      failures: Lỗi
      pauses: Lần tạm dừng
      key:
        title: Khóa API
        status:
          missing: Chưa có khóa
          unchecked: Chưa kiểm tra
          ok: Đang hoạt động
          rejected: Anthropic đã từ chối
        rejected_since: "Bị từ chối từ %{at}. Người học thấy tính năng quét đang không dùng được, và không lượt nào bị tính."
        unreadable: >-
          Không giải mã được khóa đã lưu bằng khóa mã hóa của máy chủ này. Hãy lưu lại khóa hoặc xóa nó.
        hint: Khóa
        source: Nguồn
        sources:
          stored: Lưu tại đây
          environment: Biến môi trường
        set_at: Đã lưu
        last_check: Lần kiểm tra thành công gần nhất
        expiry: Hết hạn
        never: chưa nhập ngày
        expires_today: hôm nay
        expires_in:
          other: "sau %{count} ngày"
        expired:
          other: "%{count} ngày trước"
        new_key: Khóa mới
        expires_on: Ngày hết hạn, không bắt buộc
        save: Lưu và kiểm tra
        check: Kiểm tra ngay
        remove: Xóa khóa đã lưu
        remove_confirm: >-
          Xóa khóa đã lưu? Tính năng quét sẽ quay lại dùng khóa trong biến môi trường, nếu có.
        reopen: Mở lại ngay
        note: >-
          Khóa đã lưu được dùng thay cho biến môi trường, và Anthropic kiểm tra khóa trước khi lưu. “Mở lại ngay” kết thúc
          mọi lần tạm dừng, trừ giới hạn trong ngày.
        no_encryption: >-
          Máy chủ này không có khóa mã hóa Active Record, nên không thể lưu khóa API ở đây. Hãy đặt ba biến
          ACTIVE_RECORD_ENCRYPTION, hoặc dùng ANTHROPIC_API_KEY.
        too_fast: Thay đổi quá nhiều trong thời gian ngắn. Hãy chờ vài phút rồi thử lại.
        reopened: "Đã kết thúc %{count} lần tạm dừng. Giới hạn trong ngày, nếu đã chạm, vẫn còn hiệu lực."
        saved:
          ok: "Anthropic đã chấp nhận khóa …%{hint}. Khóa đã được lưu và tính năng quét đã mở."
          rejected: Anthropic đã từ chối khóa này. Không có gì được lưu.
          no_model: Khóa này dùng được nhưng không có quyền truy cập mô hình quét. Không có gì được lưu.
          unreachable: Không liên lạc được với Anthropic để kiểm tra khóa. Không có gì được lưu. Hãy thử lại sau một phút.
          malformed: Đây không giống khóa API của Anthropic. Không có gì được lưu.
          no_encryption: Máy chủ này không có khóa mã hóa. Không có gì được lưu.
        checked:
          ok: Khóa đang hoạt động.
          rejected: Anthropic đã từ chối khóa. Tính năng quét tắt cho đến khi có lần kiểm tra thành công.
          no_model: Khóa dùng được nhưng không có quyền truy cập mô hình quét.
          unreachable: Không liên lạc được với Anthropic. Trạng thái khóa không đổi.
          missing: Không có khóa nào để kiểm tra.
        forgotten:
          ok: Đã xóa khóa đã lưu. Khóa trong biến môi trường hoạt động và đang được dùng.
          rejected: Đã xóa khóa đã lưu. Anthropic đã từ chối khóa trong biến môi trường.
          no_model: Đã xóa khóa đã lưu. Khóa trong biến môi trường không có quyền truy cập mô hình quét.
          unreachable: Đã xóa khóa đã lưu. Chưa kiểm tra được khóa trong biến môi trường.
          missing: Đã xóa khóa đã lưu. Giờ không còn khóa nào, nên tính năng quét đã tắt.
      health:
        marker: Cần chú ý
        missing: "Tính năng quét đang tắt: không có khóa API."
        rejected: "Tính năng quét đang tắt: Anthropic đã từ chối khóa API."
        expiring: Khóa API dùng để quét sắp hết hạn. Hãy lưu khóa mới.
        credit: "Tính năng quét đang tạm dừng: đã hết tín dụng Anthropic."
      model_choice:
        label: Mô hình dùng để quét
        environment: "Theo SCAN_MODEL: %{model}"
        save: Kiểm tra và dùng
        saved:
          ok: "Anthropic cho khóa này dùng %{model}. Từ giờ các lượt quét dùng mô hình này."
          rejected: Anthropic đã từ chối khóa. Mô hình không thay đổi.
          no_model: "Khóa này không có quyền dùng %{model}. Mô hình không thay đổi."
          unreachable: Không liên lạc được với Anthropic. Mô hình không thay đổi. Hãy thử lại sau một phút.
          missing: Không có khóa API để kiểm tra mô hình. Mô hình không thay đổi.
          unknown: Mô hình này không có trong bảng giá. Mô hình không thay đổi.
    alerts:
      learners_heading: Người học đang thấy gì
      action_heading: Cần làm gì
      open_admin: Mở trang quét
      rejected:
        subject: "Tính năng quét đang tắt: Anthropic đã từ chối khóa API"
        happened: >-
          Lúc %{at}, Anthropic trả lời rằng khóa API dùng để quét không hợp lệ, đã hết hạn hoặc đã bị thu hồi. Tính năng
          quét dừng ngay.
        learners: >-
          Trang quét báo rằng tính năng này hiện không dùng được và gợi ý dán văn bản thay thế. Ảnh tải lên bị từ chối và
          không bị tính vào giới hạn trong ngày của ai.
        action: >-
          Tạo khóa mới trong Anthropic Console và lưu nó trên trang quét. Khóa được kiểm tra trước, và tính năng quét mở
          lại ngay khi Anthropic chấp nhận.
      credit:
        subject: "Tính năng quét đang tạm dừng: đã hết tín dụng Anthropic"
        happened: >-
          Lúc %{at}, Anthropic từ chối một lượt quét vì tài khoản đã hết tín dụng hoặc đã chạm giới hạn chi tiêu.
        learners: >-
          Tính năng quét nghỉ sáu tiếng. Người học thấy rằng nó sẽ sớm quay lại, và các lượt quét lỗi không bị tính.
        action: >-
          Nạp thêm tín dụng hoặc nâng giới hạn chi tiêu trong Anthropic Console, rồi bấm “Mở lại ngay” trên trang quét.
      ceiling:
        subject: Tính năng quét tạm dừng đến hết hôm nay
        happened: >-
          Lúc %{at}, tổng số lượt quét của người học đã chạm giới hạn trong ngày. Tính năng quét tạm dừng đến nửa đêm
          giờ Đài Loan.
        learners: Người học thấy tính năng quét đang nghỉ và sẽ quay lại. Hôm nay không lượt nào bị tính thêm.
        action: >-
          Không cần làm gì. Nếu nhu cầu là thật, hãy nâng SCAN_GLOBAL_DAILY. Giới hạn được đặt lại lúc nửa đêm.
      expiring:
        subject: Khóa API dùng để quét hết hạn vào ngày mai
        happened: "Tính đến %{at}, khóa API đã lưu chỉ còn một ngày hoặc ít hơn là đến ngày hết hạn bạn đã nhập."
        learners: >-
          Người học chưa thấy gì thay đổi. Khi khóa hết hạn, tính năng quét sẽ dừng và họ thấy rằng nó không dùng được.
        action: Tạo khóa mới trong Anthropic Console và lưu nó trên trang quét trước khi khóa cũ hết hạn.
