vi:
  scan:
    title: Quét ảnh
    lede: >-
      Chụp một trang giáo trình, một tờ thông báo, thực đơn hay túi thuốc, hoặc dán ảnh chụp màn hình đoạn chat. Chữ Hán
      trong ảnh sẽ trở về thành văn bản để bạn sửa, rồi tạo bộ thẻ hoặc mở trong công cụ đọc.
    from_reader: Hoặc quét ảnh chụp hay ảnh chụp màn hình
    remaining:
      other: "Hôm nay còn %{count}/%{daily} lượt quét"
    drop: Thả ảnh chụp hoặc ảnh chụp màn hình vào đây
    drop_hint: >-
      Bạn cũng có thể dán ảnh chụp màn hình bằng Ctrl+V hoặc ⌘V. Ảnh được thu nhỏ ngay trên thiết bị của bạn trước khi
      gửi đi.
    camera: Chụp ảnh
    choose: Chọn tệp
    text_label: Văn bản nhận dạng được
    text_hint: Hãy đối chiếu với ảnh và sửa những chữ bị đọc sai trước khi làm tiếp.
    title_label: Tên
    default_title: "Bản quét, %{time}"
    make_deck: Tạo bộ thẻ
    open_reader: Mở trong công cụ đọc
    again: Quét ảnh khác
    privacy_note: >-
      Ảnh được gửi tới Anthropic để mô hình của họ đọc chữ, và không được lưu ở đây. Văn bản trả về được giữ %{hours} giờ
      để bạn kịp làm xong, sau đó sẽ bị xóa.
    client:
      preparing: Đang chuẩn bị ảnh…
      sending: Đang gửi…
      reading: Đang đọc chữ. Việc này mất vài giây.
      generic: Đã có lỗi xảy ra. Vui lòng thử lại sau giây lát.
      offline: Không có kết nối. Hãy kiểm tra mạng rồi thử lại.
      not_image: Tệp này không phải là ảnh. Hãy chọn ảnh chụp hoặc ảnh chụp màn hình.
      too_small: Ảnh này quá nhỏ, không đọc được.
      too_large: Ảnh này quá lớn. Hãy thử ảnh chụp màn hình hoặc một ảnh nhỏ hơn.
    refusals:
      missing: Hãy chọn ảnh trước.
      not_image: Tệp này không phải là ảnh. Hãy chọn ảnh chụp hoặc ảnh chụp màn hình.
      too_small: Ảnh này quá nhỏ, không đọc được.
      too_large: Ảnh này quá lớn. Hãy thử ảnh chụp màn hình hoặc một ảnh nhỏ hơn.
      quota: Đó là lượt quét cuối cùng của hôm nay. Ngày mai sẽ có lượt mới.
      client: Hôm nay mạng này đã quét quá nhiều lần. Vui lòng thử lại vào ngày mai.
      busy: Hiện có nhiều ảnh đang được đọc cùng lúc. Vui lòng thử lại sau một phút.
      paused: Tính năng quét đang tạm nghỉ. Vui lòng thử lại sau.
      unavailable: Tính năng quét hiện không dùng được.
    failures:
      interrupted: Quá trình đọc bị gián đoạn. Lượt quét này không bị tính, vui lòng thử lại.
      timeout: Đọc quá lâu. Lượt quét này không bị tính, vui lòng thử lại.
      unavailable: Dịch vụ đọc chữ không phản hồi. Lượt quét này không bị tính. Vui lòng thử lại sau.
      key: Tính năng quét đang tạm nghỉ. Lượt quét này không bị tính.
      rate_limited: >-
        Có quá nhiều ảnh đang được đọc cùng lúc. Lượt quét này không bị tính. Hãy thử lại sau vài phút.
      busy: Hiện có nhiều ảnh đang được đọc cùng lúc. Lượt quét này không bị tính. Hãy thử lại sau một phút.
      refused: Không đọc được ảnh này.
      too_much: >-
        Ảnh này có nhiều chữ hơn mức một lượt quét xử lý được. Hãy chụp một phần nhỏ hơn của trang.
    notes:
      blurred: >-
        Một phần ảnh bị mờ nên có thể thiếu hoặc sai vài chữ. Hãy đối chiếu với ảnh, hoặc chụp lại một tấm rõ
        hơn.
      unreadable: Ảnh quá mờ hoặc quá tối, không đọc được. Hãy thử lại ở chỗ sáng hơn và giữ yên điện thoại.
      no_text: Không tìm thấy chữ Hán nào trong ảnh này.
      gaps: Những chữ không đọc được được đánh dấu □. Hãy điền lại theo ảnh trước khi tiếp tục.
      changed: "Chữ giản thể đã được đổi sang phồn thể: %{chars}"
    closed:
      title: Tính năng quét đang tạm dừng
      unavailable: >-
        Hiện chưa thể đọc chữ từ ảnh. Hãy dán văn bản vào, hoặc vẽ chữ bạn không đọc được trong ô tìm
        kiếm.
      paused: >-
        Tính năng sẽ sớm trở lại. Trong lúc chờ, hãy dán văn bản vào, hoặc vẽ chữ bạn không đọc được trong ô tìm kiếm.
    privacy:
      heading: Ảnh bạn quét
      items:
        - >-
          Khi bạn quét ảnh chụp hoặc ảnh chụp màn hình, thiết bị của bạn thu nhỏ ảnh trước, rồi ứng dụng gửi ảnh tới
          Anthropic để mô hình của họ đọc chữ Hán trong đó. Anthropic xử lý ảnh theo điều khoản thương mại của mình, với
          vai trò nhà cung cấp dịch vụ cho ứng dụng này.
        - Ứng dụng không bao giờ lưu bản thân hình ảnh. Không có dữ liệu nào khác từ tài khoản của bạn được gửi kèm.
        - >-
          Văn bản đọc được từ ảnh được giữ 24 giờ để bạn sửa và biến thành bộ thẻ hoặc bài đọc trong công cụ đọc, sau
          đó sẽ bị xóa. Bộ thẻ hay bài đọc bạn tạo từ đó vẫn nằm trong tài khoản của bạn như mọi bộ thẻ, bài đọc khác.
        - >-
          Để tính giới hạn hằng ngày, ứng dụng lưu ngày, kết quả và kích thước của mỗi lượt quét, và trong 24 giờ lưu
          một mã băm một chiều của địa chỉ mạng gửi lượt quét đó, không bao giờ lưu chính địa chỉ ấy.
    admin:
      title: Lượt quét
      lede: >-
        Quét ảnh: %{daily} lượt mỗi người học mỗi ngày, văn bản nhận dạng được giữ %{kept} giờ. Chi phí được ước tính
        từ số token mỗi lượt quét đã dùng và giá niêm yết của mô hình.
