ja:
  scan:
    title: 写真から読み取る
    lede: >-
      教科書のページ、掲示、メニュー、薬局の薬袋を撮影するか、チャットのスクリーンショットを貼り付けてください。写っている漢字の文章がテキストになって戻ってきます。直してからデッキにしたり、リーダーで開いたりできます。
    from_reader: 写真やスクリーンショットから読み取ることもできます
    remaining:
      other: "今日の残り：%{count}／%{daily}回"
    drop: 写真やスクリーンショットをここにドロップ
    drop_hint: >-
      Ctrl+V または ⌘V でスクリーンショットを貼り付けることもできます。写真は送信前に端末上で縮小されます。
    camera: 写真を撮る
    choose: ファイルを選ぶ
    text_label: 読み取ったテキスト
    text_hint: 先に進む前に写真と見比べて、読み間違えた字を直してください。
    title_label: 名前
    default_title: "読み取り %{time}"
    make_deck: デッキを作る
    open_reader: リーダーで開く
    again: 別の写真を読み取る
    privacy_note: >-
      写真はAnthropicに送られ、同社のモデルが文字を読み取ります。写真はここには保存されません。読み取ったテキストは作業を終えられるよう%{hours}時間保存され、その後削除されます。
    client:
      preparing: 写真を準備しています…
      sending: 送信中…
      reading: 文字を読み取っています。数秒かかります。
      generic: うまくいきませんでした。少ししてからもう一度お試しください。
      offline: 接続がありません。ネットワークを確認して、もう一度お試しください。
      not_image: このファイルは画像ではありません。写真かスクリーンショットを選んでください。
      too_small: 画像が小さすぎて読み取れません。
      too_large: 画像が大きすぎます。スクリーンショットか、もっと小さい写真でお試しください。
    refusals:
      missing: 先に写真を選んでください。
      not_image: このファイルは画像ではありません。写真かスクリーンショットを選んでください。
      too_small: 画像が小さすぎて読み取れません。
      too_large: 画像が大きすぎます。スクリーンショットか、もっと小さい写真でお試しください。
      quota: 今日の読み取りはこれが最後でした。明日また使えます。
      client: このネットワークからの読み取りが今日は多すぎます。明日もう一度お試しください。
      busy: いま複数の写真を読み取っています。1分ほどしてからもう一度お試しください。
      paused: 読み取りはしばらくお休み中です。後でもう一度お試しください。
      unavailable: 現在、読み取りは利用できません。
    failures:
      interrupted: 読み取りが中断されました。今回の分はカウントされていないので、もう一度お試しください。
      timeout: 読み取りに時間がかかりすぎました。今回の分はカウントされていないので、もう一度お試しください。
      unavailable: 読み取りサービスから応答がありませんでした。今回の分はカウントされていません。後でもう一度お試しください。
      key: 読み取りはしばらくお休み中です。今回の分はカウントされていません。
      rate_limited: 同時に読み取っている写真が多すぎます。今回の分はカウントされていません。数分後にもう一度お試しください。
      busy: いま複数の写真を読み取っています。今回の分はカウントされていません。1分ほどしてからもう一度お試しください。
      refused: この画像は読み取れませんでした。
      too_much: この画像には1回で読み取れる量を超える文字があります。ページの一部分だけを撮影してください。
    notes:
      blurred: >-
        写真の一部がぼやけているため、抜けていたり間違っていたりする字があるかもしれません。写真と見比べるか、もっとはっきりした写真を撮ってください。
      unreadable: 写真がぼやけているか暗すぎて読み取れません。明るい場所で、スマホを動かさずにもう一度撮ってください。
      no_text: この画像から漢字の文章は見つかりませんでした。
      gaps: □ の部分は読み取れませんでした。先に進む前に、写真を見て補ってください。
      changed: "簡体字を繁体字に変換しました：%{chars}"
    closed:
      title: 読み取りは一時停止中です
      unavailable: >-
        現在、写真から文字を読み取ることはできません。テキストを貼り付けるか、読めない字は検索欄に手書きしてください。
      paused: >-
        まもなく再開します。それまではテキストを貼り付けるか、読めない字は検索欄に手書きしてください。
    privacy:
      heading: 読み取りに使う写真
      items:
        - >-
          写真やスクリーンショットを読み取るときは、まず端末で画像を縮小し、アプリがそれをAnthropicに送ります。同社のモデルが画像内の漢字の文章を読み取ります。Anthropicは、このアプリのサービス提供者として、同社の商用規約に基づいて画像を処理します。
        - 画像そのものをアプリが保存することはありません。アカウントのほかの情報が一緒に送られることもありません。
        - >-
          読み取ったテキストは、修正してデッキやリーダー用のテキストにできるよう24時間保存され、その後削除されます。そこから作ったデッキやテキストは、ほかのものと同じようにアカウントに残ります。
        - >-
          1日の上限を管理するため、アプリは各読み取りの日付・結果・サイズを記録し、送信元のネットワークアドレスについては元に戻せない指紋（ハッシュ）だけを24時間保存します。アドレスそのものは保存しません。
    admin:
      title: 読み取り
      lede: >-
        写真の読み取り：学習者1人あたり1日%{daily}回、読み取ったテキストは%{kept}時間保存。費用は各読み取りで使ったトークン数とモデルの定価から見積もっています。
      ceilings: 上限
      state: 状態
      open: 稼働中
      paused: "一時停止（%{reason}）%{until}まで"
      no_key: APIキーなし
      model: モデル
      unpriced: 価格の記録なし
      today: 今日の読み取り（全学習者）
      in_flight: 読み取り中
      per_client: ネットワークごと（24時間）
      at_quota: 今日の上限に達した学習者
      by_day: 日別
      total: 合計
      columns:
        day: 日付
        scans: 読み取り
        failed: 失敗
        refunded: カウント外
        input: 入力トークン
        output: 出力トークン
        cost: 費用
      footnote: "この期間の学習者：%{learners}人。平均読み取り時間：%{latency} ms"
      failures: 失敗
      pauses: 一時停止
      key:
        title: APIキー
        status:
          missing: キーなし
          unchecked: 未確認
          ok: 有効
          rejected: Anthropicが拒否
        rejected_since: "%{at}から拒否されています。学習者にはスキャンが使えないと表示され、回数は数えられません。"
        unreadable: >-
          保存されたキーをこのサーバーの暗号化キーで復号できません。キーを保存し直すか、削除してください。
        hint: キー
        source: 取得元
        sources:
          stored: ここに保存
          environment: 環境変数
        set_at: 保存日時
        last_check: 最後に確認できた日時
        expiry: 有効期限
        never: 日付の指定なし
        expires_today: 今日
        expires_in:
          other: "あと%{count}日"
        expired:
          other: "%{count}日前に期限切れ"
        new_key: 新しいキー
        expires_on: 有効期限（任意）
        save: 保存して確認
        check: 今すぐ確認
        remove: 保存したキーを削除
        remove_confirm: >-
          保存したキーを削除しますか？スキャンは環境変数のキーがあれば、そちらに戻ります。
        reopen: 今すぐ再開
        note: >-
          保存したキーは環境変数より優先され、保存前にAnthropicで確認されます。「今すぐ再開」は1日の上限以外のすべての一時停止を解除します。
        no_encryption: >-
          このサーバーにはActive Recordの暗号化キーがないため、ここにAPIキーを保存できません。ACTIVE_RECORD_ENCRYPTIONの3つの変数を設定するか、ANTHROPIC_API_KEYを使ってください。
        too_fast: 短時間に変更が多すぎます。数分待ってからもう一度お試しください。
        reopened: "解除した一時停止：%{count}件。1日の上限に達している場合は、その停止は続きます。"
        saved:
          ok: "Anthropicがキー …%{hint} を受け付けました。保存され、スキャンを再開しました。"
          rejected: Anthropicがこのキーを拒否しました。何も保存されていません。
          no_model: このキーは有効ですが、スキャン用のモデルを使えません。何も保存されていません。
          unreachable: キーを確認するためにAnthropicへ接続できませんでした。何も保存されていません。1分後にもう一度お試しください。
          malformed: AnthropicのAPIキーではないようです。何も保存されていません。
          no_encryption: このサーバーには暗号化キーがありません。何も保存されていません。
        checked:
          ok: キーは有効です。
          rejected: Anthropicがキーを拒否しました。確認が通るまでスキャンは停止したままです。
          no_model: キーは有効ですが、スキャン用のモデルを使えません。
          unreachable: Anthropicに接続できませんでした。キーの状態は変わっていません。
          missing: 確認するキーがありません。
        forgotten:
          ok: 保存したキーを削除しました。環境変数のキーが有効で、使用中です。
          rejected: 保存したキーを削除しました。環境変数のキーはAnthropicに拒否されました。
          no_model: 保存したキーを削除しました。環境変数のキーはスキャン用のモデルを使えません。
          unreachable: 保存したキーを削除しました。環境変数のキーはまだ確認できていません。
          missing: 保存したキーを削除しました。キーがなくなったため、スキャンは停止しています。
      health:
        marker: 対応が必要
        missing: スキャン停止中：APIキーがありません。
        rejected: スキャン停止中：AnthropicがAPIキーを拒否しました。
        expiring: スキャン用のAPIキーがまもなく期限切れになります。新しいキーを保存してください。
        credit: スキャン一時停止中：Anthropicのクレジットがなくなりました。
      model_choice:
        label: スキャンに使うモデル
        environment: "SCAN_MODELの値：%{model}"
        save: 確認して使う
        saved:
          ok: "このキーは%{model}を使えます。これからのスキャンはこのモデルで行います。"
          rejected: Anthropicがキーを拒否しました。モデルは変更していません。
          no_model: "このキーは%{model}を使えません。モデルは変更していません。"
          unreachable: Anthropicに接続できませんでした。モデルは変更していません。1分後にもう一度お試しください。
          missing: モデルを確認するためのAPIキーがありません。モデルは変更していません。
          unknown: このモデルは料金表にありません。モデルは変更していません。
    alerts:
      learners_heading: 学習者に今表示されていること
      action_heading: すること
      open_admin: スキャンのページを開く
      rejected:
        subject: スキャン停止中：AnthropicがAPIキーを拒否しました
        happened: >-
          %{at}、Anthropicから、スキャン用のAPIキーが無効、期限切れ、または取り消し済みだという応答がありました。スキャンはすぐに停止しました。
        learners: >-
          スキャンのページには、現在スキャンを使えないことと、代わりにテキストを貼り付ける方法が表示されます。アップロードは受け付けられず、誰の1日の回数にも数えられません。
        action: >-
          Anthropic Consoleで新しいキーを作り、スキャンのページで保存してください。保存前に確認され、Anthropicが受け付けた時点でスキャンが再開します。
      credit:
        subject: スキャン一時停止中：Anthropicのクレジットがなくなりました
        happened: >-
          %{at}、アカウントのクレジットが残っていないか、利用上限に達したため、Anthropicがスキャンを拒否しました。
        learners: >-
          スキャンは6時間休止します。学習者にはまもなく再開すると表示され、失敗したスキャンは数えられません。
        action: >-
          Anthropic Consoleでクレジットを追加するか利用上限を引き上げてから、スキャンのページで「今すぐ再開」を押してください。
      ceiling:
        subject: 今日のスキャンは一時停止中です
        happened: >-
          %{at}、学習者全体のスキャン回数が1日の上限に達しました。台湾時間の深夜0時までスキャンは一時停止します。
        learners: 学習者には、スキャンが休止中でまた使えるようになると表示されます。今日はこれ以上数えられません。
        action: >-
          対応は不要です。需要が本物なら、SCAN_GLOBAL_DAILYを引き上げてください。上限は深夜0時にリセットされます。
      expiring:
        subject: スキャン用のAPIキーは明日期限切れになります
        happened: "%{at}時点で、保存されたAPIキーは、入力された有効期限まで1日以内です。"
        learners: >-
          学習者にはまだ何も変わりません。キーの期限が切れるとスキャンは止まり、使えないと表示されます。
        action: 古いキーの期限が切れる前に、Anthropic Consoleで新しいキーを作り、スキャンのページで保存してください。
  admin:
    mail:
      lists:
        alerts: 通知
