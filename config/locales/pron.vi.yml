        choppy: "Khoảng ngắt giữa các âm tiết quá dài — từ bị vỡ thành từng âm tiết riêng."
        pitch_reset: "Giọng chọn lại cao độ ở mỗi âm tiết: nghe như đọc danh sách chứ không phải một câu."
        clipped: "Âm lượng hụt ở chỗ nối — các âm tiết bị cắt chứ không chảy vào nhau."
      read:
        ok: "Những gì được đọc khớp với văn bản."
        doubtful: "Bản ghi khớp kém với văn bản — có thể bạn đã nói thứ khác."
