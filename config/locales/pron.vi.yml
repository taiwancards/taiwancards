      tone:
        wrong: "Bám theo đường mẫu trên biểu đồ."
        shape: "Xem biểu đồ để thấy đường của bạn tách khỏi mẫu ở đâu."
        falls: "Bắt đầu thấp hơn và đưa giọng lên tới cuối âm tiết."
        rises: "Bắt đầu cao hơn và để giọng rơi xuống tới cuối âm tiết."
      initial:
        under_aspirated: "Đẩy thêm hơi sau khi bật âm — luồng hơi phải đi rõ ràng trước giọng, như th trong “thầy”."
        over_aspirated: "Rung dây thanh ngay sau khi bật âm, không có luồng hơi ở giữa — như t trong “tôi”."
        vot_off: "Chú ý chỗ nối giữa phụ âm và nguyên âm."
      sibilant:
        too_front: "Lùi lưỡi về sau thêm."
        too_back: "Đưa lưỡi ra trước thêm."
      medial:
        weak: "Âm đệm ngắn nhưng không được nuốt mất — hãy đọc cho rõ, như o trong “hoa”."
      vowel:
        open: "Khép hàm lại một chút và nâng lưỡi lên."
        close: "Hạ hàm xuống."
        front: "Lùi lưỡi về sau."
        back: "Đưa lưỡi ra trước."
        apical: "Đừng chèn âm i hay ư vào đây: giữ lưỡi ở chỗ phụ âm và tiếp tục rung dây thanh."
      coda:
        weak: "Giữ cuối âm tiết: cho hơi đi qua mũi thay vì dừng ở nguyên âm."
        heavy: "Giữ cho nguyên âm không bị mũi hóa và chỉ cho hơi vào mũi ở tận cuối."
        ng_for_n: "Đầu lưỡi chạm lợi sau răng; hạ cuống lưỡi — như -n trong “an”."
        n_for_ng: "Cuống lưỡi chạm ngạc mềm; để đầu lưỡi tự do — như -ng trong “ang”."
      duration:
        long: "Nói với nhịp tự nhiên."
        short: "Đọc cho trọn âm tiết."
        neutral_long: "Rút ngắn lại — âm tiết thanh nhẹ không được nhấn."
      timbre:
        drift: "Nghe mẫu và bắt chước trọn vẹn."
      flow:
        choppy: "Đọc cả cụm trong một hơi, không dừng giữa các âm tiết."
        pitch_reset: "Giữ một dòng giọng xuyên suốt cả cụm: mỗi âm tiết nối tiếp cao độ của âm trước."
        clipped: "Đừng cắt giọng ở chỗ nối — mang âm từ âm tiết này sang âm tiết kia."
      read:
        doubtful: "Kiểm tra văn bản và đọc lại."
        mismatch: "Kiểm tra văn bản: điểm được chấm theo đúng những gì được viết."
    confusion:
      tone_only: "Âm đúng, nhưng đó là thanh %{tone} thay vì thanh %{expected_tone}"
      segments_only: "Thanh đúng, nhưng đó là /%{syllable}/ thay vì /%{expected_syllable}/"
      both: "Đó là /%{syllable}/ thanh %{tone} thay vì /%{expected_syllable}/ thanh %{expected_tone}"
    tones:
      "1": "Cao và bằng, giữ phẳng tới cuối. Giống thanh ngang nhưng cao hơn hẳn — đừng để giọng chùng xuống ở cuối như khi đọc thanh ngang thoải mái, nếu không sẽ nghe thành thanh 4."
      "2": "Đi lên — gần như thanh sắc của bạn. Bắt đầu ở khoảng giữa giọng; bắt đầu quá cao thì không còn chỗ để lên."
      "3": "Ở Đài Loan đây là thanh thấp: hạ xuống đáy âm vực và ở lại đó, thường hơi rè. Như nửa đầu thanh hỏi kéo dài ra, không vút lên, cũng không thắt họng như thanh nặng."
      "4": "Rơi mạnh từ cao xuống, như khi gắt “Thôi!”. Bắt đầu ở chỗ thanh sắc kết thúc và rơi nhanh. Không phải thanh huyền — huyền bắt đầu thấp."
      "5": "Thanh nhẹ: ngắn, yếu, không có giai điệu riêng — cao độ lấy từ âm tiết đứng trước. Không phải thanh ngang, cũng không phải thanh nặng."
    initials:
      b: "p không bật hơi, không rung dây thanh — như p trong “pin”. Không phải b tiếng Việt: b của bạn rung dây thanh và hút hơi vào."
      p: "p bật hơi mạnh: một luồng hơi bạn cảm thấy được trên mu bàn tay. Không phải ph tiếng Việt — ph là âm của ㄈ."
      m: "Như m tiếng Việt."
      f: "Như ph tiếng Việt."
      d: "Chính là t trong “tôi”, không bật hơi. Không phải đ: đ rung dây thanh và hút hơi vào."
      t: "Chính là th trong “thầy”, có luồng hơi rõ."
      n: "Như n tiếng Việt, đầu lưỡi chạm lợi sau răng trên."
      l: "Như l tiếng Việt. Đừng để lẫn với n."
      g: "Như c/k trong “cá”, “kể” — không bật hơi. Không phải g tiếng Việt, vốn là một âm xát."
      k: "c/k kèm luồng hơi mạnh — luồng hơi là thứ duy nhất phân biệt nó với ㄍ. Không phải kh: kh tiếng Việt là âm xát, không có tắc."
      h: "Như kh của tiếng Hà Nội — xát ở cuống lưỡi; đôi khi nhẹ hơn, gần như h."
      j: "Đầu lưỡi hạ sau răng dưới, mặt lưỡi áp lên ngạc cứng. Gần ch trong “chị”, nhưng lưỡi phẳng và tiến ra trước hơn."
      q: "Cùng vị trí với ㄐ nhưng bật hơi mạnh. Không phải qu tiếng Việt."
      x: "Không phải x tiếng Việt: đầu lưỡi hạ ở răng dưới, mặt lưỡi nâng lên — như s khi bạn mỉm cười thật rộng."
      zh: "Cong đầu lưỡi lên và ra sau, không rung, không bật hơi. Tiếng Hà Nội không có âm này; ở Đài Loan nó thường nhẹ, gần ㄗ."
      ch: "Như ㄓ kèm luồng hơi mạnh."
      sh: "s với đầu lưỡi cong lên và ra sau. Ở Đài Loan thường nhẹ, gần ㄙ."
      r: "Không phải r kiểu Hà Nội (tức như d, gi). Đặt lưỡi như ㄕ rồi rung dây thanh — nghe rè rè."
      z: "“ts” liền thành một âm ở đầu âm tiết, không bật hơi. Tiếng Việt không có âm này."
      c: "“ts” kèm luồng hơi mạnh — luồng hơi phân biệt nó với ㄗ."
      s: "Như s hay x của tiếng Hà Nội."
    medials:
      i: "Âm lướt i nhanh, như i trong “yêu” — ngắn nhưng phải nghe rõ."
      u: "Âm lướt u nhanh, như o trong “hoa”; chu môi trước khi vào nguyên âm."
      ü: "Môi tròn như khi nói u, lưỡi đặt như khi nói i — giữ cả hai cùng lúc. Không phải ư."
    rimes:
      a: "a mở, hạ hàm — như a tiếng Việt."
      o: "ô tròn môi; sau ㄅㄆㄇㄈ nghe gần như “uô”."
      e: "Gần ơ của tiếng Việt nhưng lưỡi lùi và cao hơn, về phía ư, môi không tròn. Đừng đọc thành e."
      ê: "ê mở, như ê trong “về”."
      ai: "Như ai, yếu tố đầu mở hoàn toàn."
      ei: "Như ây trong “đây”."
      ao: "Như ao, môi tròn dần về cuối."
      ou: "Như âu trong “đâu”."
      an: "Như an tiếng Việt, đầu lưỡi chạm lợi sau răng; nguyên âm ở phía trước."
      en: "Như ân trong “cân” — nguyên âm yếu, ngắn."
      ang: "Như ang tiếng Việt: a sâu cộng ng — không có g bật ở cuối."
      eng: "Như âng trong “tầng”: cuống lưỡi chạm ngạc mềm."
      er: "ơ rồi cuộn đầu lưỡi lên; tiếng Việt không có âm này."
      i: "i rõ, dài, không lướt ở cuối."
      u: "u rõ, chu môi mạnh."
      ü: "Môi tròn như u, lưỡi như i. Không phải ư."
      empty: "Một nguyên âm rè không có ký hiệu riêng: để lưỡi y nguyên chỗ phụ âm vừa để lại và tiếp tục rung dây thanh. Không phải i, cũng không phải ư."
    judge:
      title: "Hiệu chỉnh điểm phát âm"
      hint: "Bản ghi của chính bạn trong phần luyện phát âm được tập hợp ở đây; bản ghi của người khác không bao giờ được lưu. Một người bản ngữ nghe từng bản và cho biết họ có chấp nhận cách phát âm đó từ người đang nói chuyện với mình không. Những câu trả lời đó đặt ngưỡng cho điểm xanh, vàng và đỏ. Điểm của bộ máy được ẩn cho tới khi có quyết định — xem trước sẽ làm lộ đáp án."
