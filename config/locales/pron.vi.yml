vi:
  pron:
    legend:
      title: "Các màu có nghĩa gì"
      body: "Không ai đạt 100 điểm — kể cả phát thanh viên Đài Loan. Màu xanh lá nghĩa là không còn gì phải sửa. Màu vàng nghĩa là người ta hiểu bạn ngay lần đầu. Chỉ màu đỏ mới đáng để sửa."
    levels:
      green:
        name: "Xuất sắc"
        note: "Nghe tự nhiên. Không còn gì để cải thiện ở đây."
      amber:
        name: "Dễ hiểu"
        note: "Nghe ra giọng nước ngoài, nhưng âm tiết được nhận đúng. Như vậy là đủ để người khác hiểu."
      red:
        name: "Nên sửa"
        note: "Âm tiết khó nhận ra. Đọc ghi chú và thử lại."
      dark:
        name: "Không hiểu được"
        note: "Người nghe sẽ nghe ra một âm tiết khác, hoặc không nghe ra gì."
      gray:
        name: "Chưa đo"
        note: "Chúng tôi chưa có mẫu đáng tin cho âm tiết này, nên không hiện điểm thay vì một điểm gây hiểu lầm."
