          text: "Ừ, thật đấy."
          hint: "bình thản, hạ giọng ở cuối câu"
        tone_1:
          hint: "cao và đều: giữ một nốt cao hơn giọng nói thường một chút, không hạ xuống"
        tone_2:
          hint: "đi lên, như khi hỏi lại “Hả?” — giọng cứ lên, không dừng lại"
        tone_3:
          hint: "xuống tận đáy giọng rồi nhích lên một chút, như tiếng “Ờ…” đang ngẫm nghĩ"
        tone_4:
          hint: "rơi mạnh từ cao xuống thấp, như khi quát “Dừng lại!”"
