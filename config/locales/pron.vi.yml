        ng_for_n: "Âm cuối -n bị đọc thành -ng."
        n_for_ng: "Âm cuối -ng bị đọc thành -n."
      duration:
        long: "Âm tiết dài hơn mẫu."
        short: "Âm tiết quá ngắn — thanh điệu không đủ chỗ để thể hiện."
        neutral_long: "Thanh nhẹ phải ngắn."
      timbre:
        drift: "Âm sắc chung của âm tiết lệch khỏi mẫu."
      lead_in:
        noisy: "Có %{ms} ms âm thừa trước âm tiết — tiếng thở hoặc tiếng ồn. Không kiểm tra được thanh mẫu qua đó: hãy bắt đầu âm tiết ngay sau tín hiệu."
        clipped: "Bản ghi bắt đầu đúng vào âm, nên không đo được độ bật hơi của %{initial}-. Hãy chờ vòng tròn xanh rồi mới nói."
      flow:
