de:
  doors:
    lede: "Fang mit deiner eigenen Aufgabe an. Zum Umschauen brauchst du kein Konto; anmelden musst du dich erst, wenn es etwas zu speichern gibt."
    use_example: "Beispiel einsetzen"
    example_title: "Das bekommst du"
    handover_note: "Danach meldest du dich einmal mit Google an. Bis dahin bleibt dein Text in diesem Browser, und wenn du zurück bist, ist alles fertig – ohne ein zweites Einfügen."
    open_tool: "Werkzeug öffnen"
    home:
      title: "Hier anfangen"
      heading: "Was führt dich her?"
      account: "Schon ein Konto?"
    exam:
      door: "Ich bereite mich auf den TOCFL vor"
      pitch: "Die offiziellen Probeprüfungen, direkt im Browser ausgewertet."
      lists: "Wortlisten nach Stufe"
      player:
        door_save_body: "Dieses Ergebnis liegt nur in diesem Browser. Melde dich an, dann wird es in deinem Konto gespeichert."
        door_save_cta: "Ergebnis speichern"
        door_saved: "Das Ergebnis von diesem Gerät ist in deinem Konto gespeichert: %{score} von %{total}. Dein bestes: %{best}."
        door_save_failed: "Das Ergebnis von diesem Gerät ließ sich noch nicht speichern. Lade die Seite neu, um es noch einmal zu versuchen."
    words:
      door: "Ich lerne mit Lehrbuch oder im Kurs"
      pitch: "Füg die Wörter deiner Lektion ein oder tipp sie ab – und bekomm einen Stapel zum Üben."
      title: "Die Wörter deiner Lektion als Stapel"
      lede: "Füg die Wörter deiner Lektion in jeder Form ein: als Liste, als Vokabeltabelle aus dem Buch, als Zeile von der Tafel. Jedes Wort kommt mit Lesung, Bedeutung und Audio, und du übst sie als Karteikarten."
      name_label: "Name des Stapels (optional)"
      name_placeholder: "Lektion 3"
      text_label: "Wörter deiner Lektion"
      text_placeholder: "你好、請問、姓、叫…"
      text_hint: "Lang- oder Kurzzeichen, beliebige Trennzeichen. Pinyin und Übersetzungen in denselben Zeilen stören nicht."
      submit: "Stapel erstellen"
      working: "Dein Stapel wird erstellt …"
      example_lede: "Die Wörter einer ersten Lektion, so eingefügt, wie sie sind:"
      example_result:
        one: "werden zu einem Stapel mit %{count} Karte"
        other: "werden zu einem Stapel mit %{count} Karten"
      deck_name: "Lektionswörter · %{date}"
      built:
        one: "Dein Stapel ist fertig: %{count} Wort."
        other: "Dein Stapel ist fertig: %{count} Wörter."
    text:
      door: "Ich möchte einen Text lesen"
      pitch: "Füg einen Text ein und sieh ihn Zeile für Zeile aufgeschlüsselt."
      title: "Einen Text Zeile für Zeile lesen"
      lede: "Füg einen Artikel, eine Nachricht oder eine Seite aus deinem Lehrbuch ein. Tipp auf ein beliebiges Wort, und du siehst Lesung und Bedeutung, Zeile für Zeile; die neuen Wörter kannst du behalten."
      name_label: "Titel (optional)"
      name_placeholder: "Zettel vom Vermieter"
      text_label: "Dein Text"
      text_placeholder: "Füge den Mandarin-Text hier ein …"
      text_hint: "Kurzzeichen werden in Langzeichen umgewandelt."
      submit: "Aufschlüsseln"
      working: "Dein Text wird aufgeschlüsselt …"
      example_lede: "Ein kurzer Text, so wird auch deiner aussehen. Tipp auf ein Wort."
    lookup:
      door: "Ich suche ein Wort oder ein Zeichen"
      go: "Nachschlagen"
      note: "Gib es in Schriftzeichen ein, dann öffnet sich der Wörterbucheintrag. Die Suche nach Pinyin oder Bedeutung geht, sobald du angemeldet bist."
    sign_in:
      exam: "Melde dich an, dann wird dein gerade erzieltes Ergebnis in deinem Konto gespeichert."
      words: "Melde dich an, dann wird dein Stapel aus den eingefügten Wörtern erstellt."
      text: "Melde dich an, dann öffnet sich dein Text, Zeile für Zeile aufgeschlüsselt."
      lookup: "Die Suche nach Pinyin oder Bedeutung gibt es nach der Anmeldung. Melde dich an, dann läuft deine Suche sofort."
    language_then:
      exam: "Danach wird dein Ergebnis gespeichert."
      words: "Danach wird dein Stapel erstellt."
      text: "Danach öffnet sich dein Text."
      lookup: "Danach läuft deine Suche."
    refused:
      empty: "Noch kein Text da. Füg zuerst etwas ein oder tipp es ab."
      too_long: "Das ist zu lang: höchstens %{limit} Zeichen auf einmal."
      no_hanzi: "Darin stehen keine Schriftzeichen. Füg die Wörter oder den Text in Schriftzeichen ein."
      no_words: "Keines dieser Wörter steht im Wörterbuch. Prüf, ob sie in Schriftzeichen geschrieben sind."
      blocked: "Dieser Browser lässt die Seite deinen Text während der Anmeldung nicht behalten. Kopier ihn, melde dich an und füg ihn im Werkzeug ein."
    more:
      title: "Nach der Anmeldung außerdem"
      import: "Liste aus Pleco, Anki oder Quizlet importieren"
      library: "Stufenlektüre, sofort lesbar"
    setup:
      title: "Dein Lernen einrichten"
      optional: "Optional"
      body: "Sag uns dein Ziel und deine Stufe, dann richten sich Startseite, Reihenfolge der neuen Wörter und Vorschläge danach. Ohne das funktioniert auch alles."
      start: "Einrichten"
      roadmap: "Wo anfangen"
      no_goal: "nicht gewählt"
    admin:
      title: "Eingänge"
      lede: "Konten der letzten %{weeks} Wochen nach dem Eingang, über den sie kamen: Haben sie das Ergebnis dieses Eingangs erreicht, überhaupt etwas gespeichert (ein Wort im Stapel, einen Text, ein Prüfungs- oder Lektionsergebnis, ein Wort im Lernen), eine Karte wiederholt?"
      door: "Eingang"
      none: "Ohne Eingang"
      columns:
        signups: "Anmeldungen"
        reached: "Ergebnis erreicht"
        saved: "Etwas gespeichert"
        studied: "Karte wiederholt"
