      lede: "Tài khoản tạo trong %{weeks} tuần gần đây, theo lối vào mà người dùng đã đi qua: có đến được kết quả của lối vào đó không, có lưu được thứ gì không (từ trong bộ thẻ, văn bản, kết quả bài thi hoặc bài học, từ đang học), có ôn thẻ nào không."
