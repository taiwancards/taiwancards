    fixes:
      near: お手本をよく聞いて、もう一度。
      tone:
        wrong: グラフのお手本の曲線をなぞってみましょう。
        shape: グラフで、自分の線がお手本から離れるところを確かめましょう。
        falls: 低めから始めて、音節の終わりまで声を上げていきます。
        rises: 高めから始めて、音節の終わりまで声を下ろしていきます。
      initial:
        under_aspirated: 子音を離したあと、息をもっと強く出します。声より先に、手のひらに当たるほどの息がはっきり聞こえるように。
        over_aspirated: 子音を離したらすぐ声を出し、間に息をはさみません。「いっぱい」の「ぱ」、「やった」の「た」のような、小さな「っ」のあとの音の感覚です。
        vot_off: 子音から母音へ移るところに気をつけましょう。
      sibilant:
        too_front: 舌をもう少し奥へ引きます。
        too_back: 舌をもう少し前へ出します。
      medial:
        weak: 介音は短い音ですが、のみこまずに、聞こえるように出します。
      vowel:
        open: あごを少し閉じて、舌を上げます。
        close: あごを下げます。
        front: 舌を奥へ引きます。
        back: 舌を前へ出します。
        apical: ここに「い」も「う」も入れません。舌を子音の位置に置いたまま、声を出し続けます。
      coda:
        weak: 音節の終わりを保ちます。母音で止めずに、息を鼻へ抜きます。
        heavy: 母音はすっきり出し、鼻にかけるのは最後の最後だけにします。
        ng_for_n: 舌先を上の歯の裏の歯ぐきに付け、舌の奥は下げたまま。「あんない」の「ん」です。
        n_for_ng: 舌の奥を上あごの奥（軟口蓋）に付け、舌先はどこにも付けません。「あんがい」の「ん」です。
      duration:
        long: 自然な速さで言いましょう。
        short: 音節を最後まで言い切りましょう。
        neutral_long: 短くします。軽声は力を入れない音節です。
      timbre:
        drift: お手本を聞き、まるごとまねしましょう。
      flow:
        choppy: 音節の間で止まらず、フレーズをひと息で読みます。
        pitch_reset: フレーズ全体を一本の声の線でつなぎます。各音節は前の音節の高さを受けて続きます。
        clipped: 音節の間で声を切らず、次の音節へ音を流し込みます。
      read:
        doubtful: 文を確かめて、もう一度読みましょう。
        mismatch: 文を確かめましょう。点数は書いてある内容を基準に測ります。
    confusion:
      tone_only: 音は合っていますが、第%{expected_tone}声のところが第%{tone}声になっていました
      segments_only: 声調は合っていますが、/%{expected_syllable}/のところが/%{syllable}/になっていました
      both: 第%{expected_tone}声の/%{expected_syllable}/のところが、第%{tone}声の/%{syllable}/になっていました
    tones:
      "1": 高く平らに、最後までその高さを保ちます。時報の「ピー」のように。日本語の話し声より少し高めから始め、途中で下げません。長すぎるかなと感じるくらい保って、ちょうどです。
      "2": 上がる声調です。驚いた「えっ？」のように。自然だと思うより低めから始めないと、上がる余地がなくなります。
      "3": 台湾では低い声調です。声域のいちばん下まで下げてそこにとどまり、声がかすれることもよくあります。低くつぶやく「うん…」の感じです。教科書にある最後の上昇（214）は、ふだんの話し言葉では出ません。
      "4": 高いところから鋭く下がります。きっぱりした「はい！」のように、高く始めて一気に下げます。
      "5": 軽声：短く弱く、自分のメロディーを持ちません。高さは前の音節で決まります。
    initials:
      b: 息を出さない「ぱ」。「いっぱい」の「ぱ」の音で、バ行の「ば」ではありません。
      p: 強く息を出す「ぱ」。口の前にかざした手のひらに息が当たるほどです。
      m: ま行の子音と同じです。
      f: 下唇を上の前歯に軽く当てて息をこすります。両唇で出す「ふ」とは違います。
      d: 息を出さない「た」。「やった」の「た」の音で、ダ行の「だ」ではありません。
      t: 強く息を出す「た」。手のひらに息が当たるほどです。
      "n": な行の子音と同じで、舌先を上の歯の裏の歯ぐきに付けます。
      l: 舌先を上の歯ぐきに付けたまま、舌の両脇から声を通します。ら行のように舌先ではじきません。
      g: 息を出さない「か」。「がっこう」の「こ」の音で、ガ行の「が」ではありません。
      k: 強く息を出す「か」。〘ㄍ〙と分けるのはこの息だけです。
      h: ハ行より荒い音です。「く」を言うときの舌の奥を上あごの奥に近づけ、そのすき間で息をこすります。
      j: 舌先は下の前歯の裏に下ろし、舌の面を上あごに付けます。息を出さない「ち」で、「まっちゃ」の「ちゃ」の子音です。
      q: "〘ㄐ〙と同じ位置で、強い息を出します。日本語の「ち」を、手のひらに息が当たるほど強く。"
      x: 日本語の「し」の子音とほぼ同じです。舌先は下の前歯の裏に置き、唇は横に引きます。
      zh: 舌先を上の歯ぐきの少し奥へ持ち上げ、軽く反らせます。息も声も出さずに離します。「ち」でも「じ」でもありません。
      ch: "〘ㄓ〙に強い息を加えた音です。"
      sh: 舌先を少し奥へ反らせて息をこすります。「し」ではありません。唇は丸めません。
      r: ラ行でも「じ」でもありません。〘ㄕ〙の舌の構えのまま声を出すと、軽くこすれる響きになります。
      z: 息を出さない「つ」。「みっつ」の「つ」の子音を、音節の頭に置きます。
      c: 強く息を出す「つ」。この息で〘ㄗ〙と区別します。
      s: "「す」の子音と同じです。「ず」のように濁らせません。"
    medials:
      i: 短い「い」のわたり音。短くても、聞こえるように出します。
      u: 短い「う」のわたり音。母音に入る前に唇を丸めておきます。
      ü: 唇は「う」のように丸め、舌は「い」の位置に。この2つを同時に保ちます。
    rimes:
      a: あごを下げた、口の大きな「あ」。
      o: 唇を丸めた「お」。〘ㄅㄆㄇㄈ〙のあとでは「うぉ」に近くなります。
      e: 日本語にない母音です。「お」の舌の形のまま、唇の丸めだけをほどいて横に引きます。「え」ではありません。
      ê: "「え」を、口を少し開きぎみにして。"
      ai: "「あい」を一拍で。「あ」をしっかり開き、「い」は軽く添えるだけ。"
      ei: "「えい」を一拍で、最後は「い」へすべらせます。「えー」とのばしません。〘ㄞ〙より短く、口の開きも小さめです。"
      ao: "「あお」を一拍で、終わりに向けて唇を丸めます。"
      ou: "「おう」を一拍で、本当に「う」へすべらせます。「おー」とのばしません。"
      an: "「あんない」の「あん」。終わりで舌先を上の歯ぐきに付けます。母音は前寄りのまま。"
      en: 力の抜けた短い母音に、舌先の「ん」。「えん」の「え」ではありません。
      ang: 奥寄りの深い「あ」に、「あんがい」の「ん」。最後に「ぐ」を付けません。
      eng: 力の抜けた母音に、「あんがい」の「ん」。舌の奥を上あごの奥に付けます。
      er: 力の抜けた母音を出しながら、舌先を軽く持ち上げて奥へ反らせます。
      i: はっきりした「い」を、最後まで同じ形で。声を消したり、あいまいにしたりしません。
      u: 唇をしっかり丸めて突き出した「う」。日本語の「う」よりずっと丸めます。
      ü: 唇は「う」のように丸め、舌は「い」の位置に。
      empty: 記号を持たない、響きだけの母音です。子音で置いた舌をそのまま動かさず、声を出し続けます。「い」でも「う」でもありません。
    judge:
      title: 発音採点の調整
      hint: 発音練習で録音した自分の音声がここに集まります。ほかの人の録音は保存しません。ネイティブが1つずつ聞き、話し相手がこう発音したら受け入れるかどうかを判定します。その答えで、緑・黄・赤の基準が決まります。判定が済むまで、エンジンの点数は隠しておきます。先に見ると答えがわかってしまうからです。
      which: 受け入れなかった部分
      accept: 受け入れる
      reject: 受け入れない
      unsure: 判断できない
      drop: 録音を削除
      drop_confirm: この録音を判定せずに削除しますか？
      reveal: エンジンの判定
      reveal_hint: 自分で判断してから開いてください。
      saved: 保存しました
      dropped: 録音を削除しました
      empty: 判定するものはありません。すべての録音にラベルが付いています。
      coverage: ラベル付きの音節（異なり／延べ）
      verdicts:
        unrated: 未判定
        accepted: 受け入れた
        rejected: 受け入れない
        unsure: 判断できない
    warmup:
      prompts:
        vowels:
          text: いー — あー — うー
          hint: それぞれ1.5秒ほどのばして
        rise:
          text: ほんとに？！
          hint: 驚いたように
        fall:
          text: はい、そうです。
          hint: 落ち着いて、最後は平らに
        tone_1:
          hint: 高く平らに：話し声より少し高い音を一定に保って
        tone_2:
          hint: 上がる：驚いた「えっ？」のように、最後まで声を上げ続けて
        tone_3:
          hint: 声のいちばん下まで下げて、少しだけ戻す：納得いかない「うーん…」のように
        tone_4:
          hint: 高いところから低いところへ鋭く下げる：きっぱりした「はい！」のように
