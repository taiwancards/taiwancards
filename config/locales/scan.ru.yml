ru:
  scan:
    title: Сканировать фото
    lede: >-
      Сфотографируйте страницу учебника, объявление, меню или аптечный пакет с лекарствами либо вставьте скриншот
      переписки. Иероглифы с него вернутся текстом: его можно поправить, а потом сделать из него колоду или открыть в
      читалке.
    from_reader: Или отсканируйте фото либо скриншот
    remaining:
      one: "Осталось сканирований на сегодня: %{count} из %{daily}"
      few: "Осталось сканирований на сегодня: %{count} из %{daily}"
      many: "Осталось сканирований на сегодня: %{count} из %{daily}"
      other: "Осталось сканирований на сегодня: %{count} из %{daily}"
    drop: Перетащите сюда фото или скриншот
    drop_hint: >-
      Скриншот можно и вставить: Ctrl+V или ⌘V. Фото уменьшается на вашем устройстве ещё до отправки.
    camera: Сделать фото
    choose: Выбрать файл
    text_label: Распознанный текст
    text_hint: Сверьте его с фото и исправьте неверно прочитанные иероглифы, прежде чем идти дальше.
    title_label: Название
    default_title: "Скан, %{time}"
    make_deck: Сделать колоду
    open_reader: Открыть в читалке
    again: Сканировать ещё
    privacy_note: >-
      Фото отправляется в Anthropic, чья модель читает текст, и здесь не хранится. Распознанный текст хранится
      %{hours} ч, чтобы вы успели закончить, а затем удаляется.
    client:
      preparing: Готовим фото…
      sending: Отправляем…
      reading: Читаем текст. Это займёт несколько секунд.
      generic: Что-то пошло не так. Попробуйте ещё раз чуть позже.
      offline: Нет подключения. Проверьте сеть и попробуйте снова.
      not_image: Это не изображение. Выберите фото или скриншот.
      too_small: Изображение слишком маленькое, его не прочитать.
      too_large: Изображение слишком большое. Попробуйте скриншот или фото поменьше.
    refusals:
      missing: Сначала выберите фото.
      not_image: Это не изображение. Выберите фото или скриншот.
      too_small: Изображение слишком маленькое, его не прочитать.
      too_large: Изображение слишком большое. Попробуйте скриншот или фото поменьше.
      quota: Это было последнее сканирование на сегодня. Новые откроются завтра.
      client: Из этой сети сегодня было слишком много сканирований. Попробуйте завтра.
      busy: Сейчас распознаётся сразу несколько фото. Попробуйте через минуту.
      paused: Сканирование ненадолго приостановлено. Попробуйте позже.
      unavailable: Сканирование сейчас недоступно.
    failures:
      interrupted: Распознавание прервалось. Эта попытка не засчитана, попробуйте ещё раз.
      timeout: Распознавание заняло слишком много времени. Эта попытка не засчитана, попробуйте ещё раз.
      unavailable: Сервис распознавания не ответил. Эта попытка не засчитана. Попробуйте позже.
      key: Сканирование ненадолго приостановлено. Эта попытка не засчитана.
      rate_limited: >-
        Сейчас распознаётся слишком много фото сразу. Эта попытка не засчитана. Попробуйте через несколько минут.
      busy: Сейчас распознаётся сразу несколько фото. Эта попытка не засчитана. Попробуйте через минуту.
      refused: Это изображение не удалось прочитать.
      too_much: >-
        На этом снимке больше текста, чем помещается в одно сканирование. Сфотографируйте часть страницы поменьше.
    notes:
      blurred: >-
        Часть фото размыта, поэтому некоторые иероглифы могут быть пропущены или прочитаны неверно. Сверьтесь с фото
        или сделайте снимок почётче.
      unreadable: Фото слишком размыто или слишком тёмное. Попробуйте снова при лучшем свете и держите телефон неподвижно.
      no_text: На этом изображении не нашлось китайского текста.
      gaps: Знаком □ отмечены иероглифы и цифры, которые не удалось прочитать. Впишите их по фото, прежде чем идти дальше.
      changed: "Упрощённые иероглифы переведены в традиционные: %{chars}"
    closed:
      title: Сканирование приостановлено
      unavailable: >-
        Распознавание текста с фото сейчас недоступно. Вставьте текст вручную или нарисуйте незнакомый иероглиф в
        поле поиска.
      paused: >-
        Скоро оно вернётся. А пока вставьте текст вручную или нарисуйте незнакомый иероглиф в поле поиска.
    privacy:
      heading: Фото для сканирования
      items:
        - >-
          Когда вы сканируете фото или скриншот, ваше устройство сначала уменьшает его, а затем приложение отправляет
          его в Anthropic, чья модель читает в нём китайский текст. Anthropic обрабатывает изображение по своим
          коммерческим условиям как поставщик услуг этого приложения.
        - Само изображение приложение не хранит никогда. Ничего другого из вашей учётной записи вместе с ним не передаётся.
        - >-
          Прочитанный текст хранится 24 часа, чтобы вы успели его исправить и сделать из него колоду или текст для
          читалки, а затем удаляется. Колода или текст, созданные из него, остаются в вашей учётной записи, как любые другие.
        - >-
          Для дневного лимита приложение хранит дату каждого сканирования, его результат и размер, а также 24 часа
          хранит необратимый отпечаток сетевого адреса, с которого пришёл запрос, но никогда не сам адрес.
    admin:
      title: Сканирования
      lede: >-
        Сканирование фото: %{daily} в день на ученика, распознанный текст хранится %{kept} ч. Стоимость оценивается по
        токенам, потраченным на каждое сканирование, и по прейскурантной цене модели.
      ceilings: Лимиты
      state: Состояние
      open: Открыто
      paused: "Приостановлено (%{reason}) до %{until}"
      no_key: Нет ключа API
      model: Модель
      unpriced: цена не указана
      today: Сканирований сегодня, все ученики
      in_flight: Распознаётся сейчас
      per_client: На сеть, 24 часа
      at_quota: Исчерпали лимит сегодня
      by_day: По дням
      total: Итого
      columns:
        day: День
        scans: Сканирования
        failed: Ошибки
        refunded: Не засчитано
        input: Входные токены
        output: Выходные токены
        cost: Стоимость
      footnote: "Учеников в этом окне: %{learners}. Среднее время распознавания: %{latency} мс."
      failures: Ошибки
      pauses: Паузы
      key:
        title: Ключ API
        status:
          missing: Ключа нет
          unchecked: Ещё не проверен
          ok: Работает
          rejected: Anthropic отклонил ключ
        rejected_since: "Отклонён с %{at}. Ученики видят, что сканирование недоступно, и ничего не засчитывается."
        unreadable: >-
          Сохранённый ключ не расшифровывается ключами шифрования этого сервера. Сохраните ключ заново или удалите его.
        hint: Ключ
        source: Откуда
        sources:
          stored: Сохранён здесь
          environment: Переменная окружения
        set_at: Сохранён
        last_check: Последняя успешная проверка
        expiry: Истекает
        never: дата не указана
        expires_today: сегодня
        expires_in:
          one: "через %{count} день"
          few: "через %{count} дня"
          many: "через %{count} дней"
          other: "через %{count} дня"
        expired:
          one: "%{count} день назад"
          few: "%{count} дня назад"
          many: "%{count} дней назад"
          other: "%{count} дня назад"
        new_key: Новый ключ
        expires_on: Дата истечения, необязательно
        save: Сохранить и проверить
        check: Проверить сейчас
        remove: Удалить сохранённый ключ
        remove_confirm: >-
          Удалить сохранённый ключ? Сканирование вернётся к ключу из переменной окружения, если он задан.
        reopen: Открыть сейчас
        note: >-
          Сохранённый ключ заменяет переменную окружения, и Anthropic проверяет его до сохранения. «Открыть сейчас»
          снимает все паузы, кроме дневного лимита.
        no_encryption: >-
          На этом сервере нет ключей шифрования Active Record, поэтому сохранить ключ API здесь нельзя. Задайте три
          переменные ACTIVE_RECORD_ENCRYPTION или используйте ANTHROPIC_API_KEY.
        too_fast: Слишком много изменений за короткое время. Подождите несколько минут и попробуйте снова.
        reopened: "Снято пауз: %{count}. Дневной лимит, если он достигнут, продолжает действовать."
        saved:
          ok: "Anthropic принял ключ …%{hint}. Он сохранён, сканирование открыто."
          rejected: Anthropic отклонил этот ключ. Ничего не сохранено.
          no_model: Ключ работает, но у него нет доступа к модели сканирования. Ничего не сохранено.
          unreachable: Не удалось связаться с Anthropic для проверки. Ничего не сохранено. Попробуйте через минуту.
          malformed: Это не похоже на ключ API Anthropic. Ничего не сохранено.
          no_encryption: На этом сервере нет ключей шифрования. Ничего не сохранено.
        checked:
          ok: Ключ работает.
          rejected: Anthropic отклонил ключ. Сканирование выключено, пока проверка не пройдёт.
          no_model: Ключ работает, но у него нет доступа к модели сканирования.
          unreachable: Не удалось связаться с Anthropic. Состояние ключа не изменилось.
          missing: Проверять нечего, ключа нет.
        forgotten:
          ok: Сохранённый ключ удалён. Ключ из переменной окружения работает и используется.
          rejected: Сохранённый ключ удалён. Anthropic отклонил ключ из переменной окружения.
          no_model: Сохранённый ключ удалён. У ключа из переменной окружения нет доступа к модели сканирования.
          unreachable: Сохранённый ключ удалён. Ключ из переменной окружения пока не удалось проверить.
          missing: Сохранённый ключ удалён. Ключа больше нет, сканирование выключено.
      health:
        marker: Требует внимания
        missing: "Сканирование выключено: нет ключа API."
        rejected: "Сканирование выключено: Anthropic отклонил ключ API."
        expiring: Ключ API для сканирования скоро истекает. Сохраните новый.
        credit: "Сканирование приостановлено: закончился кредит Anthropic."
      model_choice:
        label: Модель для сканирования
        environment: "Из SCAN_MODEL: %{model}"
        save: Проверить и включить
        saved:
          ok: "Anthropic даёт этому ключу доступ к %{model}. Сканирование теперь идёт на ней."
          rejected: Anthropic отклонил ключ. Модель не изменена.
          no_model: "У этого ключа нет доступа к %{model}. Модель не изменена."
          unreachable: Не удалось связаться с Anthropic. Модель не изменена. Попробуйте через минуту.
          missing: Нет ключа API, чтобы проверить модель. Модель не изменена.
          unknown: Этой модели нет в прейскуранте. Модель не изменена.
    alerts:
      learners_heading: Что сейчас видят ученики
      action_heading: Что сделать
      open_admin: Открыть страницу сканирования
      rejected:
        subject: "Сканирование выключено: Anthropic отклонил ключ API"
        happened: "%{at} Anthropic ответил, что ключ API для сканирования неверен, истёк или отозван. Сканирование сразу остановлено."
        learners: >-
          На странице сканирования написано, что оно сейчас недоступно, и предложено вставить текст вручную. Загрузки
          отклоняются и ни у кого не списываются из дневного лимита.
        action: >-
          Создайте новый ключ в Anthropic Console и сохраните его на странице сканирования. Сначала он проверяется, и
          сканирование открывается, как только Anthropic его примет.
      credit:
        subject: "Сканирование приостановлено: закончился кредит Anthropic"
        happened: >-
          %{at} Anthropic отказал в сканировании: на счёте не осталось кредита или достигнут лимит расходов.
        learners: >-
          Сканирование отдыхает шесть часов. Ученики видят, что оно скоро вернётся, а неудавшиеся попытки не засчитываются.
        action: >-
          Пополните кредит или поднимите лимит расходов в Anthropic Console, затем нажмите «Открыть сейчас» на странице
          сканирования.
      ceiling:
        subject: Сканирование приостановлено до конца дня
        happened: >-
          %{at} ученики вместе исчерпали дневной лимит сканирований. Сканирование приостановлено до полуночи по
          тайваньскому времени.
        learners: Ученики видят, что сканирование отдыхает и скоро вернётся. Сегодня больше ничего не засчитывается.
        action: >-
          Делать ничего не нужно. Если спрос настоящий, поднимите SCAN_GLOBAL_DAILY. Лимит обнуляется в полночь.
      expiring:
        subject: Ключ API для сканирования истекает завтра
        happened: "На %{at} до указанной вами даты истечения сохранённого ключа API остался день или меньше."
        learners: >-
          Для учеников пока ничего не меняется. Когда ключ истечёт, сканирование остановится, и они увидят, что оно
          недоступно.
        action: Создайте новый ключ в Anthropic Console и сохраните его на странице сканирования, пока старый не истёк.
  admin:
    mail:
      lists:
        alerts: Оповещения
