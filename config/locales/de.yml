  support:
    title: Seite unterstützen
    lede: TaiwanCards ist kostenlos, werbefrei und verkauft nichts – und dabei bleibt es.
    body: "Nur eines gibt es nicht umsonst: die Serverrechnung. App und Datenbank laufen rund um die Uhr, und je mehr Leute hier lernen, desto höher fällt sie aus. Wenn dir die Seite etwas gebracht hat und du helfen möchtest, geht das über den Button unten. Du kaufst damit nichts und schaltest nichts frei – alle bekommen dieselbe Seite. Wenn du diese Seite also schließt und nie wieder daran denkst: völlig in Ordnung."
