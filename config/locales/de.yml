  practice:
    about_title: Woher das Zhuyin kommt
    about:
      origin: Die Zeichen gehen auf Zhang Binglin zurück. Er nahm vereinheitlichte Formen alter chinesischer Schriftzeichen, deren Lesung den jeweiligen Laut enthält. Deshalb sehen ㄅ, ㄆ und ㄇ wie Schriftzeichen aus – sie waren einmal welche.
      adopted: Taiwan hat das System 1945 übernommen, und bis heute lernen Kinder in der Grundschule die Mandarin-Aussprache vor allem damit.
      size: Mit 37 Zeichen und fünf Tonzeichen lässt sich jeder Laut des Mandarin schreiben. Der 1. Ton bleibt meist unmarkiert, ein Punkt darüber steht für den neutralen Ton.
      today: Heute ist Zhuyin in Taiwan die gängigste Art, Schriftzeichen am Computer oder Handy einzugeben und im Wörterbuch nachzuschlagen. Lehrbücher drucken es als kleine Lesehilfe direkt an die Zeichen.
      hokkien: Für Taiwanisch (Hokkien) kamen 23 weitere Zeichen hinzu – dasselbe System, erweitert für eine andere Sprache Taiwans.
    practice_now:
      title: Gleich üben
      initials: 21 Anlaute, in Blöcken nach der Stelle im Mund, an der sie entstehen. Lies weiter, sobald du sie ohne Zögern am Klang erkennst.
      finals: 16 Auslaute. Dieselbe Übung, ohne lateinische Buchstaben auf dem Bildschirm.
      tricky: Sechs Schreibungen, bei denen das Pinyin den eigentlichen Reim verbirgt. Die Übung mischt sie mit ähnlich aussehenden Silben – so merkst du, ob du das Zhuyin liest oder die lateinischen Buchstaben.
      cta: Zur Hörübung →
    drill_progress_title: Lautübungen
    drill_progress_hint: Füllt sich, während du die Karten zur Lauterkennung und die Zhuyin-Tippübung durcharbeitest. Jeder abgeschlossene Durchgang zählt.
    voice_progress_title: Eigene Aussprache
    weak_sounds: Wo du am häufigsten danebenliegst
    runs:
