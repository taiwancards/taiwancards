  numbers:
    rules_title: Regeln, die du vor dem Üben kennen solltest
    rules:
      truncation:
        title: Eine Ziffer am Schluss meint die nächstkleinere Stelle
        body: Das ist die Hauptquelle für Verwirrung. Eine einzelne Ziffer am Ende wird nicht zur Zahl addiert – sie multipliziert die nächstkleinere Einheit, die einfach nicht ausgesprochen wird. 三百五 ist also 350, nicht 305.
        rows:
          - huayu: 三百五
            value: "350"
            note: volle Form 三百五十, 十 fällt weg
          - huayu: 兩千三
            value: "2300"
            note: volle Form 兩千三百, 百 fällt weg
          - huayu: 一萬五
            value: "15.000"
            note: volle Form 一萬五千, 千 fällt weg
      zero:
        title: 零 ist keine Pause, es verhindert die Abkürzung
        body: "Um 305 zu sagen, reicht es nicht, drei und fünf zu nennen: Dazwischen muss 零 stehen. Es zeigt an, dass eine Stelle leer ist, und hebt damit die oben beschriebene Lesart auf. Ein einziges 零 deckt eine Lücke beliebiger Breite ab."
        rows:
          - huayu: 三百零五
            value: "305"
            note: ohne 零 wäre das 350
          - huayu: 一千零五
            value: "1005"
            note: Hunderter und Zehner sind leer – trotzdem nur ein 零
          - huayu: 一千零五十
            value: "1050"
            note: 十 wird gesprochen, also sind es Zehner, keine Einer
          - huayu: 一萬零五
            value: "10.005"
            note: 零 wirkt auch über die Grenze von 萬 hinweg
      liang:
        title: 兩 oder 二 – das hängt vom Folgenden ab
        body: "二 ist die Ziffer selbst: beim Zählen, in Nummern, in 十二 und in 二十. 兩 steht dort, wo die Zwei eine Menge angibt: vor einem Zählwort und vor 百, 千, 萬, 億. Es gibt eine wichtige Ausnahme: Vor 十 steht immer 二."
        rows:
          - huayu: 二
            value: "2"
            note: die bloße Ziffer, beim Zählen
          - huayu: 二十
            value: "20"
            note: vor 十 nie 兩
          - huayu: 十二
            value: "12"
            note: eine Zwei an der Einerstelle ist ebenfalls 二
          - huayu: 兩百
            value: "200"
            note: 兩 vor 百; in Taiwan sagt man nicht 二百
          - huayu: 兩千三百二十二
            value: "2322"
            note: 兩 vor 千, 二 bei Zehnern und Einern – alles in einer Zahl
          - huayu: 兩個人
            value: 2 Personen
            note: vor einem Zählwort immer 兩
      shi:
        title: 十 am Anfang braucht kein 一
        body: Von 10 bis 19 steht 十 allein. Sobald eine höhere Stelle davor steht, kommt die Eins zurück.
        rows:
          - huayu: 十五
            value: "15"
            note: niemand sagt 一十五
          - huayu: 一百一十五
            value: "115"
            note: hier ist das 一 vor 十 Pflicht
          - huayu: 一百一
            value: "110"
            note: die umgangssprachliche Kurzform nach der Regel von der Schlussziffer
