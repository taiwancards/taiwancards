    hint: Tipp die Lesung auf deiner Tastatur und drück dann die Leertaste oder die Eingabetaste. Die Rücktaste löscht. Du kannst auch auf die Tasten unten tippen.
    accuracy: Richtig
    done: Geschaffte Wörter
    how_title: Warum du so tippen lernen solltest
    how_body: "Diese Belegung ist auf jede Tastatur gedruckt, die in Taiwan verkauft wird, und so tippen die meisten Leute hier. Zum Üben musst du nichts installieren: Drück dieselben Tasten wie auf einer taiwanischen Tastatur, und das Zhuyin erscheint. Es zählt die Position der Taste, nicht ihr Aufdruck: Auf einer deutschen Tastatur liegen deshalb ㄗ auf der Z-Taste und ㄈ auf der Y-Taste, ㄤ auf Ö, ㄦ auf ß und ㄥ auf der Minus-Taste neben der rechten Umschalttaste. Die Töne liegen in der Ziffernreihe: 6 für den 2. Ton, 3 für den 3. Ton, 4 für den 4. Ton und 7 für den neutralen Ton. Der 1. Ton braucht keine eigene Taste. Sobald die Belegung in den Fingern sitzt, ist Mandarin-Tippen keine Sucherei mehr, sondern Muskelgedächtnis – und weil du den Klang tippst, übst du nebenbei die Lesung."
