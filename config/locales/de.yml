  tones:
    names:
      "1": Erster Ton
      "2": Zweiter Ton
      "3": Dritter Ton
      "4": Vierter Ton
    segments_title: Nicht nur die Töne
    segments_lede: Zwei Unterschiede bei den Lauten selbst – man hört sie ständig, und es lohnt sich, sie von Anfang an zu kennen.
    segments:
      retroflex: Die Retroflexe ㄓ ㄔ ㄕ fallen in Taiwan oft mit ㄗ ㄘ ㄙ zusammen. Im Alltag können 知 und 資 gleich klingen.
      nasal: Die Auslaute -ing und -eng sind weitgehend mit -in und -en verschmolzen. Das ist ein fester Zug der Aussprache, keine Nachlässigkeit.
    practice_cta: Zum Ton-Training →
    chart:
      taipei: Taipeh
      reference: Peking
      aria: "%{tone}: Tonverlauf"
      taipei_note: So klingen die Töne in Taiwan. Von der Norm in China weichen sie in mehreren Punkten ab – die Liste steht weiter unten.
      reference_note: Die Norm in China, zum Vergleich. Die Ziffern sind die übliche Lehrbuchnotation.
      scale: "Fünf gedachte Tonhöhenstufen, von tief nach hoch. Lies jede Linie von links nach rechts: wo sie beginnt und wohin sie läuft. Für Taipeh stehen absichtlich keine Ziffern da – für die taiwanische Aussprache gibt es keine verbindliche Notation, und wir erfinden keine."
    hacks_title: Was wirklich hilft
    hacks:
      low: Der dritte Ton ist schlicht ein tiefer Ton, das Gegenstück zum ersten. Das tiefe Tal mit anschließendem Anstieg gibt es nur bei einer einzeln gesprochenen Silbe und am Ende einer Äußerung; in Taiwan wird der Anstieg fast nie gesprochen. Versuch nicht, ein Häkchen nachzuzeichnen – geh einfach nach unten und bleib dort, wie bei einem skeptischen, gedehnten „Hm …“.
      pair: "Denk dir den ersten und den dritten als Paar: der eine hoch und eben, der andere tief und eben. Das merkt sich leichter als „eben gegen geknickt“."
      start: "Am häufigsten verwechselt werden der zweite und der dritte. Entscheidend ist nicht, wo der Ton ankommt, sondern wo er anfängt: Der zweite beginnt in der Mitte und steigt, der dritte beginnt tief und bleibt tief."
      after_third: "Folgt auf einen dritten Ton ein zweiter, ist das Tief des dritten dein Anlauf: Du bist schon unten, und der zweite steigt direkt von dort auf. Kletter zwischen den Silben nicht erst wieder in die Mitte zurück – genau das zerreißt die Verbindung."
      fourth: "Der vierte fällt meist am leichtesten: Das ist die Melodie eines entschiedenen „Nein!“ oder „Halt!“ – steil von oben nach unten. Klingt er zu weich, hast du vermutlich nicht hoch genug angesetzt."
      relative: Tonhöhe ist relativ, nicht absolut. Die fünf Stufen liegen innerhalb deines eigenen Stimmumfangs und haben nichts mit Noten zu tun. Eine tiefe Stimme ist für die Töne kein Hindernis.
      neutral: "Eine neutrale Silbe hat keine eigene Tonhöhe – sie übernimmt sie von der Silbe davor. Nach einem ersten Ton landet sie in der Mitte, nach einem vierten unten. Extra lernen muss man da nichts: Stimmt der Ton davor, stimmt auch sie."
    title: Töne
    lede: Der vierte Teil der Lautlehre – ohne ihn funktionieren die ersten drei nicht. Was ein Ton ist, wie er sich in Taiwan verhält und warum man ihn nicht einfach weglassen kann.
    why_title: Ein Ton ist keine Verzierung
    why_body: "Im Deutschen gehört die Stimmmelodie zum Satz: Sie macht aus „Du kommst.“ ein „Du kommst?“ und hebt hervor, was dir wichtig ist. Im Mandarin gehört der Ton zur Silbe – genauso fest wie ihre Konsonanten und Vokale. Ohne Töne hat die Sprache rund vierhundert unterscheidbare Silben, mit Tönen etwa dreizehnhundert. Wer die Töne weglässt, verzichtet auf zwei Drittel der Unterscheidungen und vervielfacht die Zahl der Wörter, die aus dem eigenen Mund gleich klingen."
    myth_title: Zum Mythos, der Kontext werde es schon richten
    myth_body: Der Kontext hilft tatsächlich, und kein Wort steht je im luftleeren Raum. Aber der Kontext korrigiert nur, was schon gehört wurde; er ersetzt das Hören nicht. Wer mit Mandarin aufgewachsen ist, verarbeitet den Ton automatisch, noch vor jeder Deutung, und ein falscher Ton kommt nicht als fehlender Ton an. Er kommt als ein anderer Ton an – er führt also aktiv in die Irre, nicht bloß passiv.
    cannot_title: Keinen Ton zu sprechen geht nicht
    cannot_body: "Das ist eine technische Feststellung, kein Motivationsspruch. Jede Silbe, die du aussprichst, hat eine Tonhöhe und eine Tonbewegung, sonst wäre sie gar nicht erklungen. Die Frage ist nur, ob dieser Verlauf der verlangte ist. Wer die Arbeit an den Tönen auslässt, spricht nicht neutral, sondern mit zufälligen Tönen – und als Deutschsprachiger meist mit deutscher Satzmelodie obendrauf: Stimme hoch am Ende der Frage, Stimme hoch auf dem betonten Wort. Für dein Ohr mag es den Ton nicht geben; für dein Gegenüber gibt es ihn immer."
    cumulative_title: Es geht eigentlich nicht um Minimalpaare
    cumulative_body: "Töne werden meist mit 媽 麻 馬 罵 eingeführt. Das erweckt den Eindruck, das Risiko beschränke sich auf seltene Verwechslungen. In der Praxis summiert sich der Schaden: Bei durchgehend falschen Tönen lässt sich jedes einzelne Wort vielleicht noch erraten, der ganze Satz aber nicht mehr, weil dein Gegenüber schneller Alternativen durchprobieren müsste, als du sprichst."
    four_title: Die vier Töne
    four_lede: Die Ziffern in Klammern sind die fünfstufige Tonhöhennotation nach Chao, von 1 (tief) bis 5 (hoch).
    tones:
      t1:
        name: Erster – hoch und eben
        contour: "55"
        zhuyin: kein Zeichen
        note: Auf einer Höhe gehalten, wie ein gesungener Ton oder das „Aaah“ beim Arzt. Im Zhuyin steht dafür gar nichts – kein Tonzeichen heißt erster Ton.
      t2:
        name: Zweiter – steigend
        contour: "35"
        zhuyin: ˊ
        note: Geht nach oben, etwa wie ein erstauntes „Was?“ oder „Echt?“ im Deutschen.
      t3:
        name: Dritter – tief
        contour: 214 / 21
        zhuyin: ˇ
        note: Lehrbücher zeichnen ein Tal mit Wiederanstieg, doch den Anstieg hört man fast nur bei einer einzelnen Silbe oder am Ende einer Äußerung. Im Redefluss bleibt der dritte Ton meist unten und kommt nicht wieder hoch.
      t4:
        name: Vierter – fallend
        contour: "51"
        zhuyin: ˋ
        note: Steil von oben nach unten, kurz und bestimmt – wie ein festes „Nein!“.
    neutral_title: "Der fünfte – oder genauer: der neutrale"
    neutral_body: "Streng genommen ist er kein fünfter Ton, sondern das Fehlen eines eigenen: Die Silbe verliert ihren Verlauf, wird kürzer und übernimmt ihre Tonhöhe von der Silbe davor – so leicht und unbetont wie das e in „bitte“. Das Zhuyin markiert ihn mit einem Punkt ˙ und setzt ihn, anders als das Pinyin, VOR die Silbe: ˙ㄉㄜ. Im Training braucht man ihn nicht abzufragen – fürs Ohr ist er einfach eine sehr kurze, unbetonte Silbe."
    neutral_taiwan: "Und hier liegt ein wichtiger taiwanischer Unterschied: Der neutrale Ton ist in Taiwan deutlich seltener als in der Norm Chinas. Viele Wörter, deren zweite Silbe in China abgeschwächt wird, behalten hier ihren vollen Ton."
    taiwan_title: Was an den Tönen in Taiwan anders ist
    taiwan_body: Die Unterschiede liegen nicht im System – es sind dieselben vier Töne –, sondern in der Art, wie sie gesprochen werden.
    taiwan_points:
      range: Der Stimmumfang ist insgesamt tiefer und enger. Taiwanische Sprecher kommen mit einem kleineren Tonhöhenbereich aus als Sprecher in China; deshalb klingen die Töne zurückhaltend, aber nicht flach.
      second: Der zweite Ton steigt weniger hoch. Oft setzt er außerdem mit einer leichten Senke an und ähnelt in der Form dann dem dritten Ton aus dem Lehrbuch.
      third: Der dritte Ton kommt aus der tiefen, knarrenden Lage nicht wieder nach oben. Den vollen Verlauf 214 spricht man in Taiwan praktisch nicht.
      neutral: Der neutrale Ton kommt seltener vor; Endsilben behalten in der Regel ihren eigenen Ton.
      erhua: Erhua – das Suffix 兒 – ist im taiwanischen Mandarin sehr selten.
      merge: Der zweite und der dritte Ton liegen fürs Ohr näher beieinander als in der Rundfunkaussprache. Das ist die Norm, kein Sprachfehler.
    sandhi_title: Zwei Regeln, die den Ton ändern
    sandhi_lede: "Geschrieben wird der eine Ton, gesprochen ein anderer. Der geschriebene Ton ändert sich nicht: Wörterbuch, Zhuyin und Pinyin behalten das Original."
    third_title: Dritter Ton vor drittem Ton
    third_body: Folgen zwei dritte Töne aufeinander, wird der erste als zweiter gesprochen. 你好 schreibt man ㄋㄧˇ ㄏㄠˇ, es klingt aber wie ní hǎo. Die Regel richtet sich nach dem Gesprochenen und nicht nach der Wörterbuchform, sie gilt also auch über Wortgrenzen hinweg.
    third_three: "Bei drei dritten Tönen hintereinander hängt das Ergebnis davon ab, wie sich die Wendung dem Sinn nach gliedert. 我很好 wird meist zu wó hén hǎo, weil 很好 enger zusammengehört. Auswendig lernen muss man nichts: Die Regel greift bei genau den Silben, die du beim Sprechen tatsächlich zu einer Einheit verbindest."
    yi_title: 一 und 不
    yi_body: Der Ton dieser beiden Silben hängt davon ab, was folgt.
    yi_rules:
      yi_alone: "一 allein, am Ende und in Ordnungszahlen – erster Ton: yī, 第一 dì yī."
      yi_before4: "一 vor einem vierten Ton – zweiter: 一定 yí dìng, 一樣 yí yàng."
      yi_other: "一 vor einem ersten, zweiten oder dritten Ton – vierter: 一天 yì tiān, 一年 yì nián, 一起 yì qǐ."
      bu_before4: "不 vor einem vierten Ton – zweiter: 不是 bú shì, 不要 bú yào."
      bu_other: "不 überall sonst – vierter: 不好 bù hǎo, 不能 bù néng."
    practice_title: Üben
    practice_body: "Unten findest du ein Hörtraining: Eine Silbe erklingt, und du benennst den Ton. Es wird kein Fortschritt gespeichert und nichts fließt in deine Wiederholungen ein – reines Üben, das du jederzeit abbrechen kannst."
    practice_pending: "Töne laut zu üben ist noch nicht möglich: Das kommt, sobald eine Spracherkennung angebunden ist, die den Tonverlauf nach taiwanischer Norm prüft. Bis dahin wird nur das Erkennen nach Gehör trainiert."
    drill:
      title: Ton-Training nach Gehör
      lede: "Eine Silbe erklingt, und du benennst den Ton. Nichts wird gespeichert, deine Wiederholungen bleiben unberührt: reines Üben, das du jederzeit beenden kannst."
      back: "← Zurück zur Erklärung"
      prompt: Welcher Ton ist das?
      replay: Noch einmal abspielen
      keys: Pfeil nach oben, rechts, unten, links für den ersten, zweiten, dritten, vierten Ton. Oder tipp eine Antwort an.
      tone1: 1. eben
      tone2: 2. steigend
      tone3: 3. tief
      tone4: 4. fallend
