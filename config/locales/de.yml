  variants:
    title: Taiwan im Vergleich
    word: Wort
    reading: Lesung
    meaning: Bedeutung
    taiwan: Taiwan
    china: China
    hongkong: Hongkong
    singapore: Singapur / Malaysia
    checked: Die Lesungen sind mit den Wörterbüchern des Bildungsministeriums abgeglichen, der Wortschatz mit dessen Vergleichstabelle Taiwan–China und mit regionalen Quellen. Wo eine Form umstritten ist oder sich die Norm verschoben hat, sagt die Anmerkung das offen, statt sich auf eine Seite zu schlagen.
    sections:
      reading: Gleiche Zeichen, andere Lesung
      glyph: Gleiches Wort, anderes Zeichen
      word: Ein ganz anderes Wort
    intro:
      reading: "Diese Wörter schreibt man in Taiwan und in China gleich, spricht sie aber anders aus. 垃圾 fällt allen auf – sag in Taipeh lājī, und du hast verraten, wo du dein Mandarin gelernt hast. Zwei Einträge brauchen einen Vorbehalt: 和 mit der Lesung hàn steht tatsächlich im Wörterbuch des Bildungsministeriums, und zwar als Lesung der Konjunktion, ist aber auf dem Rückzug und fast nur noch bei Älteren und in Nachrichtensendungen zu hören – du solltest es erkennen, aber nicht selbst so sprechen. Und 說服 heißt hier wirklich shuìfú, allerdings nicht, weil China etwas geändert hätte: Die virale Geschichte von 2019 über geänderte Lesungen wurde offiziell dementiert."
      glyph: "Taiwan und Hongkong schreiben beide Langzeichen, wählen aber nicht immer dasselbe Zeichen. Es sind verschiedene Unicode-Zeichen, keine Schriftartunterschiede, deshalb sehen sie auf der Seite tatsächlich anders aus. 著 begegnet dir ständig: Taiwan schreibt es für jede Lesung, Hongkong und China teilen es mit 着 auf. Bei zweien sind sich sogar innerhalb Taiwans amtliche Norm und normale Handschrift uneins – 汙 und 脣 sind die Standardformen, aber 污 und 唇 siehst du überall."
      word: "Hier benutzen die Regionen schlicht verschiedene Wörter. Die Hongkong-Spalte enthält überwiegend kantonesischen Wortschatz in Schriftzeichen, keine Mandarin-Variante: Wer 雪櫃 auf Mandarin vorliest, liest ein kantonesisches Wort. Die tückischste Zeile ist 土豆: in Taiwan Erdnuss, in China Kartoffel. Zwei verschiedene Wörter, die zufällig gleich geschrieben werden."
