  licenses:
    moe_notice: 使用說明 – die offiziellen Nutzungshinweise, vollständig wiedergegeben, wie es die Lizenz verlangt
    title: Lizenzen und Danksagungen
    intro: TaiwanCards baut dankbar auf frei lizenzierten offenen Ressourcen und amtlichen Sprachdaten aus Taiwan auf. Bei jeder sind Quelle und Lizenz verlinkt.
    projects_title: Unsere eigenen offenen Projekte
    projects_note: "TaiwanCards beruht auf eigener, offener Forschung zum taiwanischen Mandarin: der Korpus-Pipeline, die die Daten erzeugt, der Herkunftsanalyse, die sie taiwanisch hält, den Bibliotheken zur Signalverarbeitung hinter der Aussprachebewertung und den veröffentlichten Datensätzen. All das ist offen, auch diese Anwendung selbst."
    groups:
      app: Die Anwendung und die Aufbereitung ihrer Daten
      pipeline: Korpusaufbau und Herkunftsanalyse
      gems: Bibliotheken zur Signalverarbeitung
      datasets: Veröffentlichte Datensätze
    works:
      taiwancards: Die komplette Lern-App – Rails, Importer, verteilte Wiederholung, Aussprachebewertung, Probeprüfungen. Nichts wird zurückgehalten.
      corpora: Download, Verarbeitung, Feinschliff, Kalibrierung, Bereinigung und Analyse aller Quellen, aus denen das Wörterbuch entsteht.
      twpipeline: Korpusaufbau für taiwanisches Mandarin – neun JSONL-Stufen vom rohen Crawl bis zum segmentierten Korpus mit Häufigkeitsangaben.
      twfilter: "Herkunftsanalyse: Schriftinventar, Orthografie sowie lexikalische und grammatische Merkmale, die taiwanisches Mandarin vom Sprachgebrauch in China, Hongkong und Südostasien unterscheiden."
      dsprb: Sprachsignalverarbeitung in reinem Ruby – WAV-Dekodierung, FFT-Leistungsspektren, MFCC, Tonhöhenerkennung mit YIN. Damit wird deine Aussprache bewertet.
      dtwrb: Dynamic Time Warping mit Sakoe-Chiba-Band und DBA-Mittelung (Baryzentrum). Damit wird deine Aufnahme mit der Referenzkontur verglichen.
      twngrams: Häufigkeiten von Wort- und Zeichen-N-Grammen aus dem Korpus des taiwanischen Mandarin, gemeinfrei veröffentlicht.
      twsyllables: Silbeninventar mit Zhuyin, Pinyin und der Verteilung der Töne im Korpus.
      twfilter_tables: Die Referenztabellen, mit denen twfilter die Herkunft beurteilt – orthografische Paare, lexikalische Marker, Schriftinventare.
    open_source_title: Open Source
    fonts_title: Schriften
    fonts_note: Alle drei liegen auf unserem eigenen Server. Zwei davon liefern wir verändert aus; das ist unten vermerkt.
    corpora_title: Korpora und Wörterbücher
    corpora_note: Jedes Textkorpus in der Datenbank mit der Lizenz, unter der es zu uns kommt. Veröffentlicht werden nur Quellen, deren Lizenz sowohl freie als auch kommerzielle Nutzung erlaubt; die übrigen fließen nur in Statistiken ein, und kein einziger Satz daraus wird gespeichert.
    data_title: Referenzdaten
    data_note: "Institutionen, auf deren veröffentlichtem Referenzmaterial die App aufbaut: Stufenlisten, Strichinventare, Zeichenstandards, Kalendertabellen und Klassifikationsskalen. Das sind Faktenlisten, keine schöpferischen Werke; deshalb werden sie hier als Quelle genannt und nicht lizenziert. Wo eine Institution ihr Material unter einer bestimmten Lizenz veröffentlicht hat, ist diese angegeben."
    outro: Alle Mandarin-Inhalte stehen in Taiwans Langzeichen und sind mit den Wörterbüchern des Bildungsministeriums abgeglichen. Namen, Marken und Lektionstexte bleiben Eigentum ihrer jeweiligen Inhaber.
    items:
      moe_audio: Audio zu Zeichen und Wörtern. Aufnahmen des taiwanischen Bildungsministeriums, Datenversion 20260626. Die Dateien werden unverändert ausgeliefert; die App beschränkt die Wiedergabe lediglich auf das Stichwort.
      cc_cedict: Von der Community gepflegtes Chinesisch-Englisch-Wörterbuch – Lesungen, Bedeutungen und Paare aus Lang- und Kurzzeichen.
      makemeahanzi: Grafiken zur Strichfolge, Zerlegung in Radikale und Etymologie der Zeichen.
      hanzi_writer: Die Engine für das Schreiben Strich für Strich und die Animationen im Schreibtraining.
      hanzilookup: Handschrifterkennung, die deine gezeichneten Striche in ein Zeichen verwandelt, komplett offline. Ihre Erkennungsdaten (mmah.json) stammen aus den Strichdaten von Make Me a Hanzi und stehen unter dessen Bedingungen (LGPL / Arphic PL), nicht unter der MIT-Lizenz der Engine selbst.
      unihan: Die Unicode-Han-Datenbank – maßgebliche Lesungen und Zeicheneigenschaften.
      opencc: Die Tabelle STCharacters, mit der Kurzzeichen in Langzeichen umgewandelt werden, wenn du Text einfügst. Jede Ersetzung wird dir aufgelistet.
      roboto: Die Schrift der Oberfläche, für lateinischen Text und Pinyin. Sie liegt auf unserem Server statt bei Google, deshalb geht beim Öffnen einer Seite keine Anfrage an Dritte.
      noto_sans_tc: Die Standardschrift für Langzeichen. Ebenfalls auf unserem Server.
      tw_kai: "Taiwans eigene Kaishu-Pinselschrift aus der Zeichendatenbank CNS11643 全字庫, herausgegeben vom Digitalministerium (數位發展部). Auf ihr beruht die Handschrift-Option, und das Logo der Seite ist nach ihrem 臺 gezeichnet. Wir liefern eine Teilmenge aus: Die Datei ist auf die Zeichen reduziert, die diese App tatsächlich verwendet, und das Logo enthält daraus entnommene Umrisse. Unsere Kopie ist also verändert, nicht original."
      moe: Standardzeichenformen des Bildungsministeriums, die Liste der 4808 gebräuchlichen Zeichen und Zeichenhäufigkeiten.
      bopomofo_audio: Aufnahmen der Zhuyin-Zeichen aus dem offenen Komponentenpaket zum Zhuyin-Handbuch 國語注音符號手冊 des Bildungsministeriums, separat unter CC BY 4.0 veröffentlicht. 2017 © 教育部,國語注音符號手冊-開放部件.
      tocfl: Die offiziellen TOCFL-Wortschatzlisten, Stufe für Stufe.
      naer: National Academy for Educational Research – der TBCL-Standard, das COCT-Korpus und die allgemeine Worthäufigkeitstabelle.
      moe_strokes: Die amtliche Liste der Strichnamen, auf der das Inventar der Grund- und zusammengesetzten Striche beruht.
      moe_idioms: "Das offizielle Wörterbuch der 成語: Definition, klassische Quelle, Entstehungsgeschichte und Beispiele zu jeder Redewendung. Der Originaltext erscheint wortgetreu – die Lizenz verbietet Bearbeitungen; Übersetzungen und Erläuterungen schreiben wir selbst."
      cwa: Niederschlagsskalen, Taifun-Kategorien und die Stufen des UV-Index.
      tbrs: Teeklassifikation, Verarbeitungsschritte und Oxidationsgrade taiwanischer Sorten.
      hko: Die Tabellen zum Mondkalender und zu den Sonnenperioden, aus denen die Festtage berechnet werden.
      xiaoxuetang: Nachgezeichnete alte Zeichenformen – Orakelknochen-, Bronze- und Siegelschrift. Gemeinfrei veröffentlicht.
  help:
    title: Hilfe
    intro: Ein kurzer Rundgang durch das, was du hier machen kannst. Wörterbücher, Lektionen und Listen sind für alle da – dein Fortschritt gehört nur dir.
    sections:
      search:
        title: Suche
        body: Das Feld oben durchsucht alles auf einmal – tippe auf Deutsch oder Englisch, in Pinyin (mit oder ohne Tonzeichen oder mit Tonziffern wie xiao3), in Zhuyin oder sogar ein falsch getipptes Zeichen. Die Treffer sind sortiert; der beste steht oben.
      study:
        title: Stapel und Lernen
        body: Dein Stapel enthält die Karten, an denen du gerade arbeitest. Füge Karten hinzu; unter „Jetzt lernen“ läuft dann die verteilte Wiederholung (FSRS) – du bewertest dich per Wischgeste. Jede Karte kommt genau dann zurück, wenn du sie sonst vergessen würdest.
      dictionary:
        title: Wörterbuch
        body: Stöbere in Zeichen, Wörtern, Sätzen, Kollokationen, Zählwörtern und Radikalen. Jeder Eintrag zeigt Lesungen (Zhuyin + Pinyin), Bedeutungen und wie fest er in deinem Gedächtnis sitzt.
      tocfl:
        title: TOCFL
        body: Der offizielle Wortschatz, Stufe für Stufe. Du siehst, wie gut du auf jedes Band vorbereitet bist, und kannst jede Stufe direkt lernen.
      pronunciation:
        title: Sprechen
        body: Sprich ein Wort ins Mikrofon, und du bekommst zu jeder Silbe eine Rückmeldung zu Tönen und Lauten. Der Automodus geht weiter, sobald es stimmt, und lässt das Mikrofon offen, bis es klappt.
      writing:
        title: Schreiben und Nachschlagen
        body: Bei „Zeichen schreiben“ zeichnest du jedes Zeichen anhand von Bedeutung und Lesung. „Durch Zeichnen suchen“ erkennt, was du zeichnest, und der Cangjie-Trainer übt die Eingabecodes.
      history:
        title: Verlauf und Statistik
        body: "Der Verlauf zeigt deine letzten Tage: was du gelernt hast und wie gut es hängen bleibt. Die Statistik zeigt Behaltensrate, Pensum und Schwachstellen über die Zeit."
      profile:
        title: Profil und Sicherung
        body: Ändere deinen Namen und exportiere deinen gesamten Fortschritt in eine Datei. Nach einem Neuaufbau der Datenbank importierst du sie wieder und machst genau dort weiter, wo du aufgehört hast.
