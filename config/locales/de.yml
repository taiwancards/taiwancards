    complement:
      heading: Die rechte Hand deiner Lehrkraft
      limits: Eine gute Aussprache baut man am besten mit einer Lehrkraft aus Fleisch und Blut auf, und echten Unterricht ersetzt das hier nicht. Was du bekommst, ist eine Prüfung von Tönen und Aussprache – einen Gesprächspartner oder Übungen zum Hörverstehen gibt es hier nicht, und die App will sie auch gar nicht bieten.
    honest:
      heading: Warum es das gibt
      body: Ich bin Linguist, ich lebe in Taiwan, und das hier ist die App, die ich mir immer gewünscht habe, als ich die Sprache hier gelernt habe. Entstanden ist sie aus einer Masterarbeit in Computerlinguistik und aus sehr viel ganz alltäglicher Praxis – Schilder, Speisekarten, Nachfragen, wenn ich etwas nicht verstanden habe. Werbung gibt es keine und wird es nie geben, und das ist schon der halbe Grund, warum es die App gibt.
    final:
      heading: Fang mit einer Frage an
      body: Mandarin ist neu für dich? Dann geht es bei den Lauten los. Schon ein bisschen gelernt? Fünf Minuten, und die App weiß, wo sie dich abholt.
      cta: Konto erstellen
    gold_card: Taiwan Gold Card
    disclaimer_html: "TaiwanCards wird von einer einzigen Person entwickelt und gepflegt – einem Linguisten, dessen halbes Leben schon mit Taiwan verbunden ist, bis hin zur %{gold_card} im Portemonnaie. Ministerien, Prüfungen und Publikationen werden nur genannt, um die Herkunft der Daten auszuweisen – das Projekt steht mit keiner dieser Stellen in Verbindung und wird von keiner unterstützt. Fehler sind möglich: keine Gewähr für Richtigkeit, Verfügbarkeit oder Eignung für einen bestimmten Zweck. Nutz es als Lernhilfe und bewahr einen eigenen Export deines Lernstands auf."
  onboarding:
    goal_question: Wie möchtest du lernen?
    goal_hint: Danach richten sich deine Startseite und die Menüs. Du kannst es jederzeit ändern.
    step: Schritt %{step} von %{total}
    next: Weiter
    back: Zurück
    begin: Los geht’s
    title: Dein Einstieg
    lede: Zwei Fragen – und die App stimmt deine Startseite und die ersten Wochen auf deine Antworten ab. Beides kannst du jederzeit ändern.
    pick_one: Wähl eine der Möglichkeiten aus.
    level_question:
      tocfl: Welche Stufe hast du schon?
      guided: Auf welcher Stufe bist du?
      classes: Auf welcher Stufe bist du?
    level_hint:
      tocfl: Nicht die, die du anstrebst – die wählst du in deinem Prüfungsplan.
      guided: Neue Wörter beginnen auf der nächsthöheren Stufe.
      classes: Nur zu unserer Information – du kannst die Frage gern überspringen.
    scale:
      guide: Wie finde ich meine Stufe heraus?
      zero:
        title: Von null an
        short: hier fangen die meisten an
        body: Noch vor Novice 1 – nie gelernt oder nur ein, zwei Wörter. Hier fangen die meisten an.
      hsk: "≈ HSK %{level}"
      items: "≈ %{count} Wörter und Zeichen"
      can:
        "1": Grüßen, dich vorstellen, mit Zahlen, Uhrzeiten und Preisen umgehen.
        "2": In kurzen Sätzen über dich, deine Familie, Essen und Einkaufen sprechen.
        "3": Im Alltag zurechtkommen – Verkehrsmittel, Geschäfte, Cafés – und einfache Aushänge lesen.
        "4": Über Arbeit, Studium und Pläne sprechen; langsam gesprochene Sprache und einfache Texte verstehen.
        "5": Über vertraute Themen diskutieren, unkomplizierte Artikel lesen, den meisten Gesprächen folgen.
        "6": Frei sprechen, Nachrichten lesen, Filme mit Untertiteln schauen.
        "7": Auf Mandarin arbeiten und studieren, komplexe Fachtexte lesen.
      unknown:
        test:
          title: Weiß ich nicht
          chip: Test machen
          body: Ein kurzer Einstufungstest zeigt, wo du anfangen solltest.
        skip:
          title: Überspringen
          chip: später festlegen
          body: Deine Stufe kannst du später in deinem Profil festlegen.
    known_question: Kennst du schon etwas?
    known:
      zero:
        title: Nichts
        body: Ich fange bei null an.
      phonetics:
        title: Pinyin
        body: Ich kann Pinyin lesen, aber Zhuyin ist neu für mich.
      zhuyin:
        title: Zhuyin
        body: Ich kann Zhuyin lesen, kenne aber kaum Wörter.
    limits:
      heading: Was du erwarten kannst – und was nicht
      body: Die App erklärt dir, wie man liest und schreibt, zeigt dir Zhuyin und Pinyin und entscheidet, was du als Nächstes lernst. Du kannst beliebige Wörter und Texte hineinladen, sie üben, deinen Fortschritt verfolgen und an Aussprache, Tönen und Wortschatz feilen.
      gap: "Die Aussprache lernst du aber am besten bei einer Lehrkraft mit Mandarin als Muttersprache, und nichts davon ersetzt echten Unterricht. Hier werden deine Töne und deine Aussprache geprüft – es gibt aber keine echte Unterhaltung, kein Gespräch mit einem anderen Menschen und keine Übungen zum Hörverstehen: Das hat sich die App nicht vorgenommen. Sieh sie als rechte Hand deiner Lehrkraft, nicht als deren Ersatz."
    path:
      done_cta: Zur Startseite und zu deinen Karten →
      back: "← Zurück zu allen Schritten"
      title: Dein Weg
      lede: Die Reihenfolge, die wir empfehlen. Die Schritte werden automatisch abgehakt, während du die App nutzt – du kannst sie aber auch von Hand abhaken.
      counter: "%{done} von %{total} erledigt"
      optional: optional
      now: jetzt
      open: Öffnen
      mark_done: Als erledigt markieren
      undo: Markierung aufheben
      progress: "%{done} von %{target} Wiederholungen"
      kinds:
        theory: Theorie
        practice: Übung
      done_heading: Alle Schritte erledigt
      done_body: Die Grundlagen sitzen. Deine ersten Karten warten schon – ab jetzt entscheidet die App, was sie dir in welcher Reihenfolge zeigt.
      after_heading: Wie es weitergeht
      after_body: "Sobald die Grundlagen stehen, entscheidet die App, was sie dir zeigt: zuerst nach Stufe, innerhalb der Stufe nach Häufigkeit. Den Rest nimmst du dir, wenn du ihn brauchst – „Texte lesen“, Aussprache, Schreiben von Hand und eigene Stapel aus jedem beliebigen Text."
      change: Startstufe ändern
      steps:
        hanzi:
          title: Wie ein Zeichen aufgebaut ist
          body: "Bevor du Zeichen gleich dutzendweise lernst, lohnt sich ein Blick darauf, woraus sie bestehen: Das Radikal trägt die Bedeutung, der Lautträger den Klang, und die Strichfolge folgt bei allen denselben Regeln. Nach dieser Seite sind Zeichen keine Bildchen mehr, sondern ein System."
        course:
          title: "Der Kurs: die ersten Lektionen"
          body: Ab hier kommst du mit Lektionen leichter voran als mit zufälligen Wörtern. Jede ist ein Dialog aus dem Leben in Taipeh; darunter stehen Wortschatz und Grammatik, dazu Übungen, die dich abfragen. Mit einem Klick wird aus der Lektion ein Stapel. Der Schritt zählt, sobald du deine erste Lektion abgeschlossen hast.
        zhuyin_theory:
          title: Wie die Laute funktionieren
          body: "Sieh dir zuerst an, woraus eine Silbe besteht: womit sie anfangen kann, womit sie enden kann und was der Ton bewirkt. Die Zhuyin-Zeichen kommen in Gruppen, und jede Gruppe hat ihren eigenen Button, der genau diese Gruppe übt und sonst nichts."
        tones_theory:
          title: Wie die Töne funktionieren
          body: "Vier Töne plus der neutrale – und die taiwanischen Besonderheiten, die Lehrbücher aus China weglassen: Der 3. Ton bleibt tief, statt wieder anzusteigen, und 一 und 不 ändern ihren Ton je nachdem, was folgt. Lies es durch und geh dann direkt von derselben Seite aus zur Übung."
        tones:
          title: Die vier Töne hören
          body: "In Taiwan klingen die Töne nicht wie in den Lehrbüchern aus China: Der 3. Ton bleibt tief und steigt nie wieder an. Du übst mit Studioaufnahmen jeder Silbe, abwechselnd mit einer Männer- und einer Frauenstimme."
        phrases:
          title: Lernen, was die Leute wirklich sagen
          body: "Satzmuster, mit denen du durch einen Tag in Taiwan kommst – auch die Hälfte, die du nur verstehen musst: was man dich an der Kasse fragt."
        bridge:
          title: Von Pinyin zu Zhuyin wechseln
          body: "Die Laute kennst du schon. Hier ordnest du sie den Zeichen zu, mit denen Taiwan sie schreibt, und lernst die Fallen kennen: den leeren Reim, y und w, die zusammengezogenen Auslaute iu, ui und un."
        readings:
          title: Taiwanische Lesungen neu lernen
          body: Wörter, die in Taiwan anders gelesen werden als in China, und die vollen Töne, die Taiwan dort behält, wo Lehrbücher einen neutralen Ton angeben.
        placement:
          title: Deine Stufe finden
          body: Ein kurzer adaptiver Test zu Hörverstehen, Tönen, Zeichen, Wortschatz und Sätzen. Er legt deine Startstufe fest und markiert, was du schon kannst.
        zhuyin:
          title: Zhuyin (ㄅㄆㄇㄈ)
          body: "Taiwans Lautschrift: 37 Zeichen und vier Tonzeichen. Neben Pinyin wirkt das anfangs wie Mehrarbeit – aber Zhuyin steht in taiwanischen Wörterbüchern und Lehrbüchern bei den Lesungen, und damit wird hier getippt. Wenn du es einmal kannst, wird alles danach leichter."
        drill:
          title: Die Laute erkennen
          body: Eine Übung zu Anlauten, Auslauten und Tönen, bis du sie ohne Nachdenken erkennst. Ein Durchgang reicht zum Abhaken, aber es lohnt sich, wiederzukommen.
        typing:
          title: Mit Zhuyin tippen
          body: Genau die Belegung, die in Taiwan auf die Tastaturen gedruckt ist. Ohne sie kannst du weder eine Nachricht noch eine Suchanfrage schreiben. Der Schritt zählt, sobald du zehn Wörter richtig getippt hast.
        first_cards:
          title: Deine ersten Zeichen und Wörter
          body: "Die Zeichen kommen sofort dran, statt auf später verschoben zu werden: Du fängst mit den häufigsten an. Zwanzig Wiederholungen, und der Schritt ist geschafft."
        plan:
          title: Ein Plan für deine Prüfung
          body: Wenn du den TOCFL brauchst, nenn Stufe und Datum, und die App berechnet dein Tagespensum. Wenn nicht, überspring diesen Schritt.
