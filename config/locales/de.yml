    de: Deutsch
    id: Bahasa Indonesia
  language_step:
    heading: Wähle die Sprache für App und Lernmaterial
    edition: "Keine Übersetzung aus dem Englischen, sondern eine eigene Ausgabe – von Grund auf für Deutschsprachige geschrieben. Taiwanisches Mandarin wird so erklärt, wie man es mit deutschen Ohren hört und mit deutschem Sprachgefühl versteht: Laute, Grammatik, Kultur."
    later: Du kannst sie später jederzeit im Menü ändern.
