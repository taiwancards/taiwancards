      register_title: Anmeldung und Ergebnisse
      register_body: Anmelden kannst du dich nur online. In Taiwan findet die Prüfung mehrmals im Jahr statt, die Anmeldung schließt etwa vier Wochen vor jedem Termin. Die Ergebnisse kommen etwa 20 Tage nach der Prüfung, und am selben Tag kannst du Ergebnisbescheinigung und Zertifikat im Anmeldesystem herunterladen.
      register_link: Termine und Gebühren auf der offiziellen Website
      uses_title: Was dir eine Stufe bringt
      uses:
        moe: "Taiwan Scholarship des Bildungsministeriums für Studiengänge, die nicht auf Englisch unterrichtet werden: Stufe 3 (進階級) oder höher."
        huayu: "Huayu Enrichment Scholarship ab neun Monaten: ein Zertifikat der Stufe 3 aus den letzten zwei Jahren oder eine Prüfung auf Stufe 3 oder höher nach der Ankunft."
        mofa: "Taiwan Scholarship des Außenministeriums für Studiengänge auf Mandarin: Hören und Lesen auf Stufe 2 (基礎級) oder höher."
      uses_note: Die Regeln ändern sich von Jahr zu Jahr; prüf also die Ausschreibung des Stipendiums, für das du dich bewirbst.
