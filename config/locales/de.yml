      privacy_body: "Die ganze Berechnung läuft in deinem Browser: Es wird keine einzige Anfrage gesendet – das kannst du im Netzwerk-Tab der Entwicklertools nachprüfen."
      loading: Zahlen werden geladen …
      your_surname: Dein Familienname in lateinischen Buchstaben
