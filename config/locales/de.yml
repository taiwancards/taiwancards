      any: Egal
      simple: Einfacher
      complex: Aufwendiger
      common: Vertraut
      unique: Seltener
      closeness: Nah am eigenen ⟷ typisch taiwanisch
      official: Ich will ihn in Taiwan auf amtlichen Dokumenten verwenden
      submit: Vorschläge zeigen
      badge_pair: PMI des Paars
      badge_contour: Tonmuster
      badge_repeat: wiederholter Ton, meist vermieden
      badge_strokes: Striche
      disclaimer: "Das ist kein fertiger Name und keine persönliche Empfehlung für dich. Es ist eine Statistik aus dem Haushaltsregister: welche Zeichen und Kombinationen häufiger vorkommen als andere. Einen Namen wählt man gemeinsam mit jemandem, der mit der Sprache aufgewachsen ist – nimm diese Liste als Material für dieses Gespräch."
      results_note: Fünf Vorschläge, jeweils mit Begründung. Ändere deine Antworten, und die Liste baut sich neu auf.
      why_heading: Warum diese Kombination funktioniert
      vibes:
        light: Klarheit
        virtue: Anstand
        wisdom: Bildung
        strength: Festigkeit
        nature: Naturkraft
        prosperity: Wohlstand
        peace: Ruhe
        aspiration: Ehrgeiz
      why:
        meaning_two: Der Name sagt zweierlei – %{first}, %{second}.
        meaning_one: Beide Zeichen ziehen in dieselbe Richtung – %{first} –, und dadurch wirkt der Name wie aus einem Guss.
        meaning_single: Die Bedeutung trägt %{text} – %{first}; das andere Zeichen sorgt für den Klang.
        meaning_solo: "Ein einziges Zeichen, und es steht für %{first}: Einsilbige Vornamen sind in Taiwan seltener, darum bleibt dieser im Gedächtnis."
        meaning_plain: "Diese Zeichen sind nicht nach dem Wörterbuch ausgesucht: Wer in Taiwan einen solchen Namen liest, nimmt ihn als Stimmung wahr, nicht als Satz."
        sound_common: Die Melodie %{tones} gehört zu den häufigsten Formen eines taiwanischen Namens, und sie geht ohne Stolpern über die Lippen.
        sound_rare: "Das Tonmuster %{tones} ist ungewöhnlich: Der Name klingt eigenständig und bleibt trotzdem leicht auszusprechen."
        sound_repeat: Zwei gleiche Töne hintereinander vermeidet man in Taiwan – zusammen klingt das flach.
        pair_strong: "Diese beiden Zeichen gehören wirklich zusammen: Das Paar kommt im Register weit häufiger vor, als der Zufall erwarten ließe. Der Name wirkt deshalb echt und nicht zusammengebaut."
        pair_fresh: Für diese Kombination gibt es im Register kein fertiges Vorbild – der Name wirkt wie dein eigener und nicht wie einer aus einer Liste.
        era_match: Beide Zeichen sind in deiner Generation gebräuchlich – weder ein Großelternname noch ein Babyname.
        era_older: "Die Zeichen sind älter als deine Generation: Der Name trägt die Zeit deiner Eltern in sich, und das wirkt in Taiwan eher solide."
        era_recent: So heißen Kinder, die vor Kurzem geboren sind – der Name wird betont jung klingen.
        rare_char: "Das Zeichen %{text} ist selten: Den Namen merkt man sich sofort, aber man wird dich fragen, wie er geschrieben wird."
        gender_male: Klingt eindeutig männlich.
        gender_female: Klingt eindeutig weiblich.
        gender_neutral: Geschlechtsneutral – solche Namen tragen in Taiwan Männer wie Frauen.
        echo: Der Klang erinnert an deinen echten Namen – sobald du dich vorstellst, hört man die Verbindung.
        official: "Auf Formularen und Dokumenten macht er keine Probleme: Beide Zeichen gehören zum Standardzeichensatz."
