    marks:
      exact: Richtig
      no_tone: Ohne Ton
      wrong_tone: Falscher Ton
      sound: Anderes Zeichen
      missed: Fehlt
    how_title: So wird gezählt
    how_body: "Jede Silbe des Satzes ist einen Punkt wert. Das richtige Zeichen oder die Silbe mit dem richtigen Ton bringt den vollen Punkt; eine Silbe ohne Ton bringt drei Viertel, eine mit falschem Ton die Hälfte. Ein anderes Zeichen mit gleichem Klang bringt ebenfalls die Hälfte: Dein Ohr hat es erkannt, der Fehler lag beim Schreiben. Beim Ton gilt sowohl die Wörterbuchform als auch die Form, die du in der gesprochenen Sprache hörst – 你好 darf also nǐ hǎo oder ní hǎo sein. Schreib, wie du willst, auch gemischt: Zeichen, Pinyin mit Tonzeichen oder Ziffern, Zhuyin. Überzählige Silben senken die Punktzahl."
