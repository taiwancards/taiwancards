    is:
      heading: Was das hier ist
      items:
        taiwan: Taiwans Mandarin und sonst nichts – Langzeichen, Zhuyin, die TOCFL-Stufen und Taiwans eigene TBCL-Niveaus
        decks: Wie Anki, nur ohne Stapel von Unbekannten und ohne Abende, an denen du eigene Karten abtippst – und ein Wort wird hier in fünf Fertigkeiten getrennt bewertet statt mit einem einzigen „kann ich / kann ich nicht“
        dictionary: Wie Pleco, nur mehr als ein Nachschlagewerk – derselbe Eintrag speist die Übungen und einen Lernplan, der entscheidet, was du als Nächstes siehst. Und Taiwan steht vorn, nicht in der Fußnote
        writing: Wie Skritter, nur ist Schreiben hier keine eigene App mit eigener Liste – du schreibst die Zeichen, die du diese Woche ohnehin lernst, und es zählt zum selben Fortschritt
        reading: "Wie Du Chinese, nur sucht dir niemand den Text aus: ein Lieblingslied, eine Nachrichtenmeldung, ein Arbeitsblatt aus dem Unterricht, eine Chatnachricht – füg den Text ein und du bekommst ihn in Wörter zerlegt zurück, bereit für einen Stapel"
        photo: Fotografier die Speisekarte an der Wand oder ein Schild an der Straße – die Zeichen, die du nicht lesen konntest, kommen in Wörter zerlegt zurück, bereit für einen Stapel
        speaking: Keine Spracherkennung, die nur Ja oder Nein sagt – jede Silbe, die du sprichst, wird nach neunzehn akustischen Merkmalen bewertet. Maßstab ist, wie man in Taiwan spricht, nicht in China
        everyday: "Das Taiwan, das in keinem Kurs vorkommt: im Teeladen bestellen, die Kassenbon-Lotterie, eine Wohnung mieten, der Arztbesuch, freie Tage wegen Taifun"
        corpus: Jeden Beispielsatz hat jemand in Taiwan wirklich so geschrieben – Quelle und Lizenz stehen dabei
        measured: "Hier wird nichts geschätzt: Wie häufig ein Wort ist, wie schwer es ist und zu welcher Stufe es gehört, ist an einem echten taiwanischen Korpus ausgezählt"
        memory: "Ein einziger Lernstand hinter jedem Bildschirm: Was du beim Lesen eines Textes lernst, zählt auch im Wörterbuch, in den Übungen und beim Schreiben"
    isnt:
      heading: Was das hier nicht ist
      items:
        game: Kein Spiel – keine Punkte, keine Abzeichen, keine Bestenlisten und kein Comic-Tierchen, das dir ein schlechtes Gewissen macht, damit du morgen wiederkommst
        machine: Keine KI-Inhalte – und es wird nie welche geben. Jede Bedeutung, jedes Beispiel und jede Markierung ist durch die Hände eines Menschen gegangen, und jeder Satz lässt sich bis zu einer überprüfbaren Quelle zurückverfolgen. Die meisten Apps zeigen dir, was ein Modell erzeugt hat – diese hier nie
        decks: Kein Haufen geteilter Stapel, bei denen dir niemand sagen kann, wer sie erstellt hat, aus welchem Lehrbuch sie stammen und ob die Aussprache für Taiwan überhaupt stimmt
        china: Kein Kurs aus China, in dem bloß die Zeichen gegen Langzeichen getauscht wurden – auch der Wortschatz, die Aussprache und der halbe Alltag sind anders
        words: Ein Kurs aus China wird sich kaum lange mit 自由, 民主 oder 人權 aufhalten. Hier gibt es solche Wörter reichlich, und sie fehlen auf keiner Liste
        course: Kein Lehrplan, den man von der ersten bis zur letzten Lektion absitzen muss – du steigst dort ein, wo du stehst, nimmst, was du brauchst, und überspringst den Rest
        teacher: Kein Ersatz für eine Lehrkraft – das hier ist die Hälfte, die du zwischen den Unterrichtsstunden erledigst, die Hälfte, bei der dir niemand zusieht, und die Hälfte, die entscheidet, ob du vorankommst
        hsk: Keine HSK-Vorbereitung – anderer Wortschatz, andere Aussprache und eine andere Welt hinter den Wörtern, selbst wenn du die Prüfung in Langzeichen ablegst
        simplified: Nirgends Kurzzeichen und kein Schalter, um sie einzublenden – es gibt immer nur die taiwanische Seite, im Wörterbuch genauso wie in den Beispielen und Übungen
        ads: Nicht werbefinanziert, und das bleibt so – nichts blinkt, nichts unterbricht, nichts lenkt dich vom Lernen ab oder davon, einfach ein Wort nachzuschlagen
        tracking: Keine Überwachung – keine Analysedienste von Dritten, keinerlei Tracker, und deinen gesamten Lernstand kannst du jederzeit als Datei exportieren, die dir gehört
    counts:
      heading: Schon vorhanden
      radicals: Kangxi-Radikale
      characters: Schriftzeichen
      words: Wörterbucheinträge
      collocations: Redewendungen und Kollokationen
      sentences: Sätze und Beispiele
    science:
      heading: "Unter der Haube: quantitative Linguistik"
      body: "Alles beruht auf Messung: Häufigkeit und Streuung im Korpus, Stärke von Kollokationen, kalibrierte Schwierigkeitsskalen, akustische Referenzen für jede Silbe. Was du siehst, ist die Spitze eines Eisbergs – darunter liegen Jahre des Sammelns, Messens und Prüfens, dazu eigene Bibliotheken und Datensätze, die der Forschung offenstehen. Alles ist frei zugänglich – Wissen gehört allen."
      points:
        corpus:
          title: Gemessen, nicht geschätzt
          body: Stufen, Schwierigkeit und Reihenfolge der Wörter stammen aus einem taiwanischen Korpus, das wir selbst aufgebaut und vermessen haben – Häufigkeit, Streuung, Kollokationsstärke, Stilebene.
        open:
          title: Offen einsehbar
          body: Die Korpustabellen, das Silbeninventar und die Bibliotheken dahinter sind als Datensätze veröffentlicht, und diese Anwendung ist Open Source. Jede Quelle und jede Lizenz steht auf der Seite mit den Quellenangaben.
        linked:
          title: Ein Ort, alles verknüpft
          body: Ein Zeichen führt zu seinen Wörtern, ein Wort zu echten Sätzen, ein Satz zurück zu seinem Grammatikpunkt – und alles, was dir begegnet, kann direkt in einen Stapel wandern.
    quality:
      heading: Woher die Qualität kommt
      items:
        audio:
          title: Offizielle Aufnahmen
          body: Zeichen und Wörter, eingesprochen für das staatliche Wörterbuch des taiwanischen Bildungsministeriums – nicht synthetisch erzeugt, nicht per Crowdsourcing gesammelt.
        sources:
          title: Taiwanische Quellen
          body: Das staatliche Wörterbuch, die offiziellen Stufenlisten und Häufigkeitstabellen, Gesetzestexte, Nachrichten der Städte.
        human:
          title: Hinter jedem Eintrag steht ein Mensch
          body: Bedeutungen, Beispiele und Verknüpfungen werden von Hand gegengelesen. Alles ist von Menschen geprüft – nichts generiert, nichts maschinell übersetzt.
        written:
          title: Für Deutschsprachige geschrieben
          body: "Keine Übersetzung aus dem Englischen: Die Erklärungen gehen von dem aus, was das Deutsche dir ins Ohr gelegt hat – vom ich-Laut über das ü bis zu „doch“ und „mal“ – und von den Fallen, die Pinyin stellt, wenn man es deutsch liest."
    tools:
      heading: Alles, wofür du sonst fünf Apps installieren würdest
      lede: Aufmachen, und alles ist schon da – nichts einzurichten, nichts zusammenzusuchen.
      items:
        study:
          title: Karteikarten
          body: Alles, was heute fällig ist, plus eine genau bemessene Portion Neues
        speaking:
          title: Aussprache
          body: Sprich es laut aus und sieh, welche Silbe danebenlag – und wie weit
        writing:
          title: Handschrift
          body: Zeichen aus dem Gedächtnis abrufen, dann Strich für Strich schreiben – in der richtigen Reihenfolge
        zhuyin:
          title: Zhuyin
          body: Mit Ohr und Hand, bis dir das lateinische Alphabet nicht mehr dazwischenfunkt
        tones:
          title: Töne
          body: Hören, zeichnen, sprechen – Silbe für Silbe
        typing:
          title: Tippen
          body: Zhuyin und Cangjie – so, wie man in Taiwan tippt
        reader:
          title: Texte lesen
          body: Artikel einfügen und lesen – das Wörterbuch ist schon aufgeschlagen
        everyday:
          title: Alltag in Taiwan
          body: Essen bestellen, Wohnung mieten, Bank, Papierkram – alles, was der Unterricht auslässt
        placement:
          title: Einstufungstest
          body: Fünf Minuten, und du weißt, wo du einsteigst
        plan:
          title: Prüfungsplan
          body: TOCFL-Stufe und Termin angeben – das Tagespensum ergibt sich von selbst
    core:
      heading: Ein Wort nachschlagen – und alles sehen, was dazugehört
      lede: "Aus Radikalen werden Zeichen, aus Zeichen Wörter, aus Wörtern Sätze. Jede Seite zeigt, wie alles zusammenhängt: woraus ein Wort besteht, wo es vorkommt und wie sicher du jeden Teil beherrschst."
      layers:
        radicals: Radikale
        characters: Zeichen
        words: Wörter
      facets_note: Ein Wort kennen ist nicht gleich ein Wort kennen. Du kannst es auf dem Papier lesen und trotzdem ins Stocken geraten, sobald du es sagen sollst. Deshalb merkt sich die App jedes Wort in fünf getrennten Fertigkeiten, und nur die, die nachlässt, kommt wieder dran.
      facets:
        recognition: du siehst es und erkennst es
        production: du kommst von der Bedeutung zum Wort
        reading: du liest es richtig vor
        tone: der Tonverlauf sitzt – per Stimme geprüft
        writing: aus dem Gedächtnis, Strich für Strich
    progress:
      heading: Du weißt immer, wo du stehst
      lede: Dasselbe Wissen, auf drei Arten gemessen. Nimm die, die dir etwas sagt.
      items:
        tocfl:
          title: Nach TOCFL-Stufe
          body: wie nah die nächste Prüfung wirklich ist
        school:
          title: Nach TBCL-Niveau
          body: was Taiwans nationaler Standard auf dieser Stufe von Lernenden erwartet
        frequency:
          title: Nach Häufigkeit
          body: wie viel von einer ganz normalen Seite du schon lesen kannst
    bring:
      heading: Was dir ins Auge fällt, wird zum Stapel
      lede: "Füg einen Text ein: Er wird in Wörter zerlegt, nachgeschlagen und zu einem Stapel, der in denselben Lernstand einfließt wie alles andere."
      soon: bald
      items:
        menu:
          title: Die Karte im Café oder ein Straßenschild
          body: Fotografieren – und die Zeichen, die du nicht lesen konntest, kommen in Wörter zerlegt zurück
        textbook:
          title: Neue Wörter aus Lehrbuch oder Unterricht
          body: Die Liste komplett einfügen – Übersetzungen musst du nicht von Hand abtippen
        song:
          title: Ein Lied, das du liebst
          body: Der Liedtext Wort für Wort, mit Aussprache, Tönen und Bedeutungen
        feed:
          title: Eine Nachrichtenmeldung, ein Kapitel, ein Kommentar auf Threads
          body: Mit dem Wörterbuch zur Hand lesen und Neues direkt in einen Stapel schicken
    instead:
      heading: Im Vergleich zu dem, was du vielleicht schon nutzt
      lede: Jede dieser Apps macht ihre Sache gut. Mühsam wird es, wenn fünf davon offen sind und nichts sie miteinander verbindet.
      closing: Nachschlagen, prüfen, in einen Stapel schicken, zusehen, wie dein Niveau steigt, und dich auf den TOCFL vorbereiten – an einem Ort statt in fünf Tabs.
      note: "Auf die HSK bereitet dich das hier nicht vor: Der Wortschatz und die Welt dahinter sind andere, selbst wenn du die Prüfung in Langzeichen ablegst."
    compare:
      heading: Im Vergleich zu dem, was du vielleicht schon nutzt
      summary: "Apps für Mandarin unterrichten fast immer die Variante Chinas, und die starken Allzweckwerkzeuge überlassen die schwierigen Entscheidungen dir: welcher Stapel, welches Wort als Nächstes, wie oft. TaiwanCards ist mit Absicht enger gefasst und trifft diese Entscheidungen selbst."
      honest: "Nichts davon macht die anderen zu schlechter Software, und die meisten wollen taiwanisches Mandarin gar nicht unterrichten. Das Ökosystem von Anki ist unerreicht. Plecos Wörterbücher gehen viel tiefer als alles hier. Skritters Handschriftprüfung Strich für Strich ist die beste ihrer Art. Und niemand bringt dich so zuverlässig dazu, morgen wiederzukommen, wie Duolingo. Zhong Chinese, ganz neu aus Taipeh, ist hier die einzige andere App, die das Mandarin Taiwans unterrichtet und nicht das Chinas, und sie ist eine Freude fürs Auge – das Material folgt einem einzigen Lehrbuch und das Wörterbuch ist klein, aber was drin ist, ist echt. 嗨嗨 \U0001F44B\U0001F3FB"
