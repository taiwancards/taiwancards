    lunar:
      title: Wie der Mondkalender wirklich funktioniert
      months_html: "<p>Ein Mondmonat beginnt mit dem Neumond und dauert bis zum nächsten. Das sind etwa 29,53 Tage, also hat ein Monat entweder <strong>29</strong> oder <strong>30</strong> Tage – nie 31 und nie eine feste Länge, die man auswendig lernen könnte. Zwölf solcher Monate ergeben rund 354 Tage, etwa elf Tage weniger als ein Sonnenjahr.</p><p>Um diese Lücke dreht sich alles. Würde sie nicht ausgeglichen, wanderte das Neujahr rückwärts durch die Jahreszeiten, und 春節 läge irgendwann im Sommer.</p>"
      days_html: "<p>Die Tage eines Mondmonats schreibt man nicht als bloße Zahlen. Die ersten zehn bekommen das Präfix <strong>初</strong>: 初一, 初二, 初三 … bis 初十. Die Tage 11 bis 19 werden mit 十 gebildet – 十一, 十二 … 十九 –, und 二十 ist der zwanzigste. Ab dem 21. lautet das Präfix <strong>廿</strong>: 廿一, 廿二 … 廿九, und ein Monat mit 30 Tagen endet mit 三十.</p><p><strong>初五</strong> heißt also einfach der fünfte Tag des Monats. Wer 正月初五 sagt, meint den fünften Tag des ersten Mondmonats – ohne Jahr und ohne jeden Bezug zu einem gregorianischen Datum.</p>"
      drift_html: "<p>Deshalb fällt 春節 nie zweimal hintereinander auf dasselbe gregorianische Datum. Das Mondjahr ist etwa elf Tage kürzer als das Sonnenjahr, also fällt das Neujahr jedes Mal früher – und rutscht es zu weit nach vorn, wird ein ganzer Monat eingeschoben, und es springt wieder auf einen späten Termin. Im Zeitraum 1950–2050 fällt es auf einen Tag zwischen dem 21. Januar und dem 20. Februar.</p>"
      leap_html: "<p>Der Ausgleich ist ein <strong>Schaltmonat</strong>, 閏月. Ungefähr siebenmal in neunzehn Jahren wird ein zusätzlicher Monat eingefügt; das betreffende Jahr hat dann dreizehn Monate und etwa 384 Tage. Er wird nicht ans Ende gehängt, sondern hinter einen bestehenden Monat gesetzt und übernimmt dessen Nummer: Ein Schaltmonat nach dem sechsten heißt 閏六月, und das Jahr hat dann sowohl 六月 als auch 閏六月.</p><p>Welcher Monat doppelt vorkommt, entscheidet die Sonne und keine feste Regel, die man aufsagen könnte: Es hängt davon ab, wo die 24 Sonnenperioden liegen. 2025 gab es einen 閏六月, 2033 kommt der seltene 閏十一月.</p>"
      terms_html: "<p>Zwei der Feste hier richten sich gar nicht nach dem Mond. <strong>清明</strong> und <strong>冬至</strong> sind <em>Sonnenperioden</em> – Punkte auf der jährlichen Bahn der Sonne. Deshalb stehen sie im gregorianischen Kalender fast still, während alles, was nach dem Mond geht, wandert.</p>"
    minguo:
      title: Umrechner für 民國-Jahre
      gregorian: Gregorianisches Jahr
      minguo: 民國-Jahr
      note: "%{gregorian} ist 民國%{minguo}."
      before: Die 民國-Zählung beginnt 1912, ein 民國-Jahr gibt es hier also noch nicht.
      explain_html: "<p>Amtliche Dokumente datiert Taiwan nach der <strong>民國</strong>-Ära, gezählt ab der Gründung der Republik China im Jahr <strong>1912</strong>. Dieses Jahr ist 民國1, die Rechnung lautet also einfach <strong>民國 = gregorianisches Jahr − 1911</strong>, und sie funktioniert in beide Richtungen. Du begegnest ihr auf Personalausweisen, Zugtickets, Kassenbons, Verträgen und Haltbarkeitsdaten, meist geschrieben als 114.09.28 statt 2025.</p>"
    converter:
      title: Datumsrechner Mondkalender ↔ gregorianisch
      to_gregorian: Monddatum → gregorianisch
      to_lunar: Gregorianisches Datum → Mondkalender
      lunar_year: Mondjahr
      lunar_month: Monat
      lunar_day: Tag
      date: Datum
      gregorian_result: "%{date}, %{weekday}"
      lunar_result: "%{year} %{month}%{day}"
      out_of_range: Außerhalb des abgedeckten Zeitraums.
      bounds: Abgedeckt ist der Zeitraum von %{from} bis %{to}. Die Tabelle stammt aus der Umrechnungstabelle zwischen gregorianischem und Mondkalender des Hong Kong Observatory, und jedes Datum darin wurde mit dieser Quelle abgeglichen.
  page_help:
    word_pairs_html: "<p>Wortpaare und -trios, die man leicht verwechselt, weil im Deutschen für alle ein einziges Wort steht: „können“ für 會, 能 und 可以, „nicht“ für 不 und 沒, „wieder“ für 再 und 又. Zuerst die Regel, dann Beispiele für jedes Wort, dann die häufigsten Fehler.</p><p>Die Übungen unten speichern nichts: Antworte, und du siehst sofort, warum genau dieses Wort richtig ist. Die Wörterbuchseiten dieser Wörter verlinken auf ihre Gruppe.</p>"
    dictation_html: "<p>Hör dir eine echte Aufnahme an und schreib auf, was du hörst. Es sprechen Muttersprachler aus Taiwan, und die Sätze sind nach Wortstufe sortiert: 1 ist am leichtesten.</p><p>Hör so oft zu, wie du willst. Ist es zu schnell, verlangsame es mit dem Button daneben. „Übersetzung“ verrät die Bedeutung, wenn du gar nichts verstehst.</p><p>Zhuyin kannst du direkt hier tippen: Schalte ㄅㄆㄇ ein und drück die Tasten der taiwanischen Belegung oder die Buttons auf dem Bildschirm. Die Tonzeichen liegen auf den Tasten 6, 3, 4 und 7; der erste Ton bleibt unmarkiert.</p>"
    desk_html: "<p>Die Startseite richtet sich nach dem Modus, den du gewählt hast. <strong>TOCFL</strong> zeigt den Countdown bis zur Prüfung, deinen Stand pro Stufe, eine Probeprüfung und die Grammatik der Stufe. <strong>Eigene Wörter</strong> zeigt die Wiederholungen deiner eigenen Stapel und einen schnellen Weg, Wörter aus dem Unterricht hinzuzufügen. <strong>Unsere Methode</strong> zeigt den nächsten Schritt in der Phonetik oder im Kurs und dazu die Karten des Tages. Den Modus wechselst du im Profil oder über den Link „ändern“ neben der Überschrift.</p><p>Die Zähler: <strong>fällig</strong> heißt, wie viele Karten heute laut FSRS-Plan dran sind, <strong>neu</strong>, wie viel ungesehenen Stoff die App zusätzlich hinzunehmen würde (das Pensum kommt aus deinem Prüfungsplan, ohne Plan aus den Einstellungen), und <strong>im Stapel</strong>, wie viele Karten überhaupt im Spiel sind. Der große Button führt immer dorthin, wo es sinnvoll weitergeht.</p>"
    progress_html: "<p>Die <strong>Serie</strong> zählt, an wie vielen Tagen in Folge du wiederholt hast. Ein Tag geht von Mitternacht bis Mitternacht in der Zeitzone deines Geräts; wenn du verreist, bleiben die schon gezählten Tage, wie sie sind. Nach 30 Tagen in Folge beendet eine Pause von bis zu 2 Tagen die Serie nicht mehr, nach 90 Tagen in Folge ohne Ruhetag eine Pause von bis zu 4 Tagen. Ruhetage werden nicht mitgezählt, und nach einem Ruhetag beginnt die Zählung bis zum nächsten von vorn. Die <strong>Behaltensrate</strong> ist der Anteil von „Gut“ oder besser unter den Karten, die laut FSRS fällig waren: Liegt sie deutlich unter dem Zielwert in den Einstellungen, sind die Abstände zu lang.</p><p>Zustände: <strong>ungesehen</strong> wurde noch nie gezeigt, <strong>in Lernphase</strong> steckt noch in den Lernschritten, <strong>jung</strong> hat einen Abstand unter drei Wochen, <strong>ausgereift</strong> darüber. <strong>Problemkarten</strong> sind die, die du immer wieder vergisst; sie gezielt neu zu lernen ist günstiger, als sie weiter durch den Plan laufen zu lassen.</p>"
    plan_html: "<p>Nenne eine TOCFL-Zielstufe und ein Datum, und die App rechnet aus, wie viel neuer Stoff pro Tag nötig ist, um die Stufe bis dahin abzuschließen. Das Pensum wird täglich aus dem bereits Gelernten neu berechnet; ein ausgelassener Tag wirft den Plan also nicht um, er hebt das Pensum nur etwas an.</p><p>Ist das Pensum nicht zu schaffen, wird es orange markiert: Bis zu diesem Datum lässt sich die Stufe nicht abschließen. Verschieb dann das Datum oder nimm dir eine niedrigere Stufe vor.</p>"
    cangjie_lessons_html: "<p>Cangjie ist die taiwanische Art, Langzeichen nach ihrer Form statt nach ihrem Klang zu tippen: Ein Zeichen wird in sichtbare Teile zerlegt, und jedem Teil entspricht eine Buchstabentaste. Dieses Lehrbuch behandelt nur die fünfte Generation der Methode (倉頡五代) – nicht Cangjie 3 und nicht das vereinfachte Cangjie.</p><p>Die Reihenfolge: zuerst vier Lektionen dazu, wie ein Code aufgebaut ist, dann je eine Lektion für jede der sechsundzwanzig Tasten, dann die Zerlegungsregeln und die geschlossenen Ausnahmelisten. Am Ende stehen Taiwans eigene Zeichen und der gesamte Stoff von Novice 1–2.</p><p>Jede Lektion hat ihre eigenen Übungen: die Taste zu einer Form nennen, die erste Taste eines Zeichens nennen, die richtige Zerlegung wählen und einen vollständigen Code tippen. Freies Tippen gibt es getrennt davon im <strong>Cangjie-Trainer</strong> unter „Üben“.</p>"
    names_html: "<p>Dieser Bereich erklärt, wie ein taiwanischer Name aufgebaut ist, und zeigt, was in Taiwan tatsächlich verwendet wird – ausgezählt aus dem Haushaltsregister. Einen Namen denkt er sich nicht für dich aus: Die Wahl ist persönlich und wird meist mit einem taiwanischen Freund oder einer Lehrkraft getroffen.</p><p>Der <strong>Familienname</strong> besteht aus einem Zeichen, wird vererbt und steht vor dem Vornamen; Familiennamen aus zwei Zeichen gibt es, sie sind aber selten. Der <strong>Vorname</strong> hat ein oder zwei Zeichen, die die Familie aussucht, meist zwei. Die Reihenfolge ändert sich nie: Auf Mandarin steht der Familienname immer vorn, egal, was im Pass steht, und du sprichst jemanden mit Familienname und Titel an, bis er dir etwas anderes anbietet.</p><p>Im Tab „Namen finden“ werden die Zeichen nach denselben Zahlen bewertet, die der zweite Tab zeigt: Häufigkeit nach Generation, Tonmuster, wie fest ein Paar zusammengehört, und Strichzahl. Heraus kommen fünf Vorschläge mit Begründung – eine Auswahl, über die man wirklich reden kann.</p>"
    desks_html: "<p>Ein Stapel entsteht aus allem, was du einfügst: einer Liste mit einem Wort pro Zeile, einer Liste mit Kommas oder einfach Fließtext – das System erkennt es selbst. Du kannst auch eine Datei hochladen oder die Wörter aus einem Lied übernehmen.</p><p>Der entscheidende Unterschied zu Anki: <strong>Du tippst nie Übersetzungen ein</strong>. Lesung, Bedeutung, Zerlegung der Zeichen und Audio kommen alle aus unserem Wörterbuch. Du lieferst nur die Wörter.</p><p>Bevor der Stapel angelegt wird, siehst du eine Vorschau: wie viele Karten entstehen, was doppelt war und was nicht im Wörterbuch steht. Die Einträge sind nach Schwierigkeit sortiert, die leichtesten zuerst. Kennst du die ganze Liste schon, schickt ein Button sie in die Langzeitwiederholung statt in die Warteschlange für neue Karten.</p>"
    hanzi_html: Diese Seite nimmt ein Zeichen auseinander und zeigt, was du mit den Teilen anfangen kannst. Der Bedeutungsträger verweist auf ein Bedeutungsfeld, der Lautträger auf eine ungefähre Lesung. In unseren eigenen Daten trifft der Lautträger den Reim etwa in vier von fünf Fällen, ein unbekanntes Zeichen lässt sich also oft schon beim ersten Versuch lesen. Öffne die Abschnitte einzeln.
    triage_html: "<p>Ein schneller Weg, um festzustellen, wo du stehst, wenn du schon einiges kannst. Wisch nach rechts, wenn du das Zeichen kennst, nach links, wenn du unsicher bist.</p><p><strong>Kenne ich</strong> schiebt den Eintrag in die ferne Wiederholung: etwa drei Wochen und mehr in die Zukunft, so verteilt, dass sich nichts an einem Tag staut. Verloren geht dabei nichts.</p><p><strong>Nicht sicher</strong> lässt den Eintrag in der normalen Warteschlange, wo er mit allem anderen drankommt.</p><p>Was du wirklich schon gelernt hast, bleibt außen vor und wird nicht angetastet.</p>"
    zhuyin_trainer_html: "<p>Hier lernst du Zhuyin als eigenständige Schrift, ohne lateinische Krücke. Du hörst einen Laut und wählst das Zeichen – Pinyin ist absichtlich nicht zu sehen, sonst setzt sich „ㄅ ist der Buchstabe b“ fest statt „ㄅ ist dieser Laut“.</p><p>Die Zeichen kommen in Blöcken nach Artikulationsstelle, nicht der Reihe nach durch die Tabelle. Ein neuer Block öffnet sich, wenn der vorige geschafft ist. Die Antwortmöglichkeiten liegen absichtlich nah beieinander: ähnliche Formen und Laute von derselben Artikulationsstelle – zufällige Optionen würden nur Fortschritt vortäuschen.</p><p>Ein Zeichen gilt als gelernt, wenn du es dreimal hintereinander richtig erkennst, und zwar schnell: Wer richtig, aber langsam antwortet, rechnet noch, statt zu erkennen, und der Zähler bleibt stehen. Aufhören kannst du jederzeit.</p>"
    numbers_html: "<p>Für Zahlen brauchst du nur eine Handvoll Zeichen, und die brauchst du alle. Die eigentliche Schwierigkeit sind aber nicht die Zeichen, sondern die Größenordnungen.</p><p>Mandarin fasst Ziffern zu Vierergruppen zusammen: 萬 ist 10.000, und alles darüber baut darauf auf. Deshalb ist eine Million 一百萬 und eine Milliarde 十億. Die fünf Abschnitte unten führen von den Zeichen bis zu den Fallen; der letzte behandelt die 民國-Jahre, die auf jedem taiwanischen Formular stehen.</p>"
    practice_phonetics_html: "<p><strong>Zhuyin</strong> (ㄅㄆㄇㄈ, auch Bopomofo genannt) ist ein phonetisches Alphabet: 37 Zeichen, jedes fest an einen Laut des Mandarin gebunden, dazu Tonzeichen. Die Zeichen bedeuten für sich nichts, aus Gewohnheit falsch lesen kannst du sie also nicht. Mit ihnen werden in taiwanischen Wörterbüchern und Schulbüchern die Lesungen angegeben, und mit ihnen wird hier Text getippt.</p><p><strong>Pinyin</strong> ist eine Rechtschreibung – eine Art, dieselben Laute mit lateinischen Buchstaben nach eigenen Regeln zu schreiben. Diese Regeln sind auf Kürze angelegt, nicht auf Genauigkeit: Ein Buchstabe kann für verschiedene Laute stehen, und manche Vokale fallen in der Schreibung ganz weg. Als Stütze ist es nützlich, aber es führt in die Irre, sobald du es wie Deutsch liest: Pinyin z ist kein deutsches z, ch kein deutsches ch.</p><p>In den Tabellen unten steht zuerst der <strong>Anker</strong>: eine Zeile, die dir sagt, was du jetzt sprechen sollst. Dann folgt die Artikulation – wie sich die Sprechorgane bewegen. Am Ende jeder Zeile steht in Orange der Fehler, den du vermeiden solltest.</p>"
    roadmap_html: "<p>Die beste Reihenfolge, die App durchzuarbeiten, wenn du bei null anfängst. Nichts davon ist Pflicht – alles ist ohnehin über das Menü erreichbar.</p><p>Schritte mit einem Training haken sich selbst ab: nach einem Durchgang des Lauttrainings, nach zehn richtig getippten Wörtern, nach zwanzig Wiederholungen. Die übrigen hakst du von Hand ab, sobald du dich bereit fühlst weiterzugehen.</p><p>Optionale Schritte kannst du ohne Folgen überspringen – der Weg gilt auch ohne sie als abgeschlossen.</p>"
    label: So funktioniert diese Seite
    typing_html: "<p>Die Tastatur hier zeigt die taiwanische Zhuyin-Belegung – sie ist auf den in Taiwan verkauften Tastaturen aufgedruckt, und die meisten dort tippen damit. Installieren musst du nichts: Drück dieselben Tasten, und das Zhuyin erscheint.</p><p>Tippe die Lesung des angezeigten Worts und drück dann die Leertaste oder Enter, um sie zu prüfen. Die Tontasten sind 6 (ˊ), 3 (ˇ), 4 (ˋ) und 7 (˙); eine Silbe im 1. Ton braucht keine Tontaste.</p><p>Die Wörter kommen aus deinem Wörterbuch in Lernreihenfolge – so übst du Lesungen und Tippen zugleich.</p>"
    reader_html: "<p>Lies echtes Mandarin mit eingebautem Wörterbuch. Wörter, die du schon kennst, sind ausgegraut; alles Neue ist nach Stufe eingefärbt und unterstrichen, die Lesung steht darüber.</p><p>Tippe auf ein Wort, und du bekommst den ganzen Eintrag, das Audio und einen Button, um es zu lernen. Den ganzen Text machst du mit einem Klick zu einem Stapel.</p><p>Füge selbst beliebigen Text ein oder importiere Liedtexte. Kurzzeichen werden immer zuerst in Langzeichen umgewandelt.</p>"
    placement_html: "<p>Ein adaptiver Test, der in etwa fünf Minuten deine Stufe ermittelt und dann anbietet, alles bis einschließlich dieser Stufe als bekannt zu markieren.</p><p>Die Fragen werden schwerer, solange du richtig antwortest, und leichter, wenn du danebenliegst. Die Schätzung ist absichtlich grob – auf dem Ergebnisbildschirm kannst du sie vor dem Übernehmen anpassen.</p><p>Das Markieren ist sicher: Was du schon lernst, behält seinen Fortschritt, und die markierten Einträge werden über die nächsten Wochen verteilt, damit sich die Wiederholungen nie zu einem Berg auftürmen.</p>"
    phrases_html: "<p>Ganze Äußerungen statt einzelner Vokabeln. Jede Karte ist ein Muster mit Lücken, die du aus dem Wörterbuch füllst – so deckt eine Zeile hundert Bestellungen im Teeladen ab.</p><p>Karten mit <strong>Du hörst</strong> sind die Hälfte, die jeder Sprachführer weglässt: die Fragen, die das Personal an der Theke auf dich abfeuert. Sie zu verstehen, ist wichtiger, als perfekte Sätze zu bilden.</p><p>Wo eine Form aus China zwar verstanden wird, aber importiert klingt, steht die taiwanische Form da und die andere ist durchgestrichen.</p>"
    everyday_html: "<p>Wortschatz, der wirklich taiwanisch ist und auf keiner Prüfungsliste steht – Kürzel zum Bestellen von Getränken, Slang aus dem Taiwanischen (Hokkien), die Wörter, die man in Taiwan benutzt, wo man in China etwas anderes sagt.</p><p>Filtere nach Lebensbereich oder nach der Herkunft des Worts. Was als derb markiert ist, ist auch derb. Wo China eine Entsprechung hat, wird sie gezeigt, damit du den Unterschied siehst, statt nur eine Form auswendig zu lernen.</p>"
    variants_html: "<p>Wo Taiwan von China, Hongkong und Singapur abweicht – darin, wie ein Wort gelesen wird, welches Zeichen man schreibt oder welches Wort man überhaupt wählt.</p><p>Genau diese Unterschiede verraten, dass jemand sein Mandarin anderswo gelernt hat. Was umstritten ist oder sich kürzlich geändert hat, ist im Text gekennzeichnet und wird nicht als entschieden hingestellt.</p>"
    calendar_html: "<p>Die zwölf Feste, die in Taiwan wirklich den Rhythmus des Jahres bestimmen – jedes mit der Regel, die sein Datum festlegt, statt eines Datums, das du nächstes Jahr wieder nachschlagen müsstest.</p><p>Der Abschnitt zum Mondkalender erklärt die Zählung selbst – warum 初五 bedeutet, was es bedeutet, und warum 春節 wandert. Beide Umrechner laufen im Browser: Der für 民國 ist reine Arithmetik, der für den Mondkalender nutzt eine mit dem Hong Kong Observatory abgeglichene Tabelle.</p><p>Wörter zu jedem Fest kannst du direkt aus der Liste zum Lernen hinzufügen, sofern das Wörterbuch sie schon hat.</p>"
    metro_html: "<p>Alle Linien des Netzes von Taipeh und Neu-Taipeh mit ihren Stationen in offizieller Reihenfolge. Tippe auf eine Station, und die Infokarte oben zeigt Zhuyin, Pinyin und Bedeutung; von dort aus kannst du den ganzen Wörterbucheintrag öffnen oder die Station zu einem Stapel hinzufügen.</p><p>Leere Punkte sind Umsteigestationen – die Infokarte nennt jede Linie, zu der die Station gehört. Der Plan ist nicht schematisch, sondern lagegetreu: Jede Station steht dort, wo sie wirklich liegt.</p>"
    games_html: "<p>Der Wortschatz zu taiwanischem Mahjong, Mahjong nach den offiziellen chinesischen Regeln, Xiangqi, Go und Brettspielen – jedes Wort erklärt durch das, was es im Spiel bewirkt. Ein Regelbuch ist das nicht: Ziel ist, dem Gespräch am Tisch zu folgen und Schilder, Apps und Streams zu verstehen.</p><p>Die Tabs teilen den Wortschatz nach Spiel und innerhalb jedes Spiels nach Funktion: Steine und Figuren, Spielablauf, Ansagen, Kombinationen, Strategie, was am Tisch gesagt wird. Ein grüner Punkt markiert, was man außerhalb Taiwans anders sagt, und wo China ein anderes Wort verwendet, steht es neben dem Eintrag. Die Bedeutungen sind mit dem Wörterbuch des Bildungsministeriums, den taiwanischen Regeln für das Spiel mit sechzehn Steinen und den offiziellen chinesischen Regeln von 1998 abgeglichen.</p>"
    medicine_html: "<p>Westliche Medizin, wie man in Taiwan wirklich darüber spricht: Körper und Organe, Krankheiten so, wie der Arzt sie nennt und wie man zu Hause dazu sagt, die Impfungen nach dem Impfplan der taiwanischen CDC und die Schilder, denen du durch ein Krankenhaus folgst – 掛號, 批價, 領藥. Tippe auf eine Beschriftung in den Bildern, um die Lesung zu sehen, und öffne dann den ganzen Wörterbucheintrag.</p><p>Wo ein Fachbegriff ein Alltagswort neben sich hat (闌尾炎 neben 盲腸炎), stehen beide nebeneinander. Begriffe, die sich vom Gebrauch in China unterscheiden, sind markiert, und Lehnwörter aus dem Taiwanischen (Hokkien) tragen ihre Lesung in Tâi-lô. Alles ist mit den Wörterbüchern des Bildungsministeriums und mit Taiwans eigenen Gesundheitsbehörden abgeglichen.</p>"
    dict_html: "<p>Ein einziges Wörterbuch: Einzelwörter und feste Wendungen sind hier einfach Einträge, ohne Trennung. Die Grenze ist ohnehin willkürlich – 便利商店 und 超商 bedeuten dasselbe, und sie in zwei getrennten Listen zu suchen, ergab keinen Sinn.</p><p>Die Schaltflächen für die <strong>TOCFL-Stufe</strong> grenzen auf ein Prüfungsband ein, die Reihe der TBCL-Stufen auf eine einzelne TBCL-Stufe, und der Fortschrittsfilter zeigt nur neue, begonnene oder bekannte Einträge.</p><p>Innerhalb einer Stufe sind die Einträge nach <strong>Häufigkeit</strong> sortiert – die häufigsten zuerst. Stell die Sortierung um, um rein nach Häufigkeit zu vergleichen. Tippe auf einen Eintrag, um den ganzen Artikel zu öffnen, oder leg ihn mit dem Button <strong>+</strong> direkt in einen Stapel.</p>"
    chengyu_html: "<p>成語 sind viersilbige feste Wendungen, die aus klassischen Texten und Gleichnissen stammen. Was sie wörtlich sagen, ist oft weit von dem entfernt, was sie bedeuten: 雪中送炭 heißt wörtlich „im Schnee Holzkohle bringen“, bedeutet aber „genau dann helfen, wenn Hilfe gebraucht wird“. Deshalb trägt jede Redewendung hier nicht nur eine Übersetzung, sondern auch eine <strong>Färbung</strong> – anerkennend, neutral oder missbilligend. Ob du etwas 十拿九穩 oder 莫名其妙 nennst, macht einen himmelweiten Unterschied.</p><p>Die Liste stammt aus dem Wörterbuch: Manche Redewendungen sind anhand von Wörterbuchangaben markiert, andere wurden von Hand geprüft – diese haben einen Hinweis, wann man sie tatsächlich sagt, und ein echtes Beispiel. Tippe auf eine Redewendung, um den ganzen Eintrag mit Audio, Zerlegung der Zeichen und Beispielsätzen zu öffnen.</p>"
    tbcl_html: "<p>TBCL (臺灣華語文能力基準) ist die Skala, nach der Mandarin in Taiwan tatsächlich unterrichtet wird: sieben Stufen, von eins bis sieben. Sie ist anders aufgebaut als die TOCFL-Prüfung – sie folgt einem Lehrplan, nicht einem Prüfungsformat.</p><p>Innerhalb einer Stufe reichen die Einträge vom häufigsten bis zum seltensten. Der Balken zeigt, wie viel von der Stufe du schon kannst – mitgezählt wird alles, was du irgendwo in der App gelernt hast, nicht nur hier.</p>"
    characters_html: "<p>Die 4808 gebräuchlichen Langzeichen aus der Liste des Bildungsministeriums. Jede Kachel zeigt ein Zeichen; tippe darauf, und du siehst Lesungen (Zhuyin + Pinyin), Strichfolge, Etymologie, die Wörter, in denen es vorkommt, und wie fest es in deinem Gedächtnis sitzt.</p><p>Die Zeichen sind nach Häufigkeit sortiert, die, denen du am häufigsten begegnest, kommen also zuerst.</p>"
    sentences_html: "<p>Vollständige Beispielsätze aus den Lektionen. Jedes Wort in einem Satz verlinkt auf seinen Wörterbucheintrag, du kannst also auf alles Unbekannte tippen. Mit dem Quellenfilter beschränkst du die Liste auf ein Buch oder eine Lektion.</p>"
    search_html: "<p>Drei Felder, die sich kombinieren lassen. <strong>Schreibung oder Bedeutung</strong> nimmt Zeichen oder ein Wort auf Deutsch oder Englisch. <strong>Pinyin</strong> und <strong>Zhuyin</strong> nehmen eine Lesung; Töne kannst du als Tonzeichen, als Ziffern nach jeder Silbe oder gar nicht schreiben – <code>nǐhǎo</code>, <code>ni3hao3</code> und <code>ni hao</code> führen alle zum selben Wort. Gibst du Töne an, kommen zuerst die Einträge mit genau diesen Tönen und erst danach der Rest.</p><p>Setzt du den Haken bei <strong>Stattdessen in der Satzsammlung suchen</strong>, fällt die Einteilung nach Art weg: Jeder Treffer ist ein Satz, in dem dein Wort markiert ist, zehn pro Seite, filterbar nach Stufe und Stil. Stehen zwei Wörter in der Anfrage, sagt dir die Seite außerdem, ob sie zusammenpassen.</p>"
    radicals_html: "<p>Die 214 Kangxi-Radikale – die Bausteine, unter denen jedes Zeichen eingeordnet ist. Tippe auf ein Radikal, um die Zeichen zu sehen, die es enthalten.</p>"
    zhuci_html: "<p>Die Partikeln, die das taiwanische Mandarin ans Satzende hängt: 啦, 喔, 耶, 嘛, 齁 und die übrigen. Eine Wörterbuchbedeutung tragen sie gar nicht, dafür alles, was im Tonfall liegt – Wärme, Ungeduld, eine freundliche Warnung, gespielte Empörung. Wer mit „doch“, „ja“ und „halt“ aufgewachsen ist, versteht das Prinzip sofort. Die Karten sind danach sortiert, wie oft die Partikel in unseren taiwanischen Korpora tatsächlich einen Satz abschließt; öffne eine, um alle Nuancen zu sehen, die sie ausdrücken kann – mit Beispielen, deren Übersetzung die Stimmung bewahrt.</p>"
    liangci_html: "<p>Zählwörter (量詞) im taiwanischen Mandarin sind die kleinen Wörter zwischen Zahl und Nomen: 一<b>本</b>書, 三<b>隻</b>貓 – so wie „Glas“ in „ein Glas Wasser“, nur bei jedem Nomen. Jeder Eintrag zeigt, was das Zählwort zählt, zu welchen Nomen es tatsächlich gehört und wie es in echten Sätzen aussieht. Die Listen stammen aus 教育部國語辭典簡編本, CC-CEDICT und unseren taiwanischen Korpora. Außerdem gibt es ein Spiel, bei dem du das passende Zählwort zuordnest.</p>"
    tocfl_html: "<p>Dein Fortschritt auf dem Weg zu jeder offiziellen TOCFL-Stufe. Mitgezählt wird jedes Zeichen und jedes Wort, das du irgendwo in der App gelernt hast, nicht nur hier. Öffne eine Stufe, um sie direkt zu lernen oder genau zu sehen, was noch fehlt.</p>"
    study_html: "<p>Wisch einmal durch die ganze Runde – Karten, die du nicht wusstest, kommen zurück, die anderen sind erledigt. <strong>Nach rechts</strong> = „Gewusst“, <strong>nach links</strong> = „Nicht gewusst“, <strong>nach oben</strong> = „Leicht“, <strong>nach unten</strong> = „Mit Fehler“. Die Pfeiltasten funktionieren auch, und ein Tippen auf die Karte dreht sie um.</p><p>Neues kommt jeweils als Gruppe dazu, gemischt mit allem, was zur Wiederholung fällig ist. Geplant wird mit FSRS, eine Karte kommt also genau dann zurück, wenn du sie sonst vergessen würdest.</p>"
    pronunciation_html: "<p>Sprich das Wort ins Mikrofon; jede Silbe wird nach ihrem <strong>Ton</strong> und ihrem <strong>An- und Auslaut</strong> bewertet. Grün heißt richtig, Orange knapp daneben, Rot falsch. Im Automodus geht es weiter, sobald es stimmt, und das Mikrofon bleibt offen, bis es klappt. Akzeptiert werden sowohl die Standardaussprache als auch die taiwanische.</p>"
    writing_html: "<p>Ruf dir das Zeichen anhand von Bedeutung und Lesung ins Gedächtnis und schreib es dann Strich für Strich. Die Striche werden der Reihe nach geprüft; ein falscher Strich wird zurückgesetzt. Zeichen mit vielen Fehlern kommen zuerst wieder, danach der Rest, die leichtesten zuerst.</p>"
    handwriting_html: "<p>Zeichne ein Langzeichen Strich für Strich, und es wird offline erkannt – ohne Netz, nichts verlässt dein Gerät. Praktisch zum schnellen Nachschlagen, wenn du die Form kennst, aber nicht die Lesung.</p>"
    cangjie_html: "<p>Cangjie-5-Eingabe für Taiwans Langzeichen. Tippe die lateinischen Tasten, aus denen sich ein Zeichen zusammensetzt, um es zu bilden. Jede Zeichenseite zeigt auch den Cangjie-Code.</p>"
    history_html: "<p>Was du zuletzt gelernt hast und wie fest jeder Eintrag sitzt. Die Punkte zeigen die Gedächtnisstärke pro Fertigkeit (Erkennen, Lesung, Ton, Schreiben). So merkst du, was dir entgleitet, noch bevor es fällig ist.</p>"
    practice_drill_html: "<p>Karten, die die beiden Lautschriften gegeneinander abfragen. Wähl eine Richtung – du siehst ein Zhuyin-Zeichen und rufst das Pinyin ab oder umgekehrt – und wisch dann nach rechts, wenn du es wusstest, und nach links, wenn nicht.</p><p>Was du nicht wusstest, kommt später in der Runde wieder und wird gespeichert, sodass die nächste Runde mit deinen schwachen Lauten beginnt. Anlaute und Auslaute lassen sich getrennt üben.</p>"
    practice_progress_html: "<p>Zwei verschiedene Dinge an einem Ort, und sie stammen aus verschiedenen Übungen.</p><p>Unter <strong>Lautübungen</strong> siehst du deine Durchgänge durch die Erkennungskarten und den Zhuyin-Tipptrainer und die Zeichen, bei denen du am häufigsten danebenliegst. Der Abschnitt erscheint, sobald du den ersten Durchgang abgeschlossen hast.</p><p><strong>Eigene Aussprache</strong> beruht auf deinen Versuchen am Mikrofon: welche Töne und Anlaute zuverlässig gelingen und welche nicht. Solange du nichts ins Mikrofon gesprochen hast, bleibt dieser Abschnitt leer – das ist so gewollt: Er hängt nicht mit den Karten zusammen.</p>"
