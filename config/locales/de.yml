      course: Sechzig Lektionen von „Hallo“ bis B1 – Dialoge, Wörter, Grammatik, Übungen.
      path: "Dein Fahrplan: was du der Reihe nach durcharbeitest und bei welchem Schritt du gerade bist."
      desk: Die Tagesübersicht – wie viel fällig ist, wie viel neu ist, und ein Button, der dich an die richtige Stelle bringt.
      desks: Eigene Stapel aus einem Text, einer Datei, einem Lied oder einer Lektion – mit Gruppen und Links zum Teilen.
      reader: "Füge einen beliebigen Text ein: Er wird in Wörter zerlegt, und über allem, was du noch nicht kennst, steht Zhuyin."
      graded: Texte nach Stufen, die du durchlesen kannst, ohne ständig im Wörterbuch nachzuschlagen.
      placement: Ein adaptiver Test, der deine Startstufe festlegt und markiert, was du schon kannst.
      plan: Nenne eine TOCFL-Stufe und ein Datum, und das tägliche Pensum an neuem Stoff wird berechnet.
      triage: Sortiere einen Schwung Wörter per Wischgeste in „kenne ich“ und „will ich lernen“, ohne Karten zu öffnen.
      textbook: Lektionsübersichten aus dem Lehrbuch, mit Analyse und der Markierung „Lektion kann ich“.
      textbook-phrases: Sprechsätze aus dem Lehrbuch – Satzmuster mit Ersetzungen, laut und gegen die Uhr.
      stories: "Der Lesesaal: ganze Texte mit derselben Analyse wie unter „Texte lesen“."
      exams: Echte TOCFL-Prüfungen mit Lösungsschlüssel, PDF und Audio.
      radicals: Die 214 Kangxi-Radikale – Strichzahl, Bedeutung und die Wörter, in denen sie vorkommen.
      characters: "Zeichen im Detail: Lesungen, Striche, Schreibanimation, Etymologie, Wörter nach Lesung."
      dict: "Wörter und Kollokationen: nummerierte Bedeutungen, Thesaurus, Zählwörter, Korpusbeispiele."
      sentences: Das Satzkorpus, filterbar nach Stufe, Stilebene und danach, wie genau die Stufe passt.
      chengyu: 成語-Redewendungen, filterbar nach Ton, Typ und Schwierigkeitsbereich.
      liangci: "Zählwörter: zu welchen Wörtern sie passen, Beispiele aus dem echten Leben und ein Spiel, damit sie sitzen."
      tbcl: TBCL-Wortlisten in sieben Stufen – dein Fortschritt ist hervorgehoben.
      tocfl: TOCFL-Wortlisten nach Stufe – dein Fortschritt ist hervorgehoben.
      practice-zhuyin: Woraus eine Silbe besteht – Anlaute, Auslaute, Töne und die typischen Verwechslungen.
      syllables: "Die vollständige Silbentabelle des Mandarin: welche Kombinationen es wirklich gibt."
      tones: Die vier Töne und der neutrale Ton, was Taiwan anders macht, die Regeln des Tonsandhi.
      hanzi: "Wie ein Zeichen aufgebaut ist: 六書, Komponenten, Lautträger-Reihen, Strichfolge."
      cangjie-lessons: Das Cangjie-Lehrbuch – vierzig Lektionen von einzelnen Tasten bis zu den Zerlegungsregeln, mit Übungen und Zeichenlisten.
      practice-numbers: Zahlen, Geld, Datumsangaben, Minguo-Jahre und die Fallen rund um 零 und 兩.
      grammar: 582 Satzmuster nach Stufe, jedes mit Analyse, Korpusbeispielen und verwandten Themen.
      zhuci: "Modalpartikeln (語氣詞): was 吧, 啊, 呢 und 嘛 mit einem Satz machen."
      variants: Wo Taiwan und China getrennte Wege gehen – bei Lesungen, Zeichenformen und Wörtern.
      names: Wie ein taiwanischer Name aufgebaut ist – mit den Familiennamen aus dem Haushaltsregister.
      practice-zhuyin-trainer: "Zhuyin nach Gehör, in Gruppen: Die nächste Gruppe kommt erst, wenn du diese kannst."
      practice-drill: Zhuyin gegen Pinyin im Schnelldurchlauf; Zeichen, die noch nicht sitzen, kommen öfter dran.
      tones-drill: Töne nach Gehör mit Studioaufnahmen, abwechselnd Männer- und Frauenstimmen.
      pronunciation: Sprich ins Mikrofon und sieh Silbe für Silbe, wo Ton und Laut danebenlagen.
      writing: Schreib ein Zeichen aus dem Gedächtnis, ganz ohne Vorlage; das Ergebnis fließt in die Fertigkeit Schreiben ein.
      practice-typing: Die taiwanische Zhuyin-Tastaturbelegung, bis das Tippen im Muskelgedächtnis sitzt.
      cangjie: "Cangjie-Eingabe: Zerlege ein Zeichen in Komponenten und tippe seinen Code."
      mock: Eine TOCFL-Probeprüfung – Text-, Bild- und Audioformat, reproduzierbar über einen Startwert.
      everyday: "Wortschatz nach Situation: Essen, Getränke, Verkehr, Behördengänge, Wetter, Slang."
      phrases: 186 Satzmuster in 17 Situationen, darunter die Hälfte, die du nur verstehen musst.
      notices: Schilder und Durchsagen, die dir auf der Straße und in Bus und Bahn begegnen.
      metro: Der Netzplan der MRT in Taipeh, jede Station mit Bedeutung und Lesung.
      calendar: Der Mondkalender, Feste, Wörter der Jahreszeiten und zwei Datumsumrechner.
      medicine: Wie du dich in der Apotheke und im Krankenhaus verständlich machst.
      culture: Kurze Notizen dazu, wie das Leben in Taiwan funktioniert – von Schichtplänen über Kassenbons bis zu Festen.
      games: Brettspiele auf taiwanischem Mandarin – die Begriffe, die Regeln, die Sprüche am Spieltisch.
      profile: Sprache, Position des Zhuyin, Tabs auf dem Handy, Stufe, Export und Sicherung.
      progress: Die Übersicht, der Wiederholungsverlauf, die Gedächtnisstärke je Fertigkeit und die Liste der Problemkarten.
      settings-edit: Deine eigenen FSRS-Parameter – Behaltensrate, maximales Intervall, Lernschritte.
