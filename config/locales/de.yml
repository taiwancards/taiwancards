    language: Sprache
    interface_language: "Die Sprache der Oberfläche und aller Inhalte darin. Umgestellt werden nicht nur Buttons und Menüs: Wortbedeutungen, Anmerkungen, Grammatikerklärungen und Analysen sind in jeder Sprache eigens geschrieben und wechseln mit."
    hanzi_font_toggle: Schrift der Zeichen
    hanzi_font_hint: "Schrift der Zeichen. An: Kaishu, die kalligrafische Regelschrift, die die Striche so zeigt, wie eine Hand sie schreibt. Aus: eine schlichte serifenlose Schrift. Standardmäßig an."
    readings_toggle: Zhuyin und Pinyin
    audio_rate_toggle: Wiedergabetempo
    audio_rate_hint: "Wiedergabetempo in drei Stufen: normal, ¾ und ½. Beim Verlangsamen wird der Klang gedehnt, ohne dass sich die Tonhöhe ändert – die Töne bleiben also, wo sie sind. Das Tempo gilt für jeden Abspielbutton, bis du es änderst."
    detail_toggle: Wie viel eine Wörterbuchseite zeigt
    detail_hint: "Wie viel eine Wörterbuchseite zeigt. 詳 – alles, was wir haben: Seltenheitsgrad, Verteilung der Stilebenen, Merkhilfen, Thesaurus, Herkunftsgeschichten. 簡 – das Wichtigste zum Arbeiten: Lesungen, Bedeutungen, Wortart, Zählwort, Synonyme und Antonyme, Schreibübung, eine Handvoll Sätze. Bis du TOCFL Novice hinter dir hast, steht es auf 簡, danach auf 詳; ab dann bleibt es, wo du es einstellst."
    script_setup_hint: "Wie die Sprache angezeigt wird: Schrift, Pinyin, Wiedergabetempo, das Wort aus China, wie viel eine Wörterbuchseite zeigt – und die Sprache, in der du die Website liest."
    china_toggle: Wort aus China zeigen
    china_hint: "Das Wort, das in China verwendet wird. An: Eine kleine Zeile auf der Karte zeigt, was man in China stattdessen sagt. Aus: nichts weiter. Standardmäßig aus – diese App lehrt das taiwanische Wort, das aus China dient nur zum Vergleich."
    readings_hint: "Lesungen über den Zeichen, in drei Stufen: nur Zhuyin, Zhuyin mit Pinyin und gar nichts. Pinyin gibt es nie ohne Zhuyin – in Taiwan liest man mit Zhuyin. Standardmäßig nur Zhuyin; was du wählst, gilt auf jeder Seite, bis du es änderst."
