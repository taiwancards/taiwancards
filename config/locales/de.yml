    initials_lede: "21 Zeichen – alles, womit eine Silbe beginnen kann. Der Button spielt die Aufnahme des taiwanischen Bildungsministeriums ab: Erst hören, dann die Erklärung lesen."
    series:
      title: Die drei Reihen, die alle verwechseln
      body: Neun Anlaute, die im Pinyin ähnlich aussehen, aber an drei verschiedenen Stellen im Mund gebildet werden. Übe sie zuerst Reihe für Reihe – innerhalb einer Reihe bleibt die Stelle gleich, nur der Hauch ändert sich.
      rows_hint: eine Reihe
      columns_hint: drei Reihen auf einmal
      hard_title: Das hier ist wirklich schwer
      hard_body: "Nimmst du eine Spalte statt einer Reihe, sind die Laute kaum noch auseinanderzuhalten: Im Pinyin sehen sie fast gleich aus, zhi, zi und ji unterscheiden sich nur um einen Buchstaben. Der einzige Unterschied ist die Lage der Zunge – die Spitze zum Gaumendach hochgebogen, die Spitze an den unteren Zähnen oder der Zungenrücken an den harten Gaumen gedrückt. Hier musst du genau hinhören, und anfangs danebenzuliegen ist völlig normal."
      all_nine: Alle neun gemischt
      sets:
        zhi_chi_shi: zhi chi shi
        zi_ci_si: zi ci si
        ji_qi_xi: ji qi xi
        zhi_zi_ji: zhi zi ji
        chi_ci_qi: chi ci qi
        shi_si_xi: shi si xi
    drill_these: "%{symbols} üben"
    blocks:
      labial:
        title: Lippen
        body: "Die Lippen bilden diese Laute: Bei ㄅ ㄆ ㄇ treffen sich beide Lippen, bei ㄈ berührt die Unterlippe die oberen Zähne. Das Erste, was Kinder in Taiwan lernen, und der Anfang des ㄅㄆㄇㄈ-Lieds."
      alveolar:
        title: Zungenspitze
        body: Die Zunge drückt hinter die oberen Zähne. 的, 他, 你 und 了 fangen alle hier an.
      velar:
        title: Zungenrücken
        body: Hinten am Gaumen gebildet. ㄏ ist kein gehauchtes h wie in „Haus“, sondern ein weicher ach-Laut wie in „Buch“ – nur leichter.
      palatal:
        title: Nur vor ㄧ und ㄩ
        body: Sie kommen nur mit ㄧ und ㄩ vor. Achte darauf, was folgt, dann verwechselst du sie nie mit ㄓㄔㄕ.
      retroflex:
        title: Gebogene Zunge
        body: Die Zungenspitze biegt sich zum Gaumendach. In Taiwan klingen sie weicher als in chinesischen Lehrbüchern – fast wie ㄗㄘㄙ.
      sibilant:
        title: Zischlaute
        body: Zunge an den unteren Zähnen, die Luft strömt durch eine enge Rinne. Das Gegenstück zu den drei Lauten darüber.
      medial:
        title: Gleitlaute
        body: Sie stehen zwischen Anlaut und Auslaut und werden im Pinyin zu i, u und ü – oder am Silbenanfang zu y und w.
      open:
        title: Einfache Vokale
        body: Vier klare Laute, aus denen alles andere gebaut ist. ㄝ steht nie allein – nur nach ㄧ und ㄩ.
      diphthong:
        title: Diphthonge
        body: "Zwei Laute in einer Silbe: Die Zunge gleitet von einer Stellung zur nächsten, ohne dass die Silbe abreißt."
      nasal:
        title: Nasale
        body: ㄢ/ㄤ und ㄣ/ㄥ unterscheiden sich darin, wo die Zunge zum Liegen kommt – wie bei „Bann“ und „bang“. In Taiwan verschwimmt das oft, im Wörterbuch bleibt es getrennt.
      rhotic:
        title: Ein Einzelfall
        body: Eine eigene Silbe, zu finden in 二, 兒 und 耳. Nicht zu verwechseln mit der r-Endung, die man in China an andere Wörter hängt.
      compound:
        title: Zusammengesetzte Auslaute
        body: Ein Gleitlaut plus ein Auslaut. Sie brauchen keine eigene Übung – sie bestehen aus Zeichen, die du schon geübt hast.
    finals_lede: "Alles, was nach dem anlautenden Konsonanten von der Silbe übrig bleibt: ein Vokal, ein Diphthong oder ein Vokal mit Nasal. Bei zusammengesetzten Auslauten hörst du die einzelnen Zeichen – zusammen gesprochen klingen sie nicht wie die beiden Teile nacheinander."
    why_title: Warum das keine Kleinigkeit ist
    why_body: "Pinyin kannst du ohne jede Vorbereitung lesen – und genau das macht es gefährlich: Du liest die Buchstaben unwillkürlich wie im Deutschen, und der Fehler setzt sich unbemerkt fest. Hinter einem Zhuyin-Zeichen steht nichts als der Laut, den du ihm beibringst. Genau deshalb notiert Taiwan die Lesungen damit."
    compound_audio: "Ein zusammengesetzter Auslaut: Du hörst die einzelnen Zeichen. Zusammen gesprochen klingt er nicht wie die beiden Teile nacheinander – siehe die Hinweise rechts."
    play_symbol: "%{symbol} abspielen"
    phonetics_card: "Die vollständige Lauttabelle: Zhuyin, Pinyin, IPA, ein Klangvergleich aus dem Deutschen und Beispiele."
    phonetics_title: Zhuyin und Pinyin
    col_explanation: Der Haken
    col_written: Schreibung
    col_real_sound: Tatsächlicher Laut
    rimes_lede: Bei einer Reihe von Auslauten schreibt das Pinyin nicht, was du tatsächlich hörst. Gerade hier liegt Zhuyin meist näher am echten Klang – wo und warum, steht hier.
    rimes: Wo Schrift und Klang auseinandergehen
    study: Lernen
    speak: Sprechen
    write: Schreiben
    title: Grundlagen
    intro: Lerne die Laute des Mandarin von Grund auf – zuerst die Lautschriften, dann die Aussprache.
    initials: Anlaute (Konsonanten)
    finals: Auslaute (Vokale)
    play: Abspielen
    col_pinyin: Pinyin
    col_palladius: Palladius
    palladius_note: ""
    col_zhuyin: Zhuyin
    col_ipa: IPA
    col_analogy: Klingt wie
    col_example: Beispiel
    pinyin_intro: Die Umschrift, die die ganze App verwendet. Jeder Laut mit IPA, einem anschaulichen Vergleich und einem Beispielwort.
    zhuyin_intro: Taiwans Lautschrift. Du kannst sie neben dem Pinyin lernen oder direkt über die Laute. Dieselbe Tabelle zeigt beides.
    drill:
      lede: "Die beiden Schriften zuordnen: Zeichen sehen, die lateinische Schreibung nennen, und umgekehrt. Pinyin ist hier eine Brücke, nicht das Fundament."
      title: Zhuyin ↔ Pinyin
      direction_zhuyin: Zhuyin → Pinyin
      direction_pinyin: Pinyin → Zhuyin
      systems_html: "Zhuyin, das sind 37 Zeichen, mit denen Taiwan Laute schreibt. Jedes wird immer gleich gelesen, und du kannst nichts hineinlesen, was du von lateinischen Buchstaben gewohnt bist – du lernst einfach, wie es klingt. Pinyin schreibt dieselben Laute mit lateinischen Buchstaben; es ist eine Stütze, mehr nicht. So gehst du vor: Arbeite dich durch die Tabellen unten, bis du die Zeichen am Klang erkennst."
      stage_hint: "Geh der Reihe nach vor: zuerst die Konsonanten, dann Vokale und Gleitlaute, dann die vollständigen Reime und erst dann ganze Silben."
      stages:
        consonants: Konsonanten
        vowels: Vokale
        finals: Reime
        syllables: Ganze Silben
      prompt_zhuyin: Welches Pinyin ist das?
      prompt_pinyin: Welches Zhuyin ist das?
      keys: Wisch die Karte zu deiner Antwort oder nutze die Pfeiltasten
      done_title: Runde geschafft
      restart: Noch einmal
      see_chart_zhuyin: Zhuyin-Tabelle
      see_chart_pinyin: Pinyin-Tabelle
      card: Ordne Zhuyin und Pinyin in beide Richtungen per Wischen zu.
      syllable_title: So ist eine Silbe im taiwanischen Mandarin gebaut
      syllable_body: Jede Silbe hat höchstens drei Stellen. Pflicht ist nur die letzte – 一 ist ein bloßer Auslaut, 四 ein Anlaut, nach dem gar kein Vokal geschrieben wird. Zhuyin schreibt die Stellen einzeln aus, Pinyin zieht sie oft zusammen oder lässt sie weg.
      slots:
        initial_label: Anlaut 聲母
        initial_glyph: ㄓ
        initial_body: Einer von 21 Konsonanten. Optional – viele Silben beginnen mit dem Vokal.
        medial_label: Gleitlaut 介音
        medial_glyph: ㄨ
        medial_body: "Einer von drei Gleitlauten: ㄧ ㄨ ㄩ. Diese Stelle versteckt das Pinyin am häufigsten."
        final_label: Auslaut 韻母
        final_glyph: ㄥ
        final_body: Der Reim – ein Vokal, ein Diphthong oder ein Vokal mit -n oder -ng. Die einzige Pflichtstelle.
      tones_title: Wohin der Ton kommt
      tones_body: "Pinyin setzt ein diakritisches Zeichen über den Hauptvokal: mā má mǎ mà. Zhuyin lässt den 1. Ton unmarkiert und schreibt ˊ ˇ ˋ hinter die Zeichen – ㄇㄚ ㄇㄚˊ ㄇㄚˇ ㄇㄚˋ. Der neutrale Ton ist in beiden Systemen die Ausnahme: Pinyin lässt das Zeichen einfach weg, Zhuyin setzt einen Punkt ˙ davor, wie in ˙ㄉㄜ. In senkrechter Schrift läuft das Zhuyin rechts neben dem Schriftzeichen von oben nach unten, das Tonzeichen eingeschlossen."
      mismatch_title: Wo dich das Pinyin in die Irre führt
      mismatch_body: "Das sind keine Ausnahmen zum Auswendiglernen. Sie folgen aus einer einzigen Entscheidung: Um die Schreibung kurz zu halten, lässt das Pinyin Vokale in der Silbenmitte weg, nutzt einen Buchstaben für verschiedene Laute und schreibt manchmal einen Buchstaben, wo gar kein Laut ist. Zhuyin schreibt nichts, was nicht gesprochen wird – deshalb zeigt die Zhuyin-Spalte, woraus die Silbe wirklich besteht."
      mismatch_pinyin: Pinyin
      mismatch_zhuyin: Zhuyin
      mismatch_why: Was wirklich passiert
      mismatch:
        zhong:
          pinyin: zhong
          zhuyin: ㄓㄨㄥ
          why: zh ist ㄓ, aber dieses o ist kein ㄛ. Der Reim -ong ist eigentlich -ung (wie in „Zeitung“), deshalb schreibt Zhuyin den Gleitlaut ㄨ und den Reim ㄥ.
        jiu:
          pinyin: jiu
          zhuyin: ㄐㄧㄡ
          why: "Der Reim ist -iou; das Pinyin lässt den mittleren Vokal weg, um die Schreibung kurz zu halten. Zhuyin behält beide: ㄧ und ㄡ."
        hui:
          pinyin: hui
          zhuyin: ㄏㄨㄟ
          why: Derselbe Trick – der Reim ist -uei, und das Pinyin verschluckt das e. Zhuyin schreibt ㄨ und ㄟ.
        yu:
          pinyin: yu
          zhuyin: ㄩ
          why: Das y ist kein Konsonant, es trägt nur den Vokal, und das u ist in Wahrheit ein ü. Ein Laut, also schreibt Zhuyin ein Zeichen.
        zhi:
          pinyin: zhi
          zhuyin: ㄓ
          why: Dieses i steht für gar keinen Vokal – es ist die gehaltene, zurückgebogene Zunge. Zhuyin schreibt nach ㄓ nichts, weil da nichts ist.
        weng:
          pinyin: weng / -ong
          zhuyin: ㄨㄥ
          why: Zwei verschiedene Pinyin-Schreibungen für ein und denselben Reim, je nachdem, ob ein Konsonant davorsteht. Im Zhuyin ist es in beiden Fällen ㄨㄥ.
      mismatch_more_title: Was du mitnehmen solltest
      mismatch_more_body: "Wer Pinyin liest, korrigiert ständig im Stillen: Hier ist o eigentlich u, hier fehlt ein Vokal, hier ist i gar kein Vokal, hier ist u eigentlich ü. Jede dieser Korrekturen ist eine Stelle, an der sich eine falsche Aussprache festsetzen kann – und meist merkt man es nie, weil die Schreibung völlig plausibel aussieht. Zhuyin verlangt keine davon: Was dasteht, wird gesprochen."
    tones_title: Töne und Laute
    tones_card: Sprich Silben laut aus – du bekommst zu jedem Ton eine Rückmeldung, bis alles sitzt.
    dictation_title: Diktat
    dictation_card: Eine muttersprachliche Aufnahme – schreib sie in Schriftzeichen, Pinyin oder Zhuyin auf.
