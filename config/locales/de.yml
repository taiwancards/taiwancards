  games:
    title: Brettspiele in Taiwan
    empty: Die Brettspielsammlung ist noch nicht importiert.
    boards:
      mahjong: Mahjong
      mcr: Mahjong (China)
      xiangqi: Xiangqi
      go: Go
      tabletop: Brett- und Kartenspiele
    leads:
      mahjong:
        title: Taiwanisches Mahjong
        body: "Das Spiel mit sechzehn Steinen ist taiwanisch, nicht gesamtchinesisch. Eine Hand besteht aus fünf Sätzen und einem Paar, die Punkte für Kombinationen werden in Tai addiert statt multipliziert, die acht Blumensteine zählen für sich, und der Gewinn eines Abends hängt an der Serie des Gebers. Ein Minimum gibt es nicht: Auch eine Hand mit null Tai gewinnt."
        note: Hier geht es um die Fachbegriffe und ihre Bedeutung, nicht um ein Regelbuch.
      mcr:
        title: Mahjong nach offiziellen chinesischen Regeln
        body: "Die Turnierregeln, die 1998 in China eingeführt wurden. Dreizehn Steine, 81 Kombinationen und eine Schwelle von acht Punkten: Eine Hand mit weniger Punkten gewinnt überhaupt nicht. Gezählt wird in Fan statt in Tai, und viele der Kombinationen kennt man am taiwanischen Spieltisch schlicht nicht."
        note: In Taiwan spielt man nach diesen Regeln auf Turnieren und zu Hause nach den eigenen.
      xiangqi:
        title: Xiangqi, chinesisches Schach
        body: Die Figuren stehen auf den Schnittpunkten der Linien, nicht in Feldern. General und Berater verlassen nie den Palast, der Elefant überquert nie den Fluss, das Pferd wird von einer angrenzenden Figur blockiert, und die Kanone schlägt nur über eine dazwischenstehende Figur hinweg. Wer patt gesetzt ist, verliert, und Dauerschach ist verboten.
        note: Bei Rot und Schwarz tragen dieselben Figuren verschiedene Zeichen.
      go:
        title: Go, auch Weiqi genannt
        body: "Go und Weiqi sind ein und dasselbe Spiel: 圍棋 bedeutet „Umzingelungsspiel“, auf Japanisch heißt es Go, und in Taiwan sind beide Wörter üblich. Die Steine werden auf Schnittpunkte gesetzt und nie mehr bewegt, eine Gruppe mit zwei echten Augen lebt, und in Taiwan gilt die Flächenzählung, nicht die Gebietszählung."
        note: Viele Begriffe stammen aus dem Japanischen, werden aber mit eigenen Zeichen geschrieben.
      tabletop:
        title: Brettspiele, Karten und Straßenspiele
        body: "Moderne Brettspiele heißen in Taiwan 桌遊; man spielt sie in Spielecafés, die nach Stunden abrechnen. Daneben gibt es einen eigenen Kanon an Kartenspielen: 大老二, 十三支, 心臟病 und das Straßenspiel 暗棋, Xiangqi mit verdeckten Figuren auf einem halben Brett."
        note: "Hier stehen auch die Wörter, die du an jedem Spieltisch brauchst: Züge, Punkte, Chips, Auslosen der Plätze."
