de:
  audio:
    play: Abspielen
    source_whole: MOE – Aufnahme des ganzen Wortes
  privacy_google:
    heading: Anmeldung mit Google und deine Daten
    body: Dein Konto entsteht, wenn du dich mit Google anmeldest – eine eigene Registrierung und ein Passwort gibt es nicht.
    signin: Wenn du dich mit Google anmeldest, erhält TaiwanCards deine E-Mail-Adresse und den Namen aus deinem Profil. Damit wird dein Konto angelegt und dein Lernfortschritt mit ihm verknüpft.
    drive: Nur wenn du eigens „In Google Drive sichern“ wählst, legt die App in deinem Drive eine einzige Datei mit einer Sicherung deines Lernfortschritts an. Lesen und überschreiben kann sie ausschließlich diese Datei.
    limits: "Der Zugriff ist auf die Berechtigung drive.file beschränkt: Die App erreicht nur Dateien, die sie selbst angelegt hat. Alle anderen Dateien in deinem Drive kann TaiwanCards weder sehen noch öffnen. Eine Sicherung entsteht nie automatisch, sondern nur, wenn du den Button drückst."
    privacy: Datenschutzerklärung
    terms: Nutzungsbedingungen
    policy_before: Unser Umgang mit Daten, die wir über Google-APIs erhalten, folgt der
    policy_name: Google API Services User Data Policy
    policy_after: einschließlich ihrer Anforderungen zur eingeschränkten Nutzung (Limited Use). Daten aus deinem Google-Konto werden nie für Werbung verwendet, nie verkauft und nie über das hier Beschriebene hinaus weitergegeben.
  privacy:
    title: Datenschutzerklärung
    effective: "Gültig ab: 10. Oktober 2026"
    purpose:
      heading: Wozu diese App dient
      body: TaiwanCards ist eine kostenlose, werbefreie Web-App zum Lernen von taiwanischem Mandarin. Sie bietet Karteikarten mit verteilter Wiederholung, ein Wörterbuch, Ausspracheübungen und Wortlisten. Betrieben wird sie von einem unabhängigen Entwickler, nicht von einem Unternehmen.
    stored:
      heading: Was wir speichern
      items:
        - Deine E-Mail-Adresse, deinen Anzeigenamen und deine Oberflächensprache.
        - "Kein Passwort: Das Konto wird über Google angelegt, die App fragt dich nie nach einem Passwort."
        - "Deine Lerndaten: Stapel, Karten, Wiederholungsverlauf, Fortschritt und Übungseinstellungen."
        - Deine Ausspracheversuche und die daraus abgeleiteten Messwerte.
        - Server-Protokolle der Anfragen – für einen stabilen Betrieb und zur Abwehr von Missbrauch.
        - "Zusammengefasste Seitenaufrufe pro Tag: die Seite, die verweisende Website, der Gerätetyp, das Land und die Oberflächensprache. Die App zählt sie selbst – ohne Cookie, ohne IP-Adresse und ohne jede Verbindung zu einem Konto."
    never:
      heading: Was wir nicht tun
      items:
        - Wir verkaufen und vermieten keine personenbezogenen Daten.
        - Wir zeigen keine Werbung und setzen keine Werbe-Tracker ein.
        - Wir nutzen keine Analysedienste von Dritten.
        - Wir erstellen kein Profil von dir – außer um dir deinen eigenen Fortschritt zu zeigen.
    cookies:
      heading: Cookies
      body: "Wir verwenden zwei Cookies, beide technisch notwendig: ein signiertes Sitzungs-Cookie, das dich angemeldet hält, und ein Cookie, das sich deine Oberflächensprache merkt. Werbe- oder Tracking-Cookies gibt es nicht."
    emails:
      heading: E-Mails
      items:
        - An die E-Mail-Adresse deines Kontos schicken wir höchstens ein- bis zweimal im Monat eine kurze Nachricht über Neues in der App. Sie enthält keine Werbung und nichts von Dritten.
        - "Erinnerungen an fällige Karten: höchstens eine pro Tag, nur wenn Karten auf dich warten, und zu der Uhrzeit, zu der du meistens lernst. Sie sind standardmäßig eingeschaltet und lassen sich mit einem Klick oder in deinem Profil ausschalten – unabhängig vom Newsletter."
        - Jede E-Mail enthält einen Link, mit dem du dich mit einem Klick abmeldest; ausschalten kannst du die E-Mails auch in deinem Profil. Die Abmeldung ändert sonst nichts an deinem Konto.
        - "Wir speichern, wann dir eine E-Mail geschickt wurde, wann du zum ersten Mal einem ihrer Links zurück in die App gefolgt bist und wie oft, und wann du dich abgemeldet hast. Lässt sich eine E-Mail nicht zustellen, bewahren wir die Fehlermeldung des Mailservers auf. Ob du eine E-Mail öffnest, erfassen wir nicht: Unsere E-Mails enthalten keine Zählpixel, ihre Bilder sind direkt angehängt."
        - Die E-Mails übergeben wir an Resend, einen Versanddienst. Resend erhält deine Adresse und die Nachricht ausschließlich, um sie zuzustellen.
    donation:
      heading: Spendenbutton
      body: Die Seite „Unterstützen“ enthält einen einfachen Link zu Buy Me a Coffee, einem externen Dienst. Von dort wird nichts geladen, solange du dem Link nicht folgst, es werden keine Kontodaten übermittelt, und eine Spende ist nie Voraussetzung für irgendetwas.
    where:
      heading: Wo die Daten liegen
      body: Die Anwendung und ihre Datenbank laufen bei Render in Singapur. Der Datenverkehr läuft über Cloudflare, Audiodateien werden aus Cloudflare R2 ausgeliefert, und Newsletter verschickt Resend, ein US-Unternehmen, von seinen Servern in Japan aus. Diese Anbieter verarbeiten Daten nur, um den Dienst zu hosten und seine E-Mails zuzustellen. Nutzt du die Sicherung in Google Drive, liegt diese Kopie in deinem eigenen Google-Konto.
    retention:
      heading: Speicherdauer und Löschung
      body: Deine Daten bleiben gespeichert, solange dein Konto besteht. Schreib an die unten genannte Adresse, wenn du dein Konto mit allen Inhalten löschen lassen möchtest; Server-Protokolle werden nach einiger Zeit von selbst gelöscht. Die Löschung deines Kontos hier betrifft keine Sicherungsdatei, die du in deinem eigenen Google Drive angelegt hast – diese Datei löschst du selbst.
    choices:
      heading: Deine Möglichkeiten
      items:
        - Das Wörterbuch, die Grammatik, die Nachschlageteile und alles über Taiwan kannst du ganz ohne Konto lesen.
        - Den Zugriff der App auf dein Google-Konto kannst du jederzeit auf der Seite mit den Berechtigungen deines Google-Kontos widerrufen.
        - Du kannst eine Kopie deiner Daten, ihre Berichtigung oder ihre vollständige Löschung verlangen.
    children:
      heading: Kinder
      body: Die App richtet sich nicht an Kinder unter 13 Jahren; wissentlich werden für sie keine Konten angelegt.
    changes:
      heading: Änderungen
      body: Ändert sich diese Datenschutzerklärung, ändert sich auch das oben genannte Datum.
    contact:
      heading: Kontakt
      body: "Fragen, Auskunftsanfragen und Löschanträge:"
    related:
      heading: Weitere Dokumente
  terms:
    title: Nutzungsbedingungen
    effective: "Gültig ab: 1. März 2025"
    service:
      heading: Der Dienst
      body: TaiwanCards ist eine Webanwendung zum Lernen von taiwanischem Mandarin, betrieben von einem unabhängigen Entwickler. Die Nutzung ist kostenlos und werbefrei, der Dienst wird so angeboten, wie er ist. Funktionen können sich ändern oder wegfallen.
    account:
      heading: Dein Konto
      items:
        - Mach korrekte Angaben zu deinem Konto und gib deine Zugangsdaten nicht weiter.
        - Ein Konto pro Person. Für alles, was unter deinem Konto geschieht, bist du verantwortlich.
        - Du kannst dein Konto jederzeit löschen lassen – schreib dazu an die unten genannte Adresse.
    use:
      heading: Zulässige Nutzung
      items:
        - Versuche nicht, auf Daten, Systeme oder fremde Konten zuzugreifen, auf die du kein Recht hast.
        - Lies die Website nicht massenhaft automatisiert aus und erzeuge keine automatisierte Last, die über gewöhnliches Lernen hinausgeht.
        - Lade keine rechtswidrigen oder schädlichen Inhalte hoch.
        - Beachte die Lizenzen der Wörterbücher, Korpora und Schriftarten, die auf der Seite „Lizenzen“ aufgeführt sind.
    yours:
      heading: Was du erstellst
      body: Stapel, Notizen und Fortschritt, die du anlegst, gehören weiterhin dir. Du räumst nur die Rechte ein, die nötig sind, um sie zu speichern und dir wieder anzuzeigen. Deinen Fortschritt kannst du jederzeit exportieren, auch in dein eigenes Google Drive.
    ours:
      heading: Was wir verwenden
      body: Der Code der Anwendung und die eigenen Texte gehören ihrem Autor. Wörterbücher, Korpora, Audioaufnahmen und Schriftarten stammen von Dritten und werden nach deren eigenen Lizenzen verwendet, die jeweils auf der Seite „Lizenzen“ genannt sind. Diese Bedingungen räumen dir an solchem Material Dritter keine Rechte ein, die über diese Lizenzen hinausgehen.
    availability:
      heading: Verfügbarkeit
      body: Der Dienst wird so bereitgestellt, wie er ist und soweit er verfügbar ist – ohne Gewähr für einen unterbrechungsfreien Betrieb und ohne Gewähr dafür, dass die sprachlichen Daten fehlerfrei sind. Er ist eine Lernhilfe, keine maßgebliche Instanz für die Sprache.
    suspension:
      heading: Sperrung
      body: Konten, die gegen diese Bedingungen verstoßen oder den Dienst gefährden, können gesperrt oder gelöscht werden.
    liability:
      heading: Haftung
      body: Soweit gesetzlich zulässig, haftet der Entwickler nicht für mittelbare Schäden, Neben- oder Folgeschäden, die aus der Nutzung des Dienstes entstehen.
    changes:
      heading: Änderungen
      body: Diese Bedingungen können aktualisiert werden. Dann ändert sich auch das oben genannte Datum; wenn du den Dienst nach diesem Datum weiter nutzt, akzeptierst du die geänderten Bedingungen.
    contact:
      heading: Kontakt
      body: "Fragen zu diesen Bedingungen:"
    related:
      heading: Weitere Dokumente
