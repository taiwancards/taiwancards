    system_body: Im Deutschen gliedern sich große Zahlen in Dreiergruppen – Tausend, Million, Milliarde. Mandarin gliedert in Vierergruppen. Deshalb ist „Million“ kein eigenes Wort, sondern 一百萬 – hundert 萬. Am leichtesten gewöhnst du dich daran, wenn du in Gedanken alle vier Stellen von rechts einen Punkt setzt statt alle drei.
