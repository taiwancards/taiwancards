    exam:
      title: Die TOCFL-Prüfung
      lede: Taiwans Sprachprüfung für Mandarin-Lernende, verantwortet vom SC-TOP, dem Steering Committee for the Test of Proficiency-Huayu (國家華語測驗推動工作委員會). Wie der Prüfungstag abläuft, wie bewertet wird und was dir eine Stufe bringt.
      tests_title: Vier Prüfungen
      tests_body: Hören und Lesen legst du zusammen am Computer ab, als eine Prüfung (聽讀測驗). Sprechen (口語) und Schreiben (寫作) sind eigene Prüfungen, für die du dich jeweils nach Band anmeldest. Für Kinder gibt es eine eigene Prüfung, den CCCC.
      adaptive_title: Ein Termin für alle Stufen
      adaptive_body: "Die Prüfung in Hören und Lesen ist adaptiv: Du wählst keine Stufe. Solange du richtig antwortest, werden die Fragen schwerer, nach Fehlern leichter, und die Prüfung endet, sobald sie dich eingestuft hat. Zu einer früheren Frage kannst du nicht zurück, und am Ende steht das Ergebnis auf dem Bildschirm."
      listening: "Hörverstehen: etwa 35 Fragen in etwa 50 Minuten, nach jeder Aufnahme hast du 10 Sekunden für die Antwort. Bilder, Frage und Antwort, kurze Dialoge und längere Passagen."
      reading: "Leseverstehen: etwa 35 Fragen in 60 Minuten. Einzelne Sätze, Bilder, Lückentexte und Lesetexte."
      scores_title: Punkte und Stufen
      scores_body: Die Punkte werden auf eine Skala bis 700 umgerechnet. Hören und Lesen haben jeweils eigene Bestehensgrenzen, deshalb kannst du in beiden auf unterschiedlichen Stufen landen.
