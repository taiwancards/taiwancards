      heading: Paare, die zusammengehören
      body: "Sortiert nach punktweiser Transinformation (PMI): wie viel häufiger zwei Zeichen zusammen vorkommen, als der Zufall erwarten ließe. Ein hoher Wert heißt, dass das Paar eine echte Konvention ist und kein Zufall."
    shape:
      example_surname: Familienname
      example_given: Vorname
      compact: Der Familienname ist ein ererbtes Zeichen, der Vorname besteht aus ein oder zwei Zeichen, die die Familie auswählt. Die Reihenfolge ändert sich nie – ganz gleich, wie die lateinischen Buchstaben im Reisepass stehen.
    surnames:
      heading: Die Familiennamen Taiwans
      note: Die %{shown} häufigsten von %{total} Familiennamen, gezählt bei %{people} Personen im Haushaltsregister.
    characters:
      heading: Zeichen in Vornamen
      body: Sortiert danach, wie oft sie in eingetragenen Vornamen vorkommen. Jedes ist mit seinem Wörterbucheintrag verlinkt, damit du nachlesen kannst, was es wirklich bedeutet.
      caution: Ein Zeichen bringt seine Wörterbuchbedeutung mit, seinen Klang und die Zeichen, mit denen es gewöhnlich zusammensteht. Die Bedeutung allein macht noch keinen guten Namen – Homophone, Stilebene und das Zusammenspiel mit dem Familiennamen zählen ebenso. Deshalb zeigt diese Seite Belege statt Vorschlägen.
      none: Zu dieser Filterkombination passt nichts.
    given:
      heading: Vornamen im Register
      note: Die am häufigsten eingetragenen Vornamen, jeweils mit dem erfassten Geschlecht.
