  glossary:
    fsrs: "Ein Algorithmus für verteilte Wiederholung: Aus deinen eigenen Bewertungen berechnet er den Moment, kurz bevor du eine Karte vergisst, und zeigt sie dir genau dann."
    tocfl: Taiwans staatliche Mandarin-Prüfung mit ihrer Stufenskala von Novice bis Band C.
    tbcl: "Die Taiwan Benchmarks for the Chinese Language: Taiwans staatlicher Standard mit sieben Stufen für den Unterricht von Mandarin als Fremdsprache."
    zhuyin: Taiwans Lautschrift, ㄅㄆㄇㄈ. Kinder lernen sie statt Pinyin, und mit ihr wird getippt.
    pinyin: Mandarin-Silben in lateinischen Buchstaben. In China die maßgebliche Umschrift, in Taiwan nur ein zusätzliches Hilfsmittel.
    putonghua: Die Standardform des Mandarin in China.
    hokkien: Taiwanisch (Taigi, Hokkien) ist eine südliche Min-Sprache, die ein großer Teil der Bevölkerung Taiwans spricht. Es ist eine eigene Sprache, kein Dialekt des Mandarin.
    hanzi: Die vollständigen Zeichenformen, die in Taiwan, Hongkong und Macau weiter verwendet werden – im Unterschied zu den Kurzzeichen in China.
  locales:
    en: English
    ru: Русский
