      welcome:
        subject: Willkommen bei TaiwanCards
        preheader: Wörterbuch, Karten, Grammatik, Lesen und Aussprache – ein System.
        title: Willkommen!
        body:
          - "TaiwanCards bündelt alles für taiwanisches Mandarin an einem Ort. Wörterbuch, Karten, Grammatik, Lesetexte und Aussprache sind als ein System gebaut und nicht aus verschiedenen Quellen zusammengestückelt: Ein Wort aus einer Lektion ist derselbe Wörterbucheintrag, dieselbe Karte und dieselbe Audioaufnahme."
          - Du brauchst also kein eigenes Wörterbuch, kein Anki und keine Handvoll Übungs-Apps. Dein Fortschritt sammelt sich an einem Ort, und die Wiederholungen wissen schon, was du gelernt hast.
        features:
          - title: Karten
            text: Jedes Wort kommt wieder, kurz bevor du es vergessen würdest. Lerne nach unserer Methode, bereite dich auf den TOCFL vor oder bring die Wörter aus deinem Unterricht mit.
          - title: Wörterbuch
            text: Langzeichen, Zhuyin und taiwanische Lesungen, Aufnahmen von Muttersprachlern und Beispiele aus echten Texten.
          - title: Aussprache
            text: Sprich ein Wort laut und bekomm Rückmeldung zu Tönen und Lauten.
          - title: Grammatik und Lesen
            text: Grammatiklektionen, Alltagssätze und Texte nach Stufen – von den ersten Wörtern bis zum fortgeschrittenen Niveau.
        outro: Auf der Startseite siehst du, womit du heute anfängst – meist sind es nur ein paar Minuten.
        button: TaiwanCards öffnen
        why: Du bekommst diese E-Mail, weil du ein Konto bei TaiwanCards angelegt hast. Es ist die einzige Willkommens-E-Mail – danach schreiben wir nur, wenn Karten auf die Wiederholung warten, und nie öfter als einmal am Tag. In deinem Profil kannst du eigene Tage und eine Uhrzeit für Erinnerungen wählen.
      first_cards:
        subject: Deine erste Runde dauert nur ein paar Minuten
        preheader: "Auf der Startseite siehst du, wo du anfängst: bei den Lauten oder gleich mit Wörtern auf deiner Stufe."
        title: Bereit für ein paar Minuten?
        body: "Dein Konto ist eingerichtet, und die erste Runde ist kurz. Auf der Startseite siehst du, wo du anfangen solltest: bei den Lauten oder gleich mit Wörtern auf deiner Stufe."
        button: Erste Runde starten
