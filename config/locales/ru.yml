    pinyin: Запись слогов мандарина латиницей. В Китае основная, в Тайване вспомогательная.
    putonghua: Стандарт мандарина в Китае.
    hokkien: Тайваньский хоккиен — южноминьский язык, на котором говорит значительная часть жителей Тайваня. Мандарину он не диалект, а отдельный язык.
    hanzi: Полная форма письма, сохранённая в Тайване, Гонконге и Макао, — в отличие от упрощённой в Китае.
