        body: "Игра на шестнадцать плиток — тайваньская, а не общекитайская. Рука состоит из пяти наборов и пары, очки за комбинации складываются в таях, а не умножаются, восемь цветочных плиток дают очки сами по себе, и вся выгода вечера держится на серии дилера. Минимума нет: выиграть можно и рукой без единого тая."
