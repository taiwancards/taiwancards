    science:
      heading: Под витриной — квантитативная лингвистика
      body: >-
        Всё здесь стоит на измерениях: корпусные частоты и дисперсии, сила сочетаемости, откалиброванные
        шкалы сложности, акустические эталоны каждого слога. То, что вы видите, — вершина айсберга: под
        ней годы сбора, обработки и проверки данных, собственные библиотеки и датасеты, открытые для
        научного сообщества. Всё это открыто — знания должны принадлежать всем.
      points:
        corpus:
          title: Измерено, а не на глаз
          body: >-
            Уровни, сложность и порядок слов выведены из тайваньского корпуса, который мы собрали и
            измерили сами: частота, дисперсия, сила сочетаемости, регистр.
        open:
          title: Открыто для проверки
          body: >-
            Корпусные таблицы, инвентарь слогов и библиотеки под ними опубликованы как датасеты, а само
            приложение — с открытым кодом. Все источники и лицензии перечислены на странице благодарностей.
        linked:
          title: Одно место, всё связано
          body: >-
            Иероглиф ведёт к своим словам, слово — к живым предложениям, предложение — обратно к правилу
            грамматики, и всё встреченное отправляется в колоду одним нажатием.
    quality:
      heading: Откуда берётся качество
      items:
        audio:
          title: Официальная озвучка
          body: >-
            Иероглифы и слова читает диктор — те самые записи, что сделаны для государственного словаря
            Министерства образования Тайваня. Не синтез и не любительская запись.
        sources:
          title: Тайваньские источники
          body:
            Государственный словарь, официальные списки уровней и частотные таблицы, законы, городские
            новости.
        human:
          title: За каждой статьёй стоит человек
          body: >-
            Значения, примеры и связи вычитаны вручную. Весь контент проверен человеком — ничего
            сгенерированного и машинно-переведённого.
        written:
          title: Написано для русского читателя
          body: >-
            Объяснения написаны с оглядкой на русское ухо — и на те места, где привычки родного языка
            мешают тайваньскому произношению.
    tools:
      heading: Всё то, ради чего обычно ставят пять приложений
      lede: "Открыли — и всё уже на месте: ничего не надо настраивать и нигде не надо искать."
      items:
        study:
          title: Карточки
          body: Всё, что пора повторить сегодня, плюс отмеренная порция новых слов
        speaking:
          title: Произношение
          body: Скажите вслух — и увидите, на каком слоге сбились и насколько сильно
        writing:
          title: Письмо
          body: Вспомнить иероглиф и написать его от руки — черта за чертой, в правильном порядке
        zhuyin:
          title: Чжуинь
          body: На слух и от руки — пока азбука не перестанет вас тормозить
        tones:
          title: Тоны
          body: На слух, рисунком и голосом, по одному слогу
        typing:
          title: Набор
          body: Чжуинь и цанцзе — так, как набирают в Тайване
        reader:
          title: Читалка
          body: Вставили статью — и читаете, словарь уже открыт
        everyday:
          title: Тайваньский быт
          body: Заказать еду, снять жильё, сходить в банк, оформить документы — то, что курсы обходят стороной
        placement:
          title: Тест уровня
          body: Пять минут, чтобы понять, откуда продолжать
        plan:
          title: План к экзамену
          body: Назовите уровень TOCFL и дату — дневная норма посчитается сама
    core:
      heading: Откроете одно слово — увидите всю картину
      lede: >-
        Ключи складываются в иероглифы, иероглифы в слова, слова в предложения. С каждой страницы видно
        остальное: из чего слово состоит, где встречается и насколько твёрдо вы его знаете.
      layers:
        radicals: Ключи
        characters: Иероглифы
        words: Слова
      facets_note: >-
        Знать слово — это не одно умение. Можно свободно узнавать его глазами и запнуться, когда надо
        сказать вслух. Поэтому у каждого слова пять отдельных навыков, и повторить придётся только тот,
        что просел.
      facets:
        recognition: увидели и узнали
        production: от смысла к слову
        reading: прочитали вслух правильно
        tone: тон не съезжает — проверено голосом
        writing: по памяти, черта за чертой
    progress:
      heading: Всегда понятно, где вы сейчас
      lede: Одно и то же, но с трёх сторон. Выбирайте ту, которая вам понятнее.
      items:
        tocfl:
          title: По уровням TOCFL
          body: насколько близко следующий экзамен
        school:
          title: По классам тайваньской школы
          body: что на этой ступени знает здешний школьник
        frequency:
          title: По частотности
          body: какую долю обычного текста вы уже читаете
    bring:
      heading: Всё, что попалось на глаза, превращается в колоду
      lede: >-
        Вставьте текст: приложение разберёт его на слова, найдёт каждое в словаре и соберёт колоду — и она
        попадёт в тот же общий прогресс.
      soon: скоро
      items:
        menu:
          title: Меню в кафе или вывеска на улице
          body: Сфотографировали — и приложение разобрало непонятные иероглифы по словам
        textbook:
          title: Новые слова из учебника или с занятия
          body: "Вставьте список целиком: переводы вручную набивать не нужно"
        song:
          title: Любимая песня
          body: Текст разложен по словам, с чтениями, тонами и значениями
        feed:
          title: Новость, глава книги, комментарий в Threads
          body: Читаете со словарём под рукой, а незнакомое сразу уходит в колоду
    instead:
      heading: Рядом с тем, чем вы, возможно, уже пользуетесь
      lede: >-
        Каждое из этих приложений делает своё дело хорошо. Беда в том, что держать открытыми надо все пять,
        и между ними ничего не связано.
      closing: >-
        Посмотреть слово, проверить себя, добавить в колоду, следить за уровнем и готовиться к TOCFL — всё
        в одном месте, а не в пяти вкладках.
      note: >-
        К HSK это приложение не готовит: там другая лексика и другие реалии, даже если сдавать традиционными
        иероглифами.
    compare:
      heading: Рядом с тем, чем вы, возможно, уже пользуетесь
      summary: >-
        Приложения, которые учат мандарину, почти всегда учат китайскому варианту. А сильные универсальные
        инструменты сваливают трудные решения на вас: какую колоду взять, какое слово следующее, как часто
        повторять. TaiwanCards сознательно занимается одним языком — и эти решения принимает сам.
      honest: >-
        Ничто из этого не делает остальных плохими, и большинство из них попросту не берётся учить тайваньскому
        мандарину. У Anki непревзойдённая экосистема. Словари Pleco несравнимо глубже здешних. Skritter
        лучше всех разбирает написание по чертам. Duolingo лучше всех умеет возвращать вас завтра. Zhong
        Chinese — недавний проект из Тайбэя и единственный здесь, кто, кроме нас, учит именно тайваньскому
        мандарину, а не материковому; сделан красиво. Материал держится одного учебника, а словарь пока
        небольшой, но то, что там есть, — настоящее. 嗨嗨 👋🏻
      toggle: Показать таблицу по возможностям
      checked: >-
        Проверено в августе 2026 года по официальной документации и страницам в магазинах приложений. Возможности
        и цены меняются — перепроверяйте то, что для вас важно.
      rows:
        target: Тайваньский мандарин как цель
        traditional: Традиционные иероглифы
        zhuyin: Чжуинь
        tocfl: Уровни TOCFL и TBCL
        order: Сам решает, что учить дальше
        facets: Навыков отслеживается на запись
        tone: Оценка тонов по вашему голосу
        handwriting: Написание с проверкой черт
        placement: Тест уровня
        scheduler: Планирование
        price: Цена
      notes:
        all_of_it: целиком
        simplified: упрощённые
        generic: универсальный движок
        deck: зависит от колоды
        chinese_wide: китайский вообще
        only: только они
        unclear: не описано
        with_pinyin: вместе с пиньинем
        instead_of_pinyin: вместо пиньиня
        seven_bands: семь уровней
        cefr: CEFR
        community_decks: колоды сообщества
        some_decks: часть колод
        community_imports: импорт от сообщества
        level_freq: уровень, потом частотность
        fixed_path: фиксированный путь
        five: пять
        four: четыре
        one: один
        if_configured: если настроить
        configurable: настраивается
        companion_service: отдельный сервис
        speech_no_tone: речь есть, оценки тонов нет
        addon_no_tone: дополнения, тонов нет
        drawn_not_spoken: рисуются, не произносятся
        addons: дополнения
        best_in_class: лучшее в категории
        lookup_only: только поиск
        fsrs6: FSRS-6
        fsrs_builtin: FSRS встроен
        proprietary: закрытый
        leitner: лесенка Лейтнера
        not_published: не раскрыт
        no_charge: без оплаты
        freemium: freemium
        free_tier: 20 карточек без оплаты
        free_paid_ios: без оплаты, iOS платно
        per_year: от $99.99 в год
        one_time: от $29.99 разово
    wider:
      heading: Более широкое поле
      lede: >-
        Те же вопросы, заданные популярным приложениям для китайского на Android и iOS. Вопросительный знак
        означает только то, что в описании продукта об этой возможности ничего не сказано, — а не то, что
        её нет.
      checked: >-
        Собрано в августе 2026 года по описаниям в магазинах приложений и официальным сайтам. То, что заявлено
        только в рекламных текстах, помечено как «заявлено».
      product: Приложение
      type: Тип
      types:
        course: курс
        reader: ридер
        dictionary: словарь
        trainer: тренажёр
        audio: аудиокурс
      notes:
        hsk: вместо него HSK
        cefr: вместо него CEFR
        no_exam: не заявлен
        ios_only: только в iOS-описании
        tw_textbooks: и учебники Тайваня
        tagging: разметка лексики
        claimed: заявлено
        simplified_implied: подразумеваются упрощённые
        no_srs: без планирования
        training_only: отработка без оценки
    complement:
      heading: Правая рука преподавателя
      limits: >-
        Фонетику лучше ставить с живым преподавателем, и настоящие занятия это не заменяет. Здесь есть проверка
        тонов и произношения, но нет ни разговорной практики, ни собеседника, ни аудирования — приложение
        за это и не берётся.
    honest:
      heading: Зачем это всё
      body: >-
        Я лингвист, живу в Тайване, и это то самое приложение, которого мне не хватало, когда я учил здесь
        язык. Оно выросло из магистерской по компьютерной лингвистике и из обычной ежедневной практики —
        вывески, меню, «повторите, пожалуйста». Рекламы нет и не будет, и это половина причины, по которой
        оно вообще появилось.
    final:
      heading: Начнём с одного вопроса
      body: >-
        Никогда не учили мандарин? Начнём со звуков. Уже что-то знаете? Пять минут — и станет понятно, откуда
        продолжать.
      cta: Создать аккаунт
    gold_card: Taiwan Gold Card
    disclaimer_html: >-
      TaiwanCards делает и поддерживает один человек — лингвист, у которого с Тайванем связана половина
      жизни, вплоть до %{gold_card}. Министерства, экзамены и издания названы только затем, чтобы указать
      источник данных, — проект с ними никак не связан и ими не одобрен. Ошибки возможны: никаких гарантий
      точности, доступности или пригодности для каких-либо целей. Пользуйтесь как подспорьем и время от
      времени сохраняйте выгрузку своего прогресса.
  onboarding:
    title: С чего начать
    lede: Один вопрос — и приложение подстроит первые недели под вас. Изменить выбор можно в любой момент.
    question: Что вы уже знаете в мандарине?
    pick_one: Выберите один из вариантов.
    levels:
      zero:
        title: Совсем с нуля
        body: Ни иероглифов, ни тонов, ни фонетики — начинаю с чистого листа.
        next: Начнём со звуков, а иероглифы пойдут почти сразу
      phonetics:
        title: Знаю пиньинь и тоны
        body: Читаю пиньинь, слышу тоны, но чжуинь не знаю, а иероглифов почти нет.
        next: Сразу к чжуиню — в Тайване основной именно он
      characters:
        title: Знаю чжуинь и какие-то иероглифы
        body: Читаю ㄅㄆㄇㄈ, узнаю традиционные иероглифы, какой-то словарный запас есть.
        next: Пройдём тест уровня — он найдёт, где вы
      experienced:
        title: Уже есть уровень
        body: Читаю тексты, знаю сотни слов, может быть, готовлюсь к TOCFL.
        next: Тест уровня, а потом план до экзамена
    limits:
      heading: Чего ждать, а чего нет
      body: Приложение объяснит, как читать и как писать, покажет чжуинь и пиньинь и само решит, что учить дальше. Сюда можно загрузить любые слова и любые тексты, дриллить их, следить за прогрессом и оттачивать произношение, тоны и лексику.
      gap: "Но фонетику лучше ставить с преподавателем-носителем, и живые курсы это не заменяет. Здесь есть проверка тонов и произношения — и нет живого общения, нет говорения с собеседником и нет аудирования: такой цели у приложения нет. Считайте это правой рукой преподавателя, а не его заменой."
    not_for:
      heading: Возможно, это не то приложение
      lede: Лучше выяснить сейчас, чем через месяц.
      cards: "Вам нужны просто карточки. Здесь их сильно больше: словарь, ридер, произношение, письмо и общий прогресс поверх всего сразу. Для одних карточек это перебор."
      course: "Вам нужен курс с нуля до свободного владения. Это не учебник: грамматику здесь не объясняют, разбирать её придётся в другом месте."
      china: "Вы едете в Китай. Здесь только тайваньский мандарин: традиционные иероглифы, чжуинь, тайваньская лексика. Китайского варианта нет, и упрощённые не включаются."
      nudging: Вам нужно, чтобы вас подгоняли. Напоминаний, серий дней и таблиц лидеров тут нет и не будет — предполагается, что вы сами знаете, зачем учите именно тайваньский мандарин.
      close: Если всё это вас устраивает — выбирайте вариант выше, и начнём.
    path:
      done_cta: На главный экран, к карточкам →
      back: "← К списку шагов"
      title: Ваш путь
      lede: Порядок, в котором это стоит проходить. Шаги отмечаются сами, когда вы что-то делаете, но можно отметить и вручную.
      counter: Пройдено %{done} из %{total}
      optional: по желанию
      now: сейчас
      open: Открыть
      mark_done: Отметить пройденным
      undo: Снять отметку
      progress: "%{done} из %{target} повторений"
      kinds:
        theory: теория
        practice: практика
      done_heading: Путь пройден
      done_body: База есть. Дальше вас ждут первые карточки — система сама решит, что показывать и в каком порядке.
      after_heading: Что дальше
      after_body: "Когда база есть, приложение само решает, что показывать: сначала уровень, внутри уровня — частотность. Остальное берите по мере надобности — ридер, произношение, письмо, свои колоды из любого текста."
      change: Изменить стартовый уровень
      steps:
        zhuyin_theory:
          title: Как устроены звуки
          body: >-
            Сначала стоит понять, из чего вообще складывается слог: чем он начинается, чем заканчивается и
            что делает тон. Знаки идут группами, и под каждой группой своя кнопка — она гоняет ровно эту
            группу, а не всё подряд.
        tones_theory:
          title: Как работают тоны
          body: >-
            Четыре тона плюс нейтральный — и тайваньские особенности, которых нет в учебниках из Китая:
            третий тон остаётся низким и не ныряет вверх, а 一 и 不 меняют тон в зависимости от соседа.
            Прочитайте — и с этой же страницы идите тренироваться.
        tones:
          title: "Услышать четыре тона"
          body: "Тайваньские тоны — не те, что в учебниках из Китая: третий остаётся низким и не поднимается. Тренировка на студийных записях каждого слога, с чередованием мужского и женского голоса."
        phrases:
          title: "Выучить то, что реально говорят"
          body: "Паттерны, которые закрывают день в Тайване, включая ту половину, которую нужно только понимать: что спрашивает кассир."
        bridge:
          title: "Перейти с пиньиня на чжуинь"
          body: "Звуки вы уже знаете. Здесь они ложатся на знаки, которыми их пишут в Тайване, с разбором ловушек: пустая рима, y и w, стянутые финали iu, ui, un."
        readings:
          title: "Переучить тайваньские чтения"
          body: "Слова, которые в Тайване читаются иначе, чем в Китае, и полные тоны там, где учебник даёт нейтральный."
        placement:
          title: "Определить уровень"
          body: "Короткий адаптивный тест по слуху, тонам, иероглифам, лексике и предложениям. Ставит стартовый уровень и отмечает то, что вы уже знаете."
        zhuyin:
          title: Тренажёр чжуиня (ㄅㄆㄇㄈ)
          body: >-
            Теперь то же самое на слух. Знаки открываются группами: пока не начнёте узнавать одну, следующая
            не появится. В этом весь фокус — маленькими порциями и без спешки. Всего 37 знаков и четыре
            значка тона; выучите один раз, и дальше будет только проще.
        drill:
          title: Узнавание звуков
          body: Тренажёр гоняет инициали, финали и тоны, пока они не начнут узнаваться без раздумий. Для отметки хватит одного захода, но возвращаться сюда стоит.
        typing:
          title: Набор на чжуине
          body: Та самая раскладка, что напечатана на клавиатурах в Тайване. Без неё не написать ни сообщения, ни поискового запроса. Шаг зачтётся после десяти верно набранных слов.
        pinyin:
          title: Пиньинь рядом
          body: "Пригодится: им подписаны улицы и станции, и на нём с вами заговорят иностранцы. Но основная система здесь — чжуинь, а пиньинь идёт вторым."
        first_cards:
          title: Первые иероглифы и слова
          body: "Иероглифы вводятся сразу, а не откладываются на потом: начинаете с самых частотных. Двадцать повторений — и шаг зачтён."
        plan:
          title: План до экзамена
          body: Нужен TOCFL — назовите уровень и дату, и система посчитает дневную норму. Не нужен — спокойно пропускайте.
