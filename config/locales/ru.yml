  tones:
    names:
      "1": "Первый тон"
      "2": "Второй тон"
      "3": "Третий тон"
      "4": "Четвёртый тон"
    segments_title: Не только тоны
    segments_lede: Два расхождения в самих звуках, которые слышны постоянно и о которых стоит знать сразу.
    segments:
      retroflex: Ретрофлексные ㄓ ㄔ ㄕ в тайваньской речи часто сливаются с ㄗ ㄘ ㄙ. 知 и 資 в быту могут звучать одинаково.
      nasal: Финали -ing и -eng во многом слились с -in и -en. Это устойчивая черта, а не небрежность.
    practice_cta: Открыть тренажёр тонов →
    chart:
      taipei: Тайбэй
      beijing: Пекин
      aria: "%{tone}: контур высоты"
      taipei_note: Так тоны звучат в Тайване. Отличий от нормы, принятой в Китае, несколько, они перечислены ниже.
      beijing_note: Норма Китая для сравнения. Цифры — общепринятая нормативная запись.
      scale: "Пять условных ступеней высоты, снизу вверх. Линия читается слева направо: где начинается и куда идёт. Для Тайбэя цифры намеренно не проставлены — точной нормативной записи для тайваньской реализации нет, а выдумывать её я не стану."
    hacks_title: Что помогает на практике
    hacks:
      low: Третий тон — это просто низкий тон, противоположность первому. Глубокий провал с подъёмом он даёт только изолированно и в конце фразы; в Тайване подъём не произносят почти никогда. Не пытайтесь «нарисовать галочку» — просто говорите низко и держитесь внизу.
      pair: "Считайте первый и третий парой: один высокий ровный, другой низкий ровный. Так их различать проще, чем через «ровный против ныряющего»."
      start: "Второй и третий путают чаще всего. Ориентир — не куда тон идёт, а откуда начинается: второй стартует с середины и поднимается, третий стартует внизу и внизу остаётся."
      after_third: "Если после третьего идёт второй, низ третьего работает разгоном: вы уже внизу, и второй тон уходит вверх прямо оттуда. Не возвращайтесь в середину между слогами — это и портит связку."
      fourth: "Четвёртый обычно даётся легче всего: это интонация уверенного утверждения, резко сверху вниз. Если он звучит слишком мягко, вы, скорее всего, не начали достаточно высоко."
      relative: Высота относительная, а не абсолютная. Пять ступеней отмеряются внутри вашего собственного голосового диапазона, а не по нотам. Низкий голос не мешает тонам.
      neutral: У нейтрального слога своей высоты нет — он берёт её от предыдущего. После первого звучит средне, после четвёртого низко. Отдельно его учить не нужно, он получается сам, если верен предыдущий тон.
    title: Тоны
    lede: Четвёртая часть фонетики, без которой первые три не работают. Здесь — что такое тон, как он устроен в Тайване и почему его нельзя «не произносить».
    why_title: Почему тон — не украшение
    why_body: Тон в мандарине входит в состав слога наравне с согласными и гласными. Без учёта тона в языке около четырёхсот различимых слогов; с тоном — около тысячи трёхсот. Отказываясь от тона, вы втрое сокращаете количество различий, которыми располагаете, и втрое увеличиваете число слов, которые звучат у вас одинаково.
    myth_title: Про миф «тоны не важны, вытянет контекст»
    myth_body: Контекст действительно помогает, и слова в вакууме не существуют. Но контекст работает как поправка к тому, что человек уже услышал, а не вместо слуха. Носитель разбирает тон автоматически, до всякого осмысления, — и неверный тон не воспринимается как «тон отсутствует». Он воспринимается как другой тон, то есть уводит в сторону активно, а не пассивно.
    cannot_title: "«Не произнести тон» невозможно"
    cannot_body: "Это ключевая мысль, и она техническая, а не мотивационная. Любой произнесённый слог имеет высоту и её изменение — иначе он не прозвучал бы. Вопрос лишь в том, совпадёт ли этот контур с нужным. Отказ от работы над тонами не даёт «нейтральной» речи: он даёт речь со случайными тонами. Для вашего уха тона может не быть, для собеседника он есть всегда."
    cumulative_title: Дело не только в минимальных парах
    cumulative_body: "Обычно тоны объясняют через 媽 麻 馬 罵 — и это создаёт впечатление, что риск сводится к редким совпадениям. На деле мешает не отдельная пара, а накопление: при систематически неверных тонах каждое слово по отдельности можно угадать, а фразу целиком — уже нет, потому что слушателю приходится перебирать варианты быстрее, чем идёт речь."
    four_title: Четыре тона
    four_lede: "Цифры в скобках — условная запись высоты по пятибалльной шкале Чжао Юаньжэня: от 1 (низко) до 5 (высоко)."
    tones:
      t1:
        name: Первый — ровный высокий
        contour: "55"
        zhuyin: без знака
        note: Держится на одной высоте. В чжуине не отмечается ничем — отсутствие знака и есть первый тон.
      t2:
        name: Второй — восходящий
        contour: "35"
        zhuyin: ˊ
        note: Идёт снизу вверх, как русская интонация переспроса.
      t3:
        name: Третий — низкий
        contour: 214 / 21
        zhuyin: ˇ
        note: В учебниках рисуют «провал с подъёмом», но подъём слышен главным образом в изолированном слоге и на конце фразы. В потоке речи третий тон обычно остаётся низким и не поднимается.
      t4:
        name: Четвёртый — падающий
        contour: "51"
        zhuyin: ˋ
        note: Резко сверху вниз, коротко и решительно.
    neutral_title: Пятый, он же нейтральный
    neutral_body: "Строго говоря, это не пятый тон, а отсутствие собственного тона: слог теряет свой контур, укорачивается и берёт высоту от предыдущего слога. В чжуине помечается точкой ˙ и, в отличие от пиньиня, ставится ПЕРЕД слогом: ˙ㄉㄜ. Отдельно проверять его в тренажёре смысла нет — на слух это просто очень короткий безударный слог."
    neutral_taiwan: "И здесь важное тайваньское отличие: нейтральный тон в Тайване встречается заметно реже, чем в норме Китая. Многие слова, которые в Китае произносят со вторым слогом нейтральным, в Тайване сохраняют полный тон."
    taiwan_title: Чем тоны в Тайване отличаются
    taiwan_body: Различия не в системе — тонов те же четыре, — а в их реализации.
    taiwan_points:
      range: Диапазон в целом ниже и уже. Тайваньская речь укладывается в меньший интервал высоты, чем речь в Китае, — поэтому тоны звучат сдержаннее, а не «невыразительно».
      second: Второй тон поднимается не так высоко. Более того, он нередко сам получает лёгкий провал в начале и по форме приближается к нормативному третьему.
      third: Третий тон не возвращается наверх из нижнего, скрипучего регистра. Полный контур 214 в Тайване практически не произносят.
      neutral: Нейтральный тон встречается реже, и конечные слоги обычно сохраняют собственный тон.
      erhua: Эризация — суффикс 兒 — в тайваньском мандарине очень редка.
      merge: Второй и третий тоны на слух сближаются сильнее, чем в дикторском произношении. Это норма, а не дефект речи.
    sandhi_title: Два правила, по которым тон меняется
    sandhi_lede: "Тон записывается один, а произносится другой. Записанный тон при этом не меняется: в словаре, в чжуине и в пиньине остаётся исходный."
    third_title: Третий перед третьим
    third_body: Когда два третьих тона идут подряд, первый из них произносится как второй. 你好 записано ㄋㄧˇ ㄏㄠˇ, а звучит как ní hǎo. Правило работает по звучанию, а не по словарной форме, поэтому применяется и на стыке слов.
    third_three: "Если третьих тонов три подряд, результат зависит от того, как фраза членится по смыслу. 我很好 обычно звучит как wó hén hǎo, потому что 很好 держится вместе теснее. Заучивать тут нечего: правило применяется к тем слогам, которые вы произносите одной группой."
    yi_title: 一 и 不
    yi_body: У этих двух слогов тон зависит от того, что идёт следом.
    yi_rules:
      yi_alone: "一 само по себе, в конце и в порядковых числительных — первый тон: yī, 第一 dì yī."
      yi_before4: "一 перед четвёртым тоном — второй: 一定 yí dìng, 一樣 yí yàng."
      yi_other: "一 перед первым, вторым и третьим — четвёртый: 一天 yì tiān, 一年 yì nián, 一起 yì qǐ."
      bu_before4: "不 перед четвёртым тоном — второй: 不是 bú shì, 不要 bú yào."
      bu_other: "不 во всех остальных положениях — четвёртый: 不好 bù hǎo, 不能 bù néng."
    practice_title: Отработка
    practice_body: "Ниже — тренажёр на слух: звучит слог, вы определяете тон. Прогресс он не пишет и в повторения не идёт, это чистый дриллинг — выйти можно в любой момент."
    practice_pending: "Отработки произношения тонов вслух пока нет: она появится, когда будет подключено распознавание речи с проверкой контура и тайваньской нормой. Пока тренируется только распознавание на слух."
    drill:
      title: Тренажёр тонов на слух
      lede: "Звучит слог — определите тон. Прогресс не пишется, повторения не затрагиваются: это чистая отработка, выйти можно в любой момент."
