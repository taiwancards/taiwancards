        body_known: Дальше — ваша учёба. Эту страницу всегда можно открыть из гайда.
        cta: Дальше
    steps:
      overview:
        title: Знакомство обновилось
        body: >-
          Вместо прохода по меню теперь одна страница: что внутри системы, с чего начать и что где лежит.
          Откройте её, если хотите освежить картину.
    chapters:
      dictionary:
        title: Словарь и поиск
        summary: Как найти что угодно и как читать статью
        steps:
          entry:
            title: Вот так выглядит статья
            body: >-
              Сначала чтения, потом значения — пронумерованные так же, как в исходном словаре, — потом
              примеры из корпуса. Любое слово отсюда отправляется в изучение одной кнопкой.
          detail_level:
            title: Кратко или подробно
            body: >-
              Этот переключатель в шапке решает, сколько показывать: только основное значение или ещё и
              сочетания, тезаурус, этимологию и все значения сразу.
      course:
        title: Учебник
        summary: Один путь от нуля до B1 и из чего собран урок
        steps:
          stages:
            title: Пять ступеней, шестьдесят уроков
            body: >-
              Каждая ступень закрывает целый уровень экзамена и заканчивается пробным. Внутри уроки идут
              по порядку: диалог из жизни, слова и грамматика под ним, упражнения с мгновенной проверкой
              и кнопка, которая превращает урок в колоду.
          band_progress:
            title: Сколько уровня уже закрыто
            body: >-
              Полоса держится сверху на каждой странице раздела. Она считает пройденные слова и
              грамматику против того, что требует уровень, а на странице подробностей добавляются темп и
              дата, к которой вы этим темпом закончите.
      cards:
        title: Карточки и колоды
        summary: Откуда берутся карточки и как работают повторения
        steps:
          new_deck:
            title: Отсюда начинается любая колода
            body: >-
              Эта кнопка есть на каждой странице. Песня, текст с занятия, список слов, статья — всё
              превращается в колоду.
          facets:
            title: Шесть памятей на одно слово
            body: >-
              Каждое слово спрашивается отдельно на узнавание, на воспроизведение, на чтение, на слух, на
              тон и на письмо. Узнать слово и уметь его написать — разные состояния, и интервалы у них
              разные.
      taiwan:
        title: Тайваньская жизнь
        summary: Лексика, привязанная к жизни здесь
        steps:
          domains:
            title: Всё по ситуациям
            body: >-
              Еда, напитки, транспорт, документы, погода, сленг. У каждого слова помечено, где оно
              реально встречается и чем отличается от китайского.
      phonetics:
        title: Звуки и чжуинь
        summary: Как устроены звуки и где их отрабатывать
        steps:
          parts:
            title: Четыре части
            body: >-
              Введение, инициали, финали и отдельно всё, что путается. Переключайтесь между ними здесь —
              порядок подобран так, чтобы читать подряд.
          drill_block:
            title: И сразу отработать
            body: >-
              Знаки идут группами, и под каждой группой своя кнопка. Она гоняет ровно эту группу, а не
              все 37 подряд — поэтому за один заход осваивается по четыре знака.
      trainers:
        title: Тренажёры
        summary: Что можно отработать руками и голосом
        steps:
          what_else:
            title: И это не всё
            body: >-
              Рядом лежат письмо от руки, набор на тайваньской раскладке, цанцзе, дриллы звуков и тонов
              и пробный TOCFL. Всё это доступно в любой момент, а не открывается по мере прохождения.
      display:
        title: Что показывать
        summary: Четыре переключателя, которые меняют всё сразу
        steps:
          prefs:
            title: Вот эти четыре кнопки
            body: >-
              Они управляют тем, как выглядит текст во всём приложении. Нажатие действует сразу и
              везде — можно щёлкать прямо сейчас.
          pinyin_toggle:
            title: Чтения над иероглифами
            body: "Каждое нажатие переключает вид: только чжуинь, чжуинь с пиньинем, ничего. Пиньинь сам по себе не показывается."
          font_kai:
            title: Каллиграфический шрифт
            body: Начертание, по которому в Тайване учат писать. Нажмите и посмотрите на иероглифы.
          china_toggle:
            title: Китайские эквиваленты
            body: Включите, если хочется видеть, где норма Китая расходится с тайваньской.
      profile:
        title: Профиль и прогресс
        summary: Ваш уровень, статистика и выгрузка
        steps:
          backup:
            title: И всё это можно забрать
            body: >-
              На вкладке «Копии» лежит выгрузка всего прогресса одним файлом. Данные ваши, и они никуда
              не заперты.
