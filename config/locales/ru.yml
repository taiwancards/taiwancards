    back_to_chart: "← Вернуться к таблице чжуиня и пиньиня"
    initials_lede: "Двадцать один знак — всё, чем может начинаться слог. Кнопка воспроизводит официальную запись Министерства образования Тайваня: послушайте звук прежде, чем читать разбор."
    series:
      title: Три ряда, которые все путают
      body: >-
        Девять инициалей, которые в пиньине пишутся похоже, а во рту делаются в трёх разных местах.
        Сначала отработайте их по рядам — внутри ряда место одно, меняется только сила выдоха.
      rows_hint: один ряд
      columns_hint: три ряда сразу
      hard_title: А вот это будет действительно сложно
      hard_body: >-
        Если брать не ряд, а столбец, звуки становятся почти неразличимы: в пиньине они и пишутся
        одинаково — zhi, zi, ji отличаются одной буквой. Разница только в том, где стоит язык: загнут к
        нёбу, у нижних зубов или прижат к твёрдому нёбу. Это тот случай, когда придётся слушать
        внимательно, и ошибаться поначалу нормально.
      all_nine: Все девять вперемешку
      sets:
        zhi_chi_shi: zhi chi shi
        zi_ci_si: zi ci si
        ji_qi_xi: ji qi xi
        zhi_zi_ji: zhi zi ji
        chi_ci_qi: chi ci qi
        shi_si_xi: shi si xi
    drill_these: "Отработать %{symbols}"
    blocks:
      labial:
        title: Губные
        body: Смыкаются губы. Первое, что учат тайваньские дети, — и первое, что услышите в песенке ㄅㄆㄇㄈ.
      alveolar:
        title: Кончик языка
        body: Язык упирается за верхние зубы. Тут же прячется 不 и почти все отрицания.
      velar:
        title: Задняя часть языка
        body: Звук рождается у нёба, глубже, чем в русском. ㄏ мягче нашего «х» — почти выдох.
      palatal:
        title: Мягкие перед ㄧ и ㄩ
        body: Идут только с ㄧ и ㄩ, поэтому спутать их с ㄓㄔㄕ невозможно, если помнить, что стоит следом.
      retroflex:
        title: С загнутым языком
        body: Кончик языка задран к нёбу. В Тайване их часто произносят мягче, чем в учебниках из Китая, — почти как ㄗㄘㄙ.
      sibilant:
        title: Свистящие
        body: Язык у нижних зубов, воздух идёт узкой струёй. Главная пара к предыдущей тройке.
      medial:
        title: Медиали
        body: Стоят между инициалью и финалью и в пиньине превращаются в i, u, ü — а в начале слога в y и w.
      open:
        title: Простые гласные
        body: Четыре чистых звука, из которых складывается всё остальное. ㄝ отдельно не встречается — только после ㄧ и ㄩ.
      diphthong:
        title: Дифтонги
        body: "Два звука в одном слоге: язык съезжает из одной позиции в другую, не разрывая слог."
      nasal:
        title: Носовые
        body: Разница между ㄢ/ㄤ и ㄣ/ㄥ — где заканчивается язык. В Тайване она часто смазывается, но в словаре сохраняется.
      rhotic:
        title: Единственный в своём роде
        body: Слог сам по себе, встречается в 二, 兒 и 耳. Не путать с китайской эризацией на конце слов.
      compound:
        title: Составные финали
        body: Медиаль плюс финаль. Отдельного тренажёра им не нужно — они собираются из знаков, которые вы уже отработали.
    finals_lede: "Всё, что остаётся в слоге после начального согласного: гласный, дифтонг или гласный с носовым. У составных финалей озвучены отдельные знаки — слитно они звучат не как две части подряд."
    why_title: Почему это не мелочь
    why_body: "И пиньинь, и палладицу вы прочитаете без подготовки — и именно поэтому они опасны: буквы тянут за собой привычное чтение, и ошибка закрепляется молча. За знаком чжуиня нет ничего, кроме звука, которому вы его научите. Ровно поэтому в Тайване подписывают чтения им."
    compound_audio: "Составная финаль: озвучены отдельные знаки. Слитно она звучит не как две части подряд — смотрите разбор справа."
    play_symbol: Прослушать %{symbol}
    phonetics_card: "Полная таблица звуков: чжуинь и МФА как основа, пиньинь как подсказка, палладица для справки, опора в русском и примеры."
    phonetics_title: Чжуинь и пиньинь
    col_explanation: В чём подвох
    col_written: Как пишется
    col_real_sound: Как звучит
    rimes_lede: Пиньинь во многих финалях пишет не то, что вы услышите. Чжуинь в этих же случаях обычно ближе к реальному звуку — здесь видно, где именно и почему.
    rimes: Где запись расходится со звучанием
    study: Учить
    speak: Речь
    write: Письмо
    title: Основы
    intro: Звуки мандарина с нуля — сначала системы чтения, потом произношение.
    initials: Инициали (согласные)
    finals: Финали (гласные)
    play: Прослушать
    col_pinyin: Пиньинь
    col_palladius: Палладица
    palladius_note: "Палладица здесь только для справки: вы могли встречать её в книгах и словарях, и полезно один раз увидеть, чему она соответствует. В самом приложении система Палладия не используется нигде и принципиально. Пиньинь стандартизирован и общепринят — он встречается в любом словаре и учебнике, поэтому от него есть польза. Палладица нужна заметно реже, а для жизни в Тайване не нужна вовсе: её здесь нет ни на вывеске, ни в словаре, ни на клавиатуре. Это рабочая академическая традиция русскоязычной синологии — просто не тот инструмент под эту задачу. Силы разумнее вложить в чжуинь: для Тайваня это единственный практичный вариант."
    col_zhuyin: Чжуинь
    col_ipa: МФА
    col_analogy: Похоже на
    col_example: Пример
    pinyin_intro: Романизация, которую использует всё приложение. Каждый звук с МФА, понятной аналогией и словом-примером.
    zhuyin_intro: Тайваньская фонетическая азбука. Можно учить рядом с пиньинем или прямо от звуков. Та же таблица, с обоими чтениями.
    drill:
      lede: "Сопоставление двух систем записи: видите знак — называете латиницу, и наоборот. Пиньинь здесь как мост, а не как основа."
      title: Чжуинь ↔ пиньинь
      direction_zhuyin: Чжуинь → пиньинь
      direction_pinyin: Пиньинь → чжуинь
      systems_html: "Чжуинь — это 37 значков, которыми в Тайване записывают звуки. Каждый значок всегда читается одинаково, и «своё» чтение ему не придумать: вы просто запомните, как он звучит. Пиньинь пишет те же звуки латиницей — это подсказка, не более. Что делать: пройдите по таблицам ниже и научитесь узнавать значки на слух."
      stage_hint: "Идите по порядку: сначала согласные, потом гласные и полугласные, потом целые финали и только затем слоги целиком."
      stages:
        consonants: Согласные
        vowels: Гласные
        finals: Финали
        syllables: Слоги целиком
      prompt_zhuyin: Какой это пиньинь?
      prompt_pinyin: Какой это чжуинь?
      keys: Свайпайте карточку в сторону ответа или жмите стрелки
      done_title: Круг пройден
      restart: Ещё раз
      see_chart_zhuyin: Таблица чжуиня
      see_chart_pinyin: Таблица пиньиня
      card: Сопоставление чжуиня и пиньиня в обе стороны, свайпами.
      syllable_title: Как устроен слог в тайваньском мандарине
      syllable_body: "В слоге максимум три позиции, и обязательна только последняя: 一 — это голая финаль, а 四 — инициаль, за которой вообще не записана гласная. Чжуинь показывает эти позиции явно, пиньинь часто их сливает или опускает."
      slots:
        initial_label: Инициаль 聲母
        initial_glyph: ㄓ
        initial_body: Одна из 21 согласной. Необязательна — многие слоги начинаются с гласной.
        medial_label: Медиаль 介音
        medial_glyph: ㄨ
        medial_body: "Одна из трёх полугласных: ㄧ ㄨ ㄩ. Именно эту позицию пиньинь прячет чаще всего."
        final_label: Финаль 韻母
        final_glyph: ㄥ
        final_body: "Рифма слога: гласная, дифтонг или гласная с -n либо -ng. Единственная обязательная позиция."
      tones_title: Где ставится тон
      tones_body: "Пиньинь ставит диакритику над основной гласной: mā má mǎ mà. Чжуинь первый тон не помечает вовсе, а ˊ ˇ ˋ пишет после символов — ㄇㄚ ㄇㄚˊ ㄇㄚˇ ㄇㄚˋ. Нейтральный тон — исключение в обеих системах: пиньинь просто снимает знак, а чжуинь ставит точку ˙ впереди, как в ˙ㄉㄜ. При записи сверху вниз чжуинь идёт вертикально справа от иероглифа, вместе со знаком тона."
      mismatch_title: Где пиньинь вводит в заблуждение
      mismatch_body: "Это не исключения, которые надо зазубрить, а следствие одного решения: ради краткости записи пиньинь выбрасывает гласные из середины слога, использует одну и ту же букву для разных звуков и иногда пишет букву там, где звука нет вообще. Чжуинь лишнего не пишет — поэтому в столбце с ним видно, что в слоге происходит на самом деле."
      mismatch_pinyin: Пиньинь
      mismatch_zhuyin: Чжуинь
      mismatch_why: Что происходит на самом деле
      mismatch:
        zhong:
          pinyin: zhong
          zhuyin: ㄓㄨㄥ
          why: zh — это ㄓ, но вот o здесь вовсе не ㄛ. Финаль -ong на деле -ung, поэтому чжуинь пишет полугласную ㄨ и финаль ㄥ.
        jiu:
          pinyin: jiu
          zhuyin: ㄐㄧㄡ
          why: Финаль здесь -iou, просто пиньинь выбрасывает среднюю гласную ради краткости записи. Чжуинь сохраняет и ㄧ, и ㄡ.
        hui:
          pinyin: hui
          zhuyin: ㄏㄨㄟ
          why: "Тот же приём: финаль -uei, а пиньинь проглатывает e. Чжуинь пишет ㄨ и ㄟ."
        yu:
          pinyin: yu
          zhuyin: ㄩ
          why: y здесь не согласная, она нужна лишь как подставка под гласную, а u на самом деле ü. Звук один — и чжуинь пишет один символ.
        zhi:
          pinyin: zhi
          zhuyin: ㄓ
          why: Эта i не обозначает никакой гласной — это удержанное ретрофлексное положение языка. Чжуинь после ㄓ не пишет ничего, потому что там ничего и нет.
        weng:
          pinyin: weng / -ong
          zhuyin: ㄨㄥ
          why: Два разных написания пиньиня для одной и той же финали — в зависимости от того, стоит ли перед ней согласная. В чжуине это в обоих случаях ㄨㄥ.
      mismatch_more_title: Что запомнить
      mismatch_more_body: "Читающий по пиньиню постоянно правит себя в уме: здесь o звучит как u, здесь пропущена гласная, здесь i вообще не гласная, здесь u — это ü. Каждая такая поправка — место, где закрепляется неверное произношение, и обычно человек об этом даже не догадывается: написание выглядит логичным. Чжуинь не требует ни одной поправки — что написано, то и произносится."
