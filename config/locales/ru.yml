    moe_notice: 使用說明 — официальный документ об условиях использования, сохранён целиком, как того требует лицензия
    title: Лицензии и благодарности
    intro: "Здесь перечислено всё, на чём стоит TaiwanCards, — с именами, ссылками и лицензиями. Ничего не взято «где-то в интернете»: у каждого словаря, корпуса, шрифта и записи есть источник, который можно открыть и проверить, и лицензия, которая прямо разрешает нам этим пользоваться."
    projects_title: Наши собственные открытые проекты
    projects_note: "Под приложением лежит не папка со скачанными файлами, а настоящая корпусная работа по тайваньскому мандарину — и вся она открыта. Мы сами строим корпус с нуля, сами отделяем тайваньскую норму от китайской по письму, орфографии, лексике и грамматике, сами считаем частотности по собранному корпусу и сами пишем цифровую обработку речевого сигнала, на которой держится оценка произношения. Код — на GitHub, гемы — на RubyGems, датасеты — на Hugging Face. Всё это пригодится не только нам: если вы занимаетесь тайваньским мандарином, корпусной лингвистикой или речевыми технологиями — берите и пользуйтесь."
    groups:
      app: Приложение и подготовка его данных
      pipeline: Построение корпуса и анализ происхождения
      gems: Библиотеки обработки речевого сигнала
      datasets: Опубликованные датасеты
    works:
      taiwancards: Учебное приложение целиком — Rails, импортёры, интервальные повторения, оценка произношения, симулятор экзамена. Ничего не спрятано.
      corpora: Загрузка, обработка, шлифовка, калибровка, очистка и анализ каждого источника, из которых собран словарь.
      twpipeline: Построение корпуса тайваньского мандарина — девять стадий JSONL от сырого обхода до сегментированного корпуса с частотами.
      twfilter: "Анализ происхождения: инвентарь письма, орфография, лексические и грамматические маркеры, отделяющие тайваньский мандарин от китайского, гонконгского и юго-восточного."
      dsprb: Обработка речевого сигнала на чистом Ruby — разбор WAV, спектры мощности через БПФ, MFCC, отслеживание высоты тона по YIN. Именно она оценивает ваше произношение.
      dtwrb: Динамическая трансформация временной шкалы с полосой Сакоэ — Чибы и усреднение барицентров DBA. Сравнивает вашу запись с эталонным контуром.
      twngrams: Частоты словесных и знаковых n-грамм из корпуса тайваньского мандарина, отданы в общественное достояние.
      twsyllables: Инвентарь слогов с чжуинем, пиньинем и распределением тонов по корпусу.
      twfilter_tables: "Справочные таблицы, по которым twfilter судит о происхождении: орфографические пары, лексические маркеры, инвентари письма."
    open_source_title: Открытый код
    fonts_title: Шрифты
    fonts_note: Все три лежат на нашем сервере. Два из них мы отдаём изменёнными, об этом сказано ниже.
    corpora_title: Корпуса и словари
    corpora_note: Каждый текстовый корпус в базе и лицензия, под которой он к нам приходит. Публикуются только источники, чья лицензия разрешает и бесплатное, и коммерческое использование; остальные идут только в статистику, ни одно предложение из них не хранится.
    data_title: Справочные данные
    data_note: "Учреждения, на чьи справочные материалы опирается приложение: списки уровней, инвентарь черт, стандарты начертаний, календарные таблицы и классификационные шкалы. Это фактические перечни, а не творческие произведения, поэтому здесь они указаны как источник, а не как лицензированный материал. Там, где учреждение выпустило материал под названной лицензией, она указана."
    outro: "Весь контент на мандарине — тайваньские традиционные иероглифы, сверенные со словарями Министерства образования. Ни один источник не попал сюда «по умолчанию»: там, где лицензия не разрешала хранить сам текст, из него взята только статистика, и ни одного предложения в базе не осталось. Названия, бренды и тексты уроков остаются собственностью их владельцев."
    donate_title: Поддержать проект
    donate_body: >-
      Приложение бесплатное и без рекламы, и таким останется. Если оно вам пригодилось — можно угостить
      автора кофе. Это никак не влияет на доступ: всё открыто всем одинаково.
    donate_button: Купить кофе
    items:
      moe_audio: Озвучка иероглифов и слов. Записи Министерства образования Тайваня, версия данных 20260626. Файлы отдаются без изменений; приложение лишь ограничивает воспроизведение заголовком статьи.
      cc_cedict: Общинный китайско-английский словарь — чтения, значения и пары традиционный/упрощённый.
      makemeahanzi: Графика порядка черт, разбор на радикалы и этимология иероглифов.
      hanzi_writer: Движок пошагового написания и анимации, используемый в тренажёре письма.
      hanzilookup: "Распознавание рукописного ввода: превращает нарисованные черты в иероглиф, полностью офлайн. Данные распознавания (mmah.json) построены на штрихах Make Me a Hanzi и подчиняются условиям LGPL / Arphic PL этого проекта, а не MIT самого движка."
      unihan: База Unicode Han — канонические чтения и свойства иероглифов.
      opencc: Таблица STCharacters — по ней упрощённые иероглифы переводятся в традиционные, когда вы вставляете текст. Все сделанные замены показываются списком.
      roboto: "Основная гарнитура интерфейса: латиница и пиньинь. Лежит на нашем сервере, а не подгружается из Google, поэтому при открытии страницы никуда наружу запрос не уходит."
      noto_sans_tc: Гарнитура традиционных иероглифов по умолчанию. Тоже на своём сервере.
      tw_kai: "Тайваньский кайшу из 全字庫 CNS11643, выпущенный 數位發展部. Это начертание стоит за режимом рукописного вида, а из его контура 臺 нарисован логотип сайта. Мы отдаём его урезанным: файл сокращён до иероглифов, которые приложение действительно использует, а в логотип вшиты взятые из него контуры, — то есть наша копия изменённая, а не исходная."
      moe: Стандартные начертания Министерства образования, набор 4808 частотных иероглифов и частотность иероглифов.
      bopomofo_audio: Записи символов чжуиня из открытого набора компонентов 國語注音符號手冊, выпущенного отдельно по лицензии CC BY 4.0. 2017 © 教育部,國語注音符號手冊-開放部件.
      tocfl: Официальные градуированные списки лексики TOCFL, уровень за уровнем.
      naer: Государственный НИИ образования — стандарт TBCL, корпус COCT и таблица частотности слов.
      moe_strokes: "Нормативный перечень названий черт: по нему собран список базовых и составных черт."
      moe_idioms: "Официальный словарь 成語: толкование, классический источник, история происхождения и примеры к каждой идиоме. Китайские тексты показаны дословно — лицензия запрещает переработку; переводы и пояснения на русском и английском написаны нами."
      cwa: Шкалы осадков, категории тайфунов и градация ультрафиолетового индекса.
      tbrs: Классификация чаёв, технологические этапы и степени окисления тайваньских сортов.
      hko: Таблицы лунного календаря и дат солнечных сезонов, по которым считаются праздники.
      xiaoxuetang: "Прорисовки древних форм знаков: гадательные кости, бронза и печать. Отданы в общественное достояние."
  help:
    title: Помощь
    intro:
      Коротко о том, что здесь можно делать. Всё общее — словари, уроки, списки — но прогресс только
      ваш.
    sections:
      search:
        title: Поиск
        body: >-
          Строка сверху ищет сразу по всему — вводите на русском, английском, пиньине (с тонами, без тонов
          или цифрами вроде xiao3), чжуине, даже с опечаткой в иероглифе. Результаты ранжируются: самое
          близкое совпадение — первым.
      study:
        title: Колода и изучение
        body: >-
          Колода — это активная стопка. Набираете в неё карточки, а «Изучение» гоняет интервальное повторение
          (FSRS) — оцениваете себя свайпом. Карточки возвращаются ровно тогда, когда вы вот-вот забудете.
      dictionary:
        title: Словарь
        body: >-
          Иероглифы, слова, предложения, сочетания, счётные слова и радикалы. У каждой записи — чтения (чжуинь
          + пиньинь), значения и то, насколько крепко вы её помните.
      tocfl:
        title: TOCFL
        body: >-
          Официальная лексика по уровням. Видно, насколько вы готовы к каждому уровню, и любой можно учить
          напрямую.
      pronunciation:
        title: Произношение
        body: >-
          Произнесите слово в микрофон и получите по-слоговый разбор тонов и звуков. Авторежим идёт дальше
          при верном ответе и держит микрофон открытым, пока не получится.
      writing:
        title: Письмо и распознавание
        body: >-
          «Письмо» просит нарисовать каждый иероглиф по значению и чтению. «Распознавание» узнаёт нарисованное;
          «Цанцзе» тренирует коды ввода.
      history:
        title: История и статистика
        body: >-
          История — ваша недавняя лента: что учили и насколько это закрепилось. Статистика показывает удержание,
          нагрузку и слабые места во времени.
      profile:
        title: Профиль и бэкап
        body: >-
          Меняйте имя и выгружайте весь прогресс в файл. После пересборки базы импортируете его обратно
          и продолжаете ровно с того же места.
    donate: >-
      Здесь ничего не покупается, и донат ничего не открывает — приложение одинаковое в любом случае. Если
      захочется помочь с серверами, кнопка тут. Пройти мимо — совершенно нормально.
    donate_button: Помочь с серверами
