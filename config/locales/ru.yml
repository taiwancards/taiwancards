  practice:
    about_title: Откуда взялся чжуинь
    about:
      origin: "Знаки придумал Чжан Бинлинь: он взял «упорядоченные» начертания древних китайских иероглифов, чтения которых содержат нужный звук. Поэтому ㄅ, ㄆ, ㄇ похожи на иероглифы — они ими и были."
      adopted: В Тайване система принята с 1945 года и остаётся основным способом обучения произношению в начальной школе.
      size: 37 знаков и пять тоновых помет — этого достаточно, чтобы записать любой звук мандарина. Первый тон обычно не помечают вовсе, точка сверху обозначает нейтральный.
      today: Сегодня чжуинь — самый распространённый в Тайване способ ввода иероглифов на компьютере и телефоне и поиска в словаре. В учебниках он печатается как рубиновая подпись над строкой.
      hokkien: Для тайваньского хоккиена создано ещё 23 дополнительных знака — расширение той же системы под другой язык Тайваня.
    practice_now:
      title: Отработайте прямо сейчас
      initials: Двадцать одна инициаль — блоками по способу произнесения. Читать дальше стоит, только когда эти узнаются на слух без раздумий.
      finals: Шестнадцать финалей. Тот же тренажёр, латиницы на экране нет.
      tricky: >-
        Шесть написаний, за которыми пиньинь прячет настоящую финаль. Дрилл подмешивает похожие —
        сразу видно, читаете вы чжуинь или латиницу.
      cta: К тренажёру на слух →
    drill_progress_title: Тренировка звуков
