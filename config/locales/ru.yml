  page_help:
    cangjie_lessons_html: >-
      <p>Цанцзе — тайваньский способ набора традиционных иероглифов по внешнему виду, без чтений:
      знак режется на видимые куски, каждый кусок — одна латинская клавиша. Здесь разобрана пятая
      версия метода (倉頡五代): третью и упрощённый цанцзе мы не рассматриваем.</p><p>Порядок такой:
      сначала четыре урока об устройстве кода, затем по одному уроку на каждую из двадцати шести
      клавиш, затем правила разбиения и закрытые списки исключений. В конце — тайваньские знаки и
      весь Novice 1–2.</p><p>Внутри каждого урока есть своя практика: определить клавишу по форме,
      назвать первую клавишу знака, выбрать верное разбиение и набрать код целиком. Свободный набор
      живёт отдельно, в <strong>тренажёре цанцзе</strong> из раздела «Практика».</p>
    names_html: >-
      <p>Раздел объясняет устройство тайваньского имени и показывает, что реально используется на
      острове, — по данным учёта населения. Имя за вас он не придумывает: этот выбор личный и обычно
      делается вместе с тайваньским другом или преподавателем.</p><p><strong>Фамилия</strong> — один
      иероглиф, наследуется, пишется перед личным именем; двусложные фамилии есть, но редки.
      <strong>Личное имя</strong> — один или два иероглифа, их выбирает семья, и обычный случай —
      два. Порядок не меняется: по-китайски фамилия всегда впереди, в каком бы порядке её ни печатал
      паспорт, и к человеку обращаются по фамилии с обращением, пока он не предложит иначе.</p><p>На
      вкладке «Подобрать имя» знаки ранжируются по тем же числам, что и во второй вкладке: частота по
      поколениям, тоновый рисунок, устойчивость пары и число черт. На выходе — пять вариантов с
      разбором, чтобы короткий список было о чём обсудить.</p>
    desks_html: >-
      <p>Колода собирается из того, что вы вставите: список слов с новой строки, через запятую или сплошной
      текст — система разберёт сама. Можно и загрузить файл, а можно вытащить слова из песни.</p><p>Главное
      отличие от Anki: <strong>переводы вводить не нужно</strong>. Всё берётся из нашего словаря — чтение,
      значение, разбор по иероглифам, звук. Вы даёте только список слов.</p><p>Перед созданием показывается
      предпросмотр: сколько выйдет карточек, что оказалось повтором и чего в словаре не нашлось. Записи
      идут от простых к сложным. Если весь список вам уже знаком, его можно одной кнопкой отправить в дальние
      повторения вместо новых карточек.</p>
    hanzi_html: >-
      Здесь разобрано, из чего собран иероглиф и как этим пользоваться. Смысловая часть подсказывает область
      значения, фонетическая — примерное чтение. По нашим данным фонетик угадывает финаль примерно в четырёх
      случаях из пяти, так что незнакомый знак часто можно прочитать с первой попытки. Разделы можно разворачивать
      по одному.
    triage_html: >-
      <p>Быстрый способ навести порядок, если вы уже что-то знаете. Иероглиф на экране — вправо, если знаете,
      влево, если сомневаетесь.</p><p><strong>Знаю</strong> отправляет запись в дальние повторения: примерно
      через три недели и дальше, вразнобой, чтобы не собрать лавину в один день. Насовсем ничего не пропадает.</p><p><strong>Не
      уверен</strong> оставляет запись в обычной очереди — она пойдёт по плану наравне с остальными.</p><p>Уже
      пройденное сюда не попадает, и разметка не трогает то, что вы реально учили.</p>
    zhuyin_trainer_html: >-
      <p>Здесь чжуинь учится как самостоятельная запись звука, без опоры на латиницу. Вы слышите звук и
      выбираете знак — пиньиня на экране нет намеренно, иначе закрепляется связка «ㄅ равно буква b», а не
      «ㄅ равно звук».</p><p>Знаки идут блоками по способу произнесения, а не подряд по таблице. Новый блок
      открывается, когда закрыт предыдущий. Варианты ответа подобраны близкие: похожие начертания и звуки
      того же места образования — случайные варианты создавали бы иллюзию прогресса.</p><p>Знак считается
      освоенным после трёх верных ответов подряд, причём быстрых: если вы отвечаете верно, но долго, значит
      вычисляете, а не узнаёте, и счётчик не растёт. Выйти отсюда можно в любой момент.</p>
    numbers_html: >-
      <p>Иероглифов для чисел мало, и выучить нужно все до одного — но настоящая сложность не в них, а в
      разрядах.</p><p>Мандарин группирует цифры по четыре: 萬 — это 10 000, и всё выше строится от него.
      Поэтому миллион — 一百萬, а миллиард — 十億. Пять разделов ниже идут от знаков к ловушкам; последний —
      про годы 民國, которые вы встретите в любом тайваньском бланке.</p>
    practice_phonetics_html: >-
      <p><strong>Чжуинь</strong> (ㄅㄆㄇㄈ, его же называют бопомофо) — фонетическая азбука: 37 знаков, каждый
      закреплён за одним звуком мандарина, плюс пометы тона. Знаки ничего не значат сами по себе, поэтому
      прочитать их «по привычке» невозможно. Ими подписаны чтения в тайваньских словарях и школьных учебниках,
      ими же набирают текст.</p><p><strong>Пиньинь</strong> — орфография, то есть способ записать те же
      звуки латиницей по собственным правилам. Правила сделаны ради краткости записи, а не ради точности:
      одна буква может обозначать разные звуки, а часть гласных из записи выпадает. <strong>Палладица</strong>
      — то же самое для кириллицы: стандартная русская транскрипция, которой записывают китайские имена
      и названия. В таблицах она дана только как справка, чтобы вы узнали знакомую запись; само приложение
      ею не пользуется. И пиньинь, и палладица обманывают, если читать их по правилам родного языка.</p><p>В
      таблицах ниже сначала идёт <strong>опора</strong>: что произнести прямо сейчас, одной фразой. Дальше
      — разбор артикуляции, то есть работы органов речи. В конце строки оранжевым — предупреждение о типичной
      ошибке.</p>
    roadmap_html: >-
      <p>Порядок, в котором стоит осваивать приложение, если вы начинаете с нуля. Он не обязателен: всё
      это доступно и так, из меню.</p><p>Шаги с тренажёрами отмечаются сами — после одного захода в распознавание
      звуков, после десяти верно набранных слов, после двадцати повторений. Остальные отмечайте вручную,
      когда почувствуете, что готовы дальше.</p><p>Пункты «по желанию» можно пропустить без последствий:
      путь считается пройденным и без них.</p>
    label: Как работает эта страница
    typing_html: >-
      <p>Здесь показана тайваньская раскладка бопомофо — та самая, что напечатана на клавиатурах, продающихся
      в Тайване, и которой пользуется большинство местных. Ничего устанавливать не нужно: нажимайте те же
      клавиши, и появляется чжуинь.</p><p>Наберите чтение показанного слова и нажмите пробел или Enter для
      проверки. Клавиши тонов: 6 (ˊ), 3 (ˇ), 4 (ˋ) и 7 (˙); для первого тона клавиша тона не нужна.</p><p>Слова
      берутся из вашего словаря в учебном порядке, так что тренируются одновременно и чтение, и набор.</p>
    reader_html: >-
      <p>Чтение настоящих текстов на мандарине со встроенным словарём. Знакомые слова приглушены, всё новое
      подсвечено по уровню и подчёркнуто, а сверху напечатано чтение.</p><p>Нажмите на слово — полная статья,
      аудио и кнопка «в изучение». Весь текст превращается в колоду одним нажатием.</p><p>Вставляйте что
      угодно сами или импортируйте тексты песен. Упрощённые иероглифы всегда сначала переводятся в тайваньские
      традиционные.</p>
    placement_html: >-
      <p>Адаптивный тест: за пять минут определяет уровень и предлагает пометить всё на нём и ниже как уже
      знакомое.</p><p>Вопросы усложняются, пока отвечаете верно, и упрощаются при ошибках. Оценка намеренно
      грубая — на экране результата её можно поправить перед применением.</p><p>Пометка безопасна: то, что
      вы уже учите, сохраняет прогресс, а засеянные элементы распределяются на недели вперёд, так что лавины
      повторений не будет.</p>
    phrases_html: >-
      <p>Целые высказывания, а не лексика. Каждая карточка — паттерн со слотами, которые подставляются из
      словаря: одна строка закрывает сотню заказов в чайной.</p><p>Карточки с пометой <strong>Говорят вам</strong>
      — та половина, которую пропускают все разговорники: вопросы, которые кассир выпаливает на кассе. Понимать
      их важнее, чем строить безупречные фразы.</p><p>Там, где китайская форма понятна, но звучит
      по-приезжему, дана тайваньская, а другая зачёркнута.</p>
    everyday_html: >-
      <p>Лексика, которая по-настоящему тайваньская и не попадает ни в один экзаменационный список: сокращения
      для заказа напитков, сленг из тайваньского хоккиена, слова, которыми в Тайване называют то, что в Китае зовут
      иначе.</p><p>Фильтруйте по сфере жизни или по происхождению слова. То, что помечено как грубое, таковым
      и является. Где есть китайский аналог, он показан рядом — чтобы видеть контраст, а не заучивать
      одну форму.</p>
    variants_html: >-
      <p>Где Тайвань расходится с Китаем, Гонконгом и Сингапуром: в чтении слова, в выборе иероглифа
      или в самом слове.</p><p>Именно по этим мелочам слышно, что мандарин учили не здесь. Всё спорное или
      недавно изменившееся помечено в тексте, а не подано как решённое.</p>
    calendar_html: >-
      <p>Двенадцать праздников, которые действительно задают ритм года в Тайване, и у каждого — правило,
      по которому вычисляется дата, а не дата, которую через год пришлось бы искать заново.</p><p>Раздел
      про луну объясняет сам счёт: почему 初五 значит именно это и почему 春節 каждый год съезжает. Оба конвертера
      работают прямо в браузере: 民國 — чистая арифметика, лунный — по таблице, сверенной с Гонконгской обсерваторией.</p><p>Слова
      к каждому празднику можно сразу добавить в изучение, если они уже есть в словаре.</p>
    metro_html: >-
      <p>Все линии сети Тайбэя и Нового Тайбэя со станциями в официальном порядке. Нажмите на станцию —
      в карточке сверху появятся чжуинь, пиньинь и значение, а оттуда можно открыть полную статью или добавить
      слово в колоду.</p><p>Полые кружки — пересадочные станции; в карточке перечислены все линии, к которым
      станция относится. Раскладка намеренно схематична, а не географична.</p>
    games_html: "<p>Терминология тайваньского маджонга, китайского официального маджонга, сянци, го и настольных игр — с пояснением, что каждое слово значит внутри игры. Правил мы не излагаем: цель в том, чтобы понимать разговор за столом и читать вывески, приложения и трансляции.</p><p>Вкладки делят словарь по играм, внутри — по смыслу: плитки и фигуры, ход игры, возгласы, комбинации, стратегия, что говорят за столом. Зелёная точка помечает то, что за пределами Тайваня скажут иначе; там, где Китай называет то же самое другим словом, оно указано рядом. Значения сверены со словарём Министерства образования, тайваньскими правилами шестнадцатиплиточного маджонга и официальными правилами китайского маджонга 1998 года.</p>"
    medicine_html: >-
      <p>Западная медицина такой, какой о ней говорят в Тайване: тело и органы, болезни — как их называет
      врач и как их зовут дома, прививки из календаря CDC и вывески, по которым идут через госпиталь: 掛號,
      批價, 領藥. Нажмите на подпись на рисунке, чтобы увидеть чтение, а затем откройте полную словарную
      статью.</p><p>Там, где у медицинского термина есть бытовое название (闌尾炎 рядом с 盲腸炎), пара показана
      бок о бок. Отличия от китайского узуса помечены, а заимствования из тайваньского хоккиена снабжены чтением
      тайло. Всё сверено со словарями Министерства образования и тайваньскими органами здравоохранения.</p>
    dict_html: >-
      <p>Единый словарь: и отдельные слова, и устойчивые сочетания — просто словарные статьи, без деления.
      Граница между ними условная: 便利商店 и 超商 значат одно и то же, искать их в двух разных списках было бы
      странно.</p><p>Кнопки <strong>уровня TOCFL</strong> сужают до одного экзаменационного уровня, ряд
      ступеней — до школьной шкалы TBCL, фильтр прогресса показывает только новые, изучаемые или знакомые
      записи.</p><p>Внутри уровня записи идут по <strong>частотности</strong> — самые частые первыми. Переключите
      сортировку, чтобы сравнить по чистой частотности. Нажмите на запись для полной статьи или кнопку <strong>+</strong>,
      чтобы сразу добавить её в колоду.</p>
    chengyu_html: >-
      <p>成語 — четырёхсложные выражения, пришедшие из классических текстов и притч. Дословно они часто значат
      совсем не то, что на самом деле: 雪中送炭 буквально «принести угля в снегопад», а на деле — «помочь ровно
      тогда, когда помощь нужнее всего». Поэтому у каждой идиомы здесь показан не только перевод, но и <strong>оттенок</strong>:
      одобрительный, нейтральный или неодобрительный — сказать человеку 十拿九穩 и 莫名其妙 значит совершенно разное.</p><p>Список
      собран из словаря: часть идиом размечена по словарным пометам, часть выверена вручную — у выверенных
      есть пояснение, когда так говорят, и живой пример. Нажмите на идиому, чтобы открыть полную статью
      со звуком, разбором по иероглифам и предложениями.</p>
    tbcl_html: >-
      <p>TBCL (臺灣華語文能力基準) — шкала, по которой мандарин преподают в самом Тайване: семь ступеней, от первой
      к седьмой. Она устроена иначе, чем экзаменационный TOCFL, и опирается на школьную программу, а не
      на формат теста.</p><p>Внутри ступени записи идут от самых частых к редким. Полоска показывает, сколько
      из ступени вы уже усвоили — считается всё выученное где угодно в приложении, не только здесь.</p>
    characters_html: >-
      <p>4808 частотных традиционных иероглифов из набора Министерства образования. На плитке — иероглиф;
      нажмите для чтений (чжуинь + пиньинь), порядка черт, этимологии, слов с ним и силы вашей памяти.</p><p>Иероглифы
      идут по частотности, так что самые частые — первыми.</p>
    sentences_html: >-
      <p>Полные примеры предложений из уроков. Каждое слово в предложении — ссылка на словарную статью,
      так что можно нажать на незнакомое. Фильтр источника сузит до одной книги или урока.</p>
    search_html: >-
      <p>Три поля, которые складываются. <strong>Написание или значение</strong> принимает иероглифы или
      слово по-русски либо по-английски. <strong>Пиньинь</strong> и <strong>чжуинь</strong> принимают чтение;
      тоны можно писать знаками, цифрами после слога или вовсе опустить — <code>nǐhǎo</code>, <code>ni3hao3</code>
      и <code>ni hao</code> ведут к одному слову. Если тоны заданы, сначала идут слова ровно с этими тонами,
      и только потом остальные.</p><p>Галочка <strong>искать по банку предложений</strong> откладывает виды
      в сторону: в выдаче предложения с выделенным словом, по десять на странице, с фильтрами по уровню
      и стилю. Если в запросе два слова, страница ещё и скажет, сочетаются ли они.</p>
    radicals_html: >-
      <p>214 ключей Канси — кирпичики, под которые сведён каждый иероглиф. Нажмите на ключ, чтобы увидеть
      иероглифы с ним.</p>
    zhuci_html: >-
      <p>Частицы, которые тайваньский мандарин ставит в конец предложения: 啦, 喔, 耶, 嘛, 齁 и прочие.
      Словарного значения у них нет вовсе, зато есть интонация — теплота, лёгкое раздражение, дружеское
      предупреждение, наигранное возмущение. Карточки отсортированы по тому, как часто частица реально
      стоит в конце фразы в наших тайваньских корпусах; внутри — весь спектр чувств, который она несёт,
      и примеры с переводом, в котором эта интонация не теряется.</p>
    liangci_html: >-
      <p>Тайваньские счётные слова (量詞) — словечки между числом и существительным: 一<b>本</b>書, 三<b>隻</b>貓.
      У каждого показано, что оно считает, с какими существительными реально стоит и как выглядит в живых
      предложениях. Списки собраны по 教育部國語辭典簡編本, CC-CEDICT и нашим корпусам тайваньских текстов. Есть игра
      на подбор верного счётного слова.</p>
    tocfl_html: >-
      <p>Ваш прогресс к каждому официальному уровню TOCFL. В счёт входят все иероглифы и слова, выученные
      где угодно в приложении, не только здесь. Откройте уровень, чтобы учить его напрямую или увидеть,
      что осталось.</p>
    study_html: >-
      <p>Пройдите всю пачку разом — что не знали, вернётся, что знали, уйдёт. <strong>Свайп вправо</strong>
      — знал, <strong>влево</strong> — не знал, <strong>вверх</strong> — слишком легко, <strong>вниз</strong>
      — трудно. Работают и стрелки, а нажатие переворачивает карточку.</p><p>Новые элементы вводятся пачкой,
      вперемешку со всем, что подошло к повторению. Планирование — FSRS: карточка возвращается ровно тогда,
      когда вы вот-вот забудете.</p>
    pronunciation_html: >-
      <p>Произнесите слово в микрофон; каждый слог оценивается по <strong>тону</strong> и по <strong>инициали/финали</strong>.
      Зелёный — верно, янтарный — близко, красный — мимо. В авторежиме идёт дальше при верном ответе и держит
      микрофон, пока не получится. Принимаются и стандартное, и тайваньское произношение.</p>
    writing_html: >-
      <p>Вспомните иероглиф по значению и чтению, затем напишите его по чертам. Черты проверяются по порядку;
      неверная возвращается. Иероглифы с ошибками всплывают первыми, остальные — от самых простых.</p>
    handwriting_html: >-
      <p>Нарисуйте традиционный иероглиф по чертам — распознавание офлайн, ничего не уходит с устройства.
      Удобно как быстрый поиск, когда помните начертание, но не чтение.</p>
    cangjie_html: >-
      <p>Ввод Цанцзе 5 для традиционных тайваньских иероглифов. Наберите латинские клавиши, составляющие
      иероглиф. На странице каждого иероглифа есть его код Цанцзе.</p>
    history_html: >-
      <p>Что вы недавно учили и насколько крепко это держится. Точки показывают силу памяти по граням (узнавание,
      чтение, тон, письмо). Помогает заметить, что ускользает, ещё до срока повторения.</p>
    practice_drill_html: >-
      <p>Карточки, отрабатывающие две фонетические системы друг против друга. Выберите направление — видите
      символ чжуиня и вспоминаете пиньинь или наоборот, — потом свайп вправо, если знали, и влево, если
      нет.</p><p>Что не угадали, вернётся позже в этом же круге и запомнится, так что следующий круг начнётся
      с ваших слабых звуков. Инициали и финали можно отрабатывать по отдельности.</p>
    practice_progress_html: >-
      <p>Две разные вещи на одной странице, и берутся они из разных тренажёров.</p><p><strong>Тренировка звуков</strong>
      считает ваши заходы в карточки на распознавание и в набор на чжуине, и показывает знаки, на которых
      вы чаще всего промахиваетесь. Появляется сразу после первого пройденного захода.</p><p><strong>Произношение
      вслух</strong> строится из попыток в микрофон: какие тоны и инициали выходят надёжно, а какие нет.
      Пока вы не говорили в микрофон, этот раздел пуст — и это нормально, он не связан с карточками.</p>
