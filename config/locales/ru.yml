    checked: Чтения сверены со словарями министерства образования, лексика — с официальной таблицей сопоставления по двум берегам и региональными источниками. Там, где форма спорна или норма сместилась, об этом сказано прямо, а не выбрана удобная сторона.
    sections:
      reading: Те же иероглифы, другое чтение
      glyph: То же слово, другой иероглиф
      word: Совсем другое слово
    intro:
      reading: "Пишется по обе стороны пролива одинаково, а произносится по-разному. 垃圾 замечают все: скажете в Тайбэе lājī — и сразу понятно, где вы учили мандарин. Две записи требуют оговорки. 和 в чтении hàn действительно есть в словаре министерства образования именно как союз, но оно отступает к старшему поколению и телеэфиру, так что держите его на узнавание, а не на производство. А 說服 здесь и правда shuìfú — но не потому, что Китай что-то менял: вирусная история 2019 года про смену чтений была официально опровергнута."
      glyph: "И Тайвань, и Гонконг пишут традиционными, но выбирают не всегда один и тот же иероглиф. Это разные символы Unicode, а не разница шрифтов, поэтому на странице они действительно выглядят иначе. 著 встретится чаще всего: Тайвань пишет его во всех значениях, а Гонконг и Китай делят его с 着. Две строки — случаи, где официальная норма расходится с обычным письмом внутри самого Тайваня: стандарт это 汙 и 脣, но повсюду вы увидите 污 и 唇."
      word: "Здесь регионы просто используют разные слова. Учтите: гонконгская колонка — это в основном кантонская лексика, записанная иероглифами, а не мандаринский вариант; читая 雪櫃 вслух по-мандарински, вы читаете кантонское слово. Самая коварная строка — 土豆: в Тайване это арахис, в Китае картошка. Два разных слова, столкнувшиеся в написании."
