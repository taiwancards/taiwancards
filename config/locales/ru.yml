      грамматические пояснения и разборы — всё написано на обоих языках и меняется вместе с ним.
    hanzi_font_toggle: Начертание иероглифов
    hanzi_font_hint: >-
      Начертание иероглифов. Включено — кайшу, каллиграфическая гарнитура: черты видно так, как их пишут
      от руки. Выключено — обычный шрифт без засечек. По умолчанию включено.
    readings_toggle: Чжуинь и пиньинь
    detail_toggle: Сколько показывать на страницах словаря
    detail_hint: >-
      Сколько показывать на страницах словаря. 詳 — всё, что у нас есть: рейтинг редкости, смесь регистров,
      карточки памяти, тезаурус, происхождение. 簡 — рабочий минимум: чтения, значения, часть речи, счётное
      слово, синонимы и антонимы, письмо с практикой, десяток предложений. Пока вы не прошли уровень Novice,
      начинается с 簡, дальше — с 詳; потом остаётся там, куда поставите.
    script_setup_hint: >-
      Как показывать язык: начертание, пиньинь, китайский вариант слова, объём словарной статьи — и язык, на
      котором вы читаете сам сайт.
    china_toggle: Показать китайский вариант
    china_hint: >-
      Как то же слово звучит в Китае. Включено — на карточке мелко подписан китайский вариант.
      Выключено — ничего лишнего. По умолчанию выключено: здесь учат тайваньский вариант, китайский —
      только справка.
    readings_hint: >-
      Чтения над иероглифами, три положения: только чжуинь, чжуинь вместе с пиньинем и совсем ничего.
      Пиньинь не даётся без чжуиня — в Тайване читают по чжуиню. По умолчанию только чжуинь, и выбранное
      положение действует на всех страницах, пока вы его не смените.
