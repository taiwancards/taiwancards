      cta: Начать
      secondary: Что внутри
      note: Бесплатно. Без рекламы. И так будет всегда.
      specimen:
        meaning: ананас
        caption: Одно слово — и пять разных умений, у каждого свой срок повторения.
    is:
      heading: Что это
      items:
        taiwan: >-
          Тайваньский мандарин и ничего кроме: традиционные иероглифы, чжуинь, уровни TOCFL и тайваньские
          школьные ступени
        decks: >-
          Как Anki, только карточки не надо ни искать у чужих людей, ни собирать самому по вечерам. И
          слово — это не одна карточка со свайпом «знаю / не знаю»: узнать, произнести и написать — три
          разных навыка, и учатся они отдельно
        dictionary: >-
          Как Pleco, только это не просто словарь: одна и та же статья идёт в тренажёры и в расписание
          повторений, а тайваньское стоит на первом месте, а не в примечании
        writing: >-
          Как Skritter, только письмо — не отдельное приложение со своим списком: вы пишете те иероглифы,
          которые и так учите на этой неделе, и это засчитывается в общий прогресс
        reading: >-
          Как Du Chinese, только текст выбираете вы: любимая песня, новость, распечатка с занятия,
          переписка. Вставили — приложение разберёт её по словам, и из них сразу собирается колода
        photo: >-
          Сфотографируйте меню на стене или вывеску на улице — приложение разберёт непонятные иероглифы по
          словам, и из них сразу собирается колода
        speaking: >-
          Не распознавание «понял / не понял»: каждый слог разбирается по девятнадцати акустическим
          признакам, и видно, что именно съехало, — а сверяется всё с тайваньским произношением, не с
          китайским
        everyday: >-
          Тот Тайвань, которому не учат на курсах: заказ в чайной, лотерея по чекам, аренда квартиры,
          приём у врача, день тайфуна
        corpus: >-
          Все примеры — живые фразы, написанные в Тайване. У каждой указано, откуда она и на каких условиях
          используется
        measured: >-
          Здесь ничего не прикинуто на глазок: и частотность слова, и его сложность, и уровень посчитаны
          по настоящему тайваньскому корпусу
        memory: >-
          Прогресс один на всё приложение: встретили слово в читалке — и оно уже учтено в словаре, в
          тренажёрах и в письме
    isnt:
      heading: Чем это не является
      items:
        game: >-
          Не игра: ни серий, ни очков, ни значков, ни таблиц лидеров, ни зверька, который обиженно
          напоминает о себе, стоит пропустить день
        machine: >-
          Здесь нет и не будет ИИ-контента. Каждое значение, каждый пример и каждая подпись прошли
          через человека, а за каждой фразой стоит проверяемый источник. Большинство приложений
          показывают то, что сгенерировала модель, — здесь такого не бывает
        decks: >-
          Не свалка чужих колод, о которых неизвестно, кто их собирал, по какому учебнику и верны ли там
          тайваньские чтения
        china: >-
          Не курс из Китая, которому подменили иероглифы на традиционные: там расходятся и лексика, и
          чтения, и половина бытовых реалий
        words: >-
          В курсе из Китая вам вряд ли попадутся 自由, 民主 и 人權. Здесь таких слов хватает, и нет списка,
          из которого они выпали бы
        course: >-
          Не программа, которую надо отсидеть от первого урока до последнего: берёте то, что нужно сейчас,
          остальное пропускаете и возвращаетесь к нему, когда понадобится
        teacher: >-
          Не замена преподавателю. Это та работа, которую делают между занятиями: её никто не проверит, но
          именно от неё всё и зависит
        hsk: >-
          Не подготовка к HSK: там другая лексика, другие чтения и другие реалии за словами, даже если
          сдавать традиционными иероглифами
        simplified: >-
          Упрощённых иероглифов нет нигде, и включить их нельзя: и в словаре, и в примерах, и в тренажёрах
          — только тайваньское написание
        ads: >-
          Никакой рекламы — и она здесь не появится: ничто не мигает, не перебивает и не уводит ни от
          учёбы, ни от того, чтобы просто посмотреть слово
        tracking: >-
          Не следит за вами: ни сторонней аналитики, ни трекеров. Весь прогресс в любой момент выгружается
          в файл, и файл остаётся у вас
