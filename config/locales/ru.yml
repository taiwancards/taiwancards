---
ru:
  audio:
    play: Озвучить
    source_whole: MOE — запись слова целиком
  privacy_google:
    heading: Вход через Google и ваши данные
    body: Вход через Google — необязательный способ создать аккаунт. Можно зарегистрироваться и обычной почтой с паролем, тогда никакие данные Google не запрашиваются вовсе.
    signin: При входе через Google TaiwanCards получает ваш адрес электронной почты и имя из профиля. Это нужно, чтобы создать учётную запись и связать с ней ваш прогресс.
    drive: Если вы отдельно нажмёте «Сохранить в Google Drive», приложение создаст на вашем Диске один файл с резервной копией вашего учебного прогресса и сможет читать и перезаписывать только его.
    limits: "Права ограничены разрешением drive.file: доступ есть только к тем файлам, которые создало само приложение. Остальные файлы на вашем Диске TaiwanCards не видит и получить к ним доступ не может. Резервная копия не создаётся автоматически — только по вашему нажатию."
    privacy: Политика конфиденциальности
    terms: Условия использования
    policy_before: Использование сведений, полученных через API Google, соответствует политике
    policy_name: Google API Services User Data Policy
    policy_after: и её требованиям Limited Use. Данные аккаунта Google никогда не используются для рекламы, никогда не продаются и никому не передаются сверх описанного здесь.
  privacy:
    title: Политика конфиденциальности
    effective: "Дата вступления в силу: 1 марта 2025 года"
    purpose:
      heading: Назначение приложения
      body: TaiwanCards — бесплатное веб-приложение без рекламы, предназначенное для изучения тайваньского мандарина. Оно предоставляет карточки с интервальным повторением, поиск по словарю, тренировку произношения и списки лексики. Приложение разрабатывается и поддерживается одним независимым разработчиком, а не компанией.
    stored:
      heading: Какие данные обрабатываются
      items:
        - Адрес электронной почты, отображаемое имя и язык интерфейса.
        - "Ваш пароль не хранится: учётная запись создаётся через Google, и приложение никогда не запрашивает пароль."
        - "Учебные данные: колоды, карточки, история повторений, прогресс и настройки тренировок."
        - Попытки произношения и вычисленные на их основе измерения.
        - Журналы серверных запросов, сохраняемые в целях обеспечения надёжности работы и предотвращения злоупотреблений.
    never:
      heading: Что не осуществляется
      items:
        - Персональные данные не продаются и не предоставляются во временное пользование.
        - Реклама не размещается, рекламные трекеры не используются.
        - Сторонние системы аналитики не применяются.
        - Профилирование не осуществляется ни для каких целей, кроме отображения пользователю его собственных результатов.
    cookies:
      heading: Файлы cookie
      body: "Используются два файла cookie, оба строго необходимые: подписанный сессионный файл, обеспечивающий сохранение входа в учётную запись, и файл, сохраняющий выбранный язык интерфейса. Рекламные и отслеживающие файлы cookie не используются."
    donation:
      heading: Кнопка пожертвования
      body: На странице помощи размещена необязательная кнопка пожертвования, предоставляемая сервисом Buy Me a Coffee. При открытии указанной страницы загружается их скрипт, вследствие чего браузер пользователя обращается к их серверам, и им становятся доступны IP-адрес и строка user agent. Данные учётной записи не передаются, на других страницах кнопка отсутствует, совершение пожертвования не является обязательным.
    where:
      heading: Место обработки данных
      body: Приложение и его база данных размещены на Render в Сингапуре. Трафик проходит через Cloudflare, аудиофайлы отдаются из Cloudflare R2. Указанные поставщики обрабатывают данные исключительно в целях размещения сервиса. При использовании резервного копирования в Google Drive соответствующая копия находится в вашей собственной учётной записи Google.
    retention:
      heading: Сроки хранения и удаление
      body: Данные хранятся в течение всего срока существования учётной записи. Для удаления учётной записи и всех связанных с ней данных направьте запрос на указанный ниже адрес; серверные журналы удаляются по истечении срока их хранения. Удаление учётной записи не затрагивает резервный файл, созданный вами в вашем Google Drive, — такой файл удаляется вами самостоятельно.
    choices:
      heading: Права пользователя
      items:
        - Пользоваться словарём, грамматикой, справочными разделами и всем о Тайване вовсе без учётной записи.
        - В любой момент отозвать доступ приложения к Google на странице разрешений вашей учётной записи Google.
        - Запросить копию своих данных, их исправление или полное удаление.
    children:
      heading: Несовершеннолетние
      body: Приложение не адресовано детям младше 13 лет; учётные записи для них сознательно не создаются.
    changes:
      heading: Изменение политики
      body: При изменении настоящей политики одновременно обновляется указанная выше дата вступления в силу.
    contact:
      heading: Обратная связь
      body: "Вопросы, запросы на предоставление данных и запросы на удаление:"
    related:
      heading: Смежные документы
  terms:
    title: Условия использования
    effective: "Дата вступления в силу: 1 марта 2025 года"
    service:
      heading: Предмет
      body: TaiwanCards — веб-приложение для изучения тайваньского мандарина, разрабатываемое и поддерживаемое одним независимым разработчиком. Приложение предоставляется бесплатно, не содержит рекламы и предоставляется на условиях «как есть». Отдельные возможности могут быть изменены или прекращены.
    account:
      heading: Учётная запись
      items:
        - Предоставляйте достоверные сведения об учётной записи и не передавайте свои учётные данные третьим лицам.
        - Одна учётная запись — один пользователь. Вы несёте ответственность за все действия, совершённые под вашей учётной записью.
        - Учётная запись может быть удалена в любой момент по запросу, направленному на указанный ниже адрес.
    use:
      heading: Допустимое использование
      items:
        - Не предпринимайте попыток получить доступ к данным, системам и учётным записям иных пользователей, права на который у вас отсутствуют.
        - Не осуществляйте массовое автоматизированное извлечение содержимого сайта и не создавайте автоматическую нагрузку, выходящую за рамки обычного учебного использования.
        - Не размещайте противоправные или вредоносные материалы.
        - Соблюдайте условия лицензий словарей, корпусов и шрифтов, перечисленных на странице лицензий.
    yours:
      heading: Создаваемые вами материалы
      body: Колоды, заметки и данные о прогрессе, создаваемые вами, остаются вашими. Вы предоставляете исключительно то разрешение, которое необходимо для их хранения и отображения вам. Выгрузить свой прогресс можно в любой момент, в том числе в собственное хранилище Google Drive.
    ours:
      heading: Используемые материалы
      body: Код приложения и оригинальные тексты принадлежат их автору. Словари, корпуса, аудиозаписи и шрифты получены от третьих лиц и используются на условиях их собственных лицензий, каждая из которых указана на странице лицензий. Настоящие условия не предоставляют вам каких-либо прав на указанные материалы третьих лиц сверх объёма, установленного этими лицензиями.
    availability:
      heading: Доступность сервиса
      body: Сервис предоставляется на условиях «как есть» и «по мере доступности», без каких-либо гарантий бесперебойной работы и без гарантии отсутствия ошибок в лингвистических данных. Сервис является учебным пособием и не является авторитетным источником сведений о языке.
    suspension:
      heading: Приостановление доступа
      body: Учётные записи, нарушающие настоящие условия либо создающие угрозу работоспособности сервиса, могут быть приостановлены или удалены.
    liability:
      heading: Ограничение ответственности
      body: В максимальной степени, допускаемой применимым правом, разработчик не несёт ответственности за косвенные, случайные или последующие убытки, возникшие в связи с использованием сервиса.
    changes:
      heading: Изменение условий
      body: Настоящие условия могут быть изменены. Одновременно с изменением обновляется указанная выше дата вступления в силу; продолжение использования сервиса после этой даты означает согласие с новой редакцией.
    contact:
      heading: Обратная связь
      body: "Вопросы по настоящим условиям:"
    related:
      heading: Смежные документы
