  numbers:
    rules_title: Правила, которые надо знать до тренировки
    rules:
      truncation:
        title: Хвостовая цифра означает следующий разряд вниз
        body: Это главный источник недоразумений. Одинокая цифра в конце не прибавляется к числу — она умножает следующий разряд, который просто не проговаривают. Поэтому 三百五 — это 350, а вовсе не 305.
        rows:
          - huayu: 三百五
            value: "350"
            note: полная форма 三百五十; 十 опущено
          - huayu: 兩千三
            value: "2300"
            note: полная форма 兩千三百; 百 опущено
          - huayu: 一萬五
            value: 15 000
            note: полная форма 一萬五千; 千 опущено
      zero:
        title: 零 — это не пауза, а запрет на сокращение
        body: "Чтобы сказать 305, недостаточно назвать три и пять: нужно 零 между ними. Оно сообщает, что разряд пустой, и тем самым отменяет чтение по правилу выше. Один 零 покрывает любой пропуск, сколько бы разрядов он ни занимал."
        rows:
          - huayu: 三百零五
            value: "305"
            note: без 零 получилось бы 350
          - huayu: 一千零五
            value: "1005"
            note: пропущены и сотни, и десятки — 零 всё равно один
          - huayu: 一千零五十
            value: "1050"
            note: 十 названо, значит это десятки, а не единицы
          - huayu: 一萬零五
            value: 10 005
            note: 零 работает и через границу 萬
      liang:
        title: 兩 или 二 — зависит от того, что стоит следом
        body: "二 — это сама цифра: при счёте, в номерах, в 十二 и в 二十. 兩 ставится там, где двойка что-то отмеряет: перед счётным словом и перед 百, 千, 萬, 億. Исключение одно, но важное: перед 十 всегда 二."
        rows:
          - huayu: 二
            value: "2"
            note: сама цифра, при счёте
          - huayu: 二十
            value: "20"
            note: перед 十 никогда не бывает 兩
          - huayu: 十二
            value: "12"
            note: двойка в единицах — тоже 二
          - huayu: 兩百
            value: "200"
            note: перед 百 — 兩; в Тайване 二百 не говорят
          - huayu: 兩千三百二十二
            value: "2322"
            note: 兩 дважды сверху, 二 внизу — всё в одном числе
          - huayu: 兩個人
            value: 2 чел.
            note: перед счётным словом — всегда 兩
      shi:
        title: 十 в начале числа обходится без 一
        body: От 10 до 19 十 стоит само по себе. Но как только перед ним появляется старший разряд, единица возвращается.
        rows:
          - huayu: 十五
            value: "15"
            note: 一十五 не говорят
          - huayu: 一百一十五
            value: "115"
            note: здесь 一 перед 十 обязательно
          - huayu: 一百一
            value: "110"
            note: разговорное сокращение по правилу хвостовой цифры
