    food: Что едят
    words_heading: Слова к этому празднику
    no_lexeme: в словаре пока нет
    sources: Источники
    lunar:
      title: Как на самом деле устроен лунный календарь
      months_html: "<p>Лунный месяц начинается в новолуние и длится до следующего. Это примерно 29,53 суток, поэтому в месяце либо <strong>29</strong>, либо <strong>30</strong> дней — никогда 31 и никогда фиксированная длина, которую можно заучить. Двенадцать таких месяцев дают около 354 дней, почти на одиннадцать меньше солнечного года.</p><p>В этой недостаче — вся суть. Если её не исправлять, новый год поедет назад по сезонам и 春節 в конце концов окажется летом.</p>"
      days_html: "<p>Дни лунного месяца не записывают голыми числами. Первая десятка получает приставку <strong>初</strong>: 初一, 初二, 初三 … до 初十. Дни с 11-го по 19-й идут через 十 — 十一, 十二 … 十九, — а двадцатый это 二十. С 21-го приставка <strong>廿</strong>: 廿一, 廿二 … 廿九, а тридцатидневный месяц заканчивается на 三十.</p><p>Значит, <strong>初五</strong> — это просто пятый день месяца. Когда говорят 正月初五, имеют в виду пятый день первого лунного месяца: без года и без всякой привязки к григорианской дате.</p>"
      drift_html: "<p>Поэтому 春節 никогда не выпадает на одну и ту же григорианскую дату два раза подряд. Лунный год примерно на одиннадцать дней короче солнечного, так что новый год каждый раз съезжает раньше, — а когда съедет слишком далеко, вставляется целый лишний месяц, и он снова отскакивает назад. На отрезке 1950–2050 он гуляет между 21 января и 20 февраля.</p>"
      leap_html: "<p>Поправка — это <strong>високосный месяц</strong>, 閏月. Примерно семь раз в девятнадцать лет вставляется дополнительный месяц, и в таком году их тринадцать, а дней около 384. Его не приписывают в конец — его вставляют после существующего месяца, и он забирает его номер: високосный после шестого называется 閏六月, и в таком году есть и 六月, и 閏六月.</p><p>Какой месяц удвоится, решает солнце, а не правило, которое можно продекламировать: это зависит от того, куда попадают 24 солнечных сезона. В 2025 году был 閏六月, в 2033-м будет редкий 閏十一月.</p>"
      terms_html: "<p>Два праздника здесь вообще не лунные. <strong>清明</strong> и <strong>冬至</strong> — это <em>солнечные сезоны</em>, точки на годовом пути солнца, и поэтому в григорианском календаре они стоят почти неподвижно, пока всё лунное блуждает.</p>"
    minguo:
      title: Конвертер годов 民國
      gregorian: Григорианский год
      minguo: Год 民國
      note: "%{gregorian} — это 民國%{minguo}."
      before: Отсчёт 民國 начинается с 1912 года, так что здесь года 民國 ещё нет.
      explain_html: "<p>Официальные документы в Тайване датируют по эре <strong>民國</strong>, отсчёт которой идёт от основания Китайской Республики в <strong>1912</strong> году. Этот год — 民國1, поэтому арифметика проста: <strong>民國 = григорианский − 1911</strong>, и работает она в обе стороны. Вы встретите такую запись в удостоверениях личности, на билетах, чеках, в договорах и сроках годности — обычно в виде 114.09.28, а не 2025.</p>"
    converter:
      title: Конвертер лунной и григорианской даты
      to_gregorian: Лунная дата → григорианская
