        title: "Сянци, китайские шахматы"
        body: "Фигуры стоят на пересечениях линий, а не в клетках. Генерал и советники не покидают дворца, слон не пересекает реку, конь блокируется соседней фигурой, а пушка бьёт только через лафет. Пат в сянци — поражение, а вечный шах запрещён."
        note: "У красных и чёрных одни и те же фигуры записаны разными иероглифами."
