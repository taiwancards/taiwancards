        title: "Китайский официальный маджонг"
        body: "Спортивные правила, принятые в Китае в 1998 году. Игра на тринадцать плиток, 81 комбинация и порог в восемь очков: рука дешевле выигрышем не считается. Единица счёта здесь не тай, а фань, и множество комбинаций тайваньскому столу просто неизвестно."
