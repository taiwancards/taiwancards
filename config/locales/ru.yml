  mobile_hint:
    title: С телефона — можно, но не всё
    body: >-
      Минутка правды: приложение я писал прежде всего для себя, а сам занимаюсь процентов на девяносто
      с ноутбука и только карточки листаю с телефона. Поэтому на подгонку каждого раздела под все размеры экранов
      времени ушло немного, и где-то с телефона может быть криво — на ваш страх и риск. Карточки, словарь
      и чтение теории работают нормально, а тренажёры, письмо, произношение и разбор текстов рассчитаны на
      компьютер. Всерьёз учиться лучше там.
    dismiss: Хорошо, буду знать
