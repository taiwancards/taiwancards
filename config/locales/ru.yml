        meaning_two: "Имя говорит сразу о двух вещах — %{first}, %{second}."
        meaning_one: Оба знака тянут в одну сторону — %{first}, — и от этого имя выходит цельным.
        meaning_single: "Смысл держит знак %{text} — %{first}; второй взят ради звучания."
        meaning_solo: "Один знак, и он про %{first}: коротких имён в Тайване меньше, поэтому такое запоминают."
        meaning_plain: >-
          Знаки подобраны не по словарю: тайванец прочитает такое имя как настроение, а не как фразу.
        sound_common: >-
          Мелодия %{tones} — одна из самых обычных для тайваньского имени, язык берёт её без запинки.
        sound_rare: >-
          Тоновый рисунок %{tones} встречается нечасто: имя прозвучит своим, но выговаривается легко.
        sound_repeat: Два одинаковых тона подряд в Тайване обходят стороной — вместе звучит глуховато.
        pair_strong: >-
          Эти два знака действительно ставят рядом: в реестре пара встречается заметно чаще, чем дала бы
          случайность, так что имя услышат как настоящее, а не как собранное по частям.
        pair_fresh: >-
          Готового сочетания в реестре нет, поэтому имя прочтут как своё, а не как взятое из списка.
        era_match: Оба знака в ходу у вашего поколения — имя не прозвучит ни как у дедушки, ни как у младенца.
        era_older: >-
          Знаки старше вашего поколения: имя отдаёт временем родителей, а это в Тайване слышат как
