    system_title: Разряды идут по четыре, а не по три
    system_body: Европейские языки режут число по тысячам, мандарин — по десяткам тысяч. Поэтому «миллион» — это не отдельное слово, а 一百萬, сто раз по 萬. Привыкнуть проще всего, если мысленно ставить пробел через каждые четыре цифры справа, а не через три.
