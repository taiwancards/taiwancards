    nav: 日本語との対応
    title: 日本語との対応
    lede: 字形・読み・意味のそれぞれについて、日本語の知識がどこまでそのまま使えるかをまとめました。順番に学ぶページではなく、必要なところを引くための一覧です。
    sections:
      shapes: 字形
      readings: 読み
      meanings: 意味
    levels:
      all: すべて
      level: "レベル%{level}"
    legend_html: "ペアは左が台湾の字、右が日本の字です（%{example}）。"
    character:
      heading: 日本の漢字では
      taiwan: 台湾
      japan: 日本
      both: 台湾・日本
      same: 日本と同じ形です。
      differs: 日本の新字体とは形が違います。
      small: 違いは細部だけです。
      unused: 日本語ではふつう使わない字です
      unused_hint: 常用漢字にも人名用漢字にも入っていません。華語で新しく覚える字です。
      "on": 音読み
      pattern_html: "%{pattern}のパターン"
      guide: 字形の違いの一覧へ
    pattern:
      named_html: "%{from}→%{to}"
      part_html: "%{from}の部分"
    word:
      note_label: 日本語との違い
    shapes:
      summary: "台湾の常用字とレベル付きの字、あわせて%{total}字のうち、日本と同じ形が%{same}字、形が違う字が%{differs}字、日本語では使わない字が%{unused}字です。日本語で使わない字の一覧は、レベル付きの字だけを示します。"
      summary_level: "レベル%{level}の%{total}字のうち、日本と同じ形が%{same}字、形が違う字が%{differs}字、日本語では使わない字が%{unused}字です。"
      patterns_title: 部品のパターン
      patterns_lede: "形の違いの多くは、部品がひとつ置き換わっただけです。%{patterns}のパターンを知っておけば%{covered}字をまとめて見分けられます。パターンに入らない違いは%{singletons}字です。"
      singletons_title: 一字ずつの違い
      singletons_lede: パターンにまとまらない違いです。日本の新字体が大きく簡略化した字が中心です。
      small_badge: 細部のみ
      small_title: 細部だけの違い
      small_lede: 点や画がひとつ違う程度の差です。読むときに迷うことはほとんどないので、覚える必要はありません。
      unified: 「辶」「飠」「糸」のように書き方の細部だけが違う部品は、同じ字として扱っています。
      unused_title: 日本語では使わない字
      unused_lede_html: "常用漢字にも人名用漢字にも入っていない字です。%{examples}のような文法の字が多く、日本語の知識が使えない、本当の意味での新出字です。"
      empty: このレベルには該当する字がありません。
    readings:
      lede: "音読みと華語の読みは、どちらも昔の中国語の発音から来ています。そのため音読みから華語の読みをかなり予測できます。ここの数字は、レベル付きの字のうち日本語でも使う%{count}字について、台湾での主な読みと代表的な音読みを一つずつ照らし合わせて数えたものです。"
      method: 数え方：読みが複数ある字も、台湾の見出しの読みと代表的な音読みを一つずつだけ使い、すべての字を同じ方法で数えています。
      rule: 規則
      tendency: 傾向
      share: "%{hits}／%{total}字・%{percent}"
      examples: 例
      exceptions: 例外
      open: 鼻音なし
      nasals_title: "-n か -ng か"
      nasals_lede: 華語の読みが鼻音で終わる字なら、音読みの語尾で -n と -ng を見分けられます。「案内（あんない）」の「ん」が -n、「案外（あんがい）」の「ん」が -ng の位置です。
      nasal_n: 音読みが「ン」で終わる → -n
      nasal_long: 音読みが「ウ」「イ」で終わる → -ng
      endings_title: 音読みの語尾から
      endings_lede: 鼻音で終わるかどうかがまだ分からないときの手がかりです。「ン」や入声の語尾は確実ですが、「ウ」「イ」で終わる音読みは -ng になるとは限りません。
      long_vowel_note: "「ウ」「イ」で終わる音読みから言えるのは、華語の読みが鼻音で終わる場合に -ng だということだけです。鼻音のない読みになる字も4割ほどあります。"
      endings:
        n: 「ン」で終わる → -n
        ou: 「オウ」型（コウ・ソウ・トウなど）→ -ng
        you: 「ョウ」型（ショウ・キョウなど）→ -ng
        uu: 「ウウ」型（クウ・フウ・ツウなど）→ -ng
        yuu: 「ュウ」型（シュウ・キュウなど）→ -ng
        ei: 「エイ」型（セイ・テイなど）→ -ng
        ai: 「アイ」型（カイ・タイなど）→ 鼻音なし
        ui: 「ウイ」型（スイ・ルイなど）→ 鼻音なし
        k: 「ク」「キ」で終わる（入声）→ 鼻音なし
        t: 「ツ」「チ」で終わる（入声）→ 鼻音なし
      entering_title: 入声の字と声調
      entering_lede: 「ク・キ・ツ・チ」で終わる音読みは、昔の中国語の入声（-k や -t で終わる音節）の名残です。華語ではこの子音が消えて母音で終わり、声調は四つに散らばりました。声調は音読みからは予測できません。
      tone: "第%{tone}声"
      voicing_title: 濁音と第一声
      voicing_lede: "音読みが濁音（ガ行・ザ行・ダ行・バ行）で始まる字は、華語で第一声になることがまれです。第一声の割合は、濁音で始まる字で%{voiced}、清音で始まる字で%{plain}です。"
      initials_title: 頭の子音
      initials_lede: 音読みの最初の音と、華語の声母（頭の子音）の対応です。上位二つで9割を超える行は規則、そうでない行は傾向として示します。
      row: "%{row}行"
      subrow_ji: ジ・ジャ・ジュ・ジョ
      subrow_ni: ニ・ニャ・ニュ・ニョ
      zero: 子音なし
      characters: "%{count}字"
    meanings:
      lede: 日本語にもある形の単語でも、意味や使い方がずれるものがあります。まず本当の意味、次に日本語との違いを示します。
      kinds:
        same: 日本語と同じ
        shift: 意味がずれる
        new: 日本語にない語
      counts: "日本語と同じ%{same}語・意味がずれる%{shift}語・日本語にない語%{new}語"
      pending: この一覧は準備中です。レベルごとに順次追加しています。
      empty: このレベルには、まだ該当する単語がありません。
      japanese: 日本語では
    filter:
      label: 日本語との関係
      all: すべて
