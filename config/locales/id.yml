      heading: Kenapa aplikasi ini ada
      body: Saya ahli bahasa, saya tinggal di Taiwan, dan inilah aplikasi yang terus saya dambakan selama belajar bahasa ini di sini. Aplikasi ini lahir dari tesis magister di bidang linguistik komputasional dan banyak latihan sehari-hari yang biasa saja — papan nama, menu, bertanya lagi kalau saya tidak menangkapnya. Tidak ada iklan dan tidak akan pernah ada, dan itu separuh alasan aplikasi ini ada.
