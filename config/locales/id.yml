    id: Bahasa Indonesia
  language_step:
    heading: Pilih bahasa aplikasi dan pelajarannya
    edition: "Bukan terjemahan kata per kata dari bahasa lain, melainkan edisi tersendiri. Bahasa Mandarin Taiwan dijelaskan dari sudut pandang penutur bahasa Indonesia: bunyi, tata bahasa, dan budaya."
    later: Kamu bisa mengubahnya nanti di menu.
