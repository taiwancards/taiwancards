      welcome:
        subject: Selamat datang di TaiwanCards
        preheader: Kamus, kartu, tata bahasa, bacaan, dan pelafalan — satu sistem.
        title: Selamat datang!
        body:
          - "TaiwanCards menyatukan semua yang kamu perlukan untuk belajar bahasa Mandarin Taiwan. Kamus, kartu, tata bahasa, bacaan, dan pelafalan dibangun sebagai satu sistem, bukan ditambal dari berbagai sumber: kata dari sebuah pelajaran adalah entri kamus yang sama, kartu yang sama, dan audio yang sama."
          - Jadi kamu tidak perlu kamus terpisah, Anki, dan setumpuk aplikasi latihan. Progresmu terkumpul di satu tempat, dan pengulangan sudah tahu apa saja yang kamu pelajari.
        features:
          - title: Kartu
            text: Setiap kata muncul lagi tepat saat kamu hampir lupa. Ikuti metode kami, bersiap untuk TOCFL, atau bawa kata-kata dari kelasmu.
          - title: Kamus
            text: Hanzi tradisional, zhuyin, dan bacaan khas Taiwan, audio penutur asli, serta contoh dari teks nyata.
          - title: Pelafalan
            text: Ucapkan sebuah kata dengan suara keras dan dapatkan masukan tentang nada dan bunyinya.
          - title: Tata bahasa dan bacaan
            text: Pelajaran tata bahasa, frasa sehari-hari, dan teks berjenjang per level — dari kata pertamamu sampai tingkat lanjut.
        outro: Halaman utama menunjukkan dari mana kamu mulai hari ini — biasanya cukup beberapa menit.
        button: Buka TaiwanCards
        why: Kamu menerima email ini karena kamu membuat akun TaiwanCards. Ini satu-satunya email sambutan — setelah ini kami hanya menulis kalau ada kartu yang perlu diulang, dan tidak lebih dari sekali sehari. Hari dan jam pengingat bisa kamu pilih sendiri di profilmu.
      first_cards:
        subject: Sesi pertamamu hanya beberapa menit
        preheader: "Halaman utama menunjukkan titik mulaimu: dari bunyi, atau langsung ke kata-kata sesuai levelmu."
        title: Siap untuk beberapa menit?
        body: "Akunmu sudah siap, dan sesi pertamanya singkat. Halaman utama menunjukkan dari mana sebaiknya kamu mulai: dari bunyi, atau langsung ke kata-kata sesuai levelmu."
