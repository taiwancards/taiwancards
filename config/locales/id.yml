    how_title: Cara penilaiannya
    how_body: "Setiap suku kata dalam kalimat bernilai satu poin. Hanzi yang benar, atau suku kata dengan nada yang benar, mendapat poin penuh; suku kata tanpa nada mendapat tiga perempat, dan yang nadanya salah mendapat setengah. Hanzi lain yang bunyinya sama juga mendapat setengah: telingamu sudah menangkapnya, salahnya hanya di tulisan. Nada dihitung benar baik kamu menulis bentuk kamus maupun bentuk yang terdengar dalam ucapan, jadi 你好 boleh ditulis nǐ hǎo atau ní hǎo. Tulis sesukamu, bahkan campur-campur: hanzi, pinyin dengan tanda nada atau angka, zhuyin. Suku kata berlebih menurunkan nilai."
