    lunar:
      title: Cara kerja kalender lunar yang sebenarnya
      months_html: "<p>Bulan lunar dimulai saat bulan baru dan berlangsung sampai bulan baru berikutnya. Jaraknya sekitar 29,53 hari, jadi satu bulan lamanya <strong>29</strong> atau <strong>30</strong> hari — tidak pernah 31, dan panjangnya tidak tetap sehingga tidak bisa dihafal. Dua belas bulan seperti itu berjumlah kira-kira 354 hari, sekitar sebelas hari lebih pendek daripada satu tahun matahari.</p><p>Selisih itulah inti ceritanya. Kalau tidak dikoreksi, tahun baru akan mundur terus melewati musim-musim, dan 春節 lama-lama jatuh di musim panas.</p>"
      days_html: "<p>Tanggal dalam bulan lunar tidak ditulis sebagai angka saja. Sepuluh hari pertama memakai awalan <strong>初</strong>: 初一, 初二, 初三 … sampai 初十. Tanggal 11 sampai 19 memakai 十 — 十一, 十二 … 十九 — dan 二十 adalah tanggal dua puluh. Mulai tanggal 21 awalannya <strong>廿</strong>: 廿一, 廿二 … 廿九, dan bulan yang 30 hari berakhir pada 三十.</p><p>Jadi <strong>初五</strong> hanya berarti tanggal lima. Kalau seseorang bilang 正月初五, maksudnya tanggal lima bulan pertama kalender lunar — tanpa tahun, dan tanpa tanggal Masehi tertentu.</p>"
      drift_html: "<p>Inilah sebabnya 春節 tidak pernah jatuh di tanggal Masehi yang sama dua tahun berturut-turut. Tahun lunar sekitar sebelas hari lebih pendek daripada tahun matahari, jadi tahun baru makin maju setiap tahun — dan kalau sudah maju terlalu jauh, satu bulan tambahan disisipkan sehingga tahun baru kembali jatuh lebih lambat. Dalam rentang 1950–2050, tanggalnya berpindah-pindah antara 21 Januari dan 20 Februari.</p>"
      leap_html: "<p>Koreksinya berupa <strong>bulan kabisat</strong>, 閏月. Kira-kira tujuh kali dalam setiap sembilan belas tahun, satu bulan tambahan disisipkan, sehingga tahun itu punya tiga belas bulan dan sekitar 384 hari. Bulan itu tidak ditaruh di akhir tahun — ia disisipkan setelah salah satu bulan dan memakai nomor bulan tersebut: bulan kabisat setelah bulan keenam disebut 閏六月, dan tahun itu punya 六月 sekaligus 閏六月.</p><p>Bulan mana yang digandakan ditentukan oleh matahari, bukan oleh aturan tetap yang bisa dihafal: semuanya bergantung pada letak 24 terma matahari. Tahun 2025 punya 閏六月; tahun 2033 punya 閏十一月 yang langka.</p>"
      terms_html: "<p>Dua hari raya di sini sama sekali bukan hari raya lunar. <strong>清明</strong> dan <strong>冬至</strong> adalah <em>terma matahari</em> — titik-titik pada lintasan tahunan matahari — karena itu tanggal Masehinya hampir tidak bergeser, sementara semua yang lunar berpindah-pindah.</p>"
    minguo:
      title: Konverter tahun 民國
      gregorian: Tahun Masehi
      minguo: Tahun 民國
      note: "%{gregorian} sama dengan 民國%{minguo}."
      before: Hitungan 民國 dimulai pada 1912, jadi tahun ini belum punya tahun 民國.
      explain_html: "<p>Dokumen resmi di Taiwan diberi tanggal menurut era <strong>民國</strong>, yang dihitung sejak berdirinya Republik Tiongkok pada <strong>1912</strong>. Tahun itu adalah 民國1, jadi rumusnya sederhana: <strong>民國 = Masehi − 1911</strong>, dan berlaku ke dua arah. Kamu akan menemuinya di kartu identitas, tiket kereta, struk belanja, kontrak, dan tanggal kedaluwarsa, biasanya ditulis 114.09.28, bukan 2025.</p>"
