  tones:
    names:
      "1": Nada pertama
      "2": Nada kedua
      "3": Nada ketiga
      "4": Nada keempat
    segments_title: Bukan hanya nada
    segments_lede: Dua perbedaan pada bunyinya sendiri — terdengar terus-menerus dan sebaiknya diketahui sejak awal.
    segments:
      retroflex: Bunyi retrofleks ㄓ ㄔ ㄕ (ujung lidah ditarik ke belakang) dalam ucapan orang Taiwan sering melebur dengan ㄗ ㄘ ㄙ. Dalam obrolan sehari-hari, 知 dan 資 bisa terdengar sama.
      nasal: Bagian akhir -ing dan -eng sebagian besar sudah melebur dengan -in dan -en. Ini ciri yang sudah mapan, bukan kecerobohan.
    practice_cta: Buka latihan nada →
    chart:
      taipei: Taipei
      reference: Beijing
      aria: "%{tone}: kontur nada"
      taipei_note: Beginilah bunyi nada di Taiwan. Ada beberapa perbedaan dari norma di Tiongkok; semuanya dirinci di bawah.
      reference_note: Norma di Tiongkok, sebagai pembanding. Angkanya adalah notasi preskriptif yang lazim.
      scale: "Lima tingkat tinggi nada sebagai patokan, dari rendah ke tinggi. Baca setiap garis dari kiri ke kanan: dari mana ia mulai dan ke mana ia bergerak. Untuk Taipei sengaja tidak diberi angka — belum ada notasi preskriptif yang mapan untuk pelafalan Taiwan, dan kami tidak mau mengarangnya."
    hacks_title: Yang benar-benar membantu
    hacks:
      low: Nada ketiga sebenarnya hanya nada rendah, kebalikan nada pertama. Lekukan turun-naik yang dalam hanya muncul kalau suku katanya berdiri sendiri atau di akhir ujaran; di Taiwan naiknya hampir tidak pernah diucapkan. Jangan berusaha menggambar tanda centang — cukup turun ke bawah dan bertahan di sana, seperti “Hmm…” yang ragu.
      pair: "Anggap nada pertama dan ketiga sebagai pasangan: satu tinggi datar, satu rendah datar. Ini lebih mudah dipegang daripada “datar lawan melengkung”."
      start: "Nada kedua dan ketiga paling sering tertukar. Petunjuknya bukan di mana nada itu berakhir, melainkan di mana ia mulai: nada kedua mulai dari tengah lalu naik, nada ketiga mulai rendah dan tetap rendah."
      after_third: "Kalau nada kedua datang sesudah nada ketiga, posisi rendah nada ketiga itulah ancang-ancangmu: kamu sudah di bawah, dan nada kedua langsung naik dari sana. Jangan naik dulu ke tengah di antara kedua suku kata — justru itulah yang memutus sambungannya."
      fourth: "Nada keempat biasanya paling mudah: ini intonasi perintah yang tegas, tajam dari atas ke bawah, seperti “Awas!” atau “Bukan!”. Kalau terdengar terlalu lembek, mungkin kamu memulainya kurang tinggi."
      relative: Tinggi nada itu relatif, bukan mutlak. Kelima tingkatnya diukur di dalam rentang suaramu sendiri, bukan terhadap not musik. Suara yang rendah bukan halangan untuk nada.
      neutral: "Suku kata bernada netral tidak punya tinggi nada sendiri — ia meminjamnya dari suku kata sebelumnya. Sesudah nada pertama ia jatuh di tengah, sesudah nada keempat ia jatuh rendah. Tidak ada yang perlu dihafal tersendiri: hasilnya akan benar kalau nada sebelumnya benar."
    title: Nada
    lede: Bagian keempat fonetik, yang tanpanya tiga bagian lain tidak jalan. Apa itu nada, bagaimana nada berperilaku di Taiwan, dan mengapa kamu tidak bisa melewatkannya begitu saja.
    why_title: Nada bukan hiasan
    why_body: Dalam bahasa Mandarin, nada adalah bagian dari suku kata, sama seperti konsonan dan vokalnya. Tanpa nada, bahasa ini hanya punya sekitar empat ratus suku kata yang bisa dibedakan; dengan nada, jumlahnya sekitar seribu tiga ratus. Kalau nada dibuang, dua pertiga pembeda yang tersedia bagimu hilang, dan kata yang terdengar sama dari mulutmu jadi berlipat ganda.
    myth_title: Tentang mitos “nanti juga paham dari konteks”
    myth_body: Konteks memang membantu, dan kata tidak pernah muncul di ruang hampa. Tetapi konteks hanya membetulkan apa yang sudah didengar pendengar; konteks tidak menggantikan pendengaran. Penutur asli menangkap nada secara otomatis, sebelum menafsirkan apa pun, dan nada yang salah tidak diterima sebagai nada yang kosong. Ia diterima sebagai nada lain — jadi ia aktif menyesatkan, bukan sekadar kurang jelas.
    cannot_title: Tidak bernada itu mustahil
    cannot_body: Ini soal teknis, bukan soal motivasi. Setiap suku kata yang kamu ucapkan punya tinggi nada dan gerak nada — kalau tidak, suku kata itu tidak akan berbunyi sama sekali. Pertanyaannya hanya apakah konturnya cocok dengan yang seharusnya. Melewatkan latihan nada tidak membuat ucapanmu netral; hasilnya ucapan dengan nada acak. Bagi telingamu nada itu mungkin tidak ada, tetapi bagi pendengarmu nada itu selalu ada.
    cumulative_title: Sebenarnya ini bukan soal pasangan minimal
    cumulative_body: "Nada biasanya diperkenalkan lewat 媽 麻 馬 罵, sehingga kesannya risikonya terbatas pada tabrakan langka. Dalam praktik, kerusakannya menumpuk, bukan per kata: dengan nada yang terus-menerus salah, tiap kata mungkin masih bisa ditebak, tetapi satu kalimat utuh tidak, karena pendengar harus mencoba berbagai kemungkinan lebih cepat daripada kamu berbicara."
    four_title: Empat nada
    four_lede: Angka di dalam kurung adalah notasi tinggi nada lima tingkat dari Chao, dari 1 (rendah) sampai 5 (tinggi).
    tones:
      t1:
        name: Pertama — tinggi datar
        contour: "55"
        zhuyin: tanpa tanda
        note: Ditahan di satu ketinggian, seperti satu not yang dinyanyikan panjang. Zhuyin sama sekali tidak menandainya — tidak adanya tanda itulah nada pertama.
      t2:
        name: Kedua — naik
        contour: "35"
        zhuyin: ˊ
        note: Bergerak ke atas, mirip “Hah?” atau “Masa?” yang terkejut.
      t3:
        name: Ketiga — rendah
        contour: 214 / 21
        zhuyin: ˇ
        note: Buku pelajaran menggambarnya sebagai lekukan yang naik lagi, tetapi naiknya kebanyakan hanya terdengar pada suku kata yang berdiri sendiri atau di akhir ujaran. Dalam ucapan yang mengalir, nada ketiga biasanya tetap rendah dan tidak naik kembali.
      t4:
        name: Keempat — turun
        contour: "51"
        zhuyin: ˋ
        note: Tajam dari atas ke bawah, pendek dan tegas.
    neutral_title: Yang kelima, atau tepatnya nada netral
    neutral_body: "Sebenarnya ini bukan nada kelima, melainkan ketiadaan nada sendiri: suku katanya kehilangan konturnya, memendek, dan mengambil tinggi nada dari suku kata sebelumnya — ringan seperti “-lah” atau “-nya” yang tidak bertekanan. Zhuyin menandainya dengan titik ˙ dan, berbeda dengan pinyin, menaruhnya SEBELUM suku kata: ˙ㄉㄜ. Tidak ada gunanya mengujinya dalam latihan — di telinga, ini hanya suku kata yang sangat pendek dan tidak bertekanan."
    neutral_taiwan: "Dan inilah perbedaan penting di Taiwan: nada netral jauh lebih jarang di Taiwan daripada dalam norma yang dipakai di Tiongkok. Banyak kata yang suku kata keduanya dilemahkan di Tiongkok tetap mempertahankan nada penuhnya di sini."
    taiwan_title: Bedanya nada di Taiwan
    taiwan_body: Perbedaannya bukan pada sistemnya — nadanya tetap empat yang sama — melainkan pada cara pengucapannya.
    taiwan_points:
      range: Rentang nadanya secara keseluruhan lebih rendah dan lebih sempit. Ucapan orang Taiwan muat dalam rentang tinggi nada yang lebih kecil daripada ucapan di Tiongkok, karena itulah nadanya terdengar terkendali, bukan datar.
      second: Nada kedua tidak naik setinggi itu. Ia juga sering mendapat sedikit lekukan di awal, sehingga bentuknya mirip nada ketiga versi preskriptif.
      third: Nada ketiga tidak naik kembali dari wilayah rendah yang agak serak. Kontur 214 yang penuh praktis tidak diucapkan di Taiwan.
      neutral: Nada netral lebih jarang muncul, dan suku kata terakhir umumnya tetap mempertahankan nadanya sendiri.
      erhua: Erhua — akhiran 兒 — sangat jarang dalam bahasa Mandarin Taiwan.
      merge: Di telinga, nada kedua dan ketiga lebih berdekatan daripada dalam lafal penyiar. Ini normal, bukan cacat bicara.
    sandhi_title: Dua aturan yang mengubah nada
    sandhi_lede: "Yang ditulis satu nada, yang diucapkan nada lain. Nada tertulisnya tidak berubah: kamus, zhuyin, dan pinyin tetap memakai nada asalnya."
    third_title: Nada ketiga sebelum nada ketiga
    third_body: Kalau dua nada ketiga berurutan, yang pertama diucapkan sebagai nada kedua. 你好 ditulis ㄋㄧˇ ㄏㄠˇ, tetapi terdengar ní hǎo. Aturan ini berlaku pada apa yang diucapkan, bukan pada bentuk kamus, jadi juga berlaku melintasi batas kata.
    third_three: "Kalau ada tiga nada ketiga berturut-turut, hasilnya bergantung pada pengelompokan maknanya. 我很好 biasanya diucapkan wó hén hǎo, karena 很好 lebih erat menyatu. Tidak ada yang perlu dihafal: aturannya berlaku pada suku kata mana pun yang memang kamu kelompokkan."
    yi_title: 一 dan 不
    yi_body: Nada dua suku kata ini bergantung pada suku kata yang mengikutinya.
    yi_rules:
      yi_alone: "一 yang berdiri sendiri, di akhir, dan dalam bilangan urutan — nada pertama: yī, 第一 dì yī."
      yi_before4: "一 sebelum nada keempat — nada kedua: 一定 yí dìng, 一樣 yí yàng."
      yi_other: "一 sebelum nada pertama, kedua, atau ketiga — nada keempat: 一天 yì tiān, 一年 yì nián, 一起 yì qǐ."
      bu_before4: "不 sebelum nada keempat — nada kedua: 不是 bú shì, 不要 bú yào."
      bu_other: "不 di posisi lain — nada keempat: 不好 bù hǎo, 不能 bù néng."
