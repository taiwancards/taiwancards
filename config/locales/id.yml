    group_lede:
      learn: Antrean harianmu, dekmu, pembaca teks, tes penempatan, dan rencana ujian.
      dictionary: Hanzi, kata, kalimat korpus, idiom, kata penggolong, dan daftar per level.
      language: Zhuyin dan bunyinya, nada, struktur hanzi, angka, tata bahasa, bacaan khas Taiwan.
      practice: Latihan bunyi dan nada, pelafalan, menulis tangan, mengetik, Cangjie, dan simulasi ujian.
      taiwan: Kosakata sehari-hari, frasa yang benar-benar diucapkan orang, MRT Taipei, dan kalender.
      settings: Profilmu, statistik, preferensi tampilan, dan halaman bantuan.
    item_lede:
      course: Enam puluh pelajaran dari “halo” sampai B1 — dialog, kata, tata bahasa, latihan.
      path: "Peta jalanmu: apa yang dikerjakan secara berurutan, dan kamu sedang di langkah mana."
      desk: Layar harian — berapa yang perlu diulang, berapa yang baru, dan satu tombol ke tempat yang tepat.
      desks: Dekmu sendiri dari teks, file, lagu, atau pelajaran, dengan grup dan tautan berbagi.
      reader: Tempel teks apa saja, dan teks itu dipecah menjadi kata, dengan zhuyin di atas kata yang belum kamu kenal.
      graded: Teks berlevel untuk dibaca sampai habis tanpa berhenti membuka kamus.
      placement: Tes adaptif yang menentukan level awalmu dan menandai apa yang sudah kamu kuasai.
      plan: Sebutkan level TOCFL dan tanggalnya, dan jatah materi baru per hari langsung dihitung.
      triage: Geser sekumpulan kata ke “sudah tahu” dan “mau dipelajari” tanpa membuka kartu.
      textbook: Ringkasan pelajaran dari buku, dengan uraian dan tanda “pelajaran sudah dikuasai”.
      textbook-phrases: Latihan frasa dari buku — substitusi pola, diucapkan keras-keras sambil berpacu dengan waktu.
      stories: "Ruang baca: teks utuh dengan uraian yang sama seperti di pembaca teks."
      exams: Soal TOCFL asli dengan kunci jawaban, PDF, dan audionya.
      radicals: 214 radikal Kangxi — jumlah goresan, arti, dan kata-kata tempat radikal itu muncul.
      characters: "Hanzi selengkapnya: bacaan, goresan, animasi penulisan, etimologi, kata menurut bacaan."
      dict: "Kata dan kolokasi: arti bernomor, tesaurus, kata penggolong, contoh dari korpus."
      sentences: Korpus kalimat, disaring menurut level, ragam bahasa, dan ketepatan levelnya.
      chengyu: Idiom 成語 dipilah menurut nada, jenis, dan tingkat kesulitan.
      liangci: "Kata penggolong: berpasangan dengan apa, contoh nyata, dan permainan agar cepat melekat."
      tbcl: Daftar kata TBCL dalam tujuh tingkat, dengan progresmu ditandai.
      tocfl: Daftar kata TOCFL per level, dengan progresmu ditandai.
      practice-zhuyin: Dari apa suku kata tersusun — konsonan awal, bagian akhir, nada, dan bunyi yang sering tertukar.
      syllables: "Tabel lengkap suku kata Mandarin: kombinasi mana yang benar-benar ada."
      tones: Empat nada dan nada netral, apa yang berbeda di Taiwan, dan aturan perubahan nada.
      hanzi: "Bagaimana hanzi disusun: 六書, komponen, deret komponen bunyi, urutan goresan."
      cangjie-lessons: Buku pelajaran Cangjie — empat puluh pelajaran, dari tombol tunggal sampai aturan pemecahan, dengan latihan dan daftar hanzi.
      practice-numbers: Angka, uang, tanggal, tahun Minguo, dan jebakan seputar 零 dan 兩.
      grammar: 582 pola menurut level, masing-masing dengan uraian, contoh dari korpus, dan topik terkait.
      zhuci: "Partikel 語氣詞: apa yang dilakukan 吧, 啊, 呢, dan 嘛 pada kalimat — mirip kan, dong, dan sih."
      variants: Di mana Taiwan berbeda dari Tiongkok — bacaan, bentuk hanzi, kata.
      names: Bagaimana nama Taiwan disusun, dengan jumlah pemakai tiap marga dari catatan kependudukan.
      practice-zhuyin-trainer: "Zhuyin lewat pendengaran, per kelompok: kelompok berikutnya menunggu sampai kamu menguasai yang ini."
      practice-drill: Zhuyin lawan pinyin dengan cepat; simbol yang masih lemah lebih sering muncul.
      tones-drill: Nada lewat pendengaran dari rekaman studio, suara laki-laki dan perempuan bergantian.
      pronunciation: Rekam lewat mikrofon dan lihat, suku kata demi suku kata, di mana nada dan bunyimu meleset.
      writing: Tulis hanzi dari ingatan tanpa petunjuk; hasilnya masuk ke aspek menulis.
      practice-typing: Tata letak papan ketik zhuyin Taiwan, sampai jarimu hafal sendiri.
      cangjie: "Input Cangjie: pecah hanzi menjadi komponen dan ketik kodenya."
      mock: Simulasi TOCFL — format biasa, bergambar, dan audio, bisa diulang persis dari seed.
      everyday: "Kosakata per situasi: makanan, minuman, transportasi, urusan dokumen, cuaca, bahasa gaul."
      phrases: 186 pola dalam 17 situasi, termasuk separuh yang cukup kamu pahami saja.
      notices: Papan dan pengumuman yang kamu temui di jalan dan di transportasi umum.
      metro: Peta MRT Taipei, setiap stasiun dengan arti dan bacaannya.
      calendar: Kalender lunar, festival, kata-kata musiman, dan dua pengonversi tanggal.
      medicine: Cara menyampaikan keluhanmu di apotek dan rumah sakit.
      culture: Catatan singkat tentang cara hidup di Taiwan berjalan, dari jadwal sif sampai struk belanja dan festival.
      games: Permainan papan dalam bahasa Mandarin Taiwan — istilah, aturan, dan obrolan di meja.
      profile: Bahasa, posisi zhuyin, tab di ponsel, level, ekspor, dan cadangan.
      progress: Ringkasan, riwayat pengulangan, kekuatan ingatan per aspek, dan daftar kartu bandel.
      settings-edit: Parameter FSRS-mu sendiri — retensi, interval maksimum, langkah belajar.
