      tabletop: Permainan papan dan kartu
    leads:
      mahjong:
        title: Mahjong Taiwan
        body: "Permainan enam belas ubin ini khas Taiwan, bukan milik seluruh dunia berbahasa Mandarin. Satu tangan terdiri dari lima set ditambah sepasang, poin pola dijumlahkan dalam satuan tai, bukan dikalikan, delapan ubin bunga punya nilai sendiri, dan untung-rugi semalam bergantung pada rentetan kemenangan bandar. Tidak ada batas minimum: tangan bernilai nol tai pun tetap menang."
        note: Ini soal istilah dan artinya, bukan buku aturan.
      mcr:
        title: Mahjong resmi Tiongkok
        body: "Aturan olahraga yang ditetapkan di Tiongkok pada tahun 1998. Tiga belas ubin, 81 pola, dan ambang delapan poin: tangan yang nilainya lebih rendah sama sekali tidak dihitung menang. Satuan poinnya fan, bukan tai, dan banyak polanya sama sekali tidak dikenal di meja mahjong Taiwan."
        note: Di turnamen, Taiwan memakai aturan ini; di rumah, aturannya sendiri.
      xiangqi:
        title: Xiangqi, catur Tionghoa
        body: Bidak diletakkan di titik potong garis, bukan di dalam kotak. Jenderal dan penasihat tidak pernah keluar dari istana, gajah tidak pernah menyeberangi sungai, kuda terhalang oleh bidak yang menempel di sebelahnya, dan meriam hanya bisa memakan dengan melompati satu bidak penyangga. Pat berarti kalah, dan skak terus-menerus dilarang.
        note: Pihak Merah dan Hitam menulis bidak yang sama dengan hanzi yang berbeda.
      go:
        title: Go, disebut juga weiqi
        body: "Go dan weiqi adalah satu permainan: 圍棋 berarti permainan mengepung, dalam bahasa Jepang namanya go, dan di Taiwan kedua nama itu dipakai. Batu diletakkan di titik potong dan tidak pernah dipindah, kelompok batu dengan dua mata sejati akan hidup, dan Taiwan menghitung dengan sistem area, bukan teritori."
        note: Banyak istilahnya berasal dari bahasa Jepang, tetapi ditulis dengan hanzinya sendiri.
      tabletop:
        title: Permainan papan, kartu, dan permainan jalanan
        body: "Permainan papan modern di Taiwan disebut 桌遊 dan dimainkan di kafe permainan yang tarifnya per jam. Di sampingnya ada kanon permainan kartu lokal: 大老二, 十三支, 心臟病, dan permainan jalanan 暗棋, xiangqi tertutup di setengah papan."
        note: "Di sini juga ada kata-kata yang kamu perlukan di meja mana pun: giliran, skor, chip, mengundi tempat duduk."
