id:
  audio:
    play: Putar
    source_whole: MOE — rekaman satu kata utuh
  privacy_google:
    heading: Masuk dengan Google dan datamu
    body: Akun dibuat dengan masuk lewat Google; tidak ada pendaftaran terpisah dan tidak ada kata sandi.
    signin: Saat kamu masuk dengan Google, TaiwanCards menerima alamat email dan nama di profilmu. Data ini dipakai untuk membuat akunmu dan menautkan progres belajarmu ke akun itu.
    drive: Jika kamu secara terpisah menekan “Cadangkan ke Google Drive”, aplikasi membuat satu file di Drive-mu berisi cadangan progres belajarmu, dan hanya bisa membaca serta menimpa file itu saja.
    limits: "Akses dibatasi pada cakupan drive.file: aplikasi hanya bisa menjangkau file yang dibuatnya sendiri. TaiwanCards tidak bisa melihat atau membuka file lain apa pun di Drive-mu. Cadangan tidak pernah dibuat otomatis — hanya saat kamu menekan tombolnya."
    privacy: Kebijakan privasi
    terms: Ketentuan penggunaan
    policy_before: Penggunaan informasi yang kami terima dari Google API mengikuti
    policy_name: Google API Services User Data Policy
    policy_after: beserta persyaratan Limited Use (penggunaan terbatas) di dalamnya. Data akun Google tidak pernah dipakai untuk iklan, tidak pernah dijual, dan tidak pernah dibagikan di luar yang dijelaskan di sini.
  privacy:
    title: Kebijakan privasi
    effective: "Berlaku sejak: 10 Oktober 2026"
    purpose:
      heading: Apa yang dilakukan aplikasi ini
      body: TaiwanCards adalah aplikasi web gratis tanpa iklan untuk belajar bahasa Mandarin Taiwan. Isinya kartu hafalan dengan pengulangan berjarak, kamus, latihan pelafalan, dan daftar kosakata. Aplikasi ini dikelola oleh satu pengembang independen, bukan oleh perusahaan.
    stored:
      heading: Data yang kami simpan
      items:
        - Alamat email, nama tampilan, dan bahasa antarmukamu.
        - "Tanpa kata sandi: akun dibuat lewat Google, dan aplikasi tidak pernah memintanya darimu."
        - "Data belajarmu: dek, kartu, riwayat pengulangan, progres, dan pengaturan latihan."
        - Rekaman latihan pelafalan dan hasil pengukurannya.
        - Log permintaan di server, disimpan demi keandalan dan untuk mencegah penyalahgunaan.
        - "Jumlah kunjungan halaman per hari secara agregat: halamannya, situs asal, jenis perangkat, negara, dan bahasa antarmuka. Semuanya dihitung oleh aplikasi sendiri, tanpa cookie, tanpa alamat IP, dan tanpa kaitan apa pun dengan akun."
    never:
      heading: Yang tidak kami lakukan
      items:
        - Kami tidak menjual atau menyewakan data pribadi.
        - Kami tidak menampilkan iklan dan tidak memasang pelacak iklan.
        - Kami tidak memakai layanan analitik pihak ketiga.
        - Kami tidak membuat profil tentang dirimu untuk keperluan apa pun selain menunjukkan progresmu sendiri.
    cookies:
      heading: Cookie
      body: "Hanya dua cookie yang dipakai, dan keduanya benar-benar diperlukan: cookie sesi bertanda tangan yang membuatmu tetap masuk, dan cookie yang mengingat bahasa antarmukamu. Tidak ada cookie iklan atau pelacak."
    emails:
      heading: Email
      items:
        - Catatan singkat tentang hal baru di aplikasi dikirim ke alamat email akunmu, paling banyak sekali atau dua kali sebulan. Tanpa iklan dan tanpa apa pun dari pihak ketiga.
        - "Pengingat kartu yang perlu diulang: paling banyak sekali sehari, hanya kalau ada kartu yang menunggu, pada jam kamu biasa belajar. Pengingat ini aktif secara bawaan dan bisa dimatikan dengan satu klik atau di profilmu, terpisah dari buletin."
        - Setiap email punya tautan berhenti berlangganan sekali klik, dan kamu juga bisa mematikan email di profilmu. Berhenti berlangganan tidak mengubah apa pun lainnya di akunmu.
        - "Kami mencatat kapan setiap email dikirim kepadamu, kapan kamu pertama kali membuka salah satu tautannya untuk kembali ke aplikasi dan berapa kali, serta kapan kamu berhenti berlangganan. Jika email tidak bisa terkirim, pesan galat dari server email disimpan. Pembukaan email tidak dilacak: email tidak berisi piksel pelacak, dan gambarnya dilampirkan langsung di email."
        - Email diserahkan kepada Resend, layanan pengiriman email, yang menerima alamatmu dan isi pesan hanya untuk mengirimkannya.
    donation:
      heading: Tombol donasi
      body: Halaman “Dukung situs ini” memuat tautan biasa ke Buy Me a Coffee, layanan dari pihak luar. Tidak ada apa pun yang dimuat dari mereka sampai kamu membuka tautannya, tidak ada data akun yang dikirim, dan donasi tidak pernah diwajibkan.
    where:
      heading: Tempat data disimpan
      body: Aplikasi dan basis datanya berjalan di Render di Singapura. Lalu lintas melewati Cloudflare, file audio disajikan dari Cloudflare R2, dan buletin dikirim lewat Resend, perusahaan Amerika Serikat, dari servernya di Jepang. Penyedia ini memproses data hanya untuk menjalankan layanan dan mengirimkan emailnya. Jika kamu memakai cadangan Google Drive, salinan itu tersimpan di akun Google-mu sendiri.
    retention:
      heading: Penyimpanan dan penghapusan
      body: Datamu disimpan selama akunmu ada. Kirim email ke alamat di bawah agar akun dan seluruh isinya dihapus; log server terhapus sendiri seiring waktu. Menghapus akun di sini tidak menyentuh file cadangan yang kamu buat di Google Drive-mu sendiri — file itu milikmu dan kamu sendiri yang menghapusnya.
    choices:
      heading: Pilihanmu
      items:
        - Baca kamus, tata bahasa, bagian referensi, dan semua tentang Taiwan tanpa akun sama sekali.
        - Cabut akses Google aplikasi ini kapan saja dari halaman izin akun Google-mu.
        - Minta salinan datamu, perbaikan data, atau penghapusan total.
    children:
      heading: Anak-anak
      body: Aplikasi ini tidak ditujukan untuk anak di bawah 13 tahun, dan kami tidak dengan sengaja membuatkan akun untuk mereka.
    changes:
      heading: Perubahan
      body: Jika kebijakan ini berubah, tanggal berlaku di atas ikut berubah.
    contact:
      heading: Kontak
      body: "Pertanyaan, permintaan data, dan permintaan penghapusan:"
    related:
      heading: Tautan terkait
  terms:
    title: Ketentuan penggunaan
    effective: "Berlaku sejak: 1 Maret 2025"
    service:
      heading: Layanan
      body: TaiwanCards adalah aplikasi web untuk belajar bahasa Mandarin Taiwan yang dikelola oleh satu pengembang independen. Aplikasi ini gratis, tanpa iklan, dan disediakan apa adanya. Fitur bisa berubah atau dihapus.
    account:
      heading: Akunmu
      items:
        - Berikan data akun yang benar dan jangan bagikan data masukmu kepada orang lain.
        - Satu akun untuk satu orang. Kamu bertanggung jawab atas semua yang terjadi di akunmu.
        - Kamu bisa menghapus akunmu kapan saja dengan mengirim permintaan ke alamat di bawah.
    use:
      heading: Penggunaan yang wajar
      items:
        - Jangan mencoba mengakses data, sistem, atau akun orang lain yang bukan hakmu.
        - Jangan mengambil isi situs secara massal, dan jangan membebaninya secara otomatis melebihi pemakaian belajar biasa.
        - Jangan mengunggah konten yang melanggar hukum atau berbahaya.
        - Hormati lisensi kamus, korpus, dan fon yang tercantum di halaman lisensi.
    yours:
      heading: Yang kamu buat
      body: Dek, catatan, dan progres yang kamu buat tetap milikmu. Kamu hanya memberi izin yang diperlukan untuk menyimpannya dan menampilkannya kembali kepadamu. Kamu bisa mengekspor progresmu kapan saja, termasuk ke Google Drive-mu sendiri.
    ours:
      heading: Yang kami pakai
      body: Kode aplikasi dan teks aslinya milik penulisnya. Kamus, korpus, audio, dan fon berasal dari pihak ketiga dan dipakai berdasarkan lisensinya masing-masing, yang semuanya disebutkan di halaman lisensi. Tidak ada bagian dari ketentuan ini yang memberimu hak atas materi pihak ketiga itu di luar lisensi tersebut.
    availability:
      heading: Ketersediaan
      body: Layanan ini disediakan “apa adanya” dan “sebagaimana tersedia”, tanpa jaminan akan berjalan tanpa gangguan, dan tanpa jaminan bahwa data kebahasaannya bebas dari kesalahan. Ini alat bantu belajar, bukan otoritas tentang bahasa.
    suspension:
      heading: Penangguhan
      body: Akun yang melanggar ketentuan ini, atau yang membahayakan layanan, bisa ditangguhkan atau dihapus.
    liability:
      heading: Tanggung jawab
      body: Sejauh diizinkan oleh hukum, pengembang tidak bertanggung jawab atas kerugian tidak langsung, insidental, atau lanjutan yang timbul dari penggunaan layanan ini.
    changes:
      heading: Perubahan
      body: Ketentuan ini bisa diperbarui. Tanggal berlaku di atas akan berubah saat itu terjadi, dan jika kamu tetap memakai layanan setelah tanggal tersebut, berarti kamu menerima ketentuan yang baru.
    contact:
      heading: Kontak
      body: "Pertanyaan tentang ketentuan ini:"
    related:
      heading: Tautan terkait
