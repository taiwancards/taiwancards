    core:
      heading: Cari satu kata, lihat gambaran utuhnya
      lede: "Radikal membentuk hanzi, hanzi membentuk kata, kata membentuk kalimat. Setiap halaman menunjukkan sisa jaringannya: dari apa sebuah kata tersusun, di mana kata itu muncul, dan seberapa kuat kamu menguasai tiap bagiannya."
