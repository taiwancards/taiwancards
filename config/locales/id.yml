          body: "Sebelum belajar hanzi dalam jumlah banyak, ada gunanya melihat dari apa hanzi dibuat: radikal membawa makna, komponen bunyi membawa bunyi, dan aturan urutan goresannya sama untuk semua hanzi. Setelah halaman ini, hanzi bukan lagi sekadar gambar, melainkan sebuah sistem."
        course:
          title: Kursus, pelajaran pertama
          body: Mulai dari sini, lebih mudah mengikuti pelajaran daripada kata acak. Setiap pelajaran berupa dialog dari kehidupan di Taipei, dengan kosakata dan tata bahasanya di bawah serta latihan untuk mengujimu; satu tombol mengubah pelajaran menjadi dek. Langkah ini terhitung setelah kamu menyelesaikan pelajaran pertamamu.
        zhuyin_theory:
          title: Cara kerja bunyi
          body: "Mulailah dengan melihat isi sebuah suku kata: bisa diawali apa, bisa diakhiri apa, dan apa fungsi nadanya. Simbolnya dikelompokkan, dan tiap kelompok punya tombol sendiri untuk melatih kelompok itu saja, tidak lebih."
        tones_theory:
          title: Cara kerja nada
          body: "Empat nada plus nada netral — dan detail khas Taiwan yang dilewatkan buku pelajaran Tiongkok: nada 3 tetap rendah dan tidak naik kembali, sedangkan 一 dan 不 berubah nada tergantung suku kata sesudahnya. Baca dulu, lalu langsung berlatih dari halaman yang sama."
        tones:
          title: Dengarkan empat nada
          body: "Nada di Taiwan berbeda dari nada buku pelajaran Tiongkok: nada 3 tetap rendah dan tidak pernah naik. Berlatihlah dengan rekaman studio setiap suku kata, bergantian suara pria dan wanita."
        phrases:
          title: Pelajari yang benar-benar diucapkan orang
          body: "Pola kalimat yang menemanimu seharian di Taiwan, termasuk separuh yang cukup kamu pahami saja: apa yang ditanyakan kasir kepadamu."
        bridge:
          title: Pindah dari pinyin ke zhuyin
          body: "Bunyinya sudah kamu kenal. Langkah ini memetakannya ke simbol yang dipakai Taiwan untuk menuliskannya, dan menunjukkan jebakannya: rima kosong, y dan w, serta bagian akhir yang disingkat iu, ui, dan un."
        readings:
          title: Pelajari ulang bacaan Taiwan
          body: Kata yang dibaca berbeda di Taiwan dan di Tiongkok, serta nada penuh yang dipertahankan Taiwan di tempat buku pelajaran memberimu nada netral.
        placement:
          title: Cari tahu levelmu
          body: Tes adaptif singkat yang mencakup mendengarkan, nada, hanzi, kosakata, dan kalimat. Tes ini menentukan level awalmu dan menandai apa yang sudah kamu ketahui.
        zhuyin:
          title: Zhuyin (ㄅㄆㄇㄈ)
          body: "Aksara fonetik Taiwan: 37 simbol dan empat tanda nada. Dibanding pinyin, awalnya tampak seperti kerja tambahan — tetapi zhuyin-lah yang menandai bacaan di kamus dan buku pelajaran Taiwan, dan dengan zhuyin pula orang di sini mengetik. Pelajari sekali, dan semua sesudahnya jadi lebih mudah."
        drill:
          title: Mengenali bunyi
          body: Latihan konsonan awal, bagian akhir, dan nada sampai kamu mengenalinya tanpa perlu berpikir dulu. Sekali latihan sudah cukup untuk mencentang langkah ini, tetapi latihan ini layak diulang.
        typing:
          title: Mengetik dengan zhuyin
          body: Tata letak yang tercetak di papan ketik di Taiwan. Tanpanya kamu tidak bisa menulis pesan atau kata kunci pencarian. Langkah ini terhitung setelah kamu mengetik sepuluh kata dengan benar.
        first_cards:
          title: Hanzi dan kata pertamamu
          body: "Hanzi dimulai sejak awal, tidak ditunda: kamu mulai dari yang paling sering muncul. Dua puluh pengulangan, dan langkah ini selesai."
        plan:
          title: Rencana ujianmu
          body: Kalau kamu butuh TOCFL, sebutkan level dan tanggalnya, lalu aplikasi menghitung target harianmu. Kalau tidak, lewati saja.
