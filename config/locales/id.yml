    exam:
      title: Ujian TOCFL
      lede: Tes kemahiran Taiwan untuk pelajar bahasa Mandarin, diselenggarakan oleh SC-TOP, Steering Committee for the Test of Proficiency-Huayu (國家華語測驗推動工作委員會). Bagaimana jalannya hari ujian, bagaimana penilaiannya, dan apa yang bisa dibuka oleh sebuah level.
      tests_title: Empat tes
      tests_body: Mendengarkan dan membaca dikerjakan bersama di komputer sebagai satu tes (聽讀測驗). Berbicara (口語) dan menulis (寫作) adalah tes terpisah, dan pendaftarannya per band. Anak-anak punya tes sendiri, yaitu CCCC.
      adaptive_title: Satu kali tes mencakup semua level
      adaptive_body: "Tes mendengarkan dan membaca bersifat adaptif: kamu tidak memilih level. Soalnya makin sulit selama jawabanmu benar dan makin mudah kalau kamu salah, lalu tes berhenti setelah levelmu ditentukan. Kamu tidak bisa kembali ke soal sebelumnya, dan skornya langsung tampil di layar di akhir tes."
      listening: "Mendengarkan: sekitar 35 soal dalam sekitar 50 menit, dengan waktu 10 detik untuk menjawab setelah setiap rekaman. Gambar, tanya jawab, dialog pendek, dan bacaan yang lebih panjang."
      reading: "Membaca: sekitar 35 soal dalam 60 menit. Kalimat tunggal, gambar, isian rumpang, dan teks bacaan."
      scores_title: Skor dan level
      scores_body: Skor diskalakan dengan nilai maksimal 700, dan mendengarkan serta membaca masing-masing punya batas lulusnya sendiri, jadi keduanya bisa jatuh di level yang berbeda.
