        huayu: "Huayu Enrichment Scholarship selama sembilan bulan atau lebih: sertifikat Level 3 dari dua tahun terakhir, atau mengikuti tes dan meraih Level 3 atau lebih tinggi setelah tiba di Taiwan."
        mofa: "Beasiswa Taiwan dari Kementerian Luar Negeri (MOFA), untuk program gelar yang diajarkan dalam bahasa Mandarin: mendengarkan dan membaca di Level 2 (基礎級) atau lebih tinggi."
