      body: "Diurutkan menurut PMI (pointwise mutual information): seberapa jauh lebih sering kedua hanzi ini muncul bersama dibandingkan kebetulan. Skor tinggi berarti pasangan itu memang kebiasaan, bukan kebetulan."
    shape:
      example_surname: marga
      example_given: nama diri
      compact: Marga adalah satu hanzi warisan; nama diri terdiri atas satu atau dua hanzi yang dipilih keluarga. Urutannya tidak pernah berubah, bagaimanapun huruf Latin di paspor menuliskannya.
    surnames:
      heading: Marga yang dipakai di Taiwan
      note: "%{shown} marga paling umum dari total %{total}, dihitung dari %{people} orang dalam catatan kependudukan."
    characters:
      heading: Hanzi yang muncul dalam nama diri
      body: Diurutkan menurut seberapa sering muncul dalam nama diri yang tercatat, masing-masing bertaut ke entri kamusnya agar kamu bisa membaca arti sebenarnya.
      caution: Sebuah hanzi membawa arti kamusnya, bunyinya, dan pergaulannya dengan hanzi lain. Arti saja tidak membuat nama berhasil — homofon, ragam bahasa, dan kecocokan dengan marga sama pentingnya. Itu sebabnya halaman ini menunjukkan data, bukan saran.
      none: Tidak ada yang cocok dengan gabungan filter itu.
    given:
      heading: Nama diri dalam catatan
      note: Nama diri yang paling sering tercatat, beserta jenis kelamin yang tercatat untuk masing-masing.
