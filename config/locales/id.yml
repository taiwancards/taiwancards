    how_title: Mengapa belajar mengetik dengan cara ini
    how_body: "Inilah tata letak yang tercetak di setiap papan ketik yang dijual di Taiwan, dan begitulah kebanyakan orang di sini mengetik. Kamu tidak perlu memasang apa pun untuk berlatih: tekan tombol yang sama seperti di papan ketik Taiwan, maka zhuyin akan muncul. Tombol nada ada di baris angka: 6 untuk nada 2, 3 untuk nada 3, 4 untuk nada 4, dan 7 untuk nada netral; nada 1 tidak perlu tombol. Setelah tata letaknya hafal di jari, mengetik bahasa Mandarin tidak lagi berarti mencari-cari tombol, tetapi jadi gerak refleks — dan karena yang kamu ketik adalah bunyinya, bacaannya ikut terlatih."
