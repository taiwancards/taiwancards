  variants:
    title: Taiwan dan tempat lain
    word: Kata
    reading: Cara baca
    meaning: Arti
    taiwan: Taiwan
    china: Tiongkok
    hongkong: Hong Kong
    singapore: Singapura / Malaysia
    checked: Cara baca dicek dengan kamus Kementerian Pendidikan Taiwan (MOE); kosakata dengan tabel perbandingan lintas selat dari MOE dan sumber-sumber regional. Kalau suatu bentuk masih diperdebatkan atau standarnya sudah bergeser, catatannya menyebutkan hal itu, bukan memihak salah satu.
    sections:
      reading: Hanzi sama, cara baca beda
      glyph: Kata sama, hanzi beda
      word: Katanya lain sama sekali
    intro:
      reading: "Kata-kata ini ditulis sama di Taiwan dan di Tiongkok, tetapi diucapkan berbeda. 垃圾 yang paling sering disadari orang — ucapkan lājī di Taipei, dan semua orang langsung tahu di mana kamu belajar bahasa Mandarin. Dua entri perlu catatan: 和 dengan bacaan hàn memang tercantum di kamus Kementerian Pendidikan sebagai bacaan kata hubung, tetapi kini makin terbatas pada penutur yang lebih tua dan siaran berita, jadi cukup kenali saja, tidak perlu dipakai; dan 說服 di sini memang dibaca shuìfú, tetapi bukan karena Tiongkok mengubah sesuatu — kabar viral tahun 2019 tentang revisi bacaan sudah dibantah secara resmi."
      glyph: "Taiwan dan Hong Kong sama-sama memakai hanzi tradisional, tetapi tidak selalu memilih hanzi yang sama. Ini karakter Unicode yang berbeda, bukan sekadar beda font, jadi tampilannya memang lain. 著 yang akan paling sering kamu temui: Taiwan memakainya untuk semua bacaan, sedangkan Hong Kong dan Tiongkok membaginya dengan 着. Dua di antaranya adalah kasus ketika standar resmi dan tulisan tangan sehari-hari tidak sejalan, bahkan di Taiwan sendiri — 汙 dan 脣 adalah bentuk standar, tetapi 污 dan 唇 terlihat di mana-mana."
      word: "Di sini tiap wilayah memang memakai kata yang berbeda. Perhatikan bahwa kolom Hong Kong sebagian besar berisi kosakata bahasa Kanton yang ditulis dengan hanzi, bukan varian bahasa Mandarin — penutur Mandarin yang membaca 雪櫃 keras-keras sebenarnya sedang membaca kata Kanton. Jebakan paling tajam di tabel ini adalah 土豆: kacang tanah di Taiwan, kentang di Tiongkok. Dua kata yang berbeda, kebetulan bertabrakan dalam tulisan."
