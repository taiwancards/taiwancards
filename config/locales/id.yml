    initials_lede: "Dua puluh satu simbol — semua bunyi yang bisa mengawali suku kata. Tombolnya memutar rekaman Kementerian Pendidikan Taiwan: dengarkan dulu sebelum membaca penjelasannya."
    series:
      title: Tiga deret yang selalu tertukar
      body: Sembilan konsonan awal yang tampak mirip dalam pinyin, tetapi dibentuk di tiga tempat berbeda di mulut. Latih dulu deret demi deret — dalam satu deret tempatnya sama, yang berbeda hanya embusan napasnya.
      rows_hint: satu deret
      columns_hint: tiga deret sekaligus
      hard_title: Yang ini memang sulit
      hard_body: "Ambil satu kolom, bukan satu deret, dan bunyinya jadi hampir tidak bisa dibedakan: dalam pinyin tulisannya pun nyaris sama, zhi, zi, dan ji hanya beda satu huruf. Bedanya cuma letak lidah — ditarik ke belakang ke arah langit-langit, di gigi bawah, atau menempel di langit-langit keras. Inilah yang perlu didengarkan baik-baik, dan wajar kalau awalnya masih salah."
      all_nine: Kesembilannya dicampur
      sets:
        zhi_chi_shi: zhi chi shi
        zi_ci_si: zi ci si
        ji_qi_xi: ji qi xi
        zhi_zi_ji: zhi zi ji
        chi_ci_qi: chi ci qi
        shi_si_xi: shi si xi
    drill_these: Latih %{symbols}
    blocks:
      labial:
        title: Bibir
        body: "Bunyi bibir: kedua bibir bertemu untuk ㄅ ㄆ ㄇ, dan untuk ㄈ bibir bawah menyentuh gigi atas. ㄅ adalah p pada “pagi”, tanpa embusan napas; ㄆ p yang sama dengan embusan napas kuat. Yang pertama dipelajari anak-anak Taiwan, sekaligus pembuka lagu ㄅㄆㄇㄈ."
      alveolar:
        title: Ujung lidah
        body: Ujung lidah menekan di belakang gigi atas. ㄉ adalah t pada “tahu”, tanpa embusan napas; ㄊ t yang sama dengan embusan napas kuat. 的, 他, 你, dan 了 semuanya berawal dari kelompok ini.
      velar:
        title: Pangkal lidah
        body: ㄍ adalah k pada “kaki”, tanpa embusan napas; ㄎ k yang sama dengan embusan napas kuat. ㄏ aslinya seperti kh pada “khas”, tetapi ringan — di Taiwan sering melemah sampai mirip h biasa, dan keduanya wajar.
      palatal:
        title: Hanya sebelum ㄧ dan ㄩ
        body: Bunyi ini hanya muncul bersama ㄧ dan ㄩ, jadi tidak akan tertukar dengan ㄓㄔㄕ kalau kamu memperhatikan bunyi sesudahnya. ㄐ mirip c pada “cinta”, ㄒ mirip sy pada “syukur”.
      retroflex:
        title: Lidah ditarik ke belakang
        body: Ujung lidah terangkat dan ditarik ke belakang, ke arah langit-langit mulut. Di Taiwan bunyinya lebih lembut daripada di buku pelajaran Tiongkok — hampir ㄗㄘㄙ.
      sibilant:
        title: Desis
        body: Lidah di gigi bawah, udara keluar dalam aliran sempit. Pasangan dari tiga bunyi di atas. ㄗ adalah “ts” tanpa embusan napas, ㄘ “ts” yang sama dengan embusan napas kuat — pinyin menulisnya c, tetapi bunyinya bukan c bahasa Indonesia.
      medial:
        title: Medial
        body: Letaknya di antara konsonan awal dan bagian akhir; dalam pinyin menjadi i, u, dan ü — atau y dan w di awal suku kata.
      open:
        title: Vokal tunggal
        body: Empat bunyi bersih yang menjadi bahan semua bunyi lain. ㄝ tidak pernah berdiri sendiri — hanya sesudah ㄧ dan ㄩ.
      diphthong:
        title: Diftong
        body: "Dua bunyi dalam satu suku kata: lidah meluncur dari satu posisi ke posisi berikutnya tanpa memutus suku katanya, seperti “ai” pada “pantai” yang diucapkan dengan cermat."
      nasal:
        title: Sengau
        body: ㄢ/ㄤ dan ㄣ/ㄥ berbeda di posisi akhir lidah, seperti “makan” dan “orang”. Di Taiwan bedanya sering kabur, tetapi kamus tetap membedakannya.
      rhotic:
        title: Satu-satunya
        body: Suku kata tersendiri, ada pada 二, 兒, dan 耳. Bukan akhiran r yang di Tiongkok ditempelkan pada kata lain.
      compound:
        title: Bagian akhir gabungan
        body: Medial ditambah bagian akhir. Tidak perlu latihan tersendiri — semuanya tersusun dari simbol yang sudah kamu latih.
    finals_lede: "Semua yang tersisa dalam suku kata setelah konsonan awal: vokal, diftong, atau vokal dengan bunyi sengau. Untuk bagian akhir gabungan, yang disuarakan adalah tiap simbolnya — kalau dirangkai, bunyinya tidak sama dengan kedua bagian yang diucapkan berurutan."
    why_title: Mengapa ini bukan hal sepele
    why_body: "Pinyin bisa kamu baca tanpa persiapan apa pun, dan justru itulah bahayanya: huruf-hurufnya menyeret kebiasaan membaca bahasa Indonesia — c dibaca seperti pada “cari”, j seperti pada “jalan”, b seperti pada “baju” — dan kesalahannya tertanam diam-diam. Di balik simbol zhuyin tidak ada apa-apa selain bunyi yang kamu ajarkan kepadanya. Karena itulah Taiwan menandai bacaan dengan zhuyin."
    compound_audio: "Bagian akhir gabungan: yang disuarakan adalah tiap simbolnya. Kalau dirangkai, bunyinya tidak sama dengan kedua bagian yang diucapkan berurutan — lihat catatan di kanan."
    play_symbol: Putar %{symbol}
    phonetics_card: "Tabel bunyi lengkap: zhuyin, pinyin, IPA, padanan bunyi dalam bahasa Indonesia, dan contoh."
    phonetics_title: Zhuyin dan pinyin
    col_explanation: Jebakannya
    col_written: Ditulis
    col_real_sound: Bunyi sebenarnya
    rimes_lede: Untuk sejumlah bagian akhir, pinyin tidak menuliskan apa yang benar-benar akan kamu dengar. Justru dalam kasus-kasus ini zhuyin biasanya lebih dekat dengan bunyi aslinya — inilah tempat-tempatnya, dan alasannya.
    rimes: Tempat ejaan dan bunyi tidak sejalan
