      lede: Masing-masing aplikasi itu bagus di bidangnya. Masalahnya, kamu harus membuka lima aplikasi sekaligus tanpa ada yang menghubungkannya.
      closing: Cari kata, periksa, kirim ke dek, lihat levelmu naik, dan bersiap untuk TOCFL — di satu tempat, bukan di lima tab.
