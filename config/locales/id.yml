      register_title: Pendaftaran dan hasil
      register_body: Pendaftaran hanya bisa online. Di Taiwan, tes ini diadakan beberapa kali setahun, dan pendaftaran ditutup sekitar empat minggu sebelum setiap tanggal ujian. Skor keluar sekitar 20 hari setelah tes, dan transkrip serta sertifikatnya bisa diunduh dari sistem pendaftaran pada hari itu juga.
