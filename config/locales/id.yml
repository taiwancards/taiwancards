          - "dan cinta tanpa batas untuk Taiwan \U0001F1F9\U0001F1FC"
      cta: Mulai belajar
      secondary: Lihat isinya
      note: Gratis. Tanpa iklan. Tidak sekarang, tidak juga nanti.
      specimen:
        meaning: nanas
        caption: Satu kata. Lima hal terpisah untuk diingat, masing-masing dengan jadwal pengulangannya sendiri.
    is:
      heading: Apa itu TaiwanCards
      items:
        taiwan: Bahasa Mandarin Taiwan dan hanya itu — hanzi tradisional, zhuyin, band TOCFL, dan level TBCL milik Taiwan sendiri
        decks: Seperti Anki, tapi tanpa dek buatan orang tak dikenal atau malam-malam yang habis untuk mengetik dek sendiri — dan satu kata di sini berarti lima ingatan terpisah, bukan sekali geser tahu / tidak tahu
        dictionary: Seperti Pleco, tapi bukan sekadar rujukan — entri yang sama menjadi bahan latihan dan jadwal yang menentukan apa yang kamu lihat berikutnya, dengan Taiwan di depan, bukan sebagai catatan kaki
        writing: Seperti Skritter, tapi menulis bukan aplikasi terpisah dengan daftar terpisah — kamu menggambar hanzi yang memang sedang kamu pelajari minggu ini, dan hasilnya masuk ke progres yang sama
        reading: "Seperti Du Chinese, tapi tidak ada yang memilihkan teks untukmu: lagu kesukaanmu, berita, materi kelas, atau pesan — tempel saja, dan teks itu kembali sudah dipecah menjadi kata, siap dijadikan dek"
        photo: Foto menu di dinding atau papan nama di jalan, dan hanzi yang tidak bisa kamu baca kembali sudah dipecah menjadi kata, siap dijadikan dek
        speaking: Bukan pengenal suara yang hanya menjawab ya atau tidak — setiap suku kata yang kamu ucapkan dinilai mutunya dari sembilan belas sifat akustik, dibandingkan dengan cara orang Taiwan mengucapkannya, bukan cara orang Tiongkok
        everyday: "Taiwan yang tidak diajarkan kursus mana pun: memesan di kedai minuman, undian struk belanja, menyewa apartemen, klinik, hari libur topan"
        corpus: Setiap contoh kalimat benar-benar ditulis oleh seseorang di Taiwan, disimpan bersama sumber dan lisensinya
        measured: "Tidak ada yang ditebak di sini: seberapa umum sebuah kata, seberapa sulit, dan masuk level mana — semuanya dihitung dari korpus Taiwan yang nyata"
        memory: "Satu catatan progres di balik setiap layar: pelajari kata di pembaca teks, dan kata itu terhitung di kamus, latihan, dan latihan menulis"
    isnt:
      heading: Apa yang bukan TaiwanCards
      items:
        game: Bukan game — tanpa XP, lencana, papan peringkat, dan tanpa binatang kartun yang membuatmu merasa bersalah supaya kembali besok
        machine: Tanpa konten bahasa Mandarin buatan AI — dan tidak akan pernah. Setiap arti, contoh, dan label sudah melewati tangan manusia, dan setiap frasa bisa dilacak ke sumber yang dapat diverifikasi. Edisi bahasa Indonesia untuk antarmuka dan penjelasannya disusun dengan bantuan mesin dan masih terus ditinjau
        decks: Bukan tumpukan dek bersama yang tidak jelas siapa pembuatnya, dari buku pelajaran mana, atau apakah bacaannya benar untuk Taiwan
        china: Bukan kursus dari Tiongkok yang hanzinya ditukar menjadi tradisional — kosakata, bacaan, dan separuh kehidupan sehari-harinya pun berbeda
        words: Kursus dari Tiongkok kecil kemungkinan akan lama membahas 自由, 民主, atau 人權. Di sini kata seperti itu berlimpah, dan tidak ada satu daftar pun yang melewatkannya
        course: Bukan silabus yang harus diikuti dari pelajaran pertama sampai terakhir — kamu mulai dari posisimu sekarang, ambil yang kamu perlukan, dan lewati yang tidak
        teacher: Bukan pengganti guru — ini separuh yang kamu kerjakan di antara kelas, separuh yang tidak dilihat siapa pun, dan separuh yang menentukan apakah kamu maju atau tidak
        hsk: Bukan persiapan HSK — kosakatanya berbeda, bacaannya berbeda, dan dunia di balik kata-katanya juga berbeda, meskipun kamu ikut ujiannya dalam hanzi tradisional
        simplified: Tidak ada hanzi sederhana di mana pun dan tidak ada tombol untuk menyalakannya — yang ada hanya versi Taiwan, di kamus, contoh kalimat, maupun latihan
        ads: Tidak dibiayai iklan dan tidak akan pernah — tidak ada yang berkedip, tidak ada yang menyela, tidak ada yang menarikmu dari belajar atau sekadar mencari arti kata
        tracking: Tidak memata-matai kamu — tanpa analitik pihak ketiga, tanpa pelacak apa pun, dan seluruh progresmu bisa diekspor ke file yang kamu simpan sendiri, kapan saja kamu mau
    counts:
      heading: Yang sudah tersedia
      radicals: Radikal Kangxi
      characters: Hanzi
      words: Entri kamus
      collocations: Idiom dan kolokasi
      sentences: Kalimat dan contoh
    science:
      heading: Linguistik kuantitatif di balik layar
      body: "Semuanya bertumpu pada pengukuran: frekuensi dan sebaran di korpus, kekuatan kolokasi, skala kesulitan yang dikalibrasi, rujukan akustik untuk setiap suku kata. Yang kamu lihat hanya puncak gunung es — di bawahnya ada bertahun-tahun mengumpulkan, mengukur, dan memverifikasi data, dengan pustaka dan dataset kami sendiri yang dirilis untuk komunitas peneliti. Semuanya terbuka — ilmu milik semua orang."
      points:
        corpus:
          title: Diukur, bukan ditebak
          body: Level, tingkat kesulitan, dan urutan kata berasal dari korpus Taiwan yang kami bangun dan ukur sendiri — frekuensi, sebaran, kekuatan kolokasi, ragam bahasa.
        open:
          title: Terbuka untuk diperiksa
          body: Tabel korpus, inventaris suku kata, dan pustaka di baliknya dirilis sebagai dataset, dan aplikasi ini open source. Setiap sumber dan lisensi tercantum di halaman kredit.
        linked:
          title: Satu tempat, saling terhubung
          body: Hanzi mengarah ke kata-katanya, kata ke kalimat nyata, kalimat kembali ke poin tata bahasanya — dan apa pun yang kamu temui bisa langsung masuk ke dek.
    quality:
      heading: Dari mana kualitasnya berasal
      items:
        audio:
          title: Rekaman resmi
          body: Hanzi dan kata seperti yang direkam untuk kamus resmi Kementerian Pendidikan Taiwan — bukan suara sintetis, bukan rekaman sukarelawan.
        sources:
          title: Sumber dari Taiwan
          body: Kamus negara, daftar level dan tabel frekuensi resmi, peraturan perundang-undangan, berita kota.
        human:
          title: Ada manusia di balik setiap entri
          body: Arti, contoh, dan tautan dibaca satu per satu oleh manusia. Bagian bahasa Mandarinnya diverifikasi manusia — tidak ada yang dibuat mesin. Edisi bahasa Indonesia masih terus ditinjau.
        written:
          title: Edisi untuk penutur bahasa Indonesia
          body: "Bukan terjemahan dari bahasa Inggris, melainkan edisi tersendiri yang ditulis khusus untuk penutur bahasa Indonesia: bunyi, tata bahasa, dan budaya dijelaskan lewat bahasa dan keseharian kita — dari jebakan ejaan pinyin bagi lidah Indonesia sampai kata serapan Hokkien yang kita pakai setiap hari."
