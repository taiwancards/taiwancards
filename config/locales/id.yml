  page_help:
    word_pairs_html: "<p>Pasangan dan trio kata yang mudah tertukar karena bahasa Indonesia memakai satu kata untuk semuanya: “bisa” untuk 會, 能 dan sering juga 可以, “tidak” untuk 不 dan 沒, “lagi” untuk 再 dan 又. Pertama aturannya, lalu contoh untuk tiap kata, lalu kesalahan yang paling sering dibuat orang.</p><p>Latihan di bagian bawah tidak menyimpan apa pun: jawab, dan kamu langsung melihat kenapa kata itulah yang benar. Halaman kamus untuk kata-kata ini menautkan ke set masing-masing.</p>"
    dictation_html: "<p>Dengarkan rekaman asli dan tulis apa yang kamu dengar. Suaranya dari penutur asli Taiwan, dan kalimatnya diurutkan menurut level kata: 1 yang paling mudah.</p><p>Dengarkan sesering yang kamu perlukan. Kalau terlalu cepat, perlambat dengan tombol di sebelahnya. Terjemahan membuka artinya kalau kamu benar-benar tidak bisa menangkapnya.</p><p>Kamu bisa mengetik zhuyin langsung di sini: nyalakan ㄅㄆㄇ lalu tekan tombol tata letak Taiwan atau tombol di layar. Nada ditulis dengan 6, 3, 4, dan 7; nada 1 tidak diberi tanda.</p>"
    desk_html: "<p>Layar beranda mengikuti mode yang kamu pilih. <strong>TOCFL</strong> menampilkan hitung mundur ke ujian, kesiapan per level, simulasi ujian, dan tata bahasa level itu. <strong>Kata-katamu</strong> menampilkan pengulangan dek milikmu sendiri dan cara cepat menambahkan kata dari kelas. <strong>Metode kami</strong> menampilkan langkah berikutnya di fonetik atau kursus, ditambah kartu hari ini. Ganti mode di profilmu atau lewat tautan “ubah” di sebelah judul.</p><p>Penghitung: <strong>perlu diulang</strong> adalah jumlah kartu yang jatuh tempo hari ini menurut jadwal FSRS, <strong>baru</strong> adalah berapa banyak materi yang belum pernah dilihat yang siap ditambahkan aplikasi (kuotanya dari rencanamu, atau dari pengaturan kalau tidak punya rencana), dan <strong>aktif</strong> adalah jumlah semua kartu yang sedang berjalan. Tombol besar selalu membawamu ke tempat yang paling masuk akal untuk melanjutkan.</p>"
    progress_html: "<p><strong>Runtunan</strong> adalah jumlah hari berturut-turut yang ada pengulangannya. Satu hari dihitung dari tengah malam ke tengah malam menurut zona waktu perangkatmu; kalau kamu bepergian, hari yang sudah terhitung tidak berubah. Setelah 30 hari berturut-turut, jeda sampai 2 hari tidak lagi memutus runtunan, dan setelah 90 hari berturut-turut tanpa istirahat, jeda sampai 4 hari. Hari istirahat tidak ditambahkan ke hitungan, dan setelah istirahat, hitungan menuju hari istirahat berikutnya mulai dari awal. <strong>Retensi</strong> adalah persentase jawaban “Tahu” atau lebih di antara kartu yang menurut FSRS sudah waktunya: kalau angkanya jauh di bawah target di pengaturan, intervalnya terlalu panjang.</p><p>Status: <strong>belum dilihat</strong> berarti belum pernah muncul, <strong>sedang dipelajari</strong> masih dalam langkah belajar, <strong>muda</strong> punya interval di bawah tiga minggu, <strong>matang</strong> di atasnya. <strong>Kartu bandel</strong> adalah kartu yang kamu lupakan berulang kali; mempelajarinya ulang secara manual lebih hemat daripada terus memutarnya lewat jadwal.</p>"
    plan_html: "<p>Tentukan target level TOCFL dan tanggalnya, lalu aplikasi menghitung berapa banyak materi baru per hari yang dibutuhkan untuk menuntaskan level itu tepat waktu. Kuotanya dihitung ulang setiap hari dari apa yang sudah dipelajari, jadi satu hari terlewat tidak merusak rencana — kuotanya hanya naik sedikit.</p><p>Kalau kuotanya terlalu berat, angkanya ditandai kuning: level itu tidak akan tuntas sebelum tanggal tersebut, jadi mundurkan tanggalnya atau turunkan targetnya satu level.</p>"
    cangjie_lessons_html: "<p>Cangjie adalah cara orang Taiwan mengetik hanzi tradisional berdasarkan bentuk, bukan bunyi: satu hanzi dipotong menjadi bagian-bagian yang terlihat, dan tiap bagian adalah satu tombol huruf Latin. Buku pelajaran ini hanya membahas generasi kelima metode ini (倉頡五代) — bukan Cangjie 3, dan bukan Cangjie versi sederhana.</p><p>Urutannya begini: empat pelajaran tentang cara kode disusun, lalu satu pelajaran per tombol untuk kedua puluh enam tombol, lalu aturan pemotongan dan daftar tertutup pengecualiannya. Bukunya ditutup dengan hanzi khas Taiwan dan seluruh Novice 1–2.</p><p>Setiap pelajaran punya latihannya sendiri: sebutkan tombol dari suatu bentuk, sebutkan tombol pertama sebuah hanzi, pilih potongan yang benar, dan ketik kode lengkapnya. Mengetik bebas ada di tempat terpisah, di <strong>Latihan Cangjie</strong> pada menu Latihan.</p>"
    names_html: "<p>Bagian ini menjelaskan cara nama Taiwan disusun dan menunjukkan nama yang benar-benar dipakai di Taiwan, dihitung dari data catatan kependudukan. Bagian ini tidak mengarang nama untukmu: memilih nama itu urusan pribadi, dan biasanya dilakukan bersama teman atau guru orang Taiwan.</p><p><strong>Nama keluarga</strong> terdiri dari satu hanzi, diwariskan, dan ditulis sebelum nama diri; nama keluarga dua hanzi memang ada, tetapi jarang. <strong>Nama diri</strong> terdiri dari satu atau dua hanzi yang dipilih keluarga, dan dua hanzi yang paling umum. Urutannya tidak pernah berubah: dalam bahasa Mandarin nama keluarga tetap di depan, apa pun yang tercetak di paspor, dan kamu menyapa orang dengan nama keluarga ditambah sebutan sampai ia mempersilakan cara lain.</p><p>Di tab “Pilih nama”, hanzi diperingkat berdasarkan angka-angka yang sama dengan yang ada di tab kedua: frekuensi per generasi, pola nada, seberapa erat dua hanzi biasa berpasangan, dan jumlah goresan. Hasilnya lima kandidat beserta alasannya, jadi daftar pendek itu benar-benar bisa kamu diskusikan.</p>"
    desks_html: "<p>Dek dibuat dari apa pun yang kamu tempelkan: daftar satu kata per baris, kata yang dipisahkan koma, atau teks biasa — sistem akan memilahnya sendiri. Kamu juga bisa mengunggah file, atau mengambil kata-kata dari sebuah lagu.</p><p>Perbedaan utamanya dengan Anki: <strong>kamu tidak pernah mengetik terjemahan</strong>. Cara baca, arti, uraian hanzi, dan audio semuanya diambil dari kamus kami. Kamu cukup memberikan katanya.</p><p>Sebelum dek dibuat, kamu mendapat pratinjau: berapa kartu yang akan jadi, mana yang duplikat, dan mana yang tidak ada di kamus. Entri diurutkan dari yang paling mudah. Kalau kamu sudah menguasai seluruh daftar, satu tombol mengirimnya ke pengulangan jangka panjang, bukan ke antrean kartu baru.</p>"
    hanzi_html: Halaman ini mengurai sebuah hanzi dan menunjukkan apa gunanya tiap bagian. Komponen makna menunjuk ke suatu bidang arti, komponen bunyi ke perkiraan cara baca. Dalam data kami sendiri, komponen bunyi menebak bagian akhir suku kata dengan benar sekitar empat dari lima kali, jadi hanzi yang belum dikenal sering bisa dibaca pada percobaan pertama. Buka bagian-bagiannya satu per satu.
    triage_html: "<p>Cara cepat untuk menentukan posisimu kalau kamu sudah tahu sebagian materi ini. Geser ke kanan kalau kamu tahu hanzi itu, ke kiri kalau kamu ragu.</p><p><strong>Sudah tahu</strong> mendorong entri ke pengulangan jarak jauh: kira-kira tiga minggu lagi atau lebih, disebar supaya tidak menumpuk di satu hari. Tidak ada yang hilang selamanya.</p><p><strong>Ragu</strong> membiarkan entri di antrean biasa, untuk muncul bersama yang lainnya.</p><p>Apa pun yang sudah benar-benar kamu pelajari tidak ikut disaring dan tidak diubah.</p>"
    zhuyin_trainer_html: "<p>Di sini zhuyin dipelajari sebagai aksara tersendiri, tanpa tongkat huruf Latin. Kamu mendengar bunyi lalu memilih simbolnya — sengaja tidak ada pinyin di layar, karena kalau ada, yang tertanam di kepala adalah “ㄅ sama dengan huruf b”, bukan “ㄅ adalah bunyi ini”.</p><p>Simbol muncul dalam blok menurut tempat pengucapannya, bukan berurutan dari atas ke bawah tabel. Blok baru terbuka setelah blok sebelumnya selesai. Pilihan jawabannya sengaja dibuat mirip: bentuk yang serupa dan bunyi dari tempat pengucapan yang sama — pilihan acak hanya akan memberi ilusi kemajuan.</p><p>Satu simbol dianggap dikuasai setelah tiga jawaban benar berturut-turut, dan harus cepat: menjawab benar tetapi lambat berarti kamu masih memikirkannya, belum mengenalinya, dan penghitungnya tidak bergerak. Kamu bisa berhenti kapan saja.</p>"
    numbers_html: "<p>Angka hanya butuh segelintir hanzi, dan kamu memang perlu semuanya — tetapi kesulitan sebenarnya bukan hanzinya, melainkan satuan besarnya.</p><p>Bahasa Mandarin mengelompokkan angka per empat digit: 萬 adalah 10.000 (persis “ceban” dalam bahasa pasar, yang berasal dari bahasa Hokkien), dan semua yang lebih besar dibangun di atasnya. Itulah sebabnya satu juta adalah 一百萬 dan satu miliar adalah 十億. Lima bagian di bawah bergerak dari hanzi sampai jebakannya; bagian terakhir membahas tahun 民國, yang muncul di setiap formulir Taiwan.</p>"
    practice_phonetics_html: "<p><strong>Zhuyin</strong> (ㄅㄆㄇㄈ, disebut juga bopomofo) adalah alfabet fonetik: 37 simbol, masing-masing terikat pada satu bunyi bahasa Mandarin, ditambah tanda nada. Simbol-simbol ini tidak punya arti lain, jadi tidak mungkin dibaca karena kebiasaan. Zhuyin dipakai untuk menuliskan cara baca di kamus dan buku pelajaran sekolah di Taiwan, dan dengan zhuyin pula orang di sini mengetik.</p><p><strong>Pinyin</strong> adalah ejaan — cara menulis bunyi yang sama dengan huruf Latin, dengan aturannya sendiri. Aturan itu dibuat supaya ringkas, bukan supaya akurat: satu huruf bisa mewakili beberapa bunyi, dan sebagian vokal hilang dari ejaannya. Pinyin berguna sebagai pegangan, tetapi langsung menyesatkan begitu kamu membacanya seperti ejaan bahasa Indonesia: b, d, g di pinyin adalah p, t, k kita, c bukan c, j bukan j.</p><p>Di tabel di bawah, <strong>patokan</strong> ada di depan: satu baris yang memberi tahu apa yang harus diucapkan sekarang juga. Lalu artikulasinya — bagaimana alat ucap bergerak. Di ujung setiap baris, dalam warna oranye, ada kesalahan yang perlu dihindari.</p>"
    roadmap_html: "<p>Urutan terbaik untuk menjelajahi aplikasi ini kalau kamu mulai dari nol. Tidak ada yang wajib — semuanya juga bisa dibuka dari menu.</p><p>Langkah yang punya latihan akan tercentang sendiri: setelah satu putaran latihan bunyi, setelah sepuluh kata diketik dengan benar, setelah dua puluh pengulangan. Tandai sisanya sendiri kalau kamu merasa siap lanjut.</p><p>Langkah opsional boleh dilewati tanpa akibat apa pun — jalurnya tetap dihitung selesai tanpa langkah itu.</p>"
    label: Cara kerja halaman ini
    typing_html: "<p>Keyboard yang ditampilkan di sini adalah tata letak bopomofo Taiwan — yang tercetak di keyboard yang dijual di Taiwan dan dipakai kebanyakan orang di sini. Tidak ada yang perlu dipasang: tekan tombol yang sama, dan zhuyin-nya muncul.</p><p>Ketik cara baca kata yang ditampilkan, lalu tekan spasi atau Enter untuk memeriksanya. Tombol nada adalah 6 (ˊ), 3 (ˇ), 4 (ˋ), dan 7 (˙); suku kata nada 1 tidak perlu tombol nada.</p><p>Kata-katanya diambil dari kamusmu sesuai urutan belajar, jadi kamu sekaligus melatih cara baca dan mengetik.</p>"
    reader_html: "<p>Baca bahasa Mandarin asli dengan kamus yang sudah terpasang. Kata yang sudah kamu kenal tampil redup; semua kata baru diwarnai menurut level dan digarisbawahi, dengan cara bacanya tercetak di atas.</p><p>Ketuk kata mana pun untuk melihat entri lengkap, audio, dan tombol untuk mulai mempelajarinya. Seluruh teks bisa dijadikan dek dengan satu klik.</p><p>Tempel teks apa pun sendiri, atau impor lirik lagu. Hanzi sederhana selalu diubah dulu menjadi hanzi tradisional.</p>"
    placement_html: "<p>Tes adaptif yang menemukan levelmu dalam sekitar lima menit, lalu menawarkan untuk menandai semua materi di level itu dan di bawahnya sebagai sudah dikuasai.</p><p>Soal makin sulit selama jawabanmu benar dan makin mudah kalau kamu salah. Perkiraannya sengaja kasar — kamu bisa menyesuaikannya di layar hasil sebelum menerapkannya.</p><p>Penandaan ini aman: apa pun yang sedang kamu pelajari tetap menyimpan progresnya, dan materi yang ditandai disebar ke beberapa minggu ke depan supaya pengulangan tidak menumpuk sekaligus.</p>"
    phrases_html: "<p>Ujaran utuh, bukan kosakata. Tiap kartu adalah pola dengan slot yang kamu isi dari kamus, jadi satu baris bisa dipakai untuk seratus pesanan di kedai teh.</p><p>Kartu bertanda <strong>Kata mereka</strong> adalah separuh yang selalu dilewatkan buku percakapan: pertanyaan yang dilontarkan pegawai kepadamu di kasir. Memahami pertanyaan itu lebih penting daripada menyusun kalimat yang sempurna.</p><p>Kalau bentuk dari Tiongkok tetap dimengerti tetapi terdengar seperti bawaan dari luar, bentuk Taiwan yang ditampilkan dan bentuk lainnya dicoret.</p>"
    everyday_html: "<p>Kosakata yang benar-benar khas Taiwan dan tidak ada di daftar ujian mana pun — singkatan untuk memesan minuman, slang dari bahasa Hokkien Taiwan, kata yang dipakai Taiwan ketika Tiongkok memakai kata lain.</p><p>Saring menurut bidang kehidupan atau asal katanya. Kata yang ditandai sebagai kasar memang kasar. Kalau Tiongkok punya padanannya, padanan itu ditampilkan, jadi kamu bisa melihat perbedaannya, bukan sekadar menghafal satu bentuk.</p>"
    variants_html: "<p>Tempat Taiwan berbeda dari Tiongkok, Hong Kong, dan Singapura — dalam cara membaca kata, hanzi yang ditulis, atau pilihan katanya sama sekali.</p><p>Inilah perbedaan yang menandakan bahwa kamu belajar bahasa Mandarin di tempat lain. Apa pun yang masih diperdebatkan atau baru berubah ditandai di teksnya, tidak disajikan sebagai hal yang sudah pasti.</p>"
    calendar_html: "<p>Dua belas hari raya yang benar-benar membentuk setahun di Taiwan, masing-masing dengan aturan yang menentukan tanggalnya, bukan sekadar tanggal yang harus kamu cari lagi tahun depan.</p><p>Bagian kalender lunar menjelaskan cara hitungnya — kenapa 初五 berarti seperti itu, dan kenapa 春節 berpindah-pindah. Kedua konverter berjalan di browser: konverter 民國 hanya hitungan sederhana, dan konverter lunar memakai tabel yang sudah dicek dengan Hong Kong Observatory.</p><p>Kata-kata yang terkait dengan tiap hari raya bisa langsung ditambahkan ke bahan belajarmu dari daftar, kalau kamusnya sudah memuatnya.</p>"
    metro_html: "<p>Semua jalur jaringan MRT Taipei dan New Taipei, dengan stasiun-stasiunnya dalam urutan resmi. Ketuk sebuah stasiun, dan kartu di atas menampilkan zhuyin, pinyin, dan artinya; dari situ kamu bisa membuka entri kamus lengkap atau menambahkannya ke dek.</p><p>Titik kosong adalah stasiun transit — kartunya mencantumkan semua jalur yang melewati stasiun itu. Petanya digambar dari koordinat asli tiap stasiun, jadi letak setiap stasiun sesuai dengan letak sebenarnya.</p>"
    games_html: "<p>Kosakata mahjong Taiwan, mahjong resmi Tiongkok, xiangqi, go, dan permainan papan, tiap kata dijelaskan lewat fungsinya di dalam permainan. Ini bukan buku aturan: tujuannya supaya kamu bisa mengikuti obrolan di meja serta membaca papan petunjuk, aplikasi, dan siaran langsung.</p><p>Tab membagi kosakata menurut permainan, dan di dalam tiap permainan menurut perannya: ubin dan bidak, jalannya permainan, seruan, pola, strategi, ucapan para pemain. Titik hijau menandai kata yang diucapkan berbeda di luar Taiwan, dan kalau Tiongkok memakai kata lain, kata itu ditampilkan di samping entrinya. Arti dicek dengan kamus Kementerian Pendidikan, aturan enam belas ubin Taiwan, dan aturan resmi Tiongkok tahun 1998.</p>"
    medicine_html: "<p>Kedokteran modern seperti yang benar-benar diucapkan di Taiwan: tubuh dan organ, penyakit yang disebut dokter dan kata-kata yang dipakai keluarga di rumah, vaksin dalam jadwal CDC Taiwan, serta papan petunjuk yang kamu ikuti di rumah sakit — 掛號, 批價, 領藥. Ketuk label mana pun di gambar untuk melihat cara bacanya, lalu buka entri kamus lengkapnya.</p><p>Kalau istilah medis punya padanan sehari-hari (闌尾炎 di samping 盲腸炎), pasangan itu ditampilkan berdampingan. Istilah yang berbeda dari pemakaian di Tiongkok diberi tanda, dan kata serapan dari bahasa Hokkien Taiwan disertai bacaan Tâi-lô. Semuanya dicek dengan kamus MOE dan otoritas kesehatan Taiwan sendiri.</p>"
    dict_html: "<p>Satu kamus: kata tunggal dan ungkapan baku sama-sama menjadi entri di sini, tanpa dipisahkan. Batasnya memang sembarang — 便利商店 dan 超商 artinya sama, dan mencarinya di dua daftar terpisah tidak masuk akal.</p><p>Tombol <strong>level TOCFL</strong> menyaring ke satu tingkat ujian, baris tingkat ke skala TBCL, dan filter progres hanya menampilkan entri yang baru, sedang dipelajari, atau sudah dikuasai.</p><p>Di dalam satu level, entri diurutkan menurut <strong>frekuensi</strong> — yang paling umum muncul lebih dulu. Ganti urutannya untuk membandingkan frekuensi murni. Ketuk entri mana pun untuk melihat artikel lengkapnya, atau pakai tombol <strong>+</strong> untuk langsung memasukkannya ke dek.</p>"
    chengyu_html: "<p>成語 adalah ungkapan baku empat suku kata yang berasal dari teks klasik dan cerita perumpamaan. Makna harfiahnya sering jauh sekali dari maksudnya: 雪中送炭 secara harfiah berarti “mengirim arang di tengah salju”, tetapi maksudnya “menolong tepat saat pertolongan paling dibutuhkan”. Karena itu setiap ungkapan di sini tidak hanya diberi terjemahan, tetapi juga <strong>nuansa</strong> — memuji, netral, atau mencela. Menyebut sesuatu 十拿九穩 dan menyebutnya 莫名其妙 bedanya bagai langit dan bumi.</p><p>Daftarnya diambil dari kamus: sebagian ungkapan ditandai berdasarkan label kamus, sebagian lagi dicek secara manual — yang ini disertai catatan kapan sebenarnya dipakai, ditambah contoh nyata. Ketuk sebuah ungkapan untuk melihat entri lengkap dengan audio, uraian hanzi, dan contoh kalimat.</p>"
    tbcl_html: "<p>TBCL (臺灣華語文能力基準) adalah skala yang benar-benar dipakai untuk mengajar bahasa Mandarin di Taiwan: tujuh tingkat, dari satu sampai tujuh. Susunannya berbeda dari ujian TOCFL — mengikuti kurikulum pengajaran, bukan format tes.</p><p>Di dalam satu tingkat, entri diurutkan dari yang paling sering sampai yang paling jarang. Bilahnya menunjukkan berapa banyak isi tingkat itu yang sudah kamu kuasai — semua yang sudah dipelajari di bagian mana pun di aplikasi ikut dihitung, bukan hanya di sini.</p>"
    characters_html: "<p>4.808 hanzi tradisional umum dari daftar resmi Kementerian Pendidikan. Tiap kotak menampilkan hanzinya; ketuk untuk melihat cara baca (zhuyin + pinyin), urutan goresan, etimologi, kata-kata tempat hanzi itu muncul, dan seberapa kuat ingatanmu.</p><p>Hanzi diurutkan menurut frekuensi, jadi yang paling sering kamu temui muncul lebih dulu.</p>"
    sentences_html: "<p>Contoh kalimat lengkap yang diambil dari pelajaran. Setiap kata dalam kalimat menautkan ke entri kamusnya, jadi kamu bisa mengetuk apa pun yang belum dikenal. Pakai filter sumber untuk fokus pada satu buku atau satu pelajaran.</p>"
    search_html: "<p>Tiga kolom yang bisa dipakai bersamaan. <strong>Tulisan atau arti</strong> menerima hanzi atau kata dalam bahasa Inggris atau Rusia. <strong>Pinyin</strong> dan <strong>zhuyin</strong> menerima cara baca; nada boleh ditulis dengan tanda, dengan angka setelah tiap suku kata, atau tidak ditulis sama sekali — <code>nǐhǎo</code>, <code>ni3hao3</code>, dan <code>ni hao</code> semuanya menemukan kata yang sama. Kalau kamu menulis nadanya, entri dengan nada yang persis sama muncul lebih dulu, baru kemudian sisanya.</p><p>Centang <strong>cari di bank kalimat</strong>, maka pembagian jenis entri disingkirkan: setiap hasil berupa kalimat dengan katamu ditandai di dalamnya, sepuluh per halaman, disaring menurut level dan gaya. Kalau ada dua kata di kueri, halaman ini juga memberi tahu apakah keduanya biasa dipakai bersama.</p>"
    radicals_html: "<p>214 radikal Kangxi — bahan dasar yang menjadi tempat setiap hanzi dikelompokkan. Ketuk sebuah radikal untuk melihat hanzi yang memuatnya.</p>"
    zhuci_html: "<p>Partikel yang digantungkan bahasa Mandarin Taiwan di akhir kalimat: 啦, 喔, 耶, 嘛, 齁, dan lainnya. Partikel ini sama sekali tidak menambah arti kamus, tetapi menentukan seluruh nada bicara — kehangatan, ketidaksabaran, peringatan yang ramah, pura-pura kesal. Penutur bahasa Indonesia sebenarnya sudah punya nalurinya, berkat kan, dong, sih, deh, dan lho — meski tidak ada yang sama persis. Kartu diurutkan menurut seberapa sering tiap partikel benar-benar menutup klausa dalam korpus Taiwan kami; buka salah satunya untuk melihat seluruh rentang rasa yang dibawanya, dengan contoh yang diterjemahkan supaya suasananya tetap terasa.</p>"
    liangci_html: "<p>Kata penggolong (量詞, disebut juga kata satuan) dalam bahasa Mandarin Taiwan adalah kata kecil di antara angka dan kata benda, seperti “sebuah” dan “seekor” dalam bahasa Indonesia: 一<b>本</b>書, 三<b>隻</b>貓. Tiap entri menunjukkan apa yang dihitungnya, kata benda mana yang benar-benar memakainya, dan bagaimana tampilannya dalam kalimat nyata. Daftarnya berasal dari 教育部國語辭典簡編本, CC-CEDICT, dan korpus Taiwan kami. Ada juga permainan untuk mencocokkan kata penggolong yang tepat.</p>"
    tocfl_html: "<p>Progresmu menuju setiap level resmi TOCFL. Hitungannya mencakup setiap hanzi dan kata yang sudah kamu pelajari di bagian mana pun di aplikasi, bukan hanya di sini. Buka sebuah level untuk langsung mempelajarinya atau melihat persis apa yang tersisa.</p>"
    study_html: "<p>Geser seluruh tumpukan sekali — kartu yang salah akan kembali, yang sudah kamu tahu akan pergi. <strong>Geser ke kanan</strong> = aku tahu, <strong>ke kiri</strong> = aku tidak tahu, <strong>ke atas</strong> = terlalu mudah, <strong>ke bawah</strong> = sulit. Tombol panah juga bisa dipakai, dan mengetuk kartu akan membaliknya.</p><p>Materi baru diperkenalkan per tumpukan, dicampur dengan semua kartu yang perlu diulang. Penjadwalannya memakai FSRS, jadi kartu kembali tepat saat kamu hampir lupa.</p>"
    pronunciation_html: "<p>Ucapkan kata itu ke mikrofon; tiap suku kata dinilai dari <strong>nada</strong> dan <strong>konsonan awal/vokal akhirnya</strong>. Hijau berarti benar, kuning hampir, merah meleset. Dalam mode otomatis, latihan lanjut begitu ucapanmu benar dan mikrofon tetap terbuka sampai kamu berhasil. Lafal standar maupun lafal khas Taiwan sama-sama diterima.</p>"
    writing_html: "<p>Ingat hanzi dari arti dan cara bacanya, lalu tulis goresan demi goresan. Goresan diperiksa sesuai urutan; goresan yang salah dikembalikan. Hanzi yang sering salah muncul lebih dulu, lalu sisanya dari yang paling mudah.</p>"
    handwriting_html: "<p>Gambar hanzi tradisional goresan demi goresan, dan hanzi itu dikenali secara offline — tanpa internet, tidak ada data yang keluar dari perangkatmu. Pakai ini untuk mencari cepat ketika kamu tahu bentuknya tetapi tidak tahu cara bacanya.</p>"
    cangjie_html: "<p>Input Cangjie 5 untuk hanzi tradisional Taiwan. Ketik tombol-tombol huruf Latin yang membentuk sebuah hanzi untuk menyusunnya. Setiap halaman hanzi juga menampilkan kode Cangjie-nya.</p>"
    history_html: "<p>Apa yang baru-baru ini kamu pelajari dan seberapa kuat tiap materi. Titik-titiknya menunjukkan kekuatan ingatan per aspek (mengenali, cara baca, nada, menulis). Pakai ini untuk melihat apa yang mulai terlupa sebelum waktunya diulang.</p>"
    practice_drill_html: "<p>Kartu yang melatih dua sistem fonetik saling berhadapan. Pilih arahnya — lihat simbol zhuyin lalu ingat pinyinnya, atau sebaliknya — lalu geser ke kanan kalau kamu tahu dan ke kiri kalau tidak.</p><p>Apa pun yang salah akan muncul lagi nanti dalam putaran itu dan diingat, jadi putaran berikutnya dimulai dengan bunyi-bunyi yang masih lemah. Konsonan awal dan vokal akhir bisa dilatih terpisah.</p>"
    practice_progress_html: "<p>Dua hal berbeda di satu tempat, dan keduanya berasal dari latihan yang berbeda.</p><p><strong>Latihan bunyi</strong> menghitung putaranmu di kartu pengenalan dan latihan mengetik zhuyin, serta menunjukkan simbol yang paling sering salah. Bagian ini muncul begitu kamu menyelesaikan putaran pertama.</p><p><strong>Pelafalan lisan</strong> disusun dari percobaan lewat mikrofon: nada dan konsonan awal mana yang sudah keluar dengan mantap dan mana yang belum. Sebelum kamu berbicara ke mikrofon, bagian ini kosong — itu wajar: bagian ini tidak terhubung dengan kartu.</p>"
