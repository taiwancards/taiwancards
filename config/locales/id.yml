      badge_pair: PMI pasangan
      badge_contour: pola nada
      badge_repeat: nada berulang, biasanya dihindari
      badge_strokes: goresan
      disclaimer: Ini bukan nama jadi dan bukan rekomendasi khusus untukmu. Ini statistik catatan kependudukan — hanzi dan kombinasi mana yang lebih sering muncul daripada yang lain. Nama dipilih bersama orang yang tumbuh dengan bahasa ini; anggap daftar ini sebagai bahan obrolan itu.
      results_note: Lima calon, masing-masing dengan alasannya. Ubah jawabanmu, dan daftarnya disusun ulang.
      why_heading: Mengapa kombinasi ini cocok
      vibes:
        light: kejernihan
        virtue: kebaikan budi
        wisdom: ilmu
        strength: keteguhan
        nature: kekuatan alam
        prosperity: kemakmuran
        peace: ketenangan
        aspiration: cita-cita
      why:
        meaning_two: Nama ini menyampaikan dua hal sekaligus — %{first}, %{second}.
        meaning_one: Kedua hanzi menuju ke arah yang sama — %{first} — sehingga nama ini terasa utuh.
        meaning_single: Maknanya bertumpu pada %{text} — %{first}; hanzi yang satunya hadir demi bunyi.
        meaning_solo: "Hanya satu hanzi, dan maknanya tentang %{first}: nama diri yang pendek lebih jarang di Taiwan, jadi nama ini mudah melekat."
        meaning_plain: "Hanzi ini tidak dipungut dari kamus begitu saja: pembaca Taiwan menangkap nama seperti ini sebagai suasana, bukan sebagai kalimat."
        sound_common: Melodi %{tones} termasuk pola nama Taiwan yang paling lazim, dan mudah diucapkan tanpa tersandung.
        sound_rare: Pola nada %{tones} jarang ditemui, jadi nama ini terdengar khas tetapi tetap mudah diucapkan.
        sound_repeat: Dua nada yang sama berturut-turut biasanya dihindari di Taiwan — kedengarannya datar.
        pair_strong: "Kedua hanzi ini memang serasi: pasangan ini muncul di catatan kependudukan jauh lebih sering daripada kebetulan, jadi nama ini terdengar seperti nama sungguhan, bukan rakitan."
        pair_fresh: Catatan kependudukan tidak punya pasangan siap pakai di sini, jadi nama ini terasa milikmu sendiri, bukan diambil dari daftar.
        era_match: Kedua hanzi lazim untuk generasimu — bukan nama kakek-nenek, bukan pula nama bayi.
        era_older: "Hanzi ini lebih tua dari generasimu: nama ini membawa zaman orang tua, yang di Taiwan cenderung terdengar mantap."
        era_recent: Begini nama anak-anak yang lahir belakangan ini — namamu akan terdengar sangat muda.
        rare_char: "Hanzi %{text} jarang dipakai: orang langsung ingat namamu, tetapi akan bertanya cara menulisnya."
        gender_male: Jelas terdengar sebagai nama laki-laki.
        gender_female: Jelas terdengar sebagai nama perempuan.
        gender_neutral: Netral gender — di Taiwan nama seperti ini dipakai laki-laki maupun perempuan.
        echo: Bunyinya menggemakan nama aslimu, jadi kaitannya langsung terdengar saat kamu memperkenalkan diri.
        official: "Aman untuk dokumen resmi: kedua hanzi termasuk dalam set standar."
