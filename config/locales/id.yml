    title: Lisensi dan kredit
    intro: TaiwanCards dibangun, dengan rasa terima kasih, di atas sumber terbuka berlisensi bebas dan data bahasa resmi Taiwan. Setiap sumber ditautkan ke asal dan lisensinya.
    projects_title: Karya terbuka kami sendiri
    projects_note: "TaiwanCards bertumpu pada serangkaian riset linguistik terbuka tentang bahasa Mandarin Taiwan: pipeline korpus yang membangun datanya, analisis asal-usul yang menjaga data tetap khas Taiwan, pustaka pengolahan sinyal di balik penilaian pelafalan, dan dataset yang sudah diterbitkan. Semuanya terbuka, termasuk aplikasi ini."
    groups:
      app: Aplikasi dan persiapan datanya
      pipeline: Pembangunan korpus dan analisis asal-usul
      gems: Pustaka pengolahan sinyal
      datasets: Dataset yang diterbitkan
    works:
      taiwancards: Aplikasi belajar secara utuh — Rails, importer, pengulangan berjarak, penilaian pelafalan, simulasi ujian. Tidak ada yang disembunyikan.
      corpora: Pengunduhan, pengolahan, perapian, kalibrasi, pembersihan, dan analisis setiap sumber yang menjadi bahan kamus.
      twpipeline: Pembangunan korpus bahasa Mandarin Taiwan — sembilan tahap JSONL, dari hasil crawl mentah sampai korpus yang sudah disegmentasi dan diberi anotasi frekuensi.
      twfilter: "Analisis asal-usul: inventaris aksara, ortografi, serta penanda leksikal dan gramatikal yang membedakan bahasa Mandarin Taiwan dari pemakaian di Tiongkok, Hong Kong, dan Asia Tenggara."
      dsprb: Pengolahan sinyal suara dalam Ruby murni — dekode WAV, spektrum daya FFT, MFCC, pelacakan tinggi nada YIN. Pustaka inilah yang menilai pelafalanmu.
      dtwrb: Dynamic time warping dengan pita Sakoe-Chiba dan perataan barycenter DBA. Pustaka ini membandingkan rekamanmu dengan kontur rujukan.
      twngrams: Frekuensi n-gram kata dan hanzi dari korpus bahasa Mandarin Taiwan, dilepas ke domain publik.
      twsyllables: Inventaris suku kata beserta zhuyin, pinyin, dan sebaran nada di seluruh korpus.
      twfilter_tables: Tabel rujukan yang dipakai twfilter untuk menilai asal-usul — pasangan ortografi, penanda leksikal, inventaris aksara.
    open_source_title: Sumber terbuka
    fonts_title: Fon
    fonts_note: Ketiganya kami hosting sendiri. Dua di antaranya kami sertakan dalam bentuk yang sudah diubah, dan hal itu dinyatakan di bawah.
    corpora_title: Korpus dan kamus
    corpora_note: Setiap korpus teks di database, beserta lisensi yang menyertainya. Hanya sumber yang lisensinya mengizinkan pemakaian bebas sekaligus komersial yang ditampilkan di sini; sisanya hanya dipakai untuk statistik dan tidak ada satu kalimat pun darinya yang disimpan.
    data_title: Data rujukan
    data_note: "Lembaga yang materi rujukannya menjadi dasar aplikasi ini: daftar level, inventaris goresan, standar hanzi, tabel kalender, dan skala klasifikasi. Ini daftar fakta, bukan karya kreatif, jadi kami mencantumkannya sebagai kredit, bukan sebagai lisensi. Kalau sebuah lembaga merilis materinya dengan lisensi tertentu, lisensi itu disebutkan."
    outro: Semua konten Mandarin memakai hanzi tradisional Taiwan dan dicek silang dengan kamus Kementerian Pendidikan Taiwan. Nama, merek, dan teks pelajaran tetap menjadi milik pemiliknya masing-masing.
    items:
      moe_audio: Audio untuk hanzi dan kata. Rekaman Kementerian Pendidikan Taiwan, versi data 20260626. Berkas disajikan tanpa diubah; aplikasi hanya membatasi pemutaran pada kata entri.
      cc_cedict: Kamus komunitas Mandarin–Inggris — bacaan, arti, dan pasangan hanzi tradisional/sederhana.
      makemeahanzi: Grafik urutan goresan, penguraian radikal, dan etimologi hanzi.
      hanzi_writer: Mesin penulisan dan animasi goresan demi goresan yang dipakai dalam latihan menulis.
      hanzilookup: Pengenalan tulisan tangan yang mengubah goresanmu menjadi hanzi, sepenuhnya offline. Data pengenalnya (mmah.json) diturunkan dari data goresan Make Me a Hanzi dan tunduk pada ketentuan LGPL / Arphic PL proyek itu, bukan MIT seperti mesinnya sendiri.
      unihan: Database Han dari Unicode — bacaan kanonis dan properti hanzi.
      opencc: Tabel STCharacters, dipakai untuk mengubah hanzi sederhana menjadi hanzi tradisional saat kamu menempelkan teks. Setiap penggantian yang dilakukannya ditampilkan kembali kepadamu.
      roboto: Fon antarmuka, dipakai untuk huruf Latin dan pinyin. Kami hosting sendiri, tidak dimuat dari Google, jadi tidak ada permintaan yang terkirim ke pihak ketiga saat kamu membuka halaman.
      noto_sans_tc: Fon bawaan untuk hanzi tradisional. Juga kami hosting sendiri.
      tw_kai: "Fon kuas kaishu milik Taiwan dari CNS11643 全字庫, diterbitkan oleh 數位發展部. Fon inilah yang dipakai untuk opsi tulisan tangan, dan garis 臺 darinya menjadi dasar logo situs. Kami hanya menyertakan sebagiannya: berkasnya dikurangi menjadi hanzi yang benar-benar dipakai aplikasi ini, dan logonya memuat garis yang diambil dari fon itu, jadi salinan di sini sudah diubah, bukan asli."
      moe: Bentuk hanzi standar Kementerian Pendidikan, himpunan 4808 hanzi umum, dan frekuensi hanzi.
      bopomofo_audio: Rekaman simbol zhuyin dari paket komponen terbuka MOE 國語注音符號手冊, dirilis terpisah dengan lisensi CC BY 4.0. 2017 © 教育部,國語注音符號手冊-開放部件.
      tocfl: Daftar kosakata bertingkat resmi TOCFL, level demi level.
      naer: National Academy for Educational Research — tolok ukur TBCL, korpus COCT, dan tabel frekuensi kata umum.
      moe_strokes: Daftar baku nama goresan yang menjadi dasar inventaris goresan dasar dan goresan gabungan.
      moe_idioms: "Kamus resmi 成語: definisi, sumber klasik, kisah asal-usul, dan contoh untuk setiap idiom. Teks aslinya ditampilkan apa adanya — lisensinya melarang adaptasi; arti dan catatan dalam bahasa lain kami tulis sendiri."
      cwa: Skala curah hujan, kategori topan, dan rentang indeks UV.
      tbrs: Klasifikasi teh, tahap pengolahan, dan tingkat oksidasi kultivar Taiwan.
      hko: Tabel kalender lunar dan musim matahari (jieqi) yang menjadi dasar perhitungan tanggal hari raya.
      xiaoxuetang: Bentuk hanzi kuno hasil jiplakan — aksara tulang ramalan, aksara perunggu, dan aksara segel. Dilepas ke domain publik.
  help:
    title: Bantuan
    intro: Tur singkat tentang apa saja yang bisa kamu lakukan di sini. Semuanya dipakai bersama — kamus, pelajaran, daftar — tetapi progresmu hanya milikmu.
    sections:
      search:
        title: Cari
        body: Kotak di bagian atas mencari di semua tempat sekaligus — ketik dalam bahasa Indonesia, bahasa Inggris, pinyin (dengan atau tanpa tanda nada, atau dengan angka nada seperti xiao3), zhuyin, atau bahkan hanzi yang salah ketik. Hasilnya diurutkan; yang paling cocok muncul pertama.
      study:
        title: Dek dan belajar
        body: Dek adalah tumpukan kartu yang sedang aktif. Tambahkan kartu ke dalamnya, lalu Belajar menjalankan pengulangan berjarak (FSRS) — geser untuk menilai dirimu sendiri. Kartu muncul lagi tepat saat kamu hampir melupakannya.
      dictionary:
        title: Kamus
        body: Jelajahi Hanzi, Kata, Kalimat, Kolokasi, Kata penggolong, dan Radikal. Setiap entri menampilkan bacaan (zhuyin + pinyin), arti, dan seberapa kuat ingatanmu tentangnya.
      tocfl:
        title: TOCFL
        body: Kosakata bertingkat resmi, level demi level. Lihat seberapa siap kamu untuk setiap band dan pelajari level mana pun secara langsung.
      pronunciation:
        title: Berbicara
        body: Ucapkan sebuah kata ke mikrofon dan dapatkan umpan balik per suku kata untuk nada dan bunyimu. Mode otomatis langsung lanjut kalau ucapanmu benar dan membiarkan mikrofon tetap terbuka sampai kamu berhasil.
      writing:
        title: Menulis dan pencarian
        body: Di Menulis, kamu menulis setiap hanzi dari arti dan bacaannya. Pencarian mengenali apa yang kamu tulis; Cangjie melatih kode input.
      history:
        title: Riwayat dan statistik
        body: Riwayat adalah linimasa terbarumu — apa yang kamu pelajari dan seberapa kuat ingatannya. Statistik menunjukkan daya ingat, beban belajar, dan titik lemahmu dari waktu ke waktu.
      profile:
        title: Profil dan cadangan
        body: Ubah namamu, dan ekspor seluruh progresmu ke sebuah berkas. Setelah database dibangun ulang, impor kembali berkas itu dan lanjutkan tepat dari titik terakhirmu.
