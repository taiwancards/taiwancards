  numbers:
    rules_title: Aturan yang perlu diketahui sebelum berlatih
    rules:
      truncation:
        title: Angka di ujung berarti satuan di bawahnya
        body: Inilah sumber kebingungan utama. Satu angka di akhir tidak ditambahkan begitu saja ke bilangan — angka itu mengalikan satuan berikutnya yang lebih kecil, yang tidak diucapkan. Jadi 三百五 adalah 350, bukan 305.
        rows:
          - huayu: 三百五
            value: "350"
            note: bentuk lengkapnya 三百五十, 十 dihilangkan
          - huayu: 兩千三
            value: "2300"
            note: bentuk lengkapnya 兩千三百, 百 dihilangkan
          - huayu: 一萬五
            value: "15.000"
            note: bentuk lengkapnya 一萬五千, 千 dihilangkan
      zero:
        title: 零 bukan jeda, melainkan penghalang singkatan
        body: "Untuk mengucapkan 305, tidak cukup menyebut tiga dan lima: kamu perlu 零 di antaranya. 零 memberi tahu bahwa ada tempat yang kosong, sehingga cara baca singkat tadi batal. Satu 零 cukup untuk celah selebar apa pun."
        rows:
          - huayu: 三百零五
            value: "305"
            note: tanpa 零 ini berarti 350
          - huayu: 一千零五
            value: "1005"
            note: ratusan dan puluhan sama-sama kosong — tetap satu 零
          - huayu: 一千零五十
            value: "1050"
            note: 十 diucapkan, jadi ini puluhan, bukan satuan
          - huayu: 一萬零五
            value: "10.005"
            note: 零 juga berlaku melintasi batas 萬
      liang:
        title: 兩 atau 二 tergantung yang mengikutinya
        body: "二 adalah angkanya sendiri: saat berhitung, dalam bilangan, dalam 十二 dan 二十. 兩 dipakai saat “dua” itu menghitung sesuatu: sebelum kata penggolong dan sebelum 百, 千, 萬, 億. Ada satu pengecualian penting: sebelum 十 selalu 二."
        rows:
          - huayu: 二
            value: "2"
            note: angka saja, saat berhitung
          - huayu: 二十
            value: "20"
            note: tidak pernah 兩 sebelum 十
          - huayu: 十二
            value: "12"
            note: dua di posisi satuan juga 二
          - huayu: 兩百
            value: "200"
            note: 兩 sebelum 百; di Taiwan orang tidak bilang 二百
          - huayu: 兩千三百二十二
            value: "2322"
            note: 兩 sebelum 千, 二 di puluhan dan satuan — semuanya dalam satu bilangan
          - huayu: 兩個人
            value: 2 orang
            note: selalu 兩 sebelum kata penggolong
      shi:
        title: 十 di awal tidak perlu 一
        body: Dari 10 sampai 19, 十 berdiri sendiri. Begitu ada satuan yang lebih besar di depannya, “satu”-nya kembali muncul.
        rows:
          - huayu: 十五
            value: "15"
            note: tidak ada yang bilang 一十五
          - huayu: 一百一十五
            value: "115"
            note: di sini 一 sebelum 十 wajib
          - huayu: 一百一
            value: "110"
            note: singkatan lisan menurut aturan angka di ujung
