    language: Bahasa
    interface_language: "Bahasa antarmuka dan seluruh isinya. Yang berganti bukan hanya tombol dan menu: arti kata, catatan, penjelasan tata bahasa, dan uraian ditulis dalam setiap bahasa dan ikut berganti."
    hanzi_font_toggle: Gaya huruf hanzi
    hanzi_font_hint: "Gaya huruf hanzi. Aktif: kaishu, gaya kaligrafi yang memperlihatkan goresan seperti ditulis tangan. Nonaktif: huruf sans polos. Aktif secara bawaan."
    readings_toggle: Zhuyin dan pinyin
    audio_rate_toggle: Kecepatan audio
    audio_rate_hint: "Kecepatan putar dalam tiga tingkat: normal, ¾, dan ½. Saat diperlambat, bunyi direntangkan tanpa mengubah tinggi nada, jadi nadanya tetap utuh. Berlaku untuk semua tombol dengar sampai kamu mengubahnya."
    detail_toggle: Kelengkapan halaman kamus
    detail_hint: "Seberapa banyak yang ditampilkan halaman kamus. 詳 — semua yang kami punya: skor kelangkaan, sebaran ragam bahasa, kartu pengingat, tesaurus, kisah asal-usul. 簡 — yang dipakai sehari-hari: bacaan, arti, kelas kata, kata penggolong, sinonim dan antonim, latihan goresan, beberapa kalimat. Awalnya 簡 sampai kamu melewati TOCFL Novice, lalu 詳; setelah itu tetap seperti yang kamu pilih."
    script_setup_hint: "Cara bahasa ditampilkan: gaya huruf, pinyin, kecepatan audio, kata versi Tiongkok, kelengkapan halaman kamus — dan bahasa yang kamu pakai untuk membaca situs ini."
    china_toggle: Tampilkan kata versi Tiongkok
    china_hint: "Kata yang dipakai di Tiongkok. Aktif: baris kecil di kartu menunjukkan kata yang dipakai di Tiongkok. Nonaktif: tidak ada tambahan. Nonaktif secara bawaan — aplikasi ini mengajarkan kata Taiwan; kata Tiongkok hanya sebagai rujukan."
    readings_hint: "Bacaan di atas hanzi, dalam tiga pilihan: zhuyin saja, zhuyin dengan pinyin, atau tidak ada sama sekali. Pinyin tidak pernah tampil tanpa zhuyin — Taiwan membaca dengan zhuyin. Bawaannya zhuyin saja, dan pilihanmu berlaku di semua halaman sampai kamu mengubahnya."
