          other: kartu untuk hari ini
        body: Ini kata-kata yang perlu diulang sekarang — sekitar %{minutes} menit. Kalau diulang tepat waktu, kata-kata ini bertahan di ingatan jauh lebih lama.
        button: Mulai mengulang
      still_due:
