  support:
    title: Dukung situs ini
    lede: TaiwanCards gratis, tanpa iklan, dan tidak menjual apa pun — dan akan tetap begitu.
    body: Satu hal yang tidak gratis adalah tagihan server. Aplikasi dan database-nya berjalan siang dan malam, dan makin banyak orang yang belajar di sini, makin besar tagihannya. Kalau situs ini sudah berguna buatmu dan kamu ingin membantu, tombol di bawah inilah tempatnya. Tombol itu tidak membeli apa pun dan tidak membuka fitur apa pun — semua orang mendapat situs yang sama — jadi kalau kamu menutup halaman ini dan tidak memikirkannya lagi, tidak apa-apa, sungguh.
    button: Traktir servernya
    outside: Tombol ini membawamu ke Buy Me a Coffee, layanan terpisah, di tab baru.
