      heading: Tangan kanan gurumu
      limits: Pelafalan paling baik dibangun bersama guru secara langsung, dan aplikasi ini tidak menggantikan kelas sungguhan. Yang kamu dapat adalah pemeriksaan nada dan pelafalan — di sini tidak ada teman bercakap dan tidak ada latihan pemahaman mendengarkan, dan aplikasi ini memang tidak bermaksud menyediakannya.
