    about_title: Asal-usul zhuyin
    about:
      origin: Simbol-simbol ini dirancang oleh Zhang Binglin, yang mengambil bentuk baku dari hanzi kuno yang bacaannya mengandung bunyi tersebut. Karena itulah ㄅ, ㄆ, dan ㄇ tampak seperti hanzi — dulu memang hanzi.
      adopted: Taiwan memakai sistem ini sejak 1945, dan sampai sekarang zhuyin tetap menjadi cara utama mengajarkan pelafalan bahasa Mandarin di SD.
      size: Tiga puluh tujuh simbol dan lima tanda nada sudah cukup untuk menulis bunyi apa pun dalam bahasa Mandarin. Nada pertama biasanya tidak ditandai, dan titik di atas menandakan nada netral.
      today: Kini zhuyin adalah cara paling umum di Taiwan untuk mengetik hanzi di komputer atau ponsel dan untuk mencarinya di kamus. Buku pelajaran mencetaknya sebagai anotasi kecil di samping hanzi.
      hokkien: Dua puluh tiga simbol tambahan dibuat untuk bahasa Hokkien Taiwan — sistem yang sama, diperluas untuk bahasa lain di Taiwan.
    practice_now:
      title: Langsung latih
      initials: Dua puluh satu konsonan awal, dikelompokkan dalam blok menurut tempat pengucapannya. Lanjutkan membaca setelah semuanya bisa kamu kenali lewat pendengaran tanpa ragu.
      finals: Enam belas bagian akhir. Latihannya sama, tanpa huruf Latin di layar.
      tricky: Enam ejaan tempat pinyin menyembunyikan bunyi bagian akhir yang sebenarnya. Latihannya mencampurnya dengan bunyi yang mirip, jadi kamu akan tahu apakah kamu membaca zhuyin atau huruf Latinnya.
      cta: Ke latihan mendengarkan →
