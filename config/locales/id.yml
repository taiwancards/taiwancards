          other: kartu untuk kembali ke ritme
        body: Libur seminggu itu wajar, dan progresmu tetap tersimpan. Kami memilihkan sedikit kartu yang paling penting — sekitar %{minutes} menit. Sisanya menyusul pelan-pelan.
        button: Kembali ke kata-kataku
      last_call:
        subject: Semua yang sudah kamu pelajari tetap tersimpan
        preheader: Pengingat terakhir — setelah ini kami tidak akan mengganggumu.
        title:
          one: kartu untuk kembali dengan santai
          other: kartu untuk kembali dengan santai
        body:
