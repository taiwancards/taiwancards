  glossary:
    fsrs: "Algoritme pengulangan berjarak: dari penilaianmu sendiri, algoritme ini memperkirakan saat kamu hampir lupa sebuah kartu, lalu menampilkannya tepat saat itu."
    tocfl: Ujian nasional kemahiran bahasa Mandarin di Taiwan beserta skala levelnya, dari Novice sampai Band C.
    tbcl: "Taiwan Benchmarks for the Chinese Language: standar nasional Taiwan dengan tujuh level untuk pengajaran bahasa Mandarin sebagai bahasa kedua."
    zhuyin: Alfabet fonetik Taiwan, ㄅㄆㄇㄈ. Anak-anak di Taiwan mempelajarinya sebagai ganti pinyin, dan orang mengetik dengannya.
    pinyin: Penulisan suku kata Mandarin dengan huruf Latin. Utama di Tiongkok, hanya alat bantu tambahan di Taiwan.
    putonghua: Ragam baku bahasa Mandarin di Tiongkok.
    hokkien: Bahasa Hokkien Taiwan (Taigi), bahasa Min Selatan yang dituturkan sebagian besar penduduk Taiwan. Ini bahasa tersendiri, bukan dialek bahasa Mandarin — dan dari Hokkien-lah datang kata Indonesia seperti teh, mi, dan tahu.
    hanzi: Bentuk hanzi lengkap yang dipertahankan di Taiwan, Hong Kong, dan Makau, berbeda dari hanzi sederhana yang dipakai di Tiongkok.
