    compare:
      heading: Dibanding aplikasi yang mungkin sudah kamu pakai
      summary: "Aplikasi belajar bahasa Mandarin hampir selalu mengajarkan varian Tiongkok, sedangkan alat serbaguna yang kuat menyerahkan pilihan sulit kepadamu: dek yang mana, kata apa berikutnya, seberapa sering. TaiwanCards sengaja lebih sempit, dan mengambil keputusan itu sendiri."
      honest: "Semua itu tidak membuat aplikasi lain jadi buruk, dan kebanyakan memang tidak berusaha mengajarkan bahasa Mandarin Taiwan. Ekosistem Anki tidak ada tandingannya. Kamus Pleco jauh lebih dalam daripada apa pun di sini. Penilaian tulisan tangan per goresan di Skritter adalah yang terbaik di kategorinya. Dan Duolingo paling jago membuatmu kembali lagi besok. Zhong Chinese, yang baru lahir di Taipei, adalah satu-satunya tempat lain di sini yang mengajarkan bahasa Mandarin Taiwan, bukan Mandarin Tiongkok, dan tampilannya enak dilihat — materinya mengikuti satu buku pelajaran dan kamusnya kecil, tetapi isinya asli. 嗨嗨 \U0001F44B\U0001F3FB"
