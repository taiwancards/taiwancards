    speak: Berbicara
    write: Menulis
    title: Dasar
    intro: Pelajari bunyi bahasa Mandarin dari dasar — sistem bacaannya dulu, baru pelafalan.
    initials: Konsonan awal (inisial)
    finals: Bagian akhir (vokal)
    play: Putar
    col_pinyin: Pinyin
    col_palladius: Palladius
    palladius_note: ""
    col_zhuyin: Zhuyin
    col_ipa: IPA
    col_analogy: Bunyinya seperti
    col_example: Contoh
    pinyin_intro: Romanisasi yang dipakai di seluruh aplikasi. Setiap bunyi lengkap dengan IPA, perbandingan sederhana, dan contoh kata.
    zhuyin_intro: Aksara fonetik Taiwan. Kamu bisa mempelajarinya berdampingan dengan pinyin, atau langsung dari bunyinya. Tabelnya sama, keduanya ditampilkan.
    drill:
      lede: "Mencocokkan dua sistem tulisan: lihat simbolnya, sebutkan ejaan Latinnya, dan sebaliknya. Di sini pinyin hanya jembatan, bukan fondasi."
      title: Zhuyin ↔ pinyin
      direction_zhuyin: Zhuyin → pinyin
      direction_pinyin: Pinyin → zhuyin
      systems_html: "Zhuyin adalah 37 simbol yang dipakai Taiwan untuk menuliskan bunyi. Setiap simbol selalu dibaca sama, dan kamu tidak bisa mengarang bacaannya — kamu cukup mempelajari bunyinya. Pinyin menuliskan bunyi yang sama dengan huruf Latin; pinyin hanya alat bantu, tidak lebih. Yang perlu kamu lakukan: kerjakan tabel-tabel di bawah sampai kamu bisa mengenali simbolnya lewat pendengaran."
      stage_hint: "Kerjakan berurutan: konsonan dulu, lalu vokal dan bunyi luncur, lalu bagian akhir lengkap, baru kemudian suku kata utuh."
      stages:
        consonants: Konsonan
        vowels: Vokal
        finals: Bagian akhir
        syllables: Suku kata utuh
      prompt_zhuyin: Ini pinyin apa?
      prompt_pinyin: Ini zhuyin apa?
      keys: Geser kartu ke arah jawabanmu, atau pakai tombol panah
      done_title: Putaran selesai
      restart: Lagi
      see_chart_zhuyin: Tabel zhuyin
      see_chart_pinyin: Tabel pinyin
      card: Cocokkan zhuyin dengan pinyin dua arah, dengan menggeser kartu.
      syllable_title: Susunan suku kata bahasa Mandarin Taiwan
      syllable_body: Setiap suku kata paling banyak terdiri atas tiga slot. Hanya slot terakhir yang wajib — 一 hanya bagian akhir saja, 四 konsonan awal tanpa vokal tertulis sama sekali. Zhuyin menuliskan setiap slot; pinyin sering menggabungkan atau menghilangkannya.
      slots:
        initial_label: Konsonan awal 聲母
        initial_glyph: ㄓ
        initial_body: Salah satu dari 21 konsonan. Tidak wajib — banyak suku kata dimulai dengan vokal.
        medial_label: Medial 介音
        medial_glyph: ㄨ
        medial_body: Salah satu dari tiga bunyi luncur, ㄧ ㄨ ㄩ. Slot inilah yang paling sering disembunyikan pinyin.
        final_label: Bagian akhir 韻母
        final_glyph: ㄥ
        final_body: Vokal, diftong, atau vokal dengan -n atau -ng. Satu-satunya slot yang wajib.
      tones_title: Letak tanda nada
      tones_body: "Pinyin menaruh tanda diakritik di atas vokal utama: mā má mǎ mà. Zhuyin tidak menandai nada pertama dan menulis ˊ ˇ ˋ sesudah simbolnya — ㄇㄚ ㄇㄚˊ ㄇㄚˇ ㄇㄚˋ. Nada netral menjadi pengecualian di keduanya: pinyin cukup menghilangkan tandanya, zhuyin menaruh titik ˙ di depan, seperti ˙ㄉㄜ. Dalam tulisan tegak dari atas ke bawah, zhuyin berjalan vertikal di sebelah kanan hanzi yang dianotasinya, termasuk tanda nadanya."
      mismatch_title: Tempat pinyin menyesatkanmu
      mismatch_body: "Ini bukan pengecualian yang harus dihafal. Semuanya berasal dari satu keputusan: agar ejaannya pendek, pinyin membuang vokal dari tengah suku kata, memakai satu huruf untuk bunyi yang berbeda, dan kadang menulis huruf di tempat yang sama sekali tidak ada bunyinya. Zhuyin tidak menulis apa pun yang tidak diucapkan — jadi kolom zhuyin menunjukkan susunan suku kata yang sebenarnya."
      mismatch_pinyin: Pinyin
      mismatch_zhuyin: Zhuyin
      mismatch_why: Yang sebenarnya terjadi
      mismatch:
        zhong:
          pinyin: zhong
          zhuyin: ㄓㄨㄥ
          why: zh adalah ㄓ, tetapi o itu bukan ㄛ. Bagian akhir -ong sebenarnya -ung seperti pada “gunung”, jadi zhuyin menulis bunyi luncur ㄨ dan bagian akhir ㄥ.
        jiu:
          pinyin: jiu
          zhuyin: ㄐㄧㄡ
          why: Bagian akhirnya -iou; pinyin membuang vokal tengah agar ejaannya pendek. Zhuyin mempertahankan ㄧ dan ㄡ.
        hui:
          pinyin: hui
          zhuyin: ㄏㄨㄟ
          why: Trik yang sama — bagian akhirnya -uei, dan pinyin menelan e-nya. Zhuyin menulis ㄨ dan ㄟ.
        yu:
          pinyin: yu
          zhuyin: ㄩ
          why: y di sini bukan konsonan, hanya pembawa vokal, dan u-nya sebenarnya ü. Satu bunyi, jadi zhuyin menulis satu simbol.
        zhi:
          pinyin: zhi
          zhuyin: ㄓ
          why: i itu sama sekali tidak menandai vokal — itu lidah retrofleks yang ditahan. Zhuyin tidak menulis apa pun sesudah ㄓ, karena memang tidak ada apa-apa di sana.
        weng:
          pinyin: weng / -ong
          zhuyin: ㄨㄥ
          why: Dua ejaan pinyin yang berbeda untuk bagian akhir yang sama persis, tergantung ada tidaknya konsonan di depannya. Dalam zhuyin, keduanya ㄨㄥ.
      mismatch_more_title: Yang perlu diingat
      mismatch_more_body: "Pembaca pinyin terus-menerus membuat koreksi diam-diam: di sini o sebenarnya u, di sini ada vokal yang hilang, di sini i sama sekali bukan vokal, di sini u sebenarnya ü. Setiap koreksi itu adalah tempat pelafalan yang salah bisa tertanam, dan biasanya pelajar tidak pernah menyadarinya, karena ejaannya tampak masuk akal. Zhuyin tidak meminta satu koreksi pun: yang ditulis itulah yang diucapkan."
