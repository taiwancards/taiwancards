    practice_pending: "Latihan mengucapkan nada dengan suara belum tersedia: fitur ini hadir setelah pengenalan suara yang memeriksa kontur dan norma Taiwan terpasang. Untuk sekarang, yang dilatih hanya mengenali nada lewat pendengaran."
