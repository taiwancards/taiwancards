ru:
  pron:
    legend:
      title: "Что значат цвета"
      body: "Ста баллов не набирает никто — их не набирают и тайваньские дикторы. Зелёный означает, что придираться не к чему. Жёлтый — что вас поймут с первого раза. Обращать внимание стоит только на красное."
    levels:
      green:
        name: "Отлично"
        note: "Звучит естественно. Дальше улучшать нечего."
      amber:
        name: "Понятно"
        note: "Акцент слышен, но слог узнаётся правильно. Этого достаточно, чтобы вас поняли."
      red:
        name: "Стоит поправить"
        note: "Слог узнаётся с трудом. Разберите подсказку и повторите."
      dark:
        name: "Не разобрать"
        note: "Собеседник услышит другой слог или не поймёт вовсе."
      gray:
        name: "Не измерено"
        note: "Для этого слога нет надёжного эталона — оценку не показываем, чтобы не сбивать с толку."
    parts:
      initial: "Инициаль"
      medial: "Медиаль"
      final: "Финаль"
      tone: "Тон"
      timbre: "Слог целиком"
      absent: "нет"
      empty_rime: "空韻"
    weight: "вес %{percent}%"
    weight_hint: "Вес показывает, насколько эта часть важна именно в этом слоге: чем больше похожих слогов, которые от него отличаются только ей, тем сильнее она влияет на общую оценку."
    chart:
      title: "Кривая тона"
      reference: "эталон"
      yours: "вы"
      band: "разброс дикторов"
      semitones: "полутоны"
    ui:
      chart_hint: "Полоса — как этот слог реально произносят живые дикторы: внутри неё отклонение не штрафуется. Пунктир — её середина, сплошная линия — вы, красным подсвечено, где вы вышли за полосу."
      chart_range: "Шкала — полутона от середины вашего голоса: видно не только форму тона, но и на какой высоте вы его взяли."
      parts_title: "Из чего складывается оценка"
      fix_title: "Что поправить"
      reference: "Как это устроено"
      not_measured: "не измеряется"
      no_template: "Для этого слога у нас нет эталона — оценить его не с чем. Это не ошибка произношения."
      risky: "Этот слог мы распознаём хуже остальных: оценка может оказаться строже, чем вы заслуживаете. Новичкам такие слоги не показываем — здесь они на ваш страх и риск."
      no_part: "в этом слоге нет"
      details: "Подробно"
      hide: "Свернуть"
      flow_title: "Связность"
      read_title: "Что услышано"
      focus_title: "Над чем поработать"
      focus_empty: "Позанимайтесь немного — и здесь появятся персональные рекомендации."
      focus_attempts:
        one: "%{count} попытка"
        few: "%{count} попытки"
        many: "%{count} попыток"
        other: "%{count} попытки"
      focus_bias: "Систематическое отклонение"
      focus_drill: "Отработать"
      trend_up: "растёт"
      trend_down: "падает"
      trend_flat: "без изменений"
      mastered: "освоено"
      warmup_title: "Разминка голоса"
      warmup_hint: "Полминуты — и оценка тона станет точнее: система запомнит высоту и тембр вашего голоса."
      warmup_start: "Начать разминку"
      warmup_redo: "Пройти заново"
      warmup_done: "Голос настроен"
      warmup_next: "Дальше"
      warmup_skip: "Пропустить"
      warmup_saved: "Записано"
      warmup_listen: "Послушать ещё раз"
      warmup_anchors: "Первый и третий тон вышли почти на одной высоте — так оценка тона будет неточной. Повторим только четыре слога: 媽 заметно выше обычной речи, 馬 в самый низ голоса, между ними должна быть слышная разница."
      metrics: "Детали"
      copy: "Скопировать"
      sandhi: "Внимание: читается не так, как пишется —"
      warmup_why: "Без разминки тон оценивается по форме кривой, но не по абсолютной высоте: бас и сопрано поют один и тот же тон на разных частотах. Разминка даёт точку отсчёта."
    codes:
      near: "Грубых ошибок нет, но до эталона слог не дотягивает."
      tone:
        wrong: "Прозвучал тон %{got}, а нужен %{tone}."
        shape: "Кривая расходится с эталоном тона %{tone}."
        falls: "Голос пошёл вниз, а тон %{tone} идёт вверх."
        rises: "Голос пошёл вверх, а тон %{tone} идёт вниз."
      initial:
        under_aspirated: "Придыхания не хватает: %{initial} прозвучал ближе к %{pair}."
        over_aspirated: "Придыхания слишком много: %{initial} прозвучал ближе к %{pair}."
        vot_off: "Голос включается не в тот момент относительно размыкания."
      sibilant:
        too_front: "Шум слишком высокий и передний для /%{ipa}/."
        too_back: "Шум слишком низкий и задний для /%{ipa}/."
      medial:
        weak: "Медиаль почти пропала."
      vowel:
        open: "Гласный открытее нормы."
        close: "Гласный закрытее нормы."
        front: "Гласный сдвинут вперёд."
        back: "Гласный сдвинут назад."
        apical: "После %{initial} отдельного гласного нет: звук тянется там же, где согласный."
      coda:
        weak: "Носовая кода почти не прозвучала."
        heavy: "Носовой призвук слишком сильный — гласный назализуется раньше времени."
        ng_for_n: "Кода -n прозвучала как -ng."
        n_for_ng: "Кода -ng прозвучала как -n."
      duration:
        long: "Слог длиннее нормы."
        short: "Слог короче нормы — тон не успевает развернуться."
        neutral_long: "Нейтральный тон должен быть коротким."
      timbre:
        drift: "Общая окраска слога уходит от эталона."
      lead_in:
        noisy: "Перед слогом %{ms} мс постороннего звука — вдох или шум. Сквозь него инициаль не проверяется: начинайте слог сразу после сигнала."
      flow:
        ok: "Слоги связаны так, как в живой речи."
        choppy: "Между слогами слишком длинные паузы — слова распадаются на отдельные слоги."
        pitch_reset: "Голос заново берёт высоту на каждом слоге: звучит как список, а не как фраза."
        clipped: "Громкость проваливается на стыках — слоги обрываются, не переходя друг в друга."
      read:
        ok: "Прочитано то, что написано."
        doubtful: "Запись плохо сходится с написанным — возможно, прозвучало не то."
        mismatch: "Похоже, прочитано не то, что написано."
    fixes:
      near: "Повторите, ориентируясь на эталон."
      tone:
        wrong: "Ведите голос по эталонной кривой на графике."
        shape: "Сверьтесь с графиком: посмотрите, где ваша линия расходится с эталоном."
        falls: "Начните ниже и тяните голос вверх до конца слога."
        rises: "Начните выше и опускайте голос до конца слога."
      initial:
        under_aspirated: "Усильте выдох после размыкания — воздух должен пойти заметно раньше голоса."
        over_aspirated: "Включайте голос сразу после размыкания, без выдоха между ними."
        vot_off: "Следите за стыком согласного и гласного."
      sibilant:
        too_front: "Отодвиньте язык назад."
        too_back: "Продвиньте язык вперёд."
      medial:
        weak: "Медиаль короткая, но проглатывать её нельзя — произнесите отчётливо."
      vowel:
        open: "Прикройте челюсть и поднимите язык."
        close: "Опустите челюсть."
        front: "Отодвиньте язык назад."
        back: "Продвиньте язык вперёд."
        apical: "Не подставляйте сюда и: держите язык на согласном и просто продлите его с голосом."
      coda:
        weak: "Дотяните конец слога: воздух должен пойти через нос, слог не обрывается на гласном."
        heavy: "Держите гласный чистым и включайте нос только в самом конце слога."
        ng_for_n: "Кончик языка к альвеолам, спинка не поднимается к мягкому нёбу."
        n_for_ng: "Задняя часть спинки к мягкому нёбу, кончик языка свободен."
      duration:
        long: "Возьмите естественный темп."
        short: "Дайте слогу дозвучать."
        neutral_long: "Сократите — нейтральный слог безударный."
      timbre:
        drift: "Послушайте эталон и повторите за ним целиком."
      flow:
        choppy: "Прочитайте фразу на одном дыхании, не останавливаясь между слогами."
        pitch_reset: "Ведите одну общую линию голоса через всю фразу: следующий слог продолжает высоту предыдущего."
        clipped: "Не обрывайте голос на стыке — тяните звук из слога в слог."
      read:
        doubtful: "Сверьтесь с текстом и прочитайте ещё раз."
        mismatch: "Сверьтесь с текстом: оценка считается по написанному."
    confusion:
      tone_only: "Звуки верны, но тон %{tone} вместо %{expected_tone}"
      segments_only: "Тон верен, но прозвучало /%{syllable}/ вместо /%{expected_syllable}/"
      both: "Прозвучало /%{syllable}/ тоном %{tone} вместо /%{expected_syllable}/ тоном %{expected_tone}"
    tones:
      "1": "Ровно и высоко, на одной высоте до конца. В русском ровных слогов почти нет, поэтому кажется, что тянете слишком долго."
      "2": "Снизу вверх, как в русском переспросе «Да?». Начните ниже, чем кажется нужным, иначе подниматься будет некуда."
      "3": "В Тайване это низкий тон: голос падает вниз и там остаётся, часто с хрипотцой. Финального подъёма из учебников (214) в обычной речи нет."
      "4": "Резко сверху вниз, как отрывистое «Стоп!». Начните высоко и падайте быстро."
      "5": "Нейтральный: коротко, слабо, без собственной мелодии — высоту задаёт предыдущий слог."
    initials:
      b: "Глухой «п» без придыхания. Не русское «б»: голос включается только вместе с гласным."
      p: "«П» с сильным выдохом — лист бумаги у рта должен дёрнуться. Русское «п» для этого слишком сухое."
      m: "Как русское «м»."
      f: "Как русское «ф»."
      d: "Глухой «т» без придыхания и без смягчения. Не «д» и не «ть»."
      t: "«Т» с сильным выдохом. Русское «т» звучит как ㄉ."
      n: "Как русское твёрдое «н», кончик языка у альвеол."
      l: "Кончик языка у альвеол; мягче русского «л» в «лапа», но не «ль»."
      g: "Глухой «к» без придыхания. Не русское «г»."
      k: "«К» с сильным выдохом — придыхание и есть единственное отличие от ㄍ."
      h: "Русское «х» подходит почти точно."
      j: "Кончик языка упирается в нижние зубы, средняя спинка — к твёрдому нёбу. Не «дь» и не «ч»."
      q: "То же место, что у ㄐ, но с сильным выдохом. Русское «ч» твёрже и без придыхания."
      x: "Не «щ» и не «сь»: кончик языка остаётся внизу, у нижних зубов, работает средняя спинка."
      zh: "Кончик языка загнут вверх и назад. Близко к русскому «ч», но твёрже и без придыхания."
      ch: "Как ㄓ, но с сильным выдохом."
      sh: "Русское «ш» подходит: язык уже стоит почти правильно."
      r: "Русское «ж» в положении «ш», без округления губ. В Тайване часто ближе к английскому r."
      z: "Русское «ц», но без придыхания и в начале слога."
      c: "«Ц» с сильным выдохом — придыхание отличает его от ㄗ."
      s: "Как русское «с»."
    medials:
      i: "Короткое «и» — проскакивает быстро, но должно быть слышно."
      u: "Короткое «у», губы округляются заранее."
      ü: "Губы как для «у», язык как для «и» — держите обе позиции одновременно."
    rimes:
      a: "Открытое «а», челюсть опущена."
      o: "Округлённое «о»; после ㄅㄆㄇㄈ звучит почти как «уо»."
      e: "Русского аналога нет: язык как для «ы», но отодвинут назад и вниз, губы не растянуты."
      ê: "Открытое «э», как в «этот»."
      ai: "«Ай», первый элемент — полное открытое «а»."
      ei: "«Эй», короче и закрытее, чем ㄞ."
      ao: "«Ао»: начинается с «а», уходит в «о», губы округляются к концу."
      ou: "«Оу», как в английском know."
      an: "«Ан» без смягчения: кончик языка к альвеолам, гласный передний."
      en: "Слабое «эн», гласный безударный и короткий."
      ang: "Глубокое заднее «а» плюс носовое «нг» — без «г» на конце."
      eng: "Слабый гласный плюс «нг»: задняя часть спинки к мягкому нёбу."
      er: "«Ар» с загнутым языком, как английское are."
      i: "Долгое чистое «и», без призвука «й» на конце."
      u: "Долгое «у» с сильным округлением губ."
      ü: "Губы как для «у», язык как для «и»."
      empty: "Особая «жужжащая» гласная без своего символа: язык остаётся ровно там, где был согласный, и просто продолжает звучать. Ни «и», ни «ы»."
