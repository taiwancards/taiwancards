    exam:
      title: Kỳ thi TOCFL
      lede: "Kỳ thi năng lực tiếng Quan thoại của Đài Loan dành cho người nước ngoài, do SC-TOP (國家華語測驗推動工作委員會, Ủy ban thúc đẩy kỳ thi năng lực Hoa ngữ) tổ chức. Ngày thi diễn ra thế nào, điểm được tính ra sao và mỗi cấp mở ra những gì."
      tests_title: Bốn bài thi
      tests_body: "Nghe và đọc thi cùng nhau trên máy tính, thành một bài (聽讀測驗). Nói (口語) và viết (寫作) là hai bài thi riêng, đăng ký theo từng nhóm cấp. Trẻ em có kỳ thi riêng là CCCC."
      adaptive_title: Một lần thi cho mọi cấp
      adaptive_body: "Bài nghe và đọc là bài thi thích ứng: bạn không cần chọn cấp. Trả lời đúng thì câu hỏi khó dần, sai thì dễ đi, và bài thi dừng lại khi đã xác định được trình độ. Không thể quay lại câu trước, và điểm hiện ngay trên màn hình khi thi xong."
      listening: "Nghe: khoảng 35 câu trong khoảng 50 phút, sau mỗi đoạn ghi âm có 10 giây để trả lời. Gồm tranh, hỏi đáp, hội thoại ngắn và đoạn dài."
      reading: "Đọc: khoảng 35 câu trong 60 phút. Gồm câu đơn, tranh, điền vào chỗ trống và đọc hiểu đoạn văn."
      scores_title: Điểm và cấp độ
      scores_body: "Điểm được quy về thang tối đa 700. Nghe và đọc có ngưỡng đạt riêng, nên hai kỹ năng có thể đạt cấp khác nhau."
