      items:
        taiwan: >-
          Tiếng Quan thoại của Đài Loan và không gì khác — chữ phồn thể, chú âm, các cấp TOCFL và cấp học của
          trường Đài Loan
        decks: >-
          Giống Anki, nhưng không có bộ thẻ của người lạ, cũng không mất cả buổi tối tự gõ thẻ — và mỗi từ ở
          đây là năm trí nhớ riêng biệt, không phải một cú vuốt biết / không biết
        dictionary: >-
          Giống Pleco, nhưng không chỉ để tra cứu — cùng một mục từ nuôi các bài luyện và một lịch học quyết
          định bạn sẽ gặp gì tiếp theo, với Đài Loan đứng đầu chứ không phải một chú thích bên lề
        writing: >-
          Giống Skritter, nhưng viết chữ không phải một ứng dụng riêng với danh sách riêng — bạn vẽ chính những
          chữ đang học tuần này, và nó được tính vào cùng một tiến độ
        reading: >-
          Giống Du Chinese, nhưng không ai chọn văn bản thay bạn: một bài hát bạn thích, một bản tin, tài liệu
          trên lớp hay một tin nhắn — dán vào là nhận lại văn bản đã tách từ, sẵn sàng thành bộ thẻ
        photo: >-
          Chụp thực đơn trên tường hay biển hiệu ngoài phố, những chữ bạn không đọc được sẽ quay lại dưới dạng
          từ đã tách, sẵn sàng thành bộ thẻ
        speaking: >-
          Không phải bộ nhận dạng chỉ trả lời đúng hay sai — mỗi âm tiết bạn nói được chấm chất lượng trên mười
          chín đặc trưng âm học, theo đúng cách người Đài Loan nói
        everyday: >-
          Đài Loan mà không khóa học nào dạy: gọi đồ ở quán trà sữa, xổ số hóa đơn, thuê nhà, phòng khám, ngày
          nghỉ bão
        corpus: >-
          Mỗi câu ví dụ đều do một người ở Đài Loan thực sự viết, được giữ cùng nguồn và giấy phép của nó
        measured: >-
          Không có gì ở đây là đoán: một từ phổ biến đến đâu, khó đến đâu và thuộc cấp nào đều đến từ việc đếm
          trên một kho ngữ liệu Đài Loan thật
        memory: >-
          Một hồ sơ tiến độ duy nhất đứng sau mọi màn hình: học một từ trong công cụ đọc thì nó được tính ở từ
          điển, bài luyện và bài luyện viết
    isnt:
      heading: Đây không phải là gì
      items:
        game: >-
          Không phải trò chơi — không có điểm kinh nghiệm, huy hiệu, bảng xếp hạng, và không có con vật hoạt hình
          nào làm bạn áy náy để mai quay lại
        machine: >-
          Không có nội dung tiếng Quan thoại do AI tạo ra — và sẽ không bao giờ có. Mọi nghĩa, ví dụ và nhãn
          đều đã qua tay người, và mọi câu đều truy được về một nguồn kiểm chứng được. Bản tiếng Việt của giao
          diện và phần giải thích được biên soạn có máy hỗ trợ và đang được người bản ngữ Hà Nội rà soát
        decks: >-
          Không phải một đống bộ thẻ chia sẻ mà không ai nói được ai làm ra, từ giáo trình nào, hay cách đọc có
          đúng với Đài Loan không
        china: >-
          Không phải một khóa học của Trung Quốc được thay sang chữ phồn thể — từ vựng, cách đọc và một nửa thực
          tế đời sống cũng khác nhau
        words: >-
          Không né tránh những từ như 自由, 民主 hay 人權 — chúng là một phần của đời sống Đài Loan, và không có danh
          sách nào vắng chúng
        course: >-
          Không phải một chương trình phải ngồi học từ bài đầu tới bài cuối — bạn bắt đầu từ chỗ mình đang đứng,
          lấy những gì cần và bỏ qua những gì không cần
        teacher: >-
          Không thay thế giáo viên — đây là nửa việc bạn làm giữa các buổi học, nửa không ai nhìn thấy, và chính
          nửa đó quyết định bạn có tiến bộ hay không
        hsk: >-
          Không phải để luyện thi HSK — khác từ vựng, khác cách đọc và khác cả thực tế đằng sau từ ngữ, ngay cả
          khi bạn thi bằng chữ phồn thể
        simplified: >-
          Không có chữ giản thể ở bất cứ đâu và không có công tắc để bật chúng — chỉ có phía Đài Loan, trong từ
          điển, trong ví dụ và trong các bài luyện
        ads: >-
          Không sống nhờ quảng cáo và sẽ không bao giờ — không có gì nhấp nháy, không có gì làm gián đoạn, không
          có gì kéo bạn khỏi việc học hay đơn giản là tra một từ
        tracking: >-
          Không theo dõi bạn — không có phân tích của bên thứ ba, không có bất kỳ công cụ theo dõi nào, và toàn
          bộ tiến độ của bạn có thể xuất ra một tệp để bạn giữ bất cứ khi nào bạn muốn
    counts:
      heading: Đã có sẵn
      radicals: Bộ thủ Khang Hy
      characters: Chữ Hán
      words: Mục từ điển
      collocations: Thành ngữ và kết hợp từ
      sentences: Câu và ví dụ
    science:
      heading: Ngôn ngữ học định lượng ở bên trong
      body: >-
        Mọi thứ dựa trên đo đạc: tần suất và độ phân tán trong kho ngữ liệu, độ bền của kết hợp từ, thang độ
        khó đã hiệu chỉnh, mẫu âm học cho từng âm tiết. Những gì bạn thấy chỉ là phần nổi của tảng băng — bên
        dưới là nhiều năm thu thập, đo đạc và kiểm chứng dữ liệu, cùng các thư viện và bộ dữ liệu riêng được
        công bố cho cộng đồng nghiên cứu. Tất cả đều mở — tri thức thuộc về mọi người.
      points:
        corpus:
          title: Đo đạc, không phỏng đoán
          body: >-
            Cấp độ, độ khó và thứ tự từ đến từ một kho ngữ liệu Đài Loan do chúng tôi tự xây dựng và đo đạc —
            tần suất, độ phân tán, độ bền kết hợp, ngữ vực.
        open:
          title: Mở cho mọi người kiểm tra
          body: >-
            Các bảng kho ngữ liệu, danh mục âm tiết và các thư viện đứng sau được công bố dưới dạng bộ dữ liệu,
            và ứng dụng này là mã nguồn mở. Mọi nguồn và giấy phép đều có trên trang ghi công.
        linked:
          title: Một nơi, kết nối với nhau
          body: >-
            Chữ dẫn tới từ, từ dẫn tới câu thật, câu dẫn ngược về điểm ngữ pháp — và bất cứ thứ gì bạn gặp đều
            có thể đi thẳng vào bộ thẻ.
    quality:
      heading: Chất lượng đến từ đâu
      items:
        audio:
          title: Bản ghi chính thức
          body: >-
            Chữ và từ được thu âm cho từ điển quốc gia của Bộ Giáo dục Đài Loan — không phải giọng tổng hợp, không
            phải đóng góp đại trà.
        sources:
          title: Nguồn của Đài Loan
          body: Từ điển quốc gia, danh sách cấp độ và bảng tần suất chính thức, văn bản pháp luật, tin tức thành phố.
        human:
          title: Một con người đứng sau mỗi mục từ
          body: >-
            Nghĩa, ví dụ và liên kết được đọc lại bằng tay. Phần tiếng Quan thoại do con người kiểm chứng — không
            có gì do máy tạo ra. Bản tiếng Việt đang được rà soát dần.
        written:
          title: Viết cho người Việt
          body: Phần giải thích bắt đầu từ sáu thanh và hệ thống âm của tiếng Việt (giọng Hà Nội) mà bạn đã có, và từ những cái bẫy mà chữ quốc ngữ đặt ra khi bạn đọc bính âm.
    tools:
      heading: Mọi thứ mà bình thường bạn phải cài năm ứng dụng
      lede: Mở ra là đã có sẵn tất cả — không cần thiết lập, không phải đi tìm.
      items:
        study:
          title: Thẻ ghi nhớ
          body: Mọi thứ đến hạn hôm nay, cộng một lượng từ mới vừa phải
        speaking:
          title: Phát âm
          body: Đọc to lên và xem âm tiết nào bị lệch, lệch bao nhiêu
        writing:
          title: Viết tay
          body: Nhớ lại chữ, rồi vẽ từng nét theo đúng thứ tự
        zhuyin:
          title: Chú âm
          body: Bằng tai và bằng tay, cho tới khi bảng chữ không còn cản đường
        tones:
          title: Thanh điệu
          body: Nghe, vẽ và nói, từng âm tiết một
        typing:
          title: Gõ chữ
          body: Chú âm và Thương Hiệt, đúng cách người Đài Loan gõ
        reader:
          title: Công cụ đọc
          body: Dán một bài báo và đọc với từ điển mở sẵn
        everyday:
          title: Đời sống ở Đài Loan
          body: Gọi món, thuê nhà, ngân hàng, giấy tờ — những gì lớp học bỏ qua
        placement:
          title: Kiểm tra trình độ
          body: Năm phút để biết nên học tiếp từ đâu
        plan:
          title: Kế hoạch ôn thi
          body: Chọn cấp TOCFL và ngày thi; lượng học mỗi ngày tự được tính ra
    core:
      heading: Tra một từ, thấy toàn cảnh
      lede: >-
        Bộ thủ tạo nên chữ, chữ tạo nên từ, từ tạo nên câu. Mỗi trang cho thấy phần còn lại của mạng lưới: từ
        được tạo nên từ gì, xuất hiện ở đâu và bạn biết chắc từng phần đến mức nào.
      layers:
        radicals: Bộ thủ
        characters: Chữ Hán
        words: Từ
      facets_note: >-
        Biết một từ không phải là một chuyện duy nhất. Bạn có thể đọc được nó trên trang mà vẫn cứng họng khi
        phải nói ra. Vì vậy mỗi từ mang năm trí nhớ riêng, và chỉ cái nào bị trượt mới quay lại.
      facets:
        recognition: thấy là nhận ra
        production: đi từ nghĩa tới từ
        reading: đọc to đúng
        tone: giữ đúng đường nét, kiểm tra bằng giọng nói
        writing: viết từ trí nhớ, từng nét một
    progress:
      heading: Bạn luôn biết mình đang ở đâu
      lede: Cùng một vốn kiến thức đo theo ba cách. Chọn cách nào có ý nghĩa với bạn.
      items:
        tocfl:
          title: Theo cấp TOCFL
          body: kỳ thi tiếp theo thực sự còn gần hay xa
        school:
          title: Theo cấp học ở Đài Loan
          body: học sinh ở đây được kỳ vọng biết gì ở giai đoạn đó
        frequency:
          title: Theo tần suất
          body: bạn đã đọc được bao nhiêu phần của một trang văn bình thường
    bring:
      heading: Bất cứ thứ gì thu hút bạn đều thành bộ thẻ
      lede: >-
        Dán một văn bản vào, nó sẽ được tách từ, tra nghĩa và biến thành bộ thẻ, nối vào cùng tiến độ với mọi
        thứ khác.
      soon: sắp có
      items:
        menu:
          title: Thực đơn quán cà phê hay biển hiệu ngoài phố
          body: Chụp ảnh, những chữ bạn không đọc được sẽ quay lại dưới dạng từ đã tách
        textbook:
          title: Từ mới trong giáo trình hay trên lớp
          body: Dán cả danh sách; không phải tự gõ nghĩa bằng tay
        song:
          title: Một bài hát bạn yêu thích
          body: Lời bài hát trình bày từng từ, kèm cách đọc, thanh điệu và nghĩa
        feed:
          title: Một bản tin, một chương sách, một bình luận trên Threads
          body: Đọc với từ điển trong tay và gửi những gì mới thẳng vào bộ thẻ
    instead:
      heading: Bên cạnh những gì bạn có thể đang dùng
      lede: >-
        Mỗi ứng dụng đó đều làm tốt việc của mình. Vấn đề là phải mở năm ứng dụng mà giữa chúng không có gì
        kết nối.
      closing: >-
        Tra cứu, kiểm tra, gửi vào bộ thẻ, nhìn trình độ tăng lên và ôn thi TOCFL — ở một nơi thay vì năm tab.
      note: >-
        Ứng dụng này hướng tới một kỳ thi duy nhất: TOCFL, kỳ thi năng lực Hoa ngữ của Đài Loan.
    compare:
      heading: Bên cạnh những gì bạn có thể đang dùng
      summary: >-
        Các ứng dụng dạy tiếng Quan thoại hầu như không dạy tiếng Quan thoại Đài Loan, còn những công cụ đa năng
        mạnh thì để lại cho bạn những lựa chọn khó: bộ thẻ nào, từ nào tiếp theo, bao lâu ôn một lần. TaiwanCards
        cố ý hẹp hơn và tự đưa ra những lựa chọn đó.
      honest: >-
        Điều đó không có nghĩa các ứng dụng khác là phần mềm tồi, và phần lớn chúng vốn không định dạy tiếng
        Quan thoại Đài Loan. Hệ sinh thái của Anki không gì sánh bằng. Từ điển của Pleco sâu hơn nhiều so với
        bất cứ thứ gì ở đây. Phần chấm chữ viết tay theo từng nét của Skritter là tốt nhất trong loại. Và Duolingo
        giỏi hơn ai hết trong việc kéo bạn quay lại vào ngày mai. Zhong Chinese, mới ra đời ở Đài Bắc, là nơi duy
        nhất khác ở đây dạy tiếng Quan thoại của Đài Loan, và nhìn rất đẹp mắt — tài
        liệu của nó theo một giáo trình duy nhất và từ điển còn nhỏ, nhưng những gì có trong đó là hàng thật. 嗨嗨 👋🏻
      toggle: Hiện bảng so sánh đầy đủ
      checked: >-
        Kiểm tra vào tháng 8 năm 2026 theo tài liệu chính thức và trang cửa hàng ứng dụng. Tính năng và giá có
        thể thay đổi — hãy tự kiểm tra những gì quan trọng với bạn.
