        steps: "Trong Pleco, mở Flashcards → Import / Export → Export Cards. Chọn thẻ hoặc danh mục và lưu thành tệp văn bản (hoặc XML). Tải tệp đó lên đây."
      anki:
        name: Anki
        steps: "Trong Anki trên máy tính: File → Export → Notes in Plain Text (.txt), chọn bộ thẻ và bỏ chọn phần media. Cột chứa chữ Hán sẽ được tìm tự động."
      quizlet:
        name: Quizlet
        steps: "Mở học phần trên quizlet.com → menu ⋯ → Export → Copy text, rồi dán vào bên dưới. Chữ Hán có thể nằm ở mặt nào cũng được."
