    sources: Nguồn
    lunar:
      title: Âm lịch thực sự vận hành thế nào
      months_html: "<p>Âm lịch của Đài Loan cũng là âm lịch người Việt dùng để ăn Tết — chỉ khác múi giờ, nên đôi khi một ngày lễ lệch nhau một ngày. Một tháng âm lịch bắt đầu vào ngày sóc và kéo dài tới ngày sóc tiếp theo. Khoảng đó dài chừng 29,53 ngày, nên một tháng có <strong>29</strong> hoặc <strong>30</strong> ngày — không bao giờ 31, và không có độ dài cố định để học thuộc. Mười hai tháng cộng lại khoảng 354 ngày, ngắn hơn năm dương lịch chừng mười một ngày.</p><p>Toàn bộ câu chuyện nằm ở khoảng thiếu hụt đó. Nếu không có gì điều chỉnh, năm mới sẽ trôi ngược qua các mùa và 春節 cuối cùng sẽ rơi vào mùa hè.</p>"
      days_html: "<p>Ngày trong tháng âm lịch không viết bằng số trơn. Mười ngày đầu có tiền tố <strong>初</strong> — chính là “mồng” của tiếng Việt: 初一 (mồng một), 初二, 初三 … tới 初十. Ngày 11 tới 19 dùng 十 — 十一, 十二 … 十九 — và 二十 là ngày hai mươi. Từ ngày 21 tiền tố là <strong>廿</strong>: 廿一, 廿二 … 廿九, và tháng 30 ngày kết thúc ở 三十.</p><p>Vậy <strong>初五</strong> đơn giản là mồng năm. Khi ai đó nói 正月初五, họ muốn nói mồng năm tháng Giêng — không kèm năm, và không ngụ ý ngày dương lịch nào.</p>"
      drift_html: "<p>Đây là lý do 春節 không bao giờ rơi vào cùng một ngày dương lịch hai năm liền. Năm âm lịch ngắn hơn năm dương lịch khoảng mười một ngày, nên năm mới trượt sớm dần mỗi lần — và khi trượt quá xa, cả một tháng được chèn thêm và nó lại nhảy về muộn. Trong khoảng 1950–2050, Tết dao động từ 21 tháng 1 tới 20 tháng 2.</p>"
      leap_html: "<p>Cách điều chỉnh là <strong>tháng nhuận</strong>, 閏月. Khoảng bảy lần trong mỗi mười chín năm có một tháng được chèn thêm, khiến năm đó có mười ba tháng và khoảng 384 ngày. Nó không được thêm vào cuối năm — mà chèn sau một tháng có sẵn và lấy số của tháng đó: tháng nhuận sau tháng sáu là 閏六月, và năm đó có cả 六月 lẫn 閏六月.</p><p>Tháng nào được nhân đôi do mặt trời quyết định, không theo một quy tắc cố định để học thuộc: nó phụ thuộc vào vị trí của 24 tiết khí. Năm 2025 có 閏六月; năm 2033 có tháng hiếm 閏十一月.</p>"
      terms_html: "<p>Hai dịp lễ ở đây hoàn toàn không theo âm lịch. <strong>清明</strong> và <strong>冬至</strong> là <em>tiết khí</em> — những điểm trên đường đi hằng năm của mặt trời — nên chúng gần như đứng yên trên lịch dương trong khi mọi thứ theo âm lịch thì xê dịch.</p>"
    minguo:
      title: Đổi năm 民國
      gregorian: Năm dương lịch
      minguo: Năm 民國
      note: "%{gregorian} là 民國%{minguo}."
      before: Cách tính 民國 bắt đầu từ năm 1912, nên ở đây không có năm 民國.
      explain_html: "<p>Đài Loan ghi ngày trên giấy tờ chính thức theo niên hiệu <strong>民國</strong> (Dân Quốc), tính từ khi Trung Hoa Dân Quốc thành lập năm <strong>1912</strong>. Năm đó là 民國1, nên phép tính đơn giản là <strong>民國 = năm dương lịch − 1911</strong>, và áp dụng được theo cả hai chiều. Bạn sẽ gặp nó trên thẻ căn cước, vé tàu, hóa đơn, hợp đồng và hạn sử dụng, thường viết là 114.09.28 thay vì 2025.</p>"
