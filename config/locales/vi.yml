  names:
    title: Tên người Đài Loan được cấu tạo thế nào
    meta_description: >-
      Tên người Đài Loan gồm những gì, người Đài Loan thực sự mang những họ nào, và những chữ nào hay xuất
      hiện trong tên riêng — theo số liệu đăng ký hộ tịch quốc gia.
    caveat: >-
      Tính trên %{people} tên của những người có liên hệ với Đài Loan. Nguồn dữ liệu nghiêng về những người
      đủ nổi bật để được viết về, nên nó phản ánh cách đặt tên trong thế kỷ qua chứ không phải tên đặt cho
      trẻ em năm nay.
