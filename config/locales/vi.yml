      foot: bàn chân
  games:
    title: "Trò chơi trên bàn ở Đài Loan"
    empty: "Bộ sưu tập trò chơi trên bàn chưa được nhập."
    boards:
      mahjong: "Mạt chược"
      mcr: "Mạt chược quốc tế"
      xiangqi: "Cờ tướng"
      go: "Cờ vây"
      tabletop: "Board game và bài"
    leads:
      mahjong:
        title: "Mạt chược Đài Loan"
        body: "Lối chơi mười sáu quân là của Đài Loan, không phải chung cho mọi nơi nói tiếng Hán. Một ván bài gồm năm bộ cộng một đôi, điểm theo mẫu được cộng dồn bằng đài (台) chứ không nhân lên, tám quân hoa được tính điểm riêng, và lãi lỗ cả buổi tối nằm ở chuỗi thắng của nhà cái. Không có mức tối thiểu: ván bài không đài vẫn là ván thắng."
        note: "Đây là thuật ngữ và ý nghĩa của chúng, không phải sách luật."
      mcr:
        title: "Mạt chược quốc tế (luật thi đấu)"
        body: "Luật thi đấu quốc tế thông qua năm 1998. Mười ba quân, 81 mẫu và ngưỡng tám điểm: ván dưới tám điểm hoàn toàn không được tính là thắng. Đơn vị điểm là phiên (番) chứ không phải đài, và nhiều mẫu của nó hoàn toàn xa lạ ở bàn chơi Đài Loan."
        note: "Ở Đài Loan người ta chơi luật này trong giải đấu, còn ở nhà thì chơi luật của mình."
      xiangqi:
        title: "Cờ tướng"
        body: "Quân cờ đứng trên giao điểm của các đường kẻ, không đứng trong ô. Tướng và sĩ không bao giờ rời cung, tượng không bao giờ qua sông, mã bị cản bởi quân đứng sát, còn pháo chỉ ăn quân khi có ngòi. Hết nước đi là thua, và chiếu mãi bị cấm. Người Việt chơi cờ tướng sẽ thấy rất quen."
        note: "Đỏ và Đen viết cùng một quân bằng những chữ khác nhau."
      go:
        title: "Cờ vây"
        body: "Go và weiqi là cùng một trò chơi: 圍棋 nghĩa là trò chơi bao vây, tiếng Nhật gọi là go, và ở Đài Loan dùng cả hai từ. Quân được đặt trên giao điểm và không bao giờ di chuyển, nhóm quân có hai mắt thật thì sống, và Đài Loan tính theo diện tích chứ không theo đất."
        note: "Nhiều thuật ngữ đến từ tiếng Nhật nhưng được viết bằng chữ Hán riêng."
      tabletop:
        title: "Board game, bài và trò chơi đường phố"
        body: "Board game hiện đại ở Đài Loan gọi là 桌遊 và được chơi trong các quán board game tính tiền theo giờ. Bên cạnh đó là những trò bài địa phương: 大老二, 十三支, 心臟病, và trò đường phố 暗棋, cờ tướng úp trên nửa bàn cờ."
        note: "Ở đây cũng có những từ cần dùng ở bất cứ bàn chơi nào: lượt đi, tính điểm, phỉnh, bốc chỗ ngồi."
