  licenses:
    moe_notice: 使用說明 — thông báo sử dụng chính thức, giữ nguyên toàn văn theo yêu cầu của giấy phép
    title: Giấy phép và ghi công
    intro: TaiwanCards được xây dựng, với lòng biết ơn, trên các tài nguyên mở có giấy phép tự do và dữ liệu ngôn ngữ chính thức của Đài Loan. Mỗi tài nguyên đều có liên kết tới nguồn và giấy phép.
    projects_title: Công trình mở của chúng tôi
    projects_note: "TaiwanCards dựa trên một loạt nghiên cứu ngôn ngữ mở về tiếng Quan thoại Đài Loan: quy trình kho ngữ liệu tạo ra dữ liệu, phân tích nguồn gốc giữ cho dữ liệu đúng chất Đài Loan, các thư viện xử lý tín hiệu đứng sau việc chấm phát âm, và các bộ dữ liệu đã công bố. Mọi phần, kể cả ứng dụng này, đều mở."
    groups:
      app: Ứng dụng và khâu chuẩn bị dữ liệu
      pipeline: Xây dựng kho ngữ liệu và phân tích nguồn gốc
      gems: Thư viện xử lý tín hiệu
      datasets: Bộ dữ liệu đã công bố
    works:
      taiwancards: Toàn bộ ứng dụng học — Rails, các trình nhập dữ liệu, lặp lại ngắt quãng, chấm phát âm, thi thử. Không giữ lại gì.
      corpora: Tải về, xử lý, trau chuốt, hiệu chỉnh, làm sạch và phân tích mọi nguồn mà từ điển được xây dựng từ đó.
      twpipeline: Xây dựng kho ngữ liệu tiếng Quan thoại Đài Loan — chín bước JSONL từ dữ liệu thu thập thô tới kho ngữ liệu đã tách từ và chú thích tần suất.
      twfilter: "Phân tích nguồn gốc: bộ ký tự, chính tả, dấu hiệu từ vựng và ngữ pháp nhận ra văn bản viết theo chuẩn tiếng Quan thoại Đài Loan và văn bản không theo chuẩn đó."
      dsprb: Xử lý tín hiệu tiếng nói bằng Ruby thuần — giải mã WAV, phổ công suất FFT, MFCC, dò cao độ YIN. Thư viện này chấm phát âm của bạn.
      dtwrb: Căn chỉnh thời gian động (DTW) với dải Sakoe-Chiba và trung bình trọng tâm DBA. Thư viện này so bản ghi của bạn với đường nét mẫu.
      twngrams: Tần suất n-gram của từ và chữ từ kho ngữ liệu tiếng Quan thoại Đài Loan, công bố vào phạm vi công cộng.
      twsyllables: Danh mục âm tiết kèm chú âm, bính âm và phân bố thanh điệu trong kho ngữ liệu.
      twfilter_tables: "Các bảng tham chiếu mà twfilter dùng để xác định nguồn gốc — cặp chính tả, dấu hiệu từ vựng, bộ ký tự."
    open_source_title: Mã nguồn mở
    fonts_title: Phông chữ
    fonts_note: Cả ba đều được tự lưu trữ. Hai trong số đó chúng tôi phát hành ở dạng đã chỉnh sửa, và điều này được nêu bên dưới.
    corpora_title: Kho ngữ liệu và từ điển
    corpora_note: Mọi kho văn bản trong cơ sở dữ liệu, kèm giấy phép đi cùng. Chỉ những nguồn có giấy phép cho phép dùng cả tự do lẫn thương mại mới được công bố ở đây; phần còn lại chỉ dùng để thống kê và không câu nào của chúng được lưu.
    data_title: Dữ liệu tham chiếu
    data_note: "Các cơ quan có tài liệu tham chiếu đã công bố mà ứng dụng dựa vào: danh sách theo cấp độ, danh mục nét, chuẩn chữ Hán, bảng lịch và thang phân loại. Đây là những danh sách dữ kiện chứ không phải tác phẩm sáng tạo, nên được ghi công ở đây chứ không phải cấp phép. Khi một cơ quan công bố tài liệu theo một giấy phép cụ thể, giấy phép đó được nêu rõ."
    outro: Mọi nội dung tiếng Quan thoại đều bằng chữ phồn thể Đài Loan, đối chiếu với các từ điển của Bộ Giáo dục Đài Loan. Tên riêng, thương hiệu và văn bản bài học thuộc về chủ sở hữu tương ứng.
    items:
      moe_audio: Âm thanh cho chữ và từ. Bản ghi của Bộ Giáo dục Đài Loan, phiên bản dữ liệu 20260626. Các tệp được phục vụ nguyên trạng; ứng dụng chỉ giới hạn phần phát ở mục từ.
      cc_cedict: Từ điển Hán–Anh của cộng đồng — cách đọc, nghĩa và các cặp phồn thể/giản thể.
      makemeahanzi: Hình thứ tự nét, phân tích bộ thủ và nguồn gốc chữ Hán.
      hanzi_writer: Bộ máy viết từng nét và hoạt ảnh dùng trong bài luyện viết.
      hanzilookup: Nhận dạng chữ viết tay, biến các nét bạn vẽ thành chữ Hán, hoàn toàn ngoại tuyến. Dữ liệu nhận dạng (mmah.json) được tạo từ dữ liệu nét của Make Me a Hanzi và mang điều khoản LGPL / Arphic PL của dự án đó, chứ không phải giấy phép MIT của bộ máy.
      unihan: Cơ sở dữ liệu chữ Hán của Unicode — cách đọc chuẩn và thuộc tính của chữ.
      opencc: Bảng STCharacters, dùng để đổi chữ giản thể sang phồn thể khi bạn dán văn bản. Mọi thay thế đều được liệt kê lại cho bạn.
      roboto: Phông chữ giao diện, dùng cho chữ Latinh và bính âm, có đủ dấu tiếng Việt. Được tự lưu trữ thay vì tải từ Google, nên khi bạn mở trang không có yêu cầu nào gửi tới bên thứ ba.
      noto_sans_tc: Phông mặc định cho chữ phồn thể. Cũng được tự lưu trữ.
      tw_kai: "Phông chữ khải nét bút lông của chính Đài Loan từ 全字庫 CNS11643, do 數位發展部 phát hành. Đây là phông đứng sau tùy chọn chữ viết tay, và đường nét chữ 臺 của nó là nguồn gốc của logo trang web. Chúng tôi phát hành một tập con: tệp được rút gọn còn những chữ ứng dụng thực sự dùng, và logo lấy đường nét từ đó, nên bản ở đây đã được chỉnh sửa chứ không phải bản gốc."
      moe: Tự dạng chuẩn của Bộ Giáo dục Đài Loan, bộ 4808 chữ thông dụng và tần suất chữ.
      bopomofo_audio: Bản ghi các ký hiệu chú âm từ bộ phần mở của 國語注音符號手冊 của Bộ Giáo dục, phát hành riêng theo CC BY 4.0. 2017 © 教育部,國語注音符號手冊-開放部件.
      tocfl: Danh sách từ vựng TOCFL chính thức theo từng cấp.
      naer: Viện Nghiên cứu Giáo dục Quốc gia — bộ chuẩn TBCL, kho ngữ liệu COCT và bảng tần suất từ chung.
      moe_strokes: Danh sách chuẩn tên các nét, cơ sở của danh mục nét cơ bản và nét phức.
      moe_idioms: "Từ điển thành ngữ 成語 chính thức: định nghĩa, xuất xứ cổ điển, điển tích và ví dụ cho mỗi thành ngữ. Văn bản gốc được hiển thị nguyên văn — giấy phép không cho phép cải biên; phần nghĩa và ghi chú tiếng Việt, tiếng Anh, tiếng Nga do chúng tôi viết."
      cwa: Thang lượng mưa, cấp bão và các mức chỉ số tia UV.
      tbrs: Phân loại trà, các công đoạn chế biến và mức độ oxy hóa của các giống trà Đài Loan.
      hko: Âm lịch và bảng tiết khí dùng để tính ngày lễ tết.
      xiaoxuetang: Tự dạng cổ được đồ lại — giáp cốt văn, kim văn và triện thư. Công bố vào phạm vi công cộng.
  help:
    title: Trợ giúp
    intro: >-
      Giới thiệu nhanh những gì bạn có thể làm ở đây. Mọi thứ đều dùng chung — từ điển, bài học, danh sách —
      nhưng tiến độ là của riêng bạn.
    sections:
      search:
        title: Tìm kiếm
        body: >-
          Ô ở trên cùng tìm mọi thứ cùng lúc — gõ tiếng Việt, tiếng Anh, bính âm (có hoặc không có dấu thanh,
          hoặc số thanh như xiao3), chú âm, hay thậm chí một chữ gõ sai. Kết quả được xếp hạng; kết quả gần
          nhất đứng đầu.
      study:
        title: Bộ thẻ và học
        body: >-
          Bộ thẻ là chồng thẻ đang học. Chọn thẻ cho vào đó, rồi phần Học chạy lặp lại ngắt quãng (FSRS) — vuốt
          để tự đánh giá. Thẻ quay lại đúng lúc bạn sắp quên.
      dictionary:
        title: Từ điển
        body: >-
          Xem chữ Hán, từ, câu, kết hợp từ, lượng từ và bộ thủ. Mỗi mục đều hiện cách đọc (chú âm + bính âm),
          nghĩa và mức độ bạn nhớ nó.
      tocfl:
        title: TOCFL
        body: >-
          Từ vựng chính thức theo từng cấp. Xem bạn đã sẵn sàng tới đâu cho mỗi cấp và học thẳng cấp bất kỳ.
      pronunciation:
        title: Nói
        body: >-
          Nói một từ vào micrô và nhận phản hồi cho từng âm tiết về thanh điệu và âm. Chế độ tự động đi tiếp khi bạn nói đúng và giữ micrô mở cho tới khi bạn đúng.
      writing:
        title: Viết và tra chữ
        body: >-
