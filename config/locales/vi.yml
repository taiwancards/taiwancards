  numbers:
    rules_title: Những quy tắc nên biết trước khi luyện
    rules:
      truncation:
        title: Chữ số đứng cuối chỉ đơn vị liền dưới
        body: Đây là chỗ hay gây nhầm lẫn nhất với người học châu Âu, nhưng người Việt đã quen sẵn. Một chữ số đứng một mình ở cuối không được cộng vào số — nó nhân với đơn vị liền dưới, đơn vị đó chỉ được lược đi. Giống hệt khi bạn nói “một trăm hai” là 120 hay “hai nghìn ba” là 2.300. Vì vậy 三百五 là 350 chứ không phải 305.
        rows:
          - huayu: 三百五
            value: "350"
            note: dạng đầy đủ 三百五十, lược 十 — như “ba trăm rưởi”
          - huayu: 兩千三
            value: "2.300"
            note: dạng đầy đủ 兩千三百, lược 百 — như “hai nghìn ba”
          - huayu: 一萬五
            value: "15.000"
            note: dạng đầy đủ 一萬五千, lược 千 — “một vạn rưởi”
      zero:
        title: 零 chính là “linh” của tiếng Việt
        body: "Để nói 305, chỉ gọi tên ba và năm là không đủ: phải có 零 ở giữa, đúng như bạn nói “ba trăm linh năm”. 零 báo rằng có một hàng bị trống, và vì vậy chặn cách hiểu theo kiểu lược đơn vị. Chỉ cần một 零 cho khoảng trống rộng bao nhiêu cũng được — đây là chỗ khác tiếng Việt, vốn nói “một nghìn không trăm linh năm”."
        rows:
          - huayu: 三百零五
            value: "305"
            note: ba trăm linh năm; thiếu 零 sẽ thành 350
          - huayu: 一千零五
            value: "1.005"
            note: cả hàng trăm lẫn hàng chục đều trống — vẫn chỉ một 零
          - huayu: 一千零五十
            value: "1.050"
            note: có 十 nên đây là hàng chục, không phải hàng đơn vị
          - huayu: 一萬零五
            value: "10.005"
            note: 零 cũng có tác dụng qua ranh giới 萬
      liang:
        title: 兩 hay 二 tùy thuộc vào chữ đứng sau
        body: "二 là chữ số thuần túy: khi đếm, trong con số, trong 十二 và 二十. 兩 dùng khi số hai đo lường một thứ gì đó: trước lượng từ và trước 百, 千, 萬, 億. Có một ngoại lệ quan trọng: trước 十 luôn là 二. Tiếng Việt chỉ có một chữ “hai”, nên đây là quy tắc hoàn toàn mới với bạn."
        rows:
          - huayu: 二
            value: "2"
            note: chữ số trơn, khi đếm
          - huayu: 二十
            value: "20"
            note: không bao giờ dùng 兩 trước 十
          - huayu: 十二
            value: "12"
            note: số hai ở hàng đơn vị cũng là 二
          - huayu: 兩百
            value: "200"
            note: 兩 trước 百; người Đài Loan không nói 二百
          - huayu: 兩千三百二十二
            value: "2.322"
            note: 兩 ở hàng cao, 二 ở hàng thấp — trong cùng một số
          - huayu: 兩個人
            value: 2 người
            note: trước lượng từ luôn là 兩 — như “hai người”, “hai cái”
      shi:
        title: 十 đứng đầu không cần 一
        body: Từ 10 đến 19, 十 đứng một mình — như “mười lăm” trong tiếng Việt. Nhưng khi có một đơn vị cao hơn đứng trước, chữ một quay lại, và đây là chỗ khác tiếng Việt — bạn nói “một trăm mười lăm”, còn tiếng Quan thoại nói “một trăm một mười lăm”.
        rows:
          - huayu: 十五
            value: "15"
            note: không ai nói 一十五
          - huayu: 一百一十五
            value: "115"
            note: ở đây bắt buộc có 一 trước 十
          - huayu: 一百一
            value: "110"
            note: cách nói tắt theo quy tắc chữ số đứng cuối — như “trăm mốt”
