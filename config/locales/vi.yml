    how_body: >-
      Mỗi âm tiết trong câu được một điểm. Đúng chữ, hoặc đúng âm tiết với đúng thanh, được trọn điểm; âm tiết
      không ghi thanh được ba phần tư, sai thanh được một nửa. Viết một chữ khác cùng âm cũng được một nửa:
      tai bạn nghe đúng, chỉ là viết nhầm. Thanh điệu được tính đúng dù bạn viết theo dạng từ điển hay theo
      cách đọc thực tế, nên 你好 có thể là nǐ hǎo hoặc ní hǎo. Viết theo cách nào tiện cho bạn, kể cả trộn lẫn:
      chữ Hán, bính âm có dấu thanh hoặc số, chú âm. Âm tiết thừa sẽ làm giảm điểm.
