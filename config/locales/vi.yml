    system_title: Chữ số chia nhóm bốn, không phải nhóm ba
    system_body: Tiếng Việt chia số theo nhóm ba chữ số (nghìn, triệu, tỷ); tiếng Quan thoại chia theo nhóm bốn. Bạn đã biết chữ “vạn” (萬) — mười nghìn — qua “muôn vạn”, “vạn sự như ý”; tiếng Quan thoại đếm đúng theo vạn. Vì vậy “một triệu” không có từ riêng mà là 一百萬 — một trăm vạn. Cách dễ nhất là hình dung một dấu cách sau mỗi bốn chữ số tính từ phải sang, thay vì sau mỗi ba chữ số.
