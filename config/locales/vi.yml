    complement:
      heading: Cánh tay phải của giáo viên
      limits: >-
        Ngữ âm tốt nhất nên được đặt nền cùng giáo viên thật, và ứng dụng này không thay thế lớp học thật. Bạn
        có phần kiểm tra thanh điệu và phát âm — ở đây không có bạn hội thoại và không có luyện nghe hiểu, và
        ứng dụng không định cung cấp những thứ đó.
    honest:
      heading: Vì sao có ứng dụng này
      body: >-
        Tôi là một nhà ngôn ngữ học, sống ở Đài Loan, và đây là ứng dụng tôi luôn ước có khi học ngôn ngữ ở đây.
        Nó lớn lên từ một luận văn thạc sĩ ngành ngôn ngữ học tính toán và rất nhiều luyện tập thường ngày — biển
        hiệu, thực đơn, hỏi lại khi nghe không rõ. Không có quảng cáo và sẽ không bao giờ có, và đó là một nửa lý
        do nó tồn tại.
    final:
      heading: Bắt đầu bằng một câu hỏi
      body: >-
        Mới học tiếng Quan thoại? Ứng dụng bắt đầu từ các âm. Đã học được một ít? Năm phút là ứng dụng biết nên
        đón bạn từ đâu.
      cta: Tạo tài khoản
    gold_card: Thẻ Vàng Đài Loan (Taiwan Gold Card)
    disclaimer_html: >-
      TaiwanCards do một người xây dựng và duy trì — một nhà ngôn ngữ học đã gắn nửa cuộc đời với Đài Loan, tới
      cả tấm %{gold_card} trong ví. Các bộ, kỳ thi và ấn phẩm được nêu tên chỉ để ghi công nguồn dữ liệu — dự
      án không liên kết với và không được bất kỳ bên nào trong số đó bảo trợ. Có thể có sai sót: không bảo đảm
      độ chính xác, tính sẵn sàng hay sự phù hợp cho bất kỳ mục đích nào. Hãy dùng như một công cụ hỗ trợ học
      tập, và tự giữ một bản xuất tiến độ của mình.
