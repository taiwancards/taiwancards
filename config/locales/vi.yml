vi:
  audio:
    play: Phát âm thanh
    source_whole: Bộ Giáo dục Đài Loan — bản ghi cả từ
  privacy_google:
    heading: Đăng nhập bằng Google và dữ liệu của bạn
    body: Đăng nhập bằng Google chỉ là một cách tùy chọn để tạo tài khoản. Bạn có thể đăng ký bằng địa chỉ email và mật khẩu thông thường; khi đó ứng dụng không yêu cầu bất kỳ dữ liệu nào từ Google.
    signin: Khi bạn đăng nhập bằng Google, TaiwanCards nhận địa chỉ email và tên trong hồ sơ của bạn. Thông tin này dùng để tạo tài khoản và gắn tiến độ học của bạn vào đó.
    drive: Nếu bạn bấm riêng nút “Sao lưu vào Google Drive”, ứng dụng sẽ tạo một tệp duy nhất trên Drive của bạn chứa bản sao lưu tiến độ học, và chỉ có thể đọc và ghi đè đúng tệp đó.
    limits: "Quyền truy cập giới hạn trong phạm vi drive.file: ứng dụng chỉ chạm tới các tệp do chính nó tạo ra. TaiwanCards không thể xem hay mở bất kỳ tệp nào khác trên Drive của bạn. Không có sao lưu tự động — chỉ khi bạn bấm nút."
    privacy: Chính sách quyền riêng tư
    terms: Điều khoản sử dụng
    policy_before: Việc chúng tôi sử dụng thông tin nhận được từ Google API tuân theo
    policy_name: Chính sách dữ liệu người dùng của dịch vụ Google API
    policy_after: cùng các yêu cầu về Sử dụng giới hạn. Dữ liệu tài khoản Google không bao giờ được dùng cho quảng cáo, không bao giờ bị bán và không được chia sẻ ngoài phạm vi mô tả ở đây.
  privacy:
    title: Chính sách quyền riêng tư
    effective: "Ngày có hiệu lực: 10/10/2026"
    purpose:
      heading: Ứng dụng này làm gì
      body: TaiwanCards là ứng dụng web miễn phí, không quảng cáo, dùng để học tiếng Quan thoại Đài Loan. Ứng dụng có thẻ ghi nhớ với phương pháp lặp lại ngắt quãng, tra từ điển, luyện phát âm và danh sách từ vựng. Ứng dụng do một nhà phát triển độc lập vận hành, không phải một công ty.
    stored:
      heading: Chúng tôi lưu những gì
      items:
        - Địa chỉ email, tên hiển thị và ngôn ngữ giao diện của bạn.
        - "Không lưu mật khẩu của bạn: tài khoản được tạo qua Google, ứng dụng không bao giờ hỏi mật khẩu."
        - "Dữ liệu học tập: bộ thẻ, thẻ, lịch sử ôn tập, tiến độ và cài đặt luyện tập."
        - Các lần luyện phát âm và những số đo rút ra từ đó.
        - Nhật ký yêu cầu trên máy chủ, lưu để đảm bảo hoạt động ổn định và chống lạm dụng.
        - "Số lượt xem trang tổng hợp theo ngày: trang, trang web dẫn tới, loại thiết bị, quốc gia và ngôn ngữ giao diện. Ứng dụng tự đếm, không dùng cookie, không lưu địa chỉ IP và không liên kết với tài khoản nào."
    never:
      heading: Những điều chúng tôi không làm
      items:
        - Chúng tôi không bán hay cho thuê dữ liệu cá nhân.
        - Chúng tôi không hiển thị quảng cáo và không dùng công cụ theo dõi quảng cáo.
        - Chúng tôi không dùng dịch vụ phân tích của bên thứ ba.
        - Chúng tôi không lập hồ sơ về bạn cho bất kỳ mục đích nào ngoài việc cho bạn thấy tiến độ của chính mình.
    cookies:
      heading: Cookie
      body: "Ứng dụng dùng hai cookie, cả hai đều thực sự cần thiết: một cookie phiên có chữ ký để giữ bạn ở trạng thái đăng nhập, và một cookie ghi nhớ ngôn ngữ giao diện. Không có cookie quảng cáo hay theo dõi."
    emails:
      heading: Email
      items:
        - Một thư ngắn về những gì mới trong ứng dụng được gửi tới email tài khoản của bạn, nhiều nhất một hoặc hai lần mỗi tháng. Không có quảng cáo và không có gì từ bên thứ ba.
        - "Nhắc ôn thẻ đến hạn: nhiều nhất một thư mỗi ngày, chỉ khi có thẻ đang chờ, vào giờ bạn thường học. Tính năng này bật sẵn và có thể tắt bằng một cú bấm hoặc trong hồ sơ, tách biệt với bản tin."
        - Mỗi thư đều có liên kết hủy đăng ký bằng một cú bấm, và bạn cũng có thể tắt thư trong hồ sơ. Hủy đăng ký không thay đổi gì khác trong tài khoản của bạn.
        - "Chúng tôi ghi lại thời điểm mỗi thư được gửi cho bạn, lần đầu bạn bấm một liên kết trong thư để quay lại ứng dụng và bạn đã làm vậy bao nhiêu lần, cũng như thời điểm bạn hủy đăng ký. Nếu thư không gửi được, chúng tôi giữ lại thông báo lỗi của máy chủ thư. Việc mở thư không bị theo dõi: thư không chứa điểm ảnh theo dõi, hình ảnh được đính kèm ngay trong thư."
        - Thư được chuyển cho Resend, một dịch vụ gửi email; dịch vụ này nhận địa chỉ của bạn và nội dung thư chỉ để chuyển thư đi.
    donation:
      heading: Nút ủng hộ
      body: Trang “Ủng hộ trang web” có một liên kết đơn giản tới Buy Me a Coffee, một dịch vụ bên ngoài. Không có gì được tải từ dịch vụ đó cho tới khi bạn bấm vào liên kết, không có dữ liệu tài khoản nào được gửi đi, và việc ủng hộ không bao giờ là bắt buộc.
    where:
      heading: Dữ liệu được lưu ở đâu
      body: Ứng dụng và cơ sở dữ liệu chạy trên Render tại Singapore. Lưu lượng đi qua Cloudflare, tệp âm thanh được phục vụ từ Cloudflare R2, còn bản tin được gửi qua Resend, một công ty Mỹ, từ máy chủ đặt tại Nhật Bản. Các nhà cung cấp này chỉ xử lý dữ liệu để vận hành dịch vụ và gửi thư. Nếu bạn dùng tính năng sao lưu vào Google Drive, bản sao đó nằm trong chính tài khoản Google của bạn.
    retention:
      heading: Thời hạn lưu trữ và xóa dữ liệu
      body: Dữ liệu của bạn được lưu chừng nào tài khoản còn tồn tại. Hãy viết thư tới địa chỉ bên dưới để yêu cầu xóa tài khoản cùng mọi dữ liệu trong đó; nhật ký máy chủ tự hết hạn. Xóa tài khoản ở đây không ảnh hưởng tới tệp sao lưu bạn đã tạo trên Google Drive của mình — tệp đó do bạn tự xóa.
    choices:
      heading: Quyền lựa chọn của bạn
      items:
        - Đọc từ điển, ngữ pháp, các mục tra cứu và mọi nội dung về Đài Loan mà không cần tài khoản.
        - Thu hồi quyền truy cập Google của ứng dụng bất cứ lúc nào trên trang quyền của tài khoản Google.
        - Yêu cầu bản sao dữ liệu, chỉnh sửa hoặc xóa toàn bộ.
    children:
      heading: Trẻ em
      body: Ứng dụng không hướng tới trẻ em dưới 13 tuổi và không chủ ý tạo tài khoản cho trẻ em.
    changes:
      heading: Thay đổi
      body: Nếu chính sách này thay đổi, ngày có hiệu lực ở trên cũng thay đổi theo.
    contact:
      heading: Liên hệ
      body: "Câu hỏi, yêu cầu về dữ liệu và yêu cầu xóa:"
    related:
      heading: Liên kết liên quan
  terms:
    title: Điều khoản sử dụng
    effective: "Ngày có hiệu lực: 01/03/2025"
    service:
      heading: Dịch vụ
      body: TaiwanCards là ứng dụng web để học tiếng Quan thoại Đài Loan, do một nhà phát triển độc lập vận hành. Ứng dụng miễn phí, không có quảng cáo và được cung cấp theo hiện trạng. Các tính năng có thể thay đổi hoặc bị gỡ bỏ.
    account:
      heading: Tài khoản của bạn
      items:
        - Cung cấp thông tin tài khoản chính xác và giữ kín thông tin đăng nhập của mình.
        - Mỗi tài khoản dành cho một người. Bạn chịu trách nhiệm về mọi hoạt động trong tài khoản của mình.
        - Bạn có thể xóa tài khoản bất cứ lúc nào bằng cách gửi yêu cầu tới địa chỉ bên dưới.
    use:
      heading: Sử dụng hợp lệ
      items:
        - Không tìm cách truy cập dữ liệu, hệ thống hay tài khoản của người khác mà bạn không có quyền.
        - Không thu thập hàng loạt dữ liệu của trang và không tạo tải tự động vượt quá mức học bình thường.
        - Không tải lên nội dung trái pháp luật hoặc độc hại.
        - Tôn trọng giấy phép của các từ điển, kho ngữ liệu và phông chữ được liệt kê trên trang giấy phép.
    yours:
      heading: Những gì bạn tạo ra
      body: Bộ thẻ, ghi chú và tiến độ bạn tạo ra vẫn là của bạn. Bạn chỉ cấp quyền cần thiết để lưu trữ và hiển thị chúng lại cho bạn. Bạn có thể xuất tiến độ học bất cứ lúc nào, kể cả vào Google Drive của mình.
    ours:
      heading: Những gì chúng tôi sử dụng
      body: Mã nguồn ứng dụng và văn bản gốc thuộc về tác giả. Từ điển, kho ngữ liệu, âm thanh và phông chữ đến từ bên thứ ba và được sử dụng theo giấy phép riêng của chúng, mỗi giấy phép đều được nêu trên trang giấy phép. Không điều khoản nào ở đây trao cho bạn quyền đối với tài liệu của bên thứ ba vượt quá các giấy phép đó.
    availability:
      heading: Tính sẵn sàng
      body: Dịch vụ được cung cấp “theo hiện trạng” và “khi sẵn có”, không có bất kỳ bảo đảm nào về hoạt động liên tục, cũng không bảo đảm dữ liệu ngôn ngữ hoàn toàn không có lỗi. Đây là công cụ hỗ trợ học tập, không phải nguồn chuẩn mực về ngôn ngữ.
    suspension:
      heading: Tạm ngừng
      body: Tài khoản vi phạm các điều khoản này hoặc gây nguy hại cho dịch vụ có thể bị tạm ngừng hoặc xóa.
    liability:
      heading: Trách nhiệm pháp lý
      body: Trong phạm vi tối đa pháp luật cho phép, nhà phát triển không chịu trách nhiệm về các thiệt hại gián tiếp, ngẫu nhiên hoặc hệ quả phát sinh từ việc sử dụng dịch vụ.
    changes:
      heading: Thay đổi
      body: Các điều khoản này có thể được cập nhật. Khi đó ngày có hiệu lực ở trên sẽ thay đổi, và việc bạn tiếp tục sử dụng sau ngày đó đồng nghĩa với việc chấp nhận các điều khoản đã sửa đổi.
    contact:
      heading: Liên hệ
      body: "Câu hỏi về các điều khoản này:"
    related:
      heading: Liên kết liên quan
