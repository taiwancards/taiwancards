    language: Ngôn ngữ
    interface_language: >-
      Ngôn ngữ của giao diện và mọi nội dung bên trong. Không chỉ nút bấm và menu thay đổi: nghĩa của từ,
      ghi chú, giải thích ngữ pháp và phần phân tích cũng chuyển theo. Phần nào chưa có bản tiếng Việt sẽ
      hiện bằng tiếng Anh.
    hanzi_font_toggle: Kiểu chữ Hán
    hanzi_font_hint: >-
      Kiểu chữ Hán. Bật: chữ khải (楷書), kiểu chữ thư pháp thể hiện nét như khi viết tay. Tắt: kiểu chữ không chân đơn giản. Mặc định là bật.
    readings_toggle: Chú âm và bính âm
    audio_rate_toggle: Tốc độ âm thanh
    audio_rate_hint: >-
      Tốc độ phát, ba mức: bình thường, ¾ và ½. Khi phát chậm, âm thanh được kéo dài mà không đổi cao độ, nên
      thanh điệu giữ nguyên. Áp dụng cho mọi nút nghe cho tới khi bạn đổi lại.
    detail_toggle: Mức chi tiết của trang từ điển
    detail_hint: >-
      Mức chi tiết của trang từ điển. 詳 — mọi thứ chúng tôi có: điểm độ hiếm, phân bố ngữ vực, thẻ ghi nhớ,
      từ điển đồng nghĩa, nguồn gốc chữ. 簡 — phần cần dùng: cách đọc, nghĩa, từ loại, lượng từ, từ đồng nghĩa
      và trái nghĩa, luyện viết nét, vài câu ví dụ. Bắt đầu ở 簡 cho tới khi bạn vượt qua TOCFL Novice, sau đó
      chuyển sang 詳; từ đó trở đi giữ nguyên theo lựa chọn của bạn.
    script_setup_hint: >-
      Cách hiển thị ngôn ngữ: kiểu chữ, bính âm, tốc độ âm thanh, mức chi tiết của trang từ điển — và ngôn ngữ
      bạn dùng để đọc trang web.
    china_toggle: Hiện từ dùng ngoài Đài Loan
    china_hint: >-
      Từ dùng ngoài Đài Loan. Bật: một dòng nhỏ trên thẻ cho biết nơi khác nói gì thay vào đó. Tắt: không hiện
      gì thêm. Mặc định là tắt — ứng dụng này dạy từ của Đài Loan.
    readings_hint: >-
      Cách đọc phía trên chữ Hán, ba mức: chỉ chú âm, chú âm kèm bính âm, và không hiện gì. Bính âm không bao
      giờ hiện thiếu chú âm — người Đài Loan đọc bằng chú âm. Mặc định chỉ có chú âm, và lựa chọn của bạn giữ
      nguyên trên mọi trang cho tới khi bạn đổi.
