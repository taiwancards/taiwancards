  support:
    title: Ủng hộ trang web
    lede: TaiwanCards miễn phí, không quảng cáo và không bán gì cả — và sẽ luôn như vậy.
    body: >-
      Thứ duy nhất không miễn phí là hóa đơn máy chủ. Ứng dụng và cơ sở dữ liệu chạy suốt ngày đêm, và càng
      nhiều người học ở đây thì hóa đơn càng lớn. Nếu trang web đã giúp ích cho bạn và bạn muốn góp một tay,
      nút bên dưới là chỗ để làm điều đó. Nó không mua được gì và không mở khóa gì — mọi người đều dùng cùng
      một trang web như nhau — nên nếu bạn đóng trang này và không bao giờ nghĩ tới nữa, cũng không sao cả.
    button: Nuôi máy chủ
    outside: Nút này đưa bạn tới Buy Me a Coffee, một dịch vụ riêng, trong một tab mới.
  offline:
