  reminders:
    profile:
      title: Email
      label: Nhắc học
      hint: Tách biệt với bản tin. Tắt ở đây hoặc bằng một liên kết trong bất kỳ thư nhắc nào.
      when: Khi nào nhắc tôi
      auto:
        title: Tự động
        hint: "Vào giờ bạn thường học, và chỉ khi có thẻ đang chờ: sau khi bạn nghỉ 2, 7 và 21 ngày. Không bao giờ quá một email mỗi ngày, và chúng tôi sẽ im lặng sau ba thư không được hồi đáp."
      fixed:
        title: Vào ngày và giờ tôi chọn
        hint: "Mỗi ngày đã chọn một email vào giờ đó, kèm một lượng thẻ vừa sức. Không có lời nhắc nào khác. Nếu hôm đó bạn đã học hoặc không có thẻ nào đang chờ thì sẽ không có email."
      days: Ngày
      hour: Giờ
      zone: "Theo múi giờ của bạn: %{zone}."
      no_days: Chưa chọn ngày nào nên sẽ không có lời nhắc.
    mail:
      why: Bạn nhận được thư này vì lời nhắc đang bật trong hồ sơ TaiwanCards. Bạn có thể tự chọn ngày và giờ, khi đó chúng tôi chỉ viết vào lúc ấy.
      "off": Hủy đăng ký mọi email
      schedule: Chọn ngày và giờ
      settings: Cài đặt email
      welcome:
        subject: Chào mừng bạn đến với TaiwanCards
        preheader: Từ điển, thẻ, ngữ pháp, đọc và phát âm — một hệ thống thống nhất.
        title: Chào mừng bạn!
        body:
          - "TaiwanCards gom mọi thứ cho tiếng Quan thoại Đài Loan vào một chỗ. Từ điển, thẻ, ngữ pháp, đọc và phát âm được xây dựng thành một hệ thống chứ không ghép từ nhiều nguồn khác nhau: một từ trong bài học cũng chính là mục từ điển đó, thẻ đó và bản ghi âm đó."
          - Vì vậy bạn không cần thêm từ điển riêng, Anki hay một loạt công cụ luyện tập. Tiến độ của bạn tích lũy ở một nơi, và lượt ôn tập đã biết bạn học được những gì.
        features:
          - title: Thẻ ghi nhớ
            text: Mỗi từ quay lại đúng lúc bạn sắp quên. Học theo phương pháp của chúng tôi, ôn thi TOCFL hoặc mang từ vựng từ lớp học của bạn vào.
          - title: Từ điển
            text: Chữ phồn thể, chú âm và cách đọc của Đài Loan, âm thanh do người bản ngữ đọc và ví dụ từ văn bản thật.
          - title: Phát âm
            text: Đọc to một từ và nhận phản hồi về thanh điệu và âm của bạn.
          - title: Ngữ pháp và đọc
            text: Bài ngữ pháp, câu nói thường ngày và văn bản phân theo cấp độ — từ những từ đầu tiên đến trình độ cao.
        outro: Trang chủ cho biết hôm nay nên bắt đầu từ đâu — thường chỉ mất vài phút.
        button: Mở TaiwanCards
        why: Bạn nhận được thư này vì đã tạo tài khoản TaiwanCards. Đây là thư chào mừng duy nhất — sau này chúng tôi chỉ viết khi có thẻ chờ ôn, và không bao giờ quá một lần mỗi ngày. Bạn có thể tự chọn ngày và giờ nhắc trong hồ sơ.
      first_cards:
        subject: Buổi học đầu tiên chỉ mất vài phút
        preheader: "Trang chủ cho biết nên bắt đầu từ đâu: từ các âm, hay vào thẳng từ vựng đúng trình độ của bạn."
        title: Sẵn sàng dành vài phút chứ?
        body: "Tài khoản của bạn đã sẵn sàng, và buổi học đầu tiên rất ngắn. Trang chủ cho biết bạn nên bắt đầu từ đâu: từ các âm, hay vào thẳng từ vựng đúng trình độ của bạn."
        button: Bắt đầu buổi học đầu tiên
      due_cards:
        subject:
          other: "%{count} thẻ cho hôm nay — khoảng %{minutes} phút"
        preheader: Ôn đúng hạn, từ vựng sẽ ở lại với bạn lâu hơn nhiều.
        title:
          other: thẻ cho hôm nay
        body: "Đây là những từ đến hạn ôn ngay lúc này — khoảng %{minutes} phút. Ôn đúng hạn, chúng sẽ nằm trong trí nhớ lâu hơn nhiều."
        button: Bắt đầu ôn tập
      still_due:
        subject: Từ vựng của bạn vẫn ở đây
        preheader: "Ôn nhanh — khoảng %{minutes} phút."
        title:
          other: thẻ để lấy lại nhịp học
        body: "Nghỉ một tuần là chuyện bình thường, và tiến độ của bạn vẫn được giữ nguyên. Chúng tôi đã chọn một ít thẻ quan trọng nhất — khoảng %{minutes} phút. Phần còn lại sẽ đến dần."
        button: Quay lại với từ vựng
      last_call:
        subject: Mọi thứ bạn đã học vẫn được lưu
        preheader: Lời nhắc cuối cùng — sau thư này chúng tôi sẽ không làm phiền bạn nữa.
        title:
          other: thẻ để quay lại nhẹ nhàng
        body:
          - "Ba tuần là một quãng nghỉ dài, nhưng từ vựng của bạn không đi đâu cả. Hãy bắt đầu bằng một ít thẻ — khoảng %{minutes} phút."
          - Đây là lời nhắc cuối cùng. Chúng tôi sẽ không viết nữa cho tới khi bạn tự quay lại.
        button: Quay lại
      scheduled:
        subject:
          other: "Giờ học của bạn: %{count} thẻ, khoảng %{minutes} phút"
        preheader: Bạn đã tự chọn giờ này. Một lượt ngắn là xong việc hôm nay.
        title:
          other: thẻ cho hôm nay
        body: "Bạn đã nhờ chúng tôi nhắc vào giờ này. Đây là lượng vừa đủ cho hôm nay, khoảng %{minutes} phút; phần còn lại sẽ đến trong những ngày tới."
        button: Bắt đầu học
        why: Bạn nhận được thư này vì đã chọn ngày và giờ nhắc trong hồ sơ TaiwanCards. Chúng tôi không gửi lời nhắc nào khác.
    session:
      "on": Nếu ngày mai bạn không quay lại, chúng tôi sẽ gửi một lời nhắc.
      fixed: "Chúng tôi sẽ nhắc theo lịch của bạn: %{schedule}."
