  variants:
    title: Đài Loan và các nơi khác
    word: Từ
    reading: Cách đọc
    meaning: Nghĩa
    taiwan: Đài Loan
    china: Trung Quốc
    hongkong: Hồng Kông
    singapore: Singapore / Malaysia
    checked: Cách đọc được đối chiếu với các từ điển của Bộ Giáo dục Đài Loan; từ vựng được đối chiếu với bảng so sánh của Bộ Giáo dục và các nguồn khu vực. Khi một dạng còn tranh cãi hoặc chuẩn đã thay đổi, ghi chú sẽ nói rõ thay vì chọn một bên.
    sections:
      reading: Cùng chữ, khác cách đọc
      glyph: Cùng từ, khác chữ
      word: Hoàn toàn khác từ
    intro:
      reading: "Những từ này viết giống nhau ở Đài Loan và Trung Quốc nhưng đọc khác nhau. 垃圾 là từ ai cũng để ý — nói lājī ở Đài Bắc là bạn đã cho biết mình học tiếng Quan thoại ở đâu. Hai mục cần lưu ý: 和 đọc hàn thực sự có trong từ điển của Bộ Giáo dục với tư cách cách đọc của liên từ, nhưng đang lùi dần về phía người lớn tuổi và bản tin phát thanh, nên hãy học để nhận ra hơn là để dùng; còn 說服 ở đây thực sự đọc là shuìfú, nhưng không phải vì Trung Quốc thay đổi gì — câu chuyện lan truyền năm 2019 về việc sửa cách đọc đã bị chính thức bác bỏ."
      glyph: "Cả Đài Loan và Hồng Kông đều viết chữ phồn thể, nhưng không phải lúc nào cũng chọn cùng một chữ. Đây là những ký tự Unicode riêng biệt, không phải khác biệt phông chữ, nên trên trang chúng thực sự trông khác nhau. 著 là chữ bạn sẽ gặp liên tục: Đài Loan viết chữ này cho mọi cách đọc, còn Hồng Kông và Trung Quốc tách nó với 着. Hai trường hợp ở đây là chuẩn chính thức và chữ viết tay thông thường khác nhau ngay trong Đài Loan — 汙 và 脣 là dạng chuẩn, nhưng bạn sẽ thấy 污 và 唇 ở khắp nơi."
      word: "Ở đây các vùng đơn giản là dùng những từ khác nhau. Lưu ý cột Hồng Kông phần lớn là từ vựng tiếng Quảng Đông viết bằng chữ Hán chứ không phải một biến thể tiếng Quan thoại — người nói tiếng Quan thoại đọc to 雪櫃 là đang đọc một từ tiếng Quảng Đông. Cái bẫy rõ nhất trong bảng là 土豆: lạc ở Đài Loan, khoai tây ở Trung Quốc. Đó là hai từ khác nhau tình cờ trùng nhau khi viết."
