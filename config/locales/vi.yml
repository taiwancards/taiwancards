    write: Viết
    title: Cơ bản
    intro: Học âm của tiếng Quan thoại từ gốc — trước hết là hệ thống ghi âm, sau đó là phát âm.
    initials: Thanh mẫu (phụ âm đầu)
    finals: Vận mẫu (vần)
    play: Phát
    col_pinyin: Bính âm
    col_palladius: Palladius
    palladius_note: ""
    col_zhuyin: Chú âm
    col_ipa: IPA
    col_analogy: Gần giống
    col_example: Ví dụ
    pinyin_intro: Hệ ghi âm Latinh được dùng trong ứng dụng. Mỗi âm kèm IPA, mốc so sánh với tiếng Việt và một từ ví dụ.
    zhuyin_intro: Hệ ký hiệu ghi âm của Đài Loan. Bạn có thể học song song với bính âm, hoặc học thẳng từ âm. Cùng một bảng, hiện cả hai.
    drill:
      lede: "Đối chiếu hai hệ ghi âm: thấy ký hiệu, gọi tên cách viết Latinh, và ngược lại. Ở đây bính âm chỉ là cây cầu, không phải nền móng."
      title: Chú âm ↔ bính âm
      direction_zhuyin: Chú âm → bính âm
      direction_pinyin: Bính âm → chú âm
      systems_html: "Chú âm là 37 ký hiệu Đài Loan dùng để ghi âm. Mỗi ký hiệu luôn đọc một cách, và bạn không thể tự đoán cách đọc — chỉ cần học nó nghe thế nào. Bính âm ghi chính những âm đó bằng chữ Latinh; nó chỉ là chỗ dựa, không hơn. Với người Việt, đừng đọc bính âm theo chữ quốc ngữ. Cần làm gì: luyện các bảng bên dưới cho tới khi bạn nhận ra ký hiệu bằng tai."
      stage_hint: "Làm theo thứ tự: phụ âm trước, rồi nguyên âm và âm đệm, rồi các vần đầy đủ, và cuối cùng mới là cả âm tiết."
      stages:
        consonants: Phụ âm
        vowels: Nguyên âm
        finals: Vần
        syllables: Cả âm tiết
      prompt_zhuyin: Bính âm nào đây?
      prompt_pinyin: Chú âm nào đây?
      keys: Vuốt thẻ về phía câu trả lời, hoặc dùng phím mũi tên
      done_title: Đã xong lượt
      restart: Làm lại
      see_chart_zhuyin: Bảng chú âm
      see_chart_pinyin: Bảng bính âm
      card: Đối chiếu chú âm với bính âm theo cả hai chiều, bằng cách vuốt.
      syllable_title: Âm tiết tiếng Quan thoại Đài Loan được cấu tạo thế nào
      syllable_body: Mỗi âm tiết có tối đa ba vị trí — giống âm đầu, âm đệm và vần của tiếng Việt. Chỉ vị trí cuối là bắt buộc — 一 chỉ có vận mẫu, 四 là thanh mẫu mà không viết nguyên âm nào. Chú âm viết rõ từng vị trí; bính âm thường gộp hoặc bỏ bớt.
      slots:
        initial_label: Thanh mẫu 聲母
        initial_glyph: ㄓ
        initial_body: Một trong 21 phụ âm. Không bắt buộc — nhiều âm tiết bắt đầu bằng nguyên âm.
        medial_label: Âm đệm 介音
        medial_glyph: ㄨ
        medial_body: Một trong ba âm lướt ㄧ ㄨ ㄩ. Đây là vị trí bính âm hay che giấu nhất — giống âm đệm u/o trong “hoa”, “quê”.
        final_label: Vận mẫu 韻母
        final_glyph: ㄥ
        final_body: Phần vần — một nguyên âm, một nguyên âm đôi, hoặc nguyên âm kèm -n hay -ng. Vị trí duy nhất bắt buộc.
      tones_title: Dấu thanh đặt ở đâu
      tones_body: "Bính âm đặt dấu trên nguyên âm chính, như chữ quốc ngữ: mā má mǎ mà. Chú âm không đánh dấu thanh 1 và viết ˊ ˇ ˋ sau các ký hiệu — ㄇㄚ ㄇㄚˊ ㄇㄚˇ ㄇㄚˋ. Thanh nhẹ là ngoại lệ ở cả hai: bính âm chỉ bỏ dấu, chú âm đặt dấu chấm ˙ phía trước, như ˙ㄉㄜ. Khi viết dọc, chú âm chạy dọc bên phải chữ Hán được ghi âm, kể cả dấu thanh. Đừng để hình dáng dấu đánh lừa: ˊ gần với dấu sắc thật, nhưng ˋ không phải dấu huyền và ˙ không phải dấu nặng."
      mismatch_title: Chỗ bính âm đánh lừa bạn
      mismatch_body: "Đây không phải những ngoại lệ phải học thuộc. Chúng xuất phát từ một quyết định: để viết ngắn, bính âm bỏ nguyên âm ở giữa âm tiết, dùng một chữ cái cho nhiều âm khác nhau, và đôi khi viết một chữ cái ở chỗ chẳng có âm nào. Chú âm không viết gì không được đọc — nên cột chú âm cho thấy âm tiết thực sự gồm những gì."
      mismatch_pinyin: Bính âm
      mismatch_zhuyin: Chú âm
      mismatch_why: Thực ra là thế nào
      mismatch:
        zhong:
          pinyin: zhong
          zhuyin: ㄓㄨㄥ
          why: zh là ㄓ, nhưng o ở đây không phải ㄛ. Vần -ong thực ra là -ung, nên chú âm viết âm lướt ㄨ và vần ㄥ — gần “chung” hơn là “chong”.
        jiu:
          pinyin: jiu
          zhuyin: ㄐㄧㄡ
          why: Vần là -iou; bính âm bỏ nguyên âm ở giữa cho gọn. Chú âm giữ cả ㄧ lẫn ㄡ — nghe gần “chiêu” hơn là “chiu”.
        hui:
          pinyin: hui
          zhuyin: ㄏㄨㄟ
          why: Cùng một mẹo — vần là -uei, bính âm nuốt mất e. Chú âm viết ㄨ và ㄟ — nghe gần “khuây” chứ không phải “khui”.
        yu:
          pinyin: yu
          zhuyin: ㄩ
          why: y không phải phụ âm, nó chỉ để mang nguyên âm, còn u thực ra là ü. Chỉ một âm, nên chú âm viết một ký hiệu. Đừng đọc “du” hay “iu”.
        zhi:
          pinyin: zhi
          zhuyin: ㄓ
          why: Chữ i ở đây không ghi nguyên âm nào — đó là lưỡi giữ ở thế uốn. Sau ㄓ chú âm không viết gì, vì chẳng có gì ở đó. Đừng đọc “chi”.
        weng:
          pinyin: weng / -ong
          zhuyin: ㄨㄥ
          why: Hai cách viết bính âm khác nhau cho cùng một vần, tùy có phụ âm đứng trước hay không. Trong chú âm đều là ㄨㄥ.
      mismatch_more_title: Điều cần ghi nhớ
      mismatch_more_body: "Người đọc bính âm luôn phải âm thầm sửa: chỗ này o thực ra là u, chỗ này thiếu một nguyên âm, chỗ này i chẳng phải nguyên âm, chỗ này u thực ra là ü. Với người Việt còn thêm một lớp nữa: phải gạt bỏ cách đọc chữ quốc ngữ của từng chữ cái. Mỗi lần sửa như vậy là một chỗ cách phát âm sai có thể bám rễ. Chú âm không đòi hỏi điều nào trong số đó: viết sao đọc vậy."
