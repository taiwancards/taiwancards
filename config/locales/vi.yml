  tones:
    names:
      "1": "Thanh 1"
      "2": "Thanh 2"
      "3": "Thanh 3"
      "4": "Thanh 4"
    segments_title: Không chỉ có thanh điệu
    segments_lede: Hai điểm khác biệt ngay trong âm, nghe thấy liên tục và nên biết từ đầu. Cả hai đều là tin vui với người Hà Nội.
    segments:
      retroflex: Các âm uốn lưỡi ㄓ ㄔ ㄕ trong giọng Đài Loan thường nhập vào ㄗ ㄘ ㄙ, nên trong đời thường 知 và 資 có thể nghe giống nhau. Người Hà Nội vốn không phân biệt tr/ch hay s/x khi nói, nên ở đây bạn không phải gắng uốn lưỡi quá mức — chỉ cần nhận ra cả hai cách đọc khi nghe.
      nasal: Vần -ing và -eng phần lớn đã nhập với -in và -en. Đây là đặc điểm ổn định của tiếng Quan thoại Đài Loan, không phải nói ẩu. Người Việt vốn phân biệt rõ -n và -ng, nên hãy viết đúng theo từ điển, nhưng đừng ngạc nhiên khi nghe người Đài Loan đọc lẫn.
    practice_cta: Mở bài luyện thanh điệu →
    chart:
      taipei: Đài Bắc
      reference: Hà Nội
      aria: "%{tone}: đường nét cao độ"
      taipei_note: Thanh điệu nghe ở Đài Loan — đây là chuẩn bạn sẽ học.
      reference_note: Sáu thanh của bạn, để đối chiếu. Chỉ thanh sắc khớp khá sát một thanh Quan thoại (thanh 2); các thanh khác chỉ là mốc để thấy chỗ khác nhau.
      scale: "Năm bậc cao độ quy ước, từ thấp lên cao. Đọc mỗi đường từ trái sang phải: bắt đầu ở đâu và đi về đâu. Dấu ˀ đánh dấu chỗ thanh tắc họng của tiếng Hà Nội. Với Đài Bắc chúng tôi cố ý không ghi số — chưa có cách ghi chuẩn cho thanh điệu Đài Loan, và chúng tôi không tự đặt ra."
    hacks_title: Điều gì thực sự giúp ích
    hacks:
      low: Thanh 3 chỉ đơn giản là một thanh thấp, đối lập với thanh 1. Hãy hạ giọng xuống đáy như nửa đầu thanh hỏi rồi ở yên đó. Đừng vút lên như khi đọc chữ “hỏi” chậm, và đừng thắt họng như thanh nặng — ở Đài Loan thanh 3 thấp, hơi rè, nhưng không bị cắt cụt.
      pair: "Hãy coi thanh 1 và thanh 3 là một cặp: một cao bằng, một thấp bằng. Với tai người Hà Nội, đó là “thanh ngang đẩy lên tận trần” và “thanh hỏi đặt sát sàn”. Như vậy dễ giữ hơn nhiều so với việc nhớ “bằng và lượn”."
      start: "Thanh 2 và thanh 3 hay bị nhầm. Mốc để phân biệt không phải là thanh đi về đâu mà là bắt đầu từ đâu: thanh 2 bắt đầu ở giữa rồi đi lên, đúng như thanh sắc; thanh 3 bắt đầu thấp và ở lại thấp."
      after_third: "Khi thanh 2 đứng sau thanh 3, chỗ thấp của thanh 3 là đà chạy: bạn đã ở dưới đáy, và thanh 2 đi thẳng lên từ đó. Đừng đưa giọng trở lại mức giữa ở chỗ nối hai âm tiết — chính điều đó làm gãy chỗ nối."
      fourth: "Thanh 4 là chỗ người Việt hay trượt nhất, vì dấu ˋ trông y hệt dấu huyền. Nhưng thanh huyền bắt đầu thấp và trượt nhẹ, còn thanh 4 bắt đầu ở đúng chỗ thanh sắc kết thúc — trên cao — rồi rơi thẳng xuống, ngắn và dứt khoát, như khi bạn gắt “Thôi!”. Nếu nghe mềm hoặc trầm, có lẽ bạn bắt đầu chưa đủ cao."
      relative: Cao độ là tương đối, không tuyệt đối. Năm bậc được đo trong chính âm vực giọng của bạn, không phải theo nốt nhạc. Giọng trầm không cản trở thanh điệu — bạn đã chứng minh điều đó mỗi ngày bằng sáu thanh của tiếng Việt.
      neutral: "Âm tiết thanh nhẹ không có cao độ riêng — nó lấy cao độ từ âm tiết đứng trước. Sau thanh 1 nó ở giữa, sau thanh 4 nó ở thấp. Không cần học riêng: nó tự đúng nếu thanh đứng trước đúng. Chỉ nhớ một điều: dấu ˙ trông như dấu nặng, nhưng thanh nhẹ không thắt họng và không trầm hẳn xuống như thanh nặng."
    title: Thanh điệu
    lede: Phần thứ tư của ngữ âm, thiếu nó thì ba phần kia không hoạt động. Bạn đã có sẵn sáu thanh của tiếng Hà Nội — ở đây là cách dựng bốn thanh và thanh nhẹ của tiếng Quan thoại Đài Loan từ chính đôi tai ấy, và những chỗ tiếng Việt sẽ đánh lừa bạn.
    why_title: Bạn đã có sẵn tai nghe thanh điệu
    why_body: Người học châu Âu phải được thuyết phục rằng thanh điệu là một phần của âm tiết. Bạn thì không cần — “ma, mà, má, mả, mã, mạ” là sáu từ khác nhau, và bạn nghe ra điều đó mà không cần nghĩ. Tiếng Quan thoại cũng vậy, chỉ ít thanh hơn. Không tính thanh điệu, ngôn ngữ này có khoảng bốn trăm âm tiết phân biệt được; tính cả thanh điệu thì khoảng một nghìn ba trăm. Ưu thế của bạn là có thật, và các nghiên cứu cho thấy người Việt nắm thanh 2 và thanh 3 nhanh hơn nhiều người học khác.
    myth_title: Cái bẫy “thanh nào cũng có sẵn trong tiếng Việt”
    myth_body: Rất dễ muốn gán mỗi thanh Quan thoại cho một thanh tiếng Việt — nhiều trang học tiếng trên mạng làm đúng như vậy. Nhưng chỉ có một cặp thực sự khớp — thanh 2 và thanh sắc. Các cặp còn lại đánh lừa bạn, và lỗi được ghi nhận nhiều nhất ở người Việt chính là nhầm thanh 1 với thanh 4, kéo dài cả sau một năm rưỡi học. Lời khuyên phổ biến “thanh 4 là thanh huyền” là nguyên nhân hàng đầu của lỗi đó. Hãy dùng thanh tiếng Việt làm mốc để thấy chỗ khác, đừng dùng để thay thế.
    cannot_title: Giọng Hà Nội không chỉ có cao độ
    cannot_body: "Thanh tiếng Việt mang theo cả chất giọng: thanh ngã và thanh nặng có chỗ tắc họng, thanh huyền hơi thở ra, thanh nặng bị cắt ngắn. Thanh Quan thoại thì gần như chỉ là đường nét cao độ, phát ra trơn tru. Nếu bạn mang chỗ tắc họng của thanh nặng vào thanh 4 hay thanh 3, hoặc cắt thanh 4 cụt như thanh nặng, người Đài Loan sẽ nghe thấy một âm tiết lạ chứ không phải một thanh đúng. Hãy giữ dây thanh mở và đều suốt âm tiết."
    cumulative_title: Thanh 1 và thanh 4 — cặp cần canh nhất
    cumulative_body: "Thanh ngang của người Hà Nội có thể hơi chùng xuống ở cuối mà không ai để ý, vì trong tiếng Việt điều đó không làm đổi nghĩa. Chính vì vậy tai bạn dễ gộp một thanh 1 hơi rơi với thanh 4 vào cùng một loại. Trong tiếng Quan thoại, một thanh 1 bị rơi chính là thanh 4. Lỗi này tích lũy: từng từ riêng lẻ còn đoán được, nhưng cả câu thì không, vì người nghe phải thử các khả năng nhanh hơn bạn nói. Giữ thanh 1 thật cao và thật phẳng đến tận cuối âm tiết."
    four_title: Bốn thanh
    four_lede: "Số trong ngoặc là cách ghi cao độ năm bậc của Triệu Nguyên Nhiệm (趙元任), từ 1 (thấp) đến 5 (cao) — cũng là cách các nhà ngữ âm ghi sáu thanh tiếng Việt, nên hai bảng ở trên so sánh được trực tiếp."
    tones:
      t1:
        name: Thanh 1 — cao bằng
        contour: "55"
        zhuyin: không có dấu
        note: Giữ nguyên ở một độ cao, cao hơn hẳn thanh ngang của bạn. Chú âm không đánh dấu gì cả — giống hệt thanh ngang của chữ quốc ngữ, không có dấu chính là thanh 1.
      t2:
        name: Thanh 2 — đi lên
        contour: "35"
        zhuyin: ˊ
        note: Đi từ giữa lên cao — gần như thanh sắc của bạn. Dấu ˊ của chú âm trông như dấu sắc, và lần này hình dáng không đánh lừa bạn.
      t3:
        name: Thanh 3 — thấp
        contour: 214 / 21
        zhuyin: ˇ
        note: Sách vẽ một đường lượn xuống rồi lên, nhưng phần đi lên chủ yếu chỉ nghe thấy ở âm tiết đứng riêng hoặc cuối câu. Trong lời nói liền mạch, và gần như luôn luôn ở Đài Loan, thanh 3 ở thấp, hơi rè và không quay lên — giống nửa đầu thanh hỏi của bạn, kéo dài ra và không có chỗ vút.
      t4:
        name: Thanh 4 — đi xuống
        contour: "51"
        zhuyin: ˋ
        note: Từ trên cao rơi mạnh xuống dưới, ngắn và dứt khoát. Đây không phải thanh huyền dù dấu ˋ giống hệt dấu huyền — huyền bắt đầu thấp, còn thanh 4 bắt đầu từ đỉnh âm vực.
    neutral_title: Thanh thứ năm, tức thanh nhẹ
    neutral_body: "Nói chính xác, đây không phải thanh thứ năm mà là sự vắng mặt của thanh riêng: âm tiết mất đường nét, ngắn lại và lấy cao độ từ âm tiết trước. Chú âm đánh dấu bằng dấu chấm ˙ và, khác với bính âm, đặt nó TRƯỚC âm tiết: ˙ㄉㄜ. Đừng đọc nó như thanh ngang, cũng đừng đọc như thanh nặng dù dấu chấm gợi nhớ dấu nặng: nó chỉ là một âm tiết rất ngắn, đọc lướt, như các hư từ trong câu tiếng Việt nói nhanh."
    neutral_taiwan: "Và một điểm quan trọng của tiếng Quan thoại Đài Loan: thanh nhẹ ít gặp. Rất nhiều từ hai âm tiết giữ nguyên thanh đầy đủ ở âm tiết thứ hai — với người Việt quen đọc rõ từng tiếng, đây lại là điều dễ chịu."
    taiwan_title: Thanh điệu ở Đài Loan nghe thế nào
    taiwan_body: Bạn học tiếng Quan thoại Đài Loan, nên đây chính là chuẩn của bạn. Hệ thống vẫn là bốn thanh, nhưng cách phát âm có những nét riêng.
    taiwan_points:
      range: Âm vực nói chung thấp và hẹp. Người Đài Loan nói trong một khoảng cao độ nhỏ, nên thanh điệu nghe nhẹ nhàng, kiềm chế chứ không “đơn điệu”. Thanh 1 không cần lên cao như giọng phát thanh viên.
      second: Thanh 2 không lên quá cao, và đôi khi có một chút trũng ở đầu, khiến hình dáng gần với thanh 3 trong sách giáo khoa.
      third: Thanh 3 không quay lên khỏi vùng thấp, hơi rè. Đường nét đầy đủ 214 gần như không xuất hiện ở Đài Loan.
      neutral: Thanh nhẹ ít gặp, và âm tiết cuối từ thường giữ thanh của mình.
      erhua: Nhi hóa — âm cuốn lưỡi 兒 ở cuối từ — rất hiếm trong tiếng Quan thoại Đài Loan.
      merge: Thanh 2 và thanh 3 nghe gần nhau hơn so với giọng đọc phát thanh. Đó là chuẩn mực, không phải khiếm khuyết phát âm.
    sandhi_title: Hai quy tắc làm thanh điệu thay đổi
    sandhi_lede: "Viết một thanh mà đọc một thanh khác. Thanh được viết thì không đổi: từ điển, chú âm và bính âm đều giữ thanh gốc. Tiếng Việt không có hiện tượng này, nên hãy coi đây là một kỹ năng mới."
    third_title: Thanh 3 trước thanh 3
    third_body: Khi hai thanh 3 đứng liền nhau, thanh đầu đọc thành thanh 2. 你好 viết là ㄋㄧˇ ㄏㄠˇ nhưng đọc như ní hǎo — âm đầu gần như thanh sắc. Quy tắc dựa vào cách nói chứ không dựa vào dạng từ điển, nên áp dụng cả ở chỗ nối giữa các từ.
    third_three: "Khi ba thanh 3 đứng liền nhau, kết quả phụ thuộc vào cách cụm từ chia theo nghĩa. 我很好 thường đọc là wó hén hǎo, vì 很好 gắn với nhau chặt hơn. Không cần học thuộc gì: quy tắc áp dụng cho những âm tiết bạn thực sự nói liền thành một nhóm."
    yi_title: 一 và 不
    yi_body: Thanh của hai âm tiết này phụ thuộc vào âm tiết đứng sau.
    yi_rules:
      yi_alone: "一 đứng riêng, ở cuối và trong số thứ tự — thanh 1: yī, 第一 dì yī."
      yi_before4: "一 trước thanh 4 — đọc thanh 2: 一定 yí dìng, 一樣 yí yàng."
      yi_other: "一 trước thanh 1, 2 hoặc 3 — đọc thanh 4: 一天 yì tiān, 一年 yì nián, 一起 yì qǐ."
      bu_before4: "不 trước thanh 4 — đọc thanh 2: 不是 bú shì, 不要 bú yào."
      bu_other: "不 ở mọi vị trí khác — thanh 4: 不好 bù hǎo, 不能 bù néng."
    practice_title: Luyện tập
    practice_body: "Bên dưới là bài luyện nghe: một âm tiết vang lên, bạn gọi tên thanh. Bài luyện không ghi tiến độ và không ảnh hưởng tới lượt ôn — chỉ đơn thuần luyện tai, bạn có thể rời đi bất cứ lúc nào. Hãy để ý nhất tới cặp thanh 1 và thanh 4."
    practice_pending: "Luyện phát âm thanh điệu thành tiếng ở đây chưa có: tính năng này sẽ xuất hiện khi nhận dạng giọng nói có kiểm tra đường nét và chuẩn Đài Loan được kết nối. Hiện tại chỉ luyện nhận diện bằng tai."
    drill:
      title: Luyện nghe thanh điệu
      lede: "Một âm tiết vang lên, bạn gọi tên thanh. Không ghi tiến độ, không ảnh hưởng lượt ôn: chỉ là luyện tập thuần túy, rời đi lúc nào cũng được."
      back: "← Quay lại phần giải thích"
      prompt: Đây là thanh mấy?
      replay: Nghe lại
      keys: Lên, phải, xuống, trái là thanh 1, 2, 3, 4. Hoặc chạm vào một lựa chọn.
