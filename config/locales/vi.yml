        body: Từ trên lớp, trong giáo trình hay danh sách của riêng bạn trở thành thẻ — giống Anki hay Memrise, nhưng có chú âm, âm thanh của người bản ngữ và lịch ôn tính riêng cho bạn. Thứ tự bài học của chúng tôi không xen vào.
        home:
          - Ôn bộ thẻ của riêng bạn
          - Từ trên lớp — dạng văn bản, ảnh chụp hoặc tệp nhập
          - Lỗi trong tuần và chuỗi ngày học
      guided:
        title: Học theo phương pháp của chúng tôi
        short: Theo lộ trình
        tagline: Chưa có cách học riêng — chúng tôi dẫn bạn từng bước
        body: Chưa có cách học của riêng mình? Chúng tôi dẫn bạn từng bước — trước hết là âm, sau đó là các bài trong khóa học và thẻ theo đúng thứ tự — và cho bạn biết mỗi ngày nên làm gì.
        home:
          - "Bước tiếp theo: ngữ âm hoặc một bài trong khóa học"
          - Thẻ của hôm nay theo kế hoạch của chúng tôi
          - Luyện phát âm, thanh điệu và viết chữ
