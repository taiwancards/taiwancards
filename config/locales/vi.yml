    initials_lede: "Hai mươi mốt ký hiệu — mọi thứ một âm tiết có thể bắt đầu bằng. Nút bấm phát bản ghi của Bộ Giáo dục Đài Loan: hãy nghe trước khi đọc phần phân tích. Phần giải thích dựa trên cách phát âm của người Hà Nội."
    series:
      title: Ba hàng ai cũng nhầm
      body: >-
        Chín thanh mẫu trông giống nhau trong bính âm nhưng được phát âm ở ba vị trí khác nhau trong miệng.
        Hãy luyện từng hàng trước — trong một hàng vị trí là như nhau, chỉ có luồng hơi thay đổi.
      rows_hint: một hàng
      columns_hint: ba hàng cùng lúc
      hard_title: Chỗ này thực sự khó
      hard_body: >-
        Lấy một cột thay vì một hàng thì các âm gần như không phân biệt được: trong bính âm chúng viết gần
        giống nhau, zhi, zi và ji chỉ khác nhau một chữ cái. Khác biệt duy nhất là vị trí của lưỡi — cong lên
        vòm miệng, đặt ở răng dưới, hay áp lên ngạc cứng. Với người Hà Nội, vốn đọc tr và ch như nhau, đây
        là chỗ cần nghe kỹ nhất, và lúc đầu nhầm là chuyện bình thường.
      all_nine: Cả chín âm trộn lẫn
      sets:
        zhi_chi_shi: zhi chi shi
        zi_ci_si: zi ci si
        ji_qi_xi: ji qi xi
        zhi_zi_ji: zhi zi ji
        chi_ci_qi: chi ci qi
        shi_si_xi: shi si xi
    drill_these: "Luyện %{symbols}"
    blocks:
      labial:
        title: Hai môi
        body: Hai môi chạm nhau. Đây là thứ trẻ em Đài Loan học đầu tiên, mở đầu bài hát ㄅㄆㄇㄈ. ㄇ là m, ㄈ chính là ph của bạn. Nhưng ㄅ không phải b — b tiếng Việt rung dây thanh và hút hơi vào, còn ㄅ là p không rung, không bật hơi, như p trong “pin”. ㄆ cũng không phải ph — đó là p kèm một luồng hơi mạnh, như th nhưng bằng môi.
      alveolar:
        title: Đầu lưỡi
        body: Đầu lưỡi đặt sau răng trên. Đây là nhóm dễ nhất với người Việt — ㄉ chính là t của “tôi”, ㄊ chính là th của “thầy”, ㄋ là n, ㄌ là l. Chỉ cần nhớ ㄉ không phải đ — bính âm viết d nhưng không có sự rung và hút hơi của đ. 的, 他, 你 và 了 đều bắt đầu bằng nhóm này.
      velar:
        title: Cuống lưỡi
        body: ㄍ gần như c/k của bạn, không bật hơi. ㄏ chính là kh của tiếng Hà Nội, có khi còn nhẹ hơn, gần như một hơi thở. Cái bẫy là ㄎ — nó không phải kh mà là c/k kèm một luồng hơi mạnh, như th nhưng ở cuống lưỡi.
      palatal:
        title: Chỉ đứng trước ㄧ và ㄩ
        body: ㄐ gần với ch của “chị”, ㄑ là âm đó kèm luồng hơi mạnh, ㄒ là x đọc với mặt lưỡi áp lên vòm như khi mỉm cười. Chúng chỉ đi với ㄧ và ㄩ, nên nếu để ý âm đứng sau thì không bao giờ nhầm với ㄓㄔㄕ. Cẩn thận với bính âm — x ở đây không phải x tiếng Việt, q cũng không phải qu.
      retroflex:
        title: Uốn lưỡi
        body: "Đầu lưỡi cong lên phía vòm miệng — người Hà Nội không có âm này. Tin vui là người Đài Loan đọc chúng nhẹ hơn hẳn sách giáo khoa, gần như ㄗㄘㄙ, nên bạn không cần uốn lưỡi quá mức. ㄖ đừng đọc như r kiểu Hà Nội (tức như d/gi): cong lưỡi lên và để hơi lướt qua."
      sibilant:
        title: Âm xuýt
        body: Lưỡi đặt ở răng dưới, hơi thoát ra thành dòng hẹp. ㄙ là s/x của bạn. ㄗ không có trong tiếng Việt — đó là t và s dính liền thành một âm, như “ts”. ㄘ là âm đó kèm luồng hơi mạnh. Cặp đôi của ba âm uốn lưỡi phía trên.
      medial:
        title: Âm đệm
        body: Chúng đứng giữa thanh mẫu và vận mẫu, trong bính âm thành i, u và ü — hoặc y và w ở đầu âm tiết. ㄧ là i, ㄨ là u. ㄩ không phải ư — ư không tròn môi, còn ㄩ là i đọc với môi chu tròn như khi nói u.
      open:
        title: Nguyên âm đơn
        body: Bốn âm sạch, mọi thứ khác được xây từ chúng. ㄚ là a, ㄛ gần ô, ㄜ gần ơ nhưng lưỡi cao hơn một chút, về phía ư, ㄝ là ê. ㄝ không bao giờ đứng một mình — chỉ đi sau ㄧ và ㄩ.
      diphthong:
        title: Nguyên âm đôi
        body: "Hai âm trong một âm tiết, lưỡi trượt từ vị trí này sang vị trí kia mà không ngắt âm tiết. Cả bốn đều có trong tiếng Việt: ㄞ là ai, ㄟ là ây, ㄠ là ao, ㄡ là âu."
      nasal:
        title: Vận mũi
        body: ㄢ là an, ㄣ là ân, ㄤ là ang, ㄥ là âng. Người Việt phân biệt -n và -ng rất rõ, nên đây là lợi thế của bạn; ở Đài Loan người ta thường đọc lẫn, nhưng từ điển vẫn giữ sự phân biệt.
      rhotic:
        title: Độc nhất
        body: Một âm tiết đứng riêng, có trong 二, 兒 và 耳. Tiếng Việt không có âm này — hãy đọc ơ rồi cuộn đầu lưỡi lên. Đây không phải đuôi r gắn vào từ khác — ở Đài Loan gần như không ai thêm đuôi đó.
      compound:
        title: Vận ghép
        body: Một âm đệm cộng một vận mẫu. Không cần luyện riêng — chúng được ghép từ những ký hiệu bạn đã luyện.
    finals_lede: "Mọi thứ còn lại trong âm tiết sau phụ âm đầu: một nguyên âm, một nguyên âm đôi, hoặc nguyên âm kèm âm mũi. Với vận ghép, từng ký hiệu được đọc riêng — đọc liền nhau thì không nghe như hai phần nối tiếp. Cấu trúc này quen với bạn: tiếng Việt cũng có âm đầu, âm đệm và vần."
    why_title: Vì sao đây không phải chuyện nhỏ
    why_body: "Bạn đọc được bính âm mà không cần chuẩn bị gì, và chính điều đó làm nó nguy hiểm: chữ cái kéo theo cách đọc chữ quốc ngữ. d bị đọc thành đ, x thành s, c thành k, ch thành ch tiếng Việt, q thành qu, r thành r kiểu Hà Nội — và lỗi cứ thế ngấm vào mà không ai hay. Sau một ký hiệu chú âm không có gì ngoài âm bạn dạy cho nó. Chính vì vậy Đài Loan dùng chú âm để ghi cách đọc, và các nghiên cứu về người Việt học tiếng Quan thoại cũng chỉ ra đúng điều này."
    compound_audio: "Vận ghép: từng ký hiệu được đọc riêng. Đọc liền nhau thì không nghe như hai phần nối tiếp — xem ghi chú bên phải."
    play_symbol: Phát %{symbol}
    phonetics_card: "Bảng âm đầy đủ: chú âm, bính âm, IPA, mốc so sánh với tiếng Việt và ví dụ."
    phonetics_title: Chú âm và bính âm
