  page_help:
    word_pairs_html: >-
      <p>Những cặp và bộ ba từ dễ nhầm vì tiếng Việt dùng ít từ hơn cho cùng một vùng nghĩa: “có thể” cho 會, 能 và 可以, “lại” cho 再 và 又. Với 不 và 沒 thì người Việt có lợi thế, vì đã quen phân biệt “không” và “chưa” — nhưng ranh giới không trùng khít hoàn toàn. Trước hết là quy tắc, rồi ví dụ cho từng từ, rồi những lỗi người học hay mắc nhất.</p><p>Bài tập ở cuối không lưu gì: trả lời xong là bạn thấy ngay vì sao đó là từ đúng. Trang từ điển của các từ này đều dẫn tới nhóm của chúng.</p>
    dictation_html: >-
      <p>Nghe một bản ghi thật và viết lại những gì bạn nghe. Giọng đọc là người bản ngữ Đài Loan, và câu được
      xếp theo cấp độ từ vựng: 1 là dễ nhất.</p><p>Nghe bao nhiêu lần tùy ý. Nếu quá nhanh, hãy giảm tốc độ
      bằng nút bên cạnh. Nút Bản dịch cho biết nghĩa khi bạn hoàn toàn không nghe ra.</p><p>Bạn có thể gõ chú
      âm ngay tại đây: bật ㄅㄆㄇ và nhấn các phím theo bố cục Đài Loan hoặc các nút trên màn hình. Dấu thanh là
      6, 3, 4 và 7; thanh 1 không cần dấu.</p>
    desk_html: >-
      <p>Màn hình chính thay đổi theo chế độ bạn chọn. <strong>TOCFL</strong> hiện đếm ngược tới kỳ thi, mức sẵn sàng theo cấp, bài thi thử và ngữ pháp của cấp. <strong>Từ của tôi</strong> hiện lượt ôn bộ thẻ của riêng bạn và cách nhanh để thêm từ học trên lớp. <strong>Theo lộ trình</strong> hiện bước tiếp theo về ngữ âm hoặc khóa học, cùng thẻ của ngày. Đổi chế độ trong hồ sơ hoặc bằng liên kết “đổi” cạnh tiêu đề.</p><p>Các bộ đếm: <strong>đến hạn</strong> là số thẻ tới lượt hôm nay theo lịch FSRS, <strong>mới</strong> là lượng tài liệu chưa xem mà ứng dụng sẵn sàng thêm vào (hạn mức lấy từ kế hoạch của bạn, hoặc từ cài đặt nếu chưa có kế hoạch), còn <strong>đang học</strong> là tổng số thẻ đang được dùng. Nút lớn luôn dẫn tới chỗ hợp lý nhất để học tiếp.</p>
    progress_html: >-
      <p><strong>Chuỗi ngày học</strong> là số ngày liên tiếp có ôn tập. Một ngày tính từ nửa đêm tới nửa đêm theo múi giờ của thiết bị; khi bạn đi xa, những ngày đã tính vẫn giữ nguyên. <strong>Tỷ lệ ghi nhớ</strong> là tỷ lệ đánh giá “tốt” trở lên trong số thẻ FSRS cho là đã chín: nếu nó thấp hơn hẳn mục tiêu trong cài đặt, khoảng cách ôn đang quá dài.</p><p>Trạng thái: <strong>chưa xem</strong> là chưa từng hiện, <strong>đang học</strong> là còn trong các bước học, <strong>mới nhớ</strong> có khoảng cách dưới ba tuần, <strong>vững</strong> là trên ba tuần. <strong>Thẻ hay quên</strong> là những thẻ bạn quên đi quên lại; học lại chúng bằng tay rẻ hơn là để chúng chạy theo lịch.</p>
    plan_html: >-
      <p>Chọn cấp TOCFL mục tiêu và ngày thi, ứng dụng sẽ tính mỗi ngày cần bao nhiêu tài liệu mới để hoàn
      thành cấp đó kịp lúc. Hạn mức được tính lại mỗi ngày từ những gì đã học, nên bỏ lỡ một ngày không làm hỏng
      kế hoạch — chỉ đẩy hạn mức lên một chút.</p><p>Khi hạn mức trở nên quá sức, nó được tô màu hổ phách: cấp
      độ sẽ không hoàn thành kịp ngày đó, nên hãy lùi ngày hoặc nhắm thấp hơn một cấp.</p>
    cangjie_lessons_html: >-
      <p>Thương Hiệt là cách người Đài Loan gõ chữ phồn thể theo hình dạng chứ không theo âm: một chữ được cắt
      thành những mảnh nhìn thấy được, và mỗi mảnh là một phím Latinh. Giáo trình này chỉ dạy thế hệ thứ năm
      của phương pháp (倉頡五代) — không phải Thương Hiệt 3, cũng không phải Thương Hiệt giản lược.</p><p>Trình tự
      như sau: bốn bài về cách tạo mã, rồi mỗi phím một bài cho cả hai mươi sáu phím, rồi quy tắc tách và các
      danh sách ngoại lệ khép kín. Cuối cùng là những chữ riêng của Đài Loan và toàn bộ Novice 1–2.</p><p>Mỗi
      bài đều có phần luyện riêng: gọi tên phím từ một hình dạng, gọi tên phím đầu của một chữ, chọn cách tách
      đúng và gõ mã đầy đủ. Gõ tự do nằm riêng, trong <strong>Luyện gõ Thương Hiệt</strong> ở mục Luyện tập.</p>
    names_html: >-
      <p>Mục này giải thích tên người Đài Loan được cấu tạo thế nào và cho thấy người Đài Loan thực sự dùng những gì, tính từ sổ hộ tịch. Nó không bịa tên cho bạn: chọn tên là chuyện riêng, thường được làm cùng một người bạn hoặc thầy cô người Đài Loan.</p><p><strong>Họ</strong> là một chữ, được thừa kế, viết trước tên; họ hai chữ có nhưng hiếm. <strong>Tên riêng</strong> gồm một hoặc hai chữ do gia đình chọn, phổ biến là hai chữ. Thứ tự không bao giờ đổi — giống tiếng Việt, họ đứng trước dù hộ chiếu in thế nào. Khác với người Việt gọi nhau bằng tên, người Đài Loan gọi họ kèm danh xưng cho tới khi được mời làm khác. Tên người Đài Loan đọc theo âm Hán Việt nghe rất tự nhiên với người Việt: 林安安 là Lâm An An.</p><p>Ở tab “Chọn tên”, các chữ được xếp hạng theo đúng những số liệu ở tab thứ hai: tần suất theo thế hệ, mẫu thanh điệu, độ gắn kết của cặp chữ và số nét. Kết quả là năm phương án kèm lý giải, để bạn có một danh sách ngắn thực sự đem ra bàn được.</p>
    desks_html: >-
      <p>Bộ thẻ được tạo từ bất cứ thứ gì bạn dán vào: danh sách mỗi dòng một từ, cách nhau bằng dấu phẩy, hay
      một đoạn văn bình thường — hệ thống tự xử lý. Bạn có thể tải tệp lên, hoặc lấy từ vựng từ một bài hát.</p><p>Khác
      biệt chính so với Anki: <strong>bạn không bao giờ phải gõ nghĩa</strong>. Cách đọc, nghĩa, phân tích chữ
      và âm thanh đều lấy từ từ điển của chúng tôi. Bạn chỉ cần đưa từ.</p><p>Trước khi tạo bộ thẻ bạn được xem
      trước: sẽ có bao nhiêu thẻ, những gì bị trùng và những gì không có trong từ điển. Các mục xếp từ dễ đến
      khó. Nếu bạn đã biết cả danh sách, một nút sẽ đưa nó vào lịch ôn dài hạn thay vì hàng đợi thẻ mới.</p>
    hanzi_html: >-
      Trang này tách một chữ Hán thành từng phần và cho thấy làm gì với các phần đó. Bộ phận chỉ nghĩa chỉ về
      một trường nghĩa, bộ phận chỉ âm gợi một cách đọc gần đúng. Trong dữ liệu của chúng tôi, bộ phận chỉ âm
      cho đúng vần khoảng bốn trên năm lần, nên một chữ lạ thường đọc được ngay từ lần đầu — và âm Hán Việt
      của bạn thường xác nhận điều đó. Hãy mở từng phần một.
    triage_html: >-
      <p>Cách nhanh để xác định trình độ nếu bạn đã biết một phần. Vuốt phải nếu biết chữ đó, vuốt trái nếu
      chưa chắc.</p><p><strong>Tôi biết</strong> đẩy mục đó sang lịch ôn xa: khoảng ba tuần trở đi, rải ra để
      không bao giờ dồn vào một ngày. Không có gì bị mất hẳn.</p><p><strong>Chưa chắc</strong> để mục đó trong
      hàng đợi bình thường, tới lượt cùng mọi thứ khác.</p><p>Những gì bạn đã thực sự học được để riêng, không
      bị động tới.</p>
    zhuyin_trainer_html: >-
      <p>Ở đây chú âm được học như một hệ chữ độc lập, không có chỗ dựa Latinh. Bạn nghe một âm và chọn ký hiệu — cố ý không có bính âm trên màn hình, nếu không thứ bám vào đầu sẽ là “ㄅ là chữ b” chứ không phải “ㄅ là âm này”. Với người Việt điều này càng quan trọng: chữ b của bạn là một âm khác hẳn ㄅ.</p><p>Các ký hiệu đi theo nhóm cách phát âm chứ không theo thứ tự bảng. Nhóm mới mở ra khi nhóm trước đã xong. Các lựa chọn cố ý gần nhau: hình dạng giống nhau và âm cùng vị trí phát âm — lựa chọn ngẫu nhiên chỉ tạo ảo giác tiến bộ.</p><p>Một ký hiệu được tính là đã nắm sau ba lần trả lời đúng liên tiếp, và phải nhanh: đúng nhưng chậm nghĩa là bạn đang suy ra chứ chưa nhận ra, và bộ đếm không tăng. Bạn có thể rời đi bất cứ lúc nào.</p>
    numbers_html: >-
      <p>Số đếm chỉ cần một ít chữ Hán và bạn cần tất cả — âm Hán Việt nhất, nhị, tam, tứ giúp bạn nhớ rất
      nhanh. Cái khó thực sự không nằm ở chữ mà ở các hàng đơn vị.</p><p>Tiếng Quan thoại chia chữ số theo nhóm
      bốn: 萬 (vạn) là 10.000, và mọi thứ lớn hơn đều xây trên đó. Vì vậy một triệu là 一百萬 và một tỷ là 十億.
      Năm phần dưới đây đi từ chữ Hán tới các bẫy; phần cuối nói về năm 民國, xuất hiện trên mọi biểu mẫu ở Đài
      Loan.</p>
    practice_phonetics_html: >-
      <p><strong>Chú âm</strong> (ㄅㄆㄇㄈ, còn gọi là bopomofo) là một bảng chữ ghi âm: 37 ký hiệu, mỗi ký hiệu
      gắn với một âm của tiếng Quan thoại, cộng với dấu thanh. Bản thân các ký hiệu không mang nghĩa gì, nên
      không thể đọc chúng theo thói quen. Chúng ghi cách đọc trong từ điển và sách giáo khoa Đài Loan, và là
      cách người Đài Loan gõ chữ.</p><p><strong>Bính âm</strong> là một lối chính tả — cách viết chính những
      âm đó bằng chữ Latinh theo quy tắc riêng. Những quy tắc đó được đặt ra để viết gọn, không phải để chính
      xác: một chữ cái có thể ghi nhiều âm khác nhau, và một số nguyên âm bị bỏ hẳn khỏi cách viết. Nó là chỗ
      dựa hữu ích, nhưng sẽ đánh lừa bạn ngay khi bạn đọc nó như chữ quốc ngữ — d không phải đ, x không phải x
      của tiếng Việt.</p><p>Trong các bảng dưới đây, <strong>mốc so sánh</strong> đứng đầu: một dòng cho biết nên
      nói thế nào ngay bây giờ, dựa trên âm của tiếng Hà Nội. Tiếp theo là cách cấu âm — các cơ quan phát âm
      chuyển động thế nào. Cuối mỗi hàng, màu cam, là lỗi cần tránh.</p>
    roadmap_html: >-
      <p>Thứ tự nên đi qua ứng dụng nếu bạn bắt đầu từ con số không. Không có gì ở đây là bắt buộc — mọi thứ
      đều mở được từ menu.</p><p>Các bước có bài luyện sẽ tự đánh dấu: sau một lượt luyện âm, sau mười từ gõ
      đúng, sau hai mươi lượt ôn. Những bước còn lại hãy tự đánh dấu khi bạn thấy sẵn sàng đi tiếp.</p><p>Các
      bước tùy chọn có thể bỏ qua mà không ảnh hưởng gì — lộ trình vẫn được tính là hoàn thành.</p>
    label: Trang này hoạt động thế nào
    typing_html: >-
      <p>Bàn phím ở đây là bố cục chú âm của Đài Loan — được in trên bàn phím bán ở Đài Loan và được phần lớn
      người Đài Loan dùng. Không cần cài gì: nhấn đúng các phím đó và chú âm sẽ hiện ra.</p><p>Gõ cách đọc của
      từ đang hiện, rồi nhấn phím cách hoặc Enter để kiểm tra. Phím thanh là 6 (ˊ), 3 (ˇ), 4 (ˋ) và 7 (˙);
      âm tiết thanh 1 không cần phím thanh.</p><p>Từ được lấy từ từ điển của bạn theo thứ tự học, nên bài này
      luyện cách đọc và gõ chữ cùng lúc.</p>
    reader_html: >-
      <p>Đọc tiếng Quan thoại thật với từ điển có sẵn. Những từ bạn đã biết được làm mờ; mọi từ mới được tô màu
      theo cấp độ và gạch dưới, cách đọc in phía trên.</p><p>Chạm vào từ bất kỳ để xem mục từ đầy đủ, âm thanh
      và nút để bắt đầu học. Cả văn bản có thể thành bộ thẻ chỉ với một cú bấm.</p><p>Tự dán bất cứ thứ gì,
      hoặc nhập lời bài hát. Chữ giản thể luôn được đổi sang chữ phồn thể Đài Loan trước.</p>
    placement_html: >-
      <p>Bài kiểm tra thích ứng xác định trình độ của bạn trong khoảng năm phút, rồi đề nghị đánh dấu mọi thứ
      ở mức đó trở xuống là đã biết.</p><p>Câu hỏi khó dần khi bạn trả lời đúng và dễ dần khi bạn trả lời sai.
      Kết quả ước lượng cố ý thô — bạn có thể điều chỉnh trên màn hình kết quả trước khi áp dụng.</p><p>Việc
      đánh dấu an toàn: những gì bạn đang học vẫn giữ tiến độ, và các mục được đánh dấu được rải ra trong những
      tuần tới để bạn không bao giờ gặp một bức tường thẻ ôn.</p>
    phrases_html: >-
      <p>Cả câu nói trọn vẹn, không phải từ vựng rời. Mỗi thẻ là một mẫu câu có chỗ trống để điền từ trong từ
      điển, nên một dòng đủ cho cả trăm lần gọi đồ uống.</p><p>Các thẻ đánh dấu <strong>Họ nói</strong> là nửa
      mà sổ tay nào cũng bỏ qua: những câu nhân viên hỏi bạn ở quầy. Nghe hiểu những câu đó quan trọng hơn nói
      ra những câu hoàn hảo.</p><p>Khi một cách nói vẫn được hiểu nhưng nghe lạ tai ở Đài Loan, dạng của Đài
      Loan được đưa ra và dạng kia bị gạch đi.</p>
    everyday_html: >-
      <p>Từ vựng đậm chất Đài Loan và nằm ngoài mọi danh sách thi — cách gọi đồ uống ngắn gọn, tiếng lóng
      từ tiếng Mân Nam Đài Loan, từ mượn tiếng Nhật và những từ chỉ Đài Loan mới có.</p><p>Lọc theo lĩnh vực
      đời sống hoặc theo nguồn gốc của từ. Những gì được đánh dấu là thô tục thì đúng là thô tục.</p>
    variants_html: >-
      <p>Chỗ Đài Loan khác Trung Quốc, Hồng Kông và Singapore — ở cách đọc một từ, ở chữ được viết, hay ở
      chính việc chọn từ.</p><p>Đây là những khác biệt cho thấy bạn đã học tiếng Quan thoại ở nơi khác. Những
      gì còn tranh cãi hoặc mới thay đổi đều được ghi chú trong bài thay vì trình bày như đã ngã ngũ.</p>
    calendar_html: >-
      <p>Mười hai dịp lễ thực sự định hình một năm ở Đài Loan, mỗi dịp kèm quy tắc xác định ngày của nó thay
      vì một ngày cụ thể bạn phải tra lại vào năm sau. Phần lớn chúng trùng với các dịp lễ âm lịch của người
      Việt.</p><p>Phần âm lịch giải thích chính cách đếm — vì sao 初五 có nghĩa như vậy và vì sao 春節 dịch
      chuyển. Cả hai công cụ đổi ngày chạy ngay trong trình duyệt: công cụ 民國 chỉ là phép tính số học, còn công
      cụ âm lịch dùng một bảng đã đối chiếu với Đài Thiên văn Hồng Kông.</p><p>Từ vựng gắn với mỗi dịp lễ có
      thể thêm thẳng vào danh sách học từ danh sách này, nếu từ điển đã có chúng.</p>
    metro_html: >-
      <p>Mọi tuyến của mạng lưới Đài Bắc và Tân Bắc, kèm các ga theo thứ tự chính thức. Chạm vào một ga, thẻ
      ở trên cùng sẽ hiện chú âm, bính âm và nghĩa; từ đó bạn có thể mở mục từ điển đầy đủ hoặc thêm vào bộ
      thẻ.</p><p>Chấm rỗng là ga chuyển tuyến — thẻ liệt kê mọi tuyến đi qua ga đó. Bố cục cố ý mang tính sơ
      đồ chứ không theo địa lý.</p>
    games_html: "<p>Từ vựng của mạt chược Đài Loan, mạt chược quốc tế, cờ tướng, cờ vây và board game, mỗi từ được giải thích bằng vai trò của nó trong trò chơi. Đây không phải sách luật: mục đích là theo kịp câu chuyện bên bàn chơi và đọc được biển hiệu, ứng dụng, buổi phát trực tiếp.</p><p>Các tab chia từ vựng theo trò chơi, và trong mỗi trò chơi theo vai trò: quân bài và quân cờ, diễn biến ván chơi, hô bài, mẫu bài, chiến lược, người chơi nói gì. Chấm xanh lá đánh dấu những gì chỉ người Đài Loan nói như vậy. Nghĩa được đối chiếu với từ điển của Bộ Giáo dục Đài Loan, luật mười sáu quân của Đài Loan và luật thi đấu quốc tế năm 1998.</p>"
    medicine_html: >-
      <p>Y học hiện đại theo cách người Đài Loan thực sự nói: cơ thể và nội tạng, tên bệnh bác sĩ gọi và từ
      người nhà dùng, vắc-xin trong lịch tiêm của CDC, và các biển chỉ dẫn bạn đi theo trong bệnh viện — 掛號,
      批價, 領藥. Chạm vào nhãn bất kỳ trên hình để xem cách đọc, rồi mở mục từ điển đầy đủ.</p><p>Khi thuật ngữ
      y học có từ tương ứng trong đời thường (闌尾炎 bên cạnh 盲腸炎), cặp từ được đặt cạnh nhau. Từ mượn
      tiếng Mân Nam Đài Loan kèm cách đọc Tâi-lô. Mọi thứ
      đều được đối chiếu với từ điển của Bộ Giáo dục và cơ quan y tế của Đài Loan.</p>
    dict_html: >-
      <p>Một từ điển duy nhất: từ đơn và cụm cố định đều chỉ là mục từ ở đây, không tách riêng. Ranh giới đó
      vốn tùy tiện — 便利商店 và 超商 cùng nghĩa (đều là cửa hàng tiện lợi), và tìm chúng trong hai danh sách
      riêng thì chẳng hợp lý.</p><p>Nhãn <strong>cấp TOCFL</strong> thu hẹp về một cấp thi, hàng cấp độ theo
      thang TBCL của trường học, còn bộ lọc tiến độ chỉ hiện mục mới, đang học hoặc đã biết.</p><p>Trong một cấp,
      các mục xếp theo <strong>tần suất</strong> — thông dụng nhất đứng trước. Đổi cách sắp xếp để so sánh tần
      suất thuần túy. Chạm vào mục bất kỳ để xem bài đầy đủ, hoặc dùng nút <strong>+</strong> để thêm thẳng vào
      bộ thẻ.</p>
    chengyu_html: >-
      <p>成語 là các thành ngữ bốn âm tiết bắt nguồn từ văn bản cổ và ngụ ngôn — người Việt đã quen với nhiều thành ngữ như vậy qua âm Hán Việt. Nghĩa đen của chúng thường khác xa nghĩa thật: 雪中送炭 (tuyết trung tống thán) nghĩa đen là “đưa than trong tuyết”, nhưng nghĩa là “giúp đúng lúc cần giúp nhất”. Vì vậy mỗi thành ngữ ở đây không chỉ có bản dịch mà còn có <strong>sắc thái</strong> — khen, trung tính hay chê. Gọi một việc là 十拿九穩 hay là 莫名其妙 khác nhau một trời một vực.</p><p>Danh sách lấy từ từ điển: một số thành ngữ được gắn nhãn theo từ điển, số khác được kiểm tra bằng tay — những thành ngữ đó có ghi chú về lúc nào thực sự được dùng, kèm một ví dụ thật. Chạm vào thành ngữ để xem mục đầy đủ có âm thanh, phân tích chữ và câu ví dụ.</p>
    tbcl_html: >-
      <p>TBCL (臺灣華語文能力基準) là thang mà tiếng Quan thoại thực sự được dạy theo ở Đài Loan: bảy cấp, từ một
      đến bảy. Nó được xây dựng khác với kỳ thi TOCFL — theo chương trình học ở trường chứ không theo dạng đề
      thi.</p><p>Trong một cấp, các mục đi từ thông dụng nhất tới hiếm nhất. Thanh tiến độ cho biết bạn đã biết
      bao nhiêu phần của cấp — tính mọi thứ đã học ở bất cứ đâu trong ứng dụng, không chỉ ở đây.</p>
    characters_html: >-
      <p>4808 chữ phồn thể thông dụng trong bộ chữ của Bộ Giáo dục Đài Loan. Mỗi ô hiện một chữ; chạm vào để
      xem cách đọc (chú âm + bính âm), thứ tự nét, nguồn gốc chữ, những từ có chữ đó và mức độ bạn nhớ nó.</p><p>Các
      chữ được xếp theo tần suất, nên những chữ bạn gặp nhiều nhất đứng trước.</p>
    sentences_html: >-
      <p>Câu ví dụ đầy đủ lấy từ các bài học. Mỗi từ trong câu là một liên kết tới mục từ điển, nên bạn có thể
      chạm vào bất cứ thứ gì lạ. Dùng bộ lọc nguồn để tập trung vào một quyển hoặc một bài.</p>
    search_html: >-
      <p>Ba ô kết hợp với nhau. <strong>Chữ viết hoặc nghĩa</strong> nhận chữ Hán hoặc một từ tiếng Việt hay
      tiếng Anh. <strong>Bính âm</strong> và <strong>chú âm</strong> nhận cách đọc; thanh điệu có thể ghi bằng
      dấu, bằng số sau mỗi âm tiết, hoặc bỏ qua — <code>nǐhǎo</code>, <code>ni3hao3</code> và <code>ni hao</code>
      đều tới cùng một từ. Khi bạn có ghi thanh, các mục có đúng những thanh đó đứng trước, rồi mới tới phần
      còn lại.</p><p>Đánh dấu <strong>tìm trong kho câu</strong> thì các loại mục được để sang bên: mọi kết quả
      là một câu có đánh dấu từ của bạn, mười câu mỗi trang, lọc theo cấp độ và phong cách. Khi truy vấn có hai
      từ, trang cũng cho biết chúng có đi với nhau không.</p>
    radicals_html: >-
      <p>214 bộ thủ Khang Hy — những khối nền mà mọi chữ Hán được xếp vào. Chạm vào một bộ để xem các chữ có
      bộ đó.</p>
    zhuci_html: >-
      <p>Các trợ từ mà tiếng Quan thoại Đài Loan gắn vào cuối câu: 啦, 喔, 耶, 嘛, 齁 và các trợ từ khác. Chúng
      không thêm nghĩa từ điển nào mà mang toàn bộ ngữ điệu — sự thân mật, sốt ruột, lời nhắc thân thiện, giả
      vờ phẫn nộ — đúng như à, ư, nhỉ, nhé, đấy, cơ trong tiếng Việt. Các thẻ xếp theo tần suất mỗi trợ từ thực
      sự đứng cuối mệnh đề trong kho ngữ liệu Đài Loan của chúng tôi; mở một thẻ để xem toàn bộ sắc thái nó mang
      theo, kèm ví dụ được dịch sao cho giữ được ngữ khí.</p>
    liangci_html: >-
      <p>Lượng từ (量詞) của tiếng Quan thoại Đài Loan là những từ nhỏ đứng giữa số từ và danh từ: 一<b>本</b>書, 三<b>隻</b>貓 — như “một quyển sách”, “ba con mèo”. Mỗi mục cho biết nó đếm cái gì, danh từ nào thực sự đi với nó và trông thế nào trong câu thật. Danh sách lấy từ 教育部國語辭典簡編本, CC-CEDICT và kho ngữ liệu Đài Loan của chúng tôi. Ngoài ra còn có một trò chơi để ghép đúng lượng từ.</p>
    tocfl_html: >-
      <p>Tiến độ của bạn tới từng cấp TOCFL chính thức. Số liệu tính mọi chữ và từ bạn đã học ở bất cứ đâu
      trong ứng dụng, không chỉ ở đây. Mở một cấp để học thẳng hoặc xem chính xác còn lại những gì.</p>
    study_html: >-
      <p>Lướt qua cả lượt một lần — thẻ bạn trượt sẽ quay lại, thẻ bạn biết sẽ rời đi. <strong>Vuốt phải</strong>
      = tôi biết, <strong>trái</strong> = tôi không biết, <strong>lên</strong> = quá dễ, <strong>xuống</strong>
      = khó. Phím mũi tên cũng dùng được, và chạm vào thẻ sẽ lật thẻ.</p><p>Mục mới được đưa vào theo từng lượt,
      trộn với mọi thứ đến hạn ôn. Lịch ôn theo FSRS, nên thẻ quay lại đúng lúc bạn sắp quên.</p>
    pronunciation_html: >-
      <p>Đọc từ vào micrô; mỗi âm tiết được chấm về <strong>thanh điệu</strong> và <strong>thanh mẫu/vận mẫu</strong>. Xanh lá là đúng, hổ phách là gần đúng, đỏ là lệch. Ở chế độ tự động, bài sẽ đi tiếp khi bạn đúng và giữ micrô mở cho tới khi bạn đúng. Cả cách đọc trong từ điển lẫn cách đọc thường ngày ở Đài Loan đều được chấp nhận. Hãy để ý thanh 1 và thanh 4 — đó là cặp người Việt hay lẫn nhất.</p>
    writing_html: >-
      <p>Nhớ lại chữ từ nghĩa và cách đọc, rồi viết từng nét. Các nét được kiểm tra theo thứ tự; nét sai sẽ
      được nhắc quay lại. Những chữ hay trượt xuất hiện lại trước, sau đó những chữ còn lại đến từ dễ đến
      khó.</p>
    handwriting_html: >-
      <p>Vẽ một chữ phồn thể từng nét, chữ sẽ được nhận dạng ngoại tuyến — không cần mạng, không có gì rời
      khỏi thiết bị của bạn. Dùng để tra nhanh khi bạn biết hình dạng nhưng không biết cách đọc.</p>
    cangjie_html: >-
      <p>Gõ Thương Hiệt 5 cho chữ phồn thể Đài Loan. Nhấn lần lượt các phím Latinh ứng với từng phần của chữ để gõ ra chữ đó. Trang của mỗi chữ cũng hiện mã Thương Hiệt của nó.</p>
    history_html: >-
      <p>Những gì bạn học gần đây và mỗi mục đã vững đến đâu. Các chấm cho thấy độ bền trí nhớ theo từng kỹ
      năng (nhận diện, đọc, thanh điệu, viết). Dùng nó để phát hiện những gì đang trượt trước khi tới hạn ôn.</p>
    practice_drill_html: >-
      <p>Các thẻ luyện đối chiếu hai hệ ghi âm. Chọn một chiều — thấy ký hiệu chú âm và nhớ lại bính âm, hoặc
      ngược lại — rồi vuốt phải nếu bạn biết, vuốt trái nếu không.</p><p>Những gì bạn trượt sẽ quay lại sau
      trong lượt và được ghi nhớ, nên lượt tiếp theo bắt đầu bằng những âm yếu của bạn. Có thể luyện riêng
      thanh mẫu và vận mẫu.</p>
    practice_progress_html: >-
      <p>Hai thứ khác nhau ở cùng một chỗ, và chúng đến từ những bài luyện khác nhau.</p><p><strong>Luyện âm</strong>
      đếm số lượt bạn làm thẻ nhận diện và bài luyện gõ chú âm, và cho thấy những ký hiệu bạn hay trượt nhất.
      Phần này xuất hiện ngay khi bạn xong lượt đầu tiên.</p><p><strong>Phát âm thành tiếng</strong> được tổng
      hợp từ các lần nói vào micrô: thanh điệu và thanh mẫu nào bạn phát âm ổn định và cái nào chưa. Cho tới khi
      bạn nói vào micrô, phần này còn trống — điều đó là bình thường, nó không liên quan tới thẻ.</p>
