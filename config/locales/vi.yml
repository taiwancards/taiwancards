    col_written: Viết là
    col_real_sound: Âm thực tế
    rimes_lede: Với một số vận mẫu, bính âm không viết đúng những gì bạn sẽ nghe. Chính ở những chỗ này chú âm thường sát với âm thật hơn — đây là những chỗ đó, và lý do.
