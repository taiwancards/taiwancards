  practice:
    about_title: Chú âm từ đâu mà có
    about:
      origin: Các ký hiệu do Chương Bỉnh Lân (章炳麟) đặt ra, lấy từ dạng giản lược của những chữ Hán cổ có cách đọc chứa âm cần ghi. Vì vậy ㄅ, ㄆ và ㄇ trông như chữ Hán — vì chúng từng là chữ Hán.
      adopted: Đài Loan dùng hệ thống này từ năm 1945, và đến nay nó vẫn là cách chính để dạy phát âm tiếng Quan thoại ở bậc tiểu học.
      size: Ba mươi bảy ký hiệu và năm dấu thanh là đủ để ghi mọi âm của tiếng Quan thoại. Thanh 1 thường không đánh dấu, còn dấu chấm phía trên chỉ thanh nhẹ.
      today: Ngày nay chú âm là cách phổ biến nhất ở Đài Loan để gõ chữ Hán trên máy tính và điện thoại, và để tra từ điển. Sách giáo khoa in chú âm nhỏ bên cạnh chữ.
      hokkien: Hai mươi ba ký hiệu nữa được tạo ra cho tiếng Mân Nam Đài Loan — cùng một hệ thống, mở rộng sang một ngôn ngữ khác của Đài Loan.
    practice_now:
      title: Luyện ngay
      initials: Hai mươi mốt thanh mẫu, chia nhóm theo cách phát âm. Đọc tiếp khi bạn nhận ra chúng bằng tai mà không phải ngập ngừng.
      finals: Mười sáu vận mẫu. Cùng bài luyện đó, không có chữ Latinh trên màn hình.
      tricky: >-
        Sáu cách viết mà bính âm che mất vần thật. Bài luyện trộn chúng với những âm trông giống, để bạn biết
        mình đang đọc chú âm hay đang đọc chữ Latinh.
      cta: Sang bài luyện nghe →
