    wider:
      heading: Bức tranh rộng hơn
      lede: >-
        Cùng những câu hỏi đặt ra cho các ứng dụng học tiếng Hán phổ biến trên Android và iOS. Dấu chấm hỏi nghĩa
        là sản phẩm không có tài liệu nói rõ về tính năng đó — không có bằng chứng, chứ không phải bằng chứng là
        không có.
      checked: >-
        Tổng hợp vào tháng 8 năm 2026 từ trang cửa hàng hoặc trang chính thức của từng sản phẩm. Những tuyên bố
        chỉ xuất hiện trong lời quảng cáo được đánh dấu là tự nhận.
