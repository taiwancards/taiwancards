      badge_contour: mẫu thanh điệu
      badge_repeat: lặp thanh, thường được tránh
      badge_strokes: nét
      disclaimer: >-
        Đây không phải một cái tên hoàn chỉnh và cũng không phải lời khuyên dành riêng cho bạn. Đây là số liệu
        hộ tịch — những chữ và cách kết hợp nào xuất hiện nhiều hơn những chữ khác. Tên nên được chọn cùng
        một người lớn lên với ngôn ngữ này; hãy coi danh sách này là chất liệu cho cuộc trò chuyện đó.
      results_note: Năm phương án, mỗi phương án kèm lý giải. Thay đổi câu trả lời thì danh sách sẽ được tạo lại.
      why_heading: Vì sao cách kết hợp này hợp lý
      vibes:
        light: sự sáng sủa
        virtue: sự tử tế
        wisdom: sự học
        strength: sự vững vàng
        nature: sức mạnh thiên nhiên
        prosperity: sự sung túc
        peace: sự bình yên
        aspiration: hoài bão
      why:
        meaning_two: "Tên nói hai điều cùng lúc — %{first}, %{second}."
        meaning_one: Cả hai chữ cùng hướng về một ý — %{first} — khiến cái tên trọn vẹn.
        meaning_single: "Ý nghĩa nằm ở %{text} — %{first}; chữ còn lại được chọn vì cách đọc."
        meaning_solo: "Chỉ một chữ, và chữ đó nói về %{first}: tên riêng ngắn ít gặp hơn ở Đài Loan, nên dễ được nhớ."
        meaning_plain: >-
          Những chữ này không được nhặt ra từ từ điển: người Đài Loan đọc một cái tên như thế này như một
          sắc thái hơn là một câu có nghĩa.
        sound_common: >-
          Giai điệu %{tones} là một trong những dạng phổ biến nhất của tên người Đài Loan, đọc lên trôi chảy không vấp.
        sound_rare: >-
          Mẫu thanh %{tones} không phổ biến, nên cái tên nghe có nét riêng mà vẫn dễ đọc.
        sound_repeat: Hai thanh giống nhau liền nhau là dạng người Đài Loan tránh — đọc liền nghe phẳng.
        pair_strong: >-
          Hai chữ này thật sự hay đi cùng nhau: cặp chữ xuất hiện trong hộ tịch nhiều hơn hẳn mức ngẫu nhiên,
          nên cái tên nghe như tên thật chứ không phải ghép tạm.
        pair_fresh: >-
          Hộ tịch không có sẵn cặp chữ này, nên cái tên nghe như của riêng bạn chứ không phải lấy từ danh sách.
        era_match: Cả hai chữ đều hợp với thế hệ của bạn — không phải tên của ông bà, cũng không phải tên em bé.
        era_older: >-
          Các chữ này thuộc thế hệ trước bạn: cái tên mang dấu ấn thời của bố mẹ, điều mà người Đài Loan
          thường cảm nhận là sự chững chạc.
        era_recent: Đây là cách người ta đặt tên cho trẻ mới sinh gần đây — cái tên sẽ nghe trẻ một cách rõ rệt.
        rare_char: "Chữ %{text} ít gặp: người ta nhớ tên ngay nhưng sẽ hỏi viết thế nào."
        gender_male: Nghe rõ là tên nam.
        gender_female: Nghe rõ là tên nữ.
        gender_neutral: Trung tính về giới — ở Đài Loan những tên như thế này dùng cho cả nam lẫn nữ.
        echo: Âm của tên gợi lại tên thật của bạn, nên ngay khi giới thiệu người nghe đã thấy mối liên hệ.
        official: "Tên sẽ in rõ ràng trên giấy tờ: cả hai chữ đều nằm trong bộ chữ chuẩn."
