    putonghua: chuẩn ngữ khác
    hokkien: tiếng Mân Nam Đài Loan
    hanzi: chữ phồn thể
  glossary:
    fsrs: "Thuật toán lặp lại ngắt quãng: dựa trên chính các đánh giá của bạn, nó dự đoán thời điểm bạn sắp quên một thẻ và đưa thẻ ra đúng lúc đó."
    tocfl: Kỳ thi năng lực Hoa ngữ quốc gia của Đài Loan cùng thang cấp độ của nó, từ Novice đến Band C.
    tbcl: "Bộ chuẩn năng lực Hoa ngữ của Đài Loan: các cấp độ mà chính trường học Đài Loan dùng để giảng dạy."
    zhuyin: Bảng chữ cái ghi âm của Đài Loan, ㄅㄆㄇㄈ. Trẻ em Đài Loan học chú âm thay cho bính âm, và người Đài Loan gõ chữ bằng chú âm.
    pinyin: Cách ghi âm tiết tiếng Quan thoại bằng chữ Latinh. Ở Đài Loan chỉ là công cụ phụ trợ, gặp trên biển tên đường và ga tàu.
    putonghua: Một chuẩn tiếng Quan thoại khác với chuẩn của Đài Loan; ứng dụng này không dạy chuẩn đó.
    hokkien: Tiếng Mân Nam Đài Loan (tiếng Đài), một ngôn ngữ Mân Nam được phần lớn dân số Đài Loan sử dụng. Đây là một ngôn ngữ riêng, không phải phương ngữ của tiếng Quan thoại.
    hanzi: Dạng chữ Hán đầy đủ, nét chữ truyền thống mà Đài Loan dùng trong trường học, báo chí và mọi văn bản chính thức.
  locales:
    en: English
    ru: Русский
    vi: Tiếng Việt
  language_step:
    heading: Chọn ngôn ngữ cho ứng dụng và học liệu
    edition: "Không phải bản dịch nguyên văn từ tiếng Anh, mà là một ấn bản riêng. Tiếng Quan thoại Đài Loan được giải thích từ góc nhìn của người nói tiếng Việt: phát âm, ngữ pháp và những nét văn hóa."
    later: Sau này bạn có thể đổi lại trong menu.
  app:
    name: TaiwanCards
