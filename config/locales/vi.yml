    begin: Bắt đầu
    title: Bắt đầu từ đâu
    lede: Hai câu hỏi, và ứng dụng sẽ sắp xếp màn hình chính cùng những tuần đầu tiên theo câu trả lời của bạn. Bạn có thể đổi cả hai bất cứ khi nào.
    pick_one: Hãy chọn một trong các lựa chọn.
    level_question:
      tocfl: "Bạn đã có trình độ nào?"
      guided: "Trình độ của bạn là gì?"
      classes: "Trình độ của bạn là gì?"
    level_hint:
      tocfl: "Không phải cấp bạn sẽ thi — cấp đó bạn chọn trong kế hoạch ôn thi."
      guided: "Từ mới sẽ bắt đầu từ cấp ngay trên đó."
      classes: "Chỉ để chúng tôi tham khảo — bỏ qua cũng được."
    scale:
      guide: Làm sao biết trình độ của mình?
      zero:
        title: Từ con số không
        short: "phần lớn mọi người bắt đầu ở đây"
        body: Trước Novice 1 — chưa từng học, hoặc biết một hai từ. Phần lớn mọi người bắt đầu ở đây.
      hsk: "≈ HSK %{level}"
      items: "≈ %{count} từ và chữ"
      can:
        "1": Chào hỏi, tự giới thiệu, xử lý số đếm, giờ giấc và giá cả.
        "2": Nói về bản thân, gia đình, đồ ăn và mua sắm bằng những câu ngắn.
        "3": Xoay xở trong đời thường — đi lại, mua sắm, quán cà phê — và đọc những thông báo đơn giản.
        "4": Nói về công việc, học tập và kế hoạch; theo kịp lời nói chậm và văn bản đơn giản.
        "5": Thảo luận các chủ đề quen thuộc, đọc bài báo dễ hiểu, theo kịp phần lớn cuộc hội thoại.
        "6": Nói chuyện thoải mái, đọc tin tức, xem phim có phụ đề.
        "7": Làm việc và học tập bằng tiếng Quan thoại, đọc văn bản phức tạp và chuyên môn.
      unknown:
        test:
          title: Không chắc
          chip: "làm bài kiểm tra"
          body: Một bài kiểm tra trình độ ngắn sẽ cho biết nên bắt đầu từ đâu.
        skip:
          title: Bỏ qua
          chip: "chọn sau"
          body: Bạn có thể chọn trình độ sau trong hồ sơ.
    known_question: Bạn đã biết những gì rồi?
    known:
      zero:
        title: Chưa gì cả
        body: Bắt đầu từ trang giấy trắng.
      phonetics:
        title: Bính âm
        body: Tôi đọc được bính âm, nhưng chú âm thì mới với tôi.
      zhuyin:
        title: Chú âm
        body: Tôi đọc được chú âm, nhưng hầu như chưa biết từ nào.
    limits:
      heading: Nên và không nên kỳ vọng gì
      body: Ứng dụng sẽ giải thích cách đọc và cách viết, cho bạn thấy chú âm và bính âm, và quyết định bạn học gì tiếp theo. Bạn có thể nạp bất kỳ từ và văn bản nào vào, luyện chúng, theo dõi tiến độ, và mài giũa phát âm, thanh điệu cùng vốn từ.
      gap: "Nhưng ngữ âm tốt nhất nên được đặt nền cùng một giáo viên bản ngữ, và không gì ở đây thay thế được lớp học thật. Ở đây bạn có phần kiểm tra thanh điệu và phát âm — không có hội thoại trực tiếp, không nói chuyện với người khác, và không có luyện nghe hiểu: ứng dụng không định làm những việc đó. Hãy coi nó là cánh tay phải của giáo viên chứ không phải người thay thế."
    path:
      done_cta: Tới màn hình chính và thẻ của bạn →
      back: "← Quay lại danh sách các bước"
      title: Lộ trình của bạn
      lede: Thứ tự nên đi qua. Các bước tự được đánh dấu khi bạn dùng ứng dụng, nhưng bạn cũng có thể tự đánh dấu.
      counter: "Đã xong %{done}/%{total}"
      optional: tùy chọn
      now: bây giờ
      open: Mở
      mark_done: Đánh dấu đã xong
      undo: Bỏ đánh dấu
      progress: "%{done}/%{target} lượt ôn"
      kinds:
        theory: lý thuyết
        practice: thực hành
      done_heading: Đã xong lộ trình
      done_body: Nền móng đã có. Những thẻ đầu tiên đang chờ bạn — từ đây ứng dụng quyết định hiện gì và theo thứ tự nào.
      after_heading: Tiếp theo là gì
      after_body: "Khi nền móng đã có, ứng dụng quyết định cho bạn xem gì: trước hết theo cấp độ, trong mỗi cấp theo tần suất. Những thứ còn lại cứ dùng khi cần — công cụ đọc, phát âm, viết tay và bộ thẻ riêng tạo từ bất kỳ văn bản nào."
      change: Đổi trình độ khởi đầu
      steps:
        hanzi:
          title: "Cấu tạo chữ Hán"
          body: >-
            Trước khi học chữ Hán hàng loạt, nên xem chúng được tạo nên từ gì: bộ thủ mang nghĩa, bộ phận chỉ
            âm mang âm, và thứ tự nét là như nhau cho mọi chữ. Người Việt có thêm âm Hán Việt làm cầu nối. Sau
            trang này, chữ Hán không còn là những bức tranh mà trở thành một hệ thống.
        course:
          title: "Khóa học, những bài đầu tiên"
          body: >-
            Từ đây theo bài học sẽ dễ hơn học từ ngẫu nhiên. Mỗi bài là một đoạn hội thoại trong đời sống ở Đài
            Bắc, có từ vựng và ngữ pháp bên dưới cùng bài tập tự kiểm tra; một nút biến bài học thành bộ thẻ.
            Bước này được tính khi bạn xong bài đầu tiên.
        zhuyin_theory:
          title: Hệ thống âm hoạt động thế nào
          body: >-
            Bắt đầu bằng việc xem một âm tiết gồm những gì: có thể bắt đầu bằng gì, kết thúc bằng gì và thanh
            điệu làm gì — cấu trúc rất gần với âm đầu, âm đệm và vần của tiếng Việt. Các ký hiệu đi theo nhóm,
            mỗi nhóm có nút riêng để luyện đúng nhóm đó và không gì khác.
        tones_theory:
          title: Thanh điệu hoạt động thế nào
          body: >-
            Bốn thanh cộng thanh nhẹ, giải thích từ sáu thanh của tiếng Hà Nội mà bạn đã có — và những nét riêng
            của Đài Loan: thanh 3 ở thấp chứ không vút lên, còn 一 và 不 đổi thanh tùy chữ đứng sau. Đọc xong, đi
            thẳng tới bài luyện từ chính trang đó.
        tones:
          title: "Nghe bốn thanh"
          body: "Thanh điệu Đài Loan không giống sách giáo khoa: thanh 3 ở thấp và không bao giờ vút lên. Luyện trên bản ghi phòng thu của mọi âm tiết, giọng nam và giọng nữ xen kẽ."
        phrases:
          title: "Học những gì người ta thực sự nói"
          body: "Những mẫu câu đủ dùng cho một ngày ở Đài Loan, kể cả nửa bạn chỉ cần nghe hiểu: nhân viên thu ngân hỏi bạn gì."
        bridge:
          title: "Chuyển từ bính âm sang chú âm"
          body: "Bạn đã biết các âm. Phần này gắn chúng với các ký hiệu mà Đài Loan dùng để ghi, và chỉ ra các bẫy: vần rỗng, y và w, các vần rút gọn iu, ui và un."
        readings:
          title: "Học lại cách đọc của Đài Loan"
          body: "Những từ Đài Loan đọc khác với giáo trình in ở nơi khác, và những thanh đầy đủ mà Đài Loan giữ lại ở chỗ các giáo trình ấy ghi thanh nhẹ."
        placement:
          title: "Tìm trình độ của bạn"
          body: "Một bài kiểm tra thích ứng ngắn về nghe, thanh điệu, chữ Hán, từ vựng và câu. Nó đặt trình độ khởi đầu và đánh dấu những gì bạn đã biết."
        zhuyin:
          title: Chú âm (ㄅㄆㄇㄈ)
          body: "Hệ ký hiệu ghi âm của Đài Loan: 37 ký hiệu và bốn dấu thanh. Bên cạnh bính âm, lúc đầu nó có vẻ là việc thêm — nhưng đó là thứ ghi cách đọc trong từ điển và sách giáo khoa Đài Loan, là cách người ta gõ chữ ở đây, và với người Việt nó còn giúp tránh đọc bính âm theo chữ quốc ngữ. Học một lần, mọi thứ sau đó đều dễ hơn."
        drill:
          title: Nhận diện các âm
          body: Bài luyện thanh mẫu, vận mẫu và thanh điệu cho tới khi bạn nhận ra chúng mà không phải dừng lại suy nghĩ. Một lượt là đủ để đánh dấu bước này, nhưng nên quay lại luyện thêm.
        typing:
          title: Gõ bằng chú âm
          body: Chính bố cục được in trên bàn phím ở Đài Loan. Thiếu nó bạn không viết được tin nhắn hay từ khóa tìm kiếm. Bước này được tính khi bạn gõ đúng mười từ.
        first_cards:
          title: Những chữ và từ đầu tiên
          body: "Chữ Hán bắt đầu ngay chứ không bị hoãn lại: bạn bắt đầu với những chữ thông dụng nhất. Hai mươi lượt ôn là xong bước này."
        plan:
          title: Kế hoạch tới kỳ thi
          body: Nếu bạn cần TOCFL, hãy chọn cấp và ngày thi, ứng dụng sẽ tính lượng học mỗi ngày. Nếu không cần, hãy bỏ qua.
  notices:
