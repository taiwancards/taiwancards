    title: Mọi âm tiết tiếng Quan thoại, có âm thanh
    meta_description: >-
      Toàn bộ %{clips} bản ghi âm tiết tiếng Quan thoại dùng ở Đài Loan, có chú âm và bính âm, do hai giọng
      phòng thu đọc.
    lede: >-
      %{bases} âm tiết và %{clips} bản ghi, đủ mọi thanh mà mỗi âm tiết thực sự có. Hai giọng phòng thu từ kho
      ngữ liệu CNS11643. Chạm vào một thanh để nghe.
