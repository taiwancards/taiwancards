    interface_language: >-
      The language of the interface and of everything in it. It switches more than buttons and menus: word
      meanings, notes, grammar explanations and breakdowns are all written in both languages and move with
      it.
    hanzi_font_toggle: Character face
    hanzi_font_hint: >-
      Character face. On: kaishu, the calligraphic face that shows strokes the way a hand writes them. Off:
      a plain sans. On by default.
    pinyin_toggle: Show or hide pinyin
    detail_toggle: How much a dictionary page shows
    detail_hint: >-
      How much a dictionary page shows. 詳 — everything we hold: rarity score, register mix, memory cards,
      thesaurus, origin stories. 簡 — the working set: readings, meanings, part of speech, measure word,
      synonyms and antonyms, stroke practice, a handful of sentences. Starts at 簡 until you are past TOCFL
      Novice, then at 詳; after that it stays wherever you put it.
    script_setup_hint: >-
      How the language is shown: face, pinyin, the Chinese word, how much a dictionary page shows — and the
      language you read the site in.
    mainland_toggle: Show the Chinese word
    mainland_hint: >-
      The word used in China. On: a small line on the card shows what China says instead. Off: nothing
      extra. Off by default — this app teaches the Taiwanese word; the Chinese one is reference only.
    pinyin_hint: >-
      Pinyin next to zhuyin. Zhuyin is always shown and cannot be turned off. On: the romanisation appears
      beside it. Off: zhuyin alone. Off by default — Taiwan reads by zhuyin.
