  numbers:
    rules_title: Rules worth knowing before you drill
    rules:
      truncation:
        title: A trailing digit means the next unit down
        body: This is the main source of confusion. A lone digit at the end is not added to the number — it multiplies the next unit down, which simply goes unsaid. So 三百五 is 350, not 305.
        rows:
          - huayu: 三百五
            value: "350"
            note: full form 三百五十, with 十 dropped
          - huayu: 兩千三
            value: "2300"
            note: full form 兩千三百, with 百 dropped
          - huayu: 一萬五
            value: "15,000"
            note: full form 一萬五千, with 千 dropped
      zero:
        title: 零 is not a pause, it blocks the shortcut
        body: "To say 305 it is not enough to name three and five: you need 零 between them. It announces that a place is empty and so cancels the reading above. One 零 covers a gap of any width."
        rows:
          - huayu: 三百零五
            value: "305"
            note: without 零 this would be 350
          - huayu: 一千零五
            value: "1005"
            note: both hundreds and tens are empty — still one 零
          - huayu: 一千零五十
            value: "1050"
            note: 十 is spoken, so these are tens, not units
          - huayu: 一萬零五
            value: "10,005"
            note: 零 works across the 萬 boundary too
      liang:
        title: 兩 or 二 depends on what follows
        body: "二 is the digit itself: when counting, in numbers, in 十二 and in 二十. 兩 goes where the two measures something: before a measure word and before 百, 千, 萬, 億. There is one important exception: before 十 it is always 二."
        rows:
          - huayu: 二
            value: "2"
            note: the bare digit, when counting
          - huayu: 二十
            value: "20"
            note: never 兩 before 十
          - huayu: 十二
            value: "12"
            note: a two in the units is 二 as well
          - huayu: 兩百
            value: "200"
            note: 兩 before 百; Taiwan does not say 二百
          - huayu: 兩千三百二十二
            value: "2322"
            note: 兩 twice up top, 二 below — all in one number
          - huayu: 兩個人
            value: 2 people
            note: always 兩 before a measure word
      shi:
        title: 十 at the start needs no 一
        body: From 10 to 19, 十 stands on its own. As soon as a higher unit appears in front of it, the one comes back.
        rows:
          - huayu: 十五
            value: "15"
            note: nobody says 一十五
          - huayu: 一百一十五
            value: "115"
            note: here the 一 before 十 is required
          - huayu: 一百一
            value: "110"
            note: the colloquial shortening from the trailing-digit rule
    title: Numbers and numerals
    keys: Arrow keys, or tap an option.
    done_title: Run complete
    restart: Again
    system_title: Digits group in fours, not threes
    system_body: European languages cut a number every three digits; Chinese cuts every four. That is why 'million' is not its own word but 一百萬 — a hundred lots of 萬. The easiest way in is to mentally place a space every four digits from the right instead of every three.
