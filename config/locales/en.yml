  variants:
    title: Taiwan vs elsewhere
    word: Word
    reading: Reading
    meaning: Meaning
    taiwan: Taiwan
    mainland: China
    hongkong: Hong Kong
    singapore: Singapore / Malaysia
    checked: Readings checked against the Ministry of Education dictionaries; vocabulary against the MOE cross-strait comparison table and regional sources. Where a form is contested or the standard has shifted, the note says so rather than picking a side.
    sections:
      reading: Same characters, different reading
      glyph: Same word, different character
      word: Different word entirely
    intro:
      reading: "These are written the same way in Taiwan and in China but said differently. 垃圾 is the one everybody notices — say lājī in Taipei and you have announced where you learned your Mandarin. Two entries need a caveat: 和 read hàn is genuinely in the Ministry of Education dictionary as the conjunction reading, but it is receding toward older speakers and broadcast news, so treat it as something to recognize rather than to produce; and 說服 really is shuìfú here, though not because China changed anything — the viral 2019 story about readings being revised was officially denied."
      glyph: "Both Taiwan and Hong Kong write traditional characters, but they do not always pick the same one. These are separate Unicode characters, not font differences, so they genuinely look different on the page. 著 is the one you will meet constantly: Taiwan writes it for every reading, while Hong Kong and China split it against 着. Two of these are cases where the official standard and ordinary handwriting disagree even inside Taiwan — 汙 and 脣 are the standard forms, but you will see 污 and 唇 everywhere."
      word: "Here the regions simply use different words. Note that the Hong Kong column is mostly Cantonese vocabulary written in characters rather than a Mandarin variant — a Mandarin speaker reading 雪櫃 aloud is reading a Cantonese word. The sharpest trap in the table is 土豆: peanut in Taiwan, potato in China. They are two different words that collided in writing."
