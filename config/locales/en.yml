    gold_card: Taiwan Gold Card
    disclaimer_html: >-
      TaiwanCards is built and maintained by one person — a linguist whose life has been tied to Taiwan
      for half of it, down to the %{gold_card} in his wallet. Ministries, examinations and publications
      are named only to credit the source of the data — the project is not affiliated with or endorsed
      by any of them. Mistakes are possible: no guarantees of accuracy, availability or fitness for any
      purpose. Use it as a study aid, and keep your own export of your progress.
  onboarding:
    title: Where to start
    lede: One question, and the app shapes your first few weeks around the answer. You can change it whenever you like.
    question: How much Mandarin do you already have?
    pick_one: Pick one of the options.
    levels:
      zero:
        title: Absolute beginner
        body: No characters, no tones, no phonetics — starting from nothing.
        next: We start with the sounds, and characters follow almost immediately
      phonetics:
        title: I know pinyin and tones
        body: I can read pinyin and hear tones, but zhuyin is new to me and I know few characters.
        next: Straight to zhuyin — it is the system Taiwan actually uses
      characters:
        title: I know zhuyin and some characters
        body: I read ㄅㄆㄇㄈ, recognize traditional characters and have some vocabulary.
        next: A placement test to find where you are
      experienced:
        title: I already have a level
        body: I read texts, know hundreds of words, and may be working toward TOCFL.
        next: Placement test first, then a plan up to your exam date
    limits:
      heading: What to expect, and what not to
      body: The app will explain how to read and how to write, show you zhuyin and pinyin, and decide what you study next. You can load any words and any texts into it, drill them, watch your progress, and sharpen your pronunciation, tones and vocabulary.
      gap: "But phonetics is best set up with a native teacher, and none of this replaces real classes. What you get here is tone and pronunciation checking — and no live conversation, no speaking with another person, and no listening comprehension: the app does not set out to do those. Treat it as a teacher's right hand rather than a substitute for one."
    not_for:
      heading: This may not be the app for you
      lede: Better to find out now than a month from now.
      cards: "You just want flashcards. This is a good deal more than that: a dictionary, a reader, pronunciation, handwriting, and one shared record of progress underneath all of it. For flashcards alone it is overkill."
      course: "You want a course that takes you from zero to fluent. This is not a textbook: it does not teach grammar, and you will need to work through that elsewhere."
      mainland: "You are moving to China. Everything here is Taiwanese Mandarin: traditional characters, zhuyin, Taiwanese vocabulary. There is no Chinese variant, and simplified characters cannot be switched on."
      nudging: You want to be chased. There are no reminders, no streaks and no leaderboards, and there never will be — the assumption is that you know why you are learning Taiwanese Mandarin in particular.
      close: If none of that puts you off, pick an option above and let us begin.
    path:
      done_cta: To the home screen and your cards →
      back: "← Back to the step list"
      title: Your path
      lede: The order worth going through. Steps tick themselves off as you use the app, but you can also mark them by hand.
      counter: "%{done} of %{total} done"
      optional: optional
      now: now
      open: Open
      mark_done: Mark as done
      undo: Unmark
      progress: "%{done} of %{target} reviews"
      kinds:
        theory: theory
        practice: practice
      done_heading: Path complete
      done_body: The groundwork is in place. Your first cards are waiting — the app decides what to show and in what order from here.
      after_heading: What comes next
      after_body: "Once the groundwork is there, the app decides what to show you: level first, frequency within the level. Take the rest as you need it — the reader, pronunciation, handwriting, and your own decks built from any text."
      change: Change your starting level
      steps:
        zhuyin_theory:
          title: How the sounds work
          body: >-
            Start by seeing what a syllable is made of: what it can begin with, what it can end with and
            what the tone does. The symbols come in groups, and each group has its own button that drills
            exactly that group and nothing else.
        tones_theory:
          title: How the tones work
          body: >-
            Four tones plus the neutral one — and the Taiwanese details that mainland textbooks leave out:
            the third tone stays low instead of dipping back up, and 一 and 不 shift tone depending on what
            follows. Read it, then go straight to the drill from that same page.
        tones:
          title: "Hear the four tones"
          body: "Taiwanese tones are not the textbook ones from China: the third stays low and never rises. Train on studio recordings of every syllable, alternating a male and a female voice."
        phrases:
          title: "Learn what people actually say"
          body: "Patterns that carry a day in Taiwan, including the half you only have to understand: what the cashier asks you."
        bridge:
          title: "Move from pinyin to zhuyin"
          body: "You already know the sounds. This maps them onto the symbols Taiwan writes them with, and flags the traps: the empty rime, y and w, the contracted finals iu, ui and un."
        readings:
          title: "Relearn the Taiwan readings"
          body: "Words Taiwan reads differently from China, and the full tones it keeps where a textbook gives you a neutral one."
        placement:
          title: "Find your level"
          body: "A short adaptive test across listening, tones, characters, vocabulary and sentences. It sets your starting level and marks what you already know."
        zhuyin:
          title: Zhuyin (ㄅㄆㄇㄈ)
          body: "Taiwan's phonetic script: 37 symbols and four tone marks. Next to pinyin it looks like extra work at first — but it is what annotates readings in Taiwanese dictionaries and textbooks, and it is how text gets typed here. Learn it once and everything afterward is easier."
        drill:
          title: Recognizing the sounds
          body: A drill over initials, finals and tones until you recognize them without stopping to think. One run is enough to tick the step off, but it is worth coming back to.
        typing:
          title: Typing in zhuyin
          body: The very layout printed on keyboards in Taiwan. Without it you cannot write a message or a search query. The step counts once you have typed ten words correctly.
        pinyin:
          title: Pinyin alongside
          body: "Worth having: it labels streets and stations, and it is what foreigners will use with you. But zhuyin is the primary system here, with pinyin second."
        first_cards:
          title: Your first characters and words
          body: "Characters start straight away rather than being put off: you begin with the most frequent ones. Twenty reviews and the step is done."
        plan:
          title: A plan up to your exam
          body: If you need TOCFL, name the level and the date and the app works out a daily quota. If you do not, skip it.
