    lunar:
      title: How the lunar calendar actually works
      months_html: "<p>A lunar month begins on the new moon and runs until the next one. That takes about 29.53 days, so a month is either <strong>29</strong> or <strong>30</strong> days — never 31, and never a fixed length you can memorize. Twelve of them come to roughly 354 days, about eleven days short of a solar year.</p><p>That shortfall is the whole story. If nothing corrected it, the new year would drift backward through the seasons and 春節 would eventually land in the summer.</p>"
      days_html: "<p>Days of a lunar month are not written as bare numbers. The first ten take the prefix <strong>初</strong>: 初一, 初二, 初三 … up to 初十. Days 11 to 19 use 十 — 十一, 十二 … 十九 — and 二十 is the twentieth. From 21 the prefix is <strong>廿</strong>: 廿一, 廿二 … 廿九, and a 30-day month ends on 三十.</p><p>So <strong>初五</strong> simply means the fifth day of the month. When someone says 正月初五 they mean the fifth day of the first lunar month — no year attached, and no Gregorian date implied.</p>"
      drift_html: "<p>This is why 春節 never falls on the same Gregorian date twice in a row. The lunar year is about eleven days shorter than the solar one, so the new year slides earlier each time — and when it slides too far, a whole extra month is inserted and it jumps back late again. Over the 1950–2050 range it moves between 21 January and 20 February.</p>"
      leap_html: "<p>The correction is a <strong>leap month</strong>, 閏月. Roughly seven times in every nineteen years an extra month is inserted, giving that year thirteen months and about 384 days. It is not appended at the end — it is slotted in after an existing month and takes its number: a leap month after the sixth is 閏六月, and that year has both 六月 and 閏六月.</p><p>Which month gets doubled is decided by the sun, not by a fixed rule you can recite: it depends on where the 24 solar terms fall. 2025 had 閏六月; 2033 has the rare 閏十一月.</p>"
      terms_html: "<p>Two of the festivals here are not lunar at all. <strong>清明</strong> and <strong>冬至</strong> are <em>solar terms</em> — points on the sun's annual path — which is why they sit almost still in the Gregorian calendar while everything lunar wanders.</p>"
    minguo:
      title: 民國 year converter
      gregorian: Gregorian year
      minguo: 民國 year
      note: "%{gregorian} is 民國%{minguo}."
      before: The 民國 count starts at 1912, so there is no 民國 year here.
      explain_html: "<p>Taiwan dates official documents by the <strong>民國</strong> era, counted from the founding of the Republic of China in <strong>1912</strong>. That year is 民國1, so the arithmetic is simply <strong>民國 = Gregorian − 1911</strong>, and it works in both directions. You will meet it on ID cards, train tickets, receipts, contracts and expiry dates, usually written as 114.09.28 rather than 2025.</p>"
    converter:
      title: Lunar ↔ Gregorian date converter
      to_gregorian: Lunar date → Gregorian
      to_lunar: Gregorian date → lunar
      lunar_year: Lunar year
      lunar_month: Month
      lunar_day: Day
      date: Date
      gregorian_result: "%{date}, %{weekday}"
      lunar_result: "%{year} %{month}%{day}"
      out_of_range: Outside the covered range.
      bounds: Covers %{from} to %{to}. The table is taken from the Hong Kong Observatory's Gregorian-Lunar Calendar Conversion Table and every date in it was checked back against that source.
  page_help:
    desks_html: >-
      <p>A deck is built from whatever you paste: a list one per line, separated by commas, or plain running
      text — the system works it out. You can upload a file, or pull the words out of a song instead.</p><p>The
      key difference from Anki: <strong>you never type translations</strong>. Reading, meaning, character
      breakdown and audio all come from our dictionary. You supply only the words.</p><p>Before the deck
      is created you get a preview: how many cards it will make, what was a duplicate, and what is not in
      the dictionary. Entries run easiest first. If you already know the whole list, one button sends it
      into long-range review instead of the new-card queue.</p>
    hanzi_html: >-
      This page takes a character apart and shows what to do with the pieces. The meaning component points
      at a field of meaning, the phonetic one at a rough reading. In our own data the phonetic gets the
      rime right about four times in five, so an unfamiliar character is often readable on the first try.
      Open the sections one at a time.
    triage_html: >-
      <p>A quick way to establish where you stand if you already know some of this. Swipe right if you know
      the character, left if you are unsure.</p><p><strong>I know it</strong> pushes the entry into distant
      reviews: roughly three weeks out and beyond, spread out so they never pile into one day. Nothing is
      lost for good.</p><p><strong>Not sure</strong> leaves the entry in the ordinary queue, to come round
      with everything else.</p><p>Anything you have genuinely studied is left out of the sweep and untouched.</p>
    zhuyin_trainer_html: >-
      <p>Here zhuyin is learned as a script in its own right, with no Latin crutch. You hear a sound and
      pick the symbol — there is deliberately no pinyin on screen, otherwise what sets in is 'ㄅ equals the
      letter b' rather than 'ㄅ equals this sound'.</p><p>Symbols come in blocks by manner of articulation
      rather than straight down the chart. A new block opens once the previous one is done. The options
      are deliberately close: similar shapes and sounds from the same place of articulation — random options
      would only create an illusion of progress.</p><p>A symbol counts as mastered after three correct answers
      in a row, and quick ones: answering correctly but slowly means you are working it out rather than
      recognizing it, and the counter does not move. You can leave at any time.</p>
    numbers_html: >-
      <p>Numbers need only a handful of characters and you do need all of them — but the real difficulty
      is not the characters, it is the magnitudes.</p><p>Chinese groups digits in fours: 萬 is 10,000, and
      everything above builds on it. That is why a million is 一百萬 and a billion is 十億. The five sections
      below run from the characters to the traps; the last covers 民國 years, which appear on every Taiwanese
      form.</p>
    practice_phonetics_html: >-
      <p><strong>Zhuyin</strong> (ㄅㄆㄇㄈ, also called bopomofo) is a phonetic alphabet: 37 symbols, each tied
      to one Mandarin sound, plus tone marks. The symbols mean nothing on their own, so there is no way
      to read them out of habit. They annotate readings in Taiwanese dictionaries and school textbooks,
      and they are how text gets typed here.</p><p><strong>Pinyin</strong> is an orthography — a way of
      writing those same sounds with Latin letters under rules of its own. Those rules were built for brevity,
      not accuracy: one letter can stand for different sounds, and some vowels drop out of the spelling
      altogether. It is a useful prop, and it misleads the moment you read it as English.</p><p>In the charts
      below the <strong>anchor</strong> comes first: one line telling you what to say right now. Then comes
      the articulation — how the speech organs move. At the end of each row, in orange, is the mistake to
      avoid.</p>
    roadmap_html: >-
      <p>The order worth working through the app in if you are starting from scratch. Nothing here is compulsory
      — all of it is reachable from the menu anyway.</p><p>Steps backed by a drill tick themselves off:
      after one run of the sound drill, after ten words typed correctly, after twenty reviews. Mark the
      rest by hand once you feel ready to move on.</p><p>Optional steps can be skipped with no consequences
      — the path counts as complete without them.</p>
    label: How this page works
    typing_html: >-
      <p>The keyboard shown here is the Taiwan bopomofo layout — the one printed on keyboards sold in Taiwan
      and used by most people here. Nothing needs installing: press the same keys and the zhuyin appears.</p><p>Type
      the reading of the word shown, then press space or Enter to check it. Tone keys are 6 (ˊ), 3 (ˇ),
      4 (ˋ) and 7 (˙); a first-tone syllable needs no tone key.</p><p>Words come from your dictionary in
      learning order, so this drills readings and typing at the same time.</p>
    reader_html: >-
      <p>Read real Chinese with the dictionary built in. Words you already know are muted; everything new
      is colored by level and underlined, with its reading printed above.</p><p>Tap any word for the full
      entry, audio and a button to start learning it. The whole text can be turned into a deck in one click.</p><p>Paste
      anything yourself, or import song lyrics. Simplified characters are always converted to Taiwan traditional
      first.</p>
    placement_html: >-
      <p>An adaptive test that finds your level in about five minutes, then offers to mark everything at
      or below it as already known.</p><p>Questions get harder while you answer correctly and easier when
      you miss. The estimate is deliberately rough — you can adjust it on the result screen before applying.</p><p>Marking
      is safe: anything you are already studying keeps its progress, and the seeded items are spread over
      the coming weeks so you never get a wall of reviews.</p>
    phrases_html: >-
      <p>Whole utterances, not vocabulary. Each card is a pattern with slots you fill from the dictionary,
      so one line covers a hundred orders at a drink shop.</p><p>Cards marked <strong>They say</strong> are
      the half every phrasebook omits: the questions staff fire at you at the counter. Understanding those
      matters more than producing perfect sentences.</p><p>Where a Chinese form would be understood but
      sounds imported, the Taiwanese form is given and the other is struck through.</p>
    everyday_html: >-
      <p>Vocabulary that is genuinely Taiwanese and sits outside every exam list — drink-ordering shorthand,
      Hokkien-derived slang, the words Taiwan uses where China uses something else.</p><p>Filter
      by area of life or by where the word came from. Anything marked as strong language is exactly that.
      Where a Chinese equivalent exists it is shown, so you can see the contrast rather than memorize a
      single form.</p>
    variants_html: >-
      <p>Where Taiwan diverges from China, Hong Kong and Singapore — in how a word is read, in which
      character is written, or in the word chosen outright.</p><p>These are the differences that mark you
      out as having learned your Mandarin somewhere else. Anything contested or recently changed is flagged
      in the text rather than presented as settled.</p>
    calendar_html: >-
      <p>The twelve festivals that actually structure a year in Taiwan, each with the rule that fixes its
      date rather than a date you would have to look up again next year.</p><p>The lunar section explains
      the counting itself — why 初五 means what it means, and why 春節 moves. Both converters run in the browser:
      the 民國 one is pure arithmetic, and the lunar one uses a table checked against the Hong Kong Observatory.</p><p>Words
      tied to each festival can be added to your study straight from the list, where the dictionary already
      has them.</p>
    metro_html: >-
      <p>Every line of the Taipei and New Taipei network, with its stations in official order. Tap a station
      and the card at the top shows its zhuyin, pinyin and meaning; from there you can open the full dictionary
      entry or add it to a deck.</p><p>Hollow dots are interchanges — the card lists every line that station
      belongs to. The layout is deliberately schematic rather than geographic.</p>
    medicine_html: >-
      <p>Western medicine as Taiwan actually speaks it: the body and the organs, the diseases a doctor
      names and the words a family uses at home, the vaccines on the CDC schedule, and the signs you follow
      through a hospital — 掛號, 批價, 領藥. Tap any label on the pictures for the reading, then open the full
      dictionary entry.</p><p>Where a medical term has an everyday counterpart (闌尾炎 next to 盲腸炎), the
      pair is shown side by side. Terms that differ from mainland usage are marked, and Hokkien loans carry
      their Tâi-lô readings. Everything is checked against the MOE dictionaries and Taiwan's own health
      authorities.</p>
    dict_html: >-
      <p>One dictionary: single words and set phrases are simply entries here, with no split between them.
      The line is arbitrary anyway — 便利商店 and 超商 mean the same thing, and hunting for them in two separate
      lists made no sense.</p><p>The <strong>TOCFL level</strong> pills narrow to one exam band, the grade
      row to the school-based TBCL scale, and the progress filter shows only new, learning or known entries.</p><p>Within
      a level, entries are ordered by <strong>frequency</strong> — the most common come first. Switch the
      sort to compare pure frequency. Tap any entry for its full article, or use the <strong>+</strong>
      button to drop it straight into a deck.</p>
    chengyu_html: >-
      <p>成語 are four-syllable set expressions that come out of classical texts and parables. What they say
      literally is often nowhere near what they mean: 雪中送炭 is literally «to send charcoal in the snow»,
      but it means «to help at exactly the moment help is needed». So every idiom here carries not just
      a translation but a <strong>tone</strong> — approving, neutral or disapproving. Calling something
      十拿九穩 and calling it 莫名其妙 are worlds apart.</p><p>The list is drawn from the dictionary: some idioms
      are tagged from dictionary labels, others were checked by hand — those carry a note on when it is
      actually said, plus a real example. Tap an idiom for the full entry with audio, a character breakdown
      and sentences.</p>
    tbcl_html: >-
      <p>TBCL (臺灣華語文能力基準) is the scale Mandarin is actually taught on in Taiwan: seven grades, from one
      up to seven. It is built differently from the TOCFL exam — it follows the school curriculum rather
      than a test format.</p><p>Within a grade, entries run from the most frequent to the rarest. The bar
      shows how much of the grade you already know — it counts everything learned anywhere in the app, not
      only here.</p>
    characters_html: >-
      <p>The 4808 common traditional characters from the Ministry of Education set. Each tile shows the
      character; tap it for readings (zhuyin + pinyin), stroke order, etymology, the words it appears in,
      and how strong your memory is.</p><p>Characters are ordered by frequency, so the ones you meet most
      often come first.</p>
    sentences_html: >-
      <p>Full example sentences drawn from the lessons. Each word in a sentence is a link to its dictionary
      entry, so you can tap anything unfamiliar. Use the source filter to focus on one book or lesson.</p>
    search_html: >-
      <p>Three fields that stack. <strong>Writing or meaning</strong> takes hanzi or a word in English or
      Russian. <strong>Pinyin</strong> and <strong>zhuyin</strong> take a reading; tones may be written
      as marks, as digits after each syllable, or left out — <code>nǐhǎo</code>, <code>ni3hao3</code> and
      <code>ni hao</code> all reach the same word. When you do write tones, the entries with exactly those
      tones come first, and only then the rest.</p><p>Tick <strong>search the sentence bank</strong> and
      the kinds are set aside: every hit is a sentence with your word marked in it, ten to a page, filtered
      by level and style. With two words in the query the page also says whether they go together.</p>
    radicals_html: >-
      <p>The 214 Kangxi radicals — the building blocks every character is filed under. Tap a radical to
      see the characters that contain it.</p>
    liangci_html: >-
      <p>Taiwan Mandarin classifiers (量詞) are the little words between a number and a noun: 一<b>本</b>書,
      三<b>隻</b>貓. Each entry shows what it counts, which nouns actually take it and how it looks in real
      sentences. The lists come from 教育部國語辭典簡編本, CC-CEDICT and our Taiwanese corpora. There is also a game
      for matching the right classifier.</p>
    tocfl_html: >-
      <p>Your progress toward each official TOCFL level. The counts include every character and word you
      have learned anywhere in the app, not just here. Open a level to study it directly or see exactly
      what is left.</p>
    study_html: >-
      <p>Swipe the whole batch once — the cards you miss come back, the ones you know leave. <strong>Swipe
      right</strong> = I knew it, <strong>left</strong> = I did not, <strong>up</strong> = too easy, <strong>down</strong>
      = hard. The arrow keys work too, and tapping a card flips it.</p><p>New items are introduced a batch
      at a time, mixed with everything that is due for review. Scheduling is FSRS, so a card returns right
      as you are about to forget it.</p>
    pronunciation_html: >-
      <p>Say the word into the mic; each syllable is graded on its <strong>tone</strong> and its <strong>initial/final
      sounds</strong>. Green means correct, amber close, red off. In auto mode it moves on once you are
      right and keeps the mic open until you get it. Both standard and Taiwanese pronunciations are accepted.</p>
    writing_html: >-
      <p>Recall the character from its meaning and reading, then write it stroke by stroke. Strokes are
      checked in order; a wrong stroke is nudged back. Miss-heavy characters resurface first, then the rest
      come easiest-first.</p>
    handwriting_html: >-
      <p>Draw a traditional character stroke by stroke and it is recognized offline — no network, nothing
      leaves your device. Use it as a quick lookup when you know the shape but not the reading.</p>
    cangjie_html: >-
      <p>Cangjie 5 input for traditional Taiwan characters. Type the Latin keys that make up a character
      to compose it. Each character page also shows its Cangjie code.</p>
    history_html: >-
      <p>What you have studied lately and how solid each item is. The dots show memory strength per facet
      (recognition, reading, tone, writing). Use it to spot what is slipping before it is due.</p>
    practice_drill_html: >-
      <p>Cards that drill the two phonetic systems against each other. Pick a direction — see a zhuyin symbol
      and recall the pinyin, or the reverse — then swipe right if you knew it and left if you did not.</p><p>Anything
      you miss comes back later in the round and is remembered, so the next round starts with your weak
      sounds. Initials and finals can be drilled separately.</p>
    practice_progress_html: >-
      <p>Two different things in one place, and they come from different trainers.</p><p><strong>Sound practice</strong>
      counts your runs through the recognition cards and the zhuyin typing drill, and shows the symbols
      you miss most. It appears as soon as you finish your first run.</p><p><strong>Spoken pronunciation</strong>
      is built from microphone attempts: which tones and initials come out reliably and which do not. Until
      you have spoken into the mic this section is empty — that is expected, it is not connected to the
      cards.</p>
