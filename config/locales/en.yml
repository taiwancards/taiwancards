  practice:
    about_title: Where zhuyin came from
    about:
      origin: The symbols were devised by Zhang Binglin, who took regularised forms of ancient Chinese characters whose readings contain the sound in question. That is why ㄅ, ㄆ and ㄇ look like characters — they once were.
      adopted: Taiwan adopted the system in 1945, and it remains the principal way Mandarin pronunciation is taught in primary school.
      size: Thirty-seven symbols and five tone marks are enough to write any sound in Mandarin. The first tone is usually left unmarked, and a dot above stands for the neutral tone.
      today: Today zhuyin is the most common way in Taiwan to type characters on a computer or phone and to look them up in a dictionary. Textbooks print it as ruby annotation above the line.
      hokkien: Twenty-three further symbols were created for Taiwanese Hokkien — the same system extended to another language of Taiwan.
    practice_now:
      title: Practice it right away
      initials: Twenty-one initials, in blocks by manner of articulation. Read on once these come back by ear without hesitation.
      finals: Sixteen finals. The same trainer, with no Latin on screen.
      tricky: >-
        Six spellings where pinyin hides the real rime. The drill mixes them with look-alikes, so you
        find out whether you are reading the zhuyin or the Latin.
      cta: To the listening trainer →
    drill_progress_title: Sound practice
    drill_progress_hint: Fills up as you work through the sound-recognition cards and the zhuyin typing drill. Every completed run counts.
