    leeches_lede: These words keep slipping away after many tries. Give them extra attention — open the word, read its example sentences, practice the tone or writing — instead of just flipping the card again.
    how_title: How this works
    how_body_1: The app uses spaced repetition — each word comes back at growing intervals (a day, a few days, a week…). Answering just before you would forget it is exactly what makes memory stick.
    how_body_2: When you miss a word, its interval shrinks and it returns sooner. Nothing is ever lost or failed for good — mistakes are the system doing its job.
