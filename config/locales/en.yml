      initials: Initials
      finals: Finals
      tricky: Tricky cases
    part_next: "Next: %{title} →"
    part_previous: "← Back: %{title}"
    to_drill: Read it — on to the practice →
    back_to_chart: "← Back to the zhuyin and pinyin chart"
    initials_lede: "Twenty-one symbols — everything a syllable can begin with. The button plays Taiwan's Ministry of Education recording: listen before you read the breakdown."
    series:
      title: The three rows everyone confuses
      body: >-
        Nine initials that look alike in pinyin but are made in three different places in the mouth. Drill
        them row by row first — within a row the place is the same and only the breath changes.
      rows_hint: one row
      columns_hint: three rows at once
      hard_title: This one is genuinely hard
      hard_body: >-
        Take a column instead of a row and the sounds become almost indistinguishable: in pinyin they are
        written almost the same, with zhi, zi and ji a single letter apart. The only difference is where
        the tongue sits — curled to the roof, at the lower teeth, or pressed to the hard palate. This is
        the one to listen to carefully, and getting it wrong at first is normal.
      all_nine: All nine mixed together
      sets:
        zhi_chi_shi: zhi chi shi
        zi_ci_si: zi ci si
        ji_qi_xi: ji qi xi
        zhi_zi_ji: zhi zi ji
        chi_ci_qi: chi ci qi
        shi_si_xi: shi si xi
    drill_these: "Drill %{symbols}"
    blocks:
      labial:
        title: Lips
        body: Both lips meet. The first thing Taiwanese children learn, and the opening of the ㄅㄆㄇㄈ song.
      alveolar:
        title: Tip of the tongue
        body: The tongue presses behind the upper teeth. 不 and almost every negation live here.
      velar:
        title: Back of the tongue
        body: Made further back than the English equivalents. ㄏ is softer than an English h — closer to a breath.
      palatal:
        title: Only before ㄧ and ㄩ
        body: They appear only with ㄧ and ㄩ, so they can never be confused with ㄓㄔㄕ if you watch what follows.
      retroflex:
        title: Curled tongue
        body: The tip curls up towards the roof of the mouth. Taiwan says these softer than mainland textbooks do — nearly ㄗㄘㄙ.
      sibilant:
        title: Whistling
        body: Tongue at the lower teeth, air in a narrow stream. The pair to the three above.
      medial:
        title: Medials
        body: They sit between initial and final, becoming i, u and ü in pinyin — or y and w at the start of a syllable.
      open:
        title: Plain vowels
        body: Four clean sounds everything else is built from. ㄝ never stands alone — only after ㄧ and ㄩ.
      diphthong:
        title: Diphthongs
        body: "Two sounds in one syllable: the tongue glides from one position to the next without breaking the syllable."
      nasal:
        title: Nasals
        body: ㄢ/ㄤ and ㄣ/ㄥ differ in where the tongue ends. Taiwan often blurs it, but the dictionary keeps it.
      rhotic:
        title: One of a kind
        body: A syllable in its own right, found in 二, 兒 and 耳. Not the mainland r-ending on other words.
      compound:
        title: Compound finals
        body: A medial plus a final. They need no drill of their own — they are built from symbols you have already practised.
    finals_lede: "Everything left in the syllable after the initial consonant: a vowel, a diphthong, or a vowel with a nasal. For compound finals the individual symbols are voiced — run together they do not sound like the two parts in sequence."
    why_title: Why this is not a detail
    why_body: "You can read pinyin without any preparation, and that is exactly what makes it dangerous: the letters drag your English reading along with them, and the error sets in silently. There is nothing behind a zhuyin symbol but the sound you teach it. That is precisely why Taiwan annotates readings with it."
    compound_audio: "A compound final: the individual symbols are voiced. Run together it does not sound like the two parts in sequence — see the notes on the right."
    play_symbol: Play %{symbol}
    phonetics_card: "The full sound chart: zhuyin, pinyin, IPA, an anchor in English, and examples."
    phonetics_title: Zhuyin and pinyin
    col_explanation: The catch
    col_written: Written as
    col_real_sound: Actual sound
    rimes_lede: For a number of finals, pinyin does not write what you will actually hear. Zhuyin is usually closer to the real sound in exactly these cases — this is where, and why.
    rimes: Where the spelling and the sound diverge
