    speak: Speak
    write: Write
    title: Basics
    intro: Learn the sounds of Mandarin from the ground up — the reading systems first, then pronunciation.
    initials: Initials (consonants)
    finals: Finals (vowels)
    play: Play
    col_pinyin: Pinyin
    col_palladius: Palladius
    palladius_note: ""
    col_zhuyin: Zhuyin
    col_ipa: IPA
    col_analogy: Sounds like
    col_example: Example
    pinyin_intro: The romanization used across the app. Each sound with its IPA, a plain-language analogy, and an example word.
    zhuyin_intro: Taiwan's phonetic script. You can learn it next to pinyin, or straight from the sounds. Same table, showing both.
    drill:
      lede: "Matching the two scripts: see a symbol, name the Latin spelling, and back again. Pinyin is a bridge here, not the foundation."
      title: Zhuyin ↔ pinyin
      direction_zhuyin: Zhuyin → pinyin
      direction_pinyin: Pinyin → zhuyin
      systems_html: "Zhuyin is 37 symbols that Taiwan uses to write sounds. Each one always reads the same way, and you cannot invent a reading for it — you simply learn how it sounds. Pinyin writes those same sounds with Latin letters; it is there as a prop, nothing more. What to do: work through the charts below until you can recognize the symbols by ear."
      stage_hint: "Work through it in order: consonants first, then the vowels and glides, then the full rimes, and only then whole syllables."
      stages:
        consonants: Consonants
        vowels: Vowels
        finals: Rimes
        syllables: Whole syllables
      prompt_zhuyin: Which pinyin is this?
      prompt_pinyin: Which zhuyin is this?
      keys: Swipe the card toward your answer, or use the arrow keys
      done_title: Round finished
      restart: Go again
      see_chart_zhuyin: Zhuyin chart
      see_chart_pinyin: Pinyin chart
      card: Match zhuyin against pinyin in both directions, by swiping.
      syllable_title: How a Taiwanese Mandarin syllable is built
      syllable_body: Every syllable is at most three slots. Only the last one is compulsory — 一 is a bare final, 四 is an initial with no vowel written at all. Zhuyin spells the slots out; pinyin often merges or omits them.
      slots:
        initial_label: Initial 聲母
        initial_glyph: ㄓ
        initial_body: One of 21 consonants. Optional — many syllables begin with the vowel.
        medial_label: Medial 介音
        medial_glyph: ㄨ
        medial_body: One of three glides, ㄧ ㄨ ㄩ. This is the slot pinyin hides most often.
        final_label: Final 韻母
        final_glyph: ㄥ
        final_body: The rime — a vowel, a diphthong, or a vowel with -n or -ng. The only compulsory slot.
      tones_title: Where the tone goes
      tones_body: "Pinyin puts a diacritic over the main vowel: mā má mǎ mà. Zhuyin leaves the first tone unmarked and writes ˊ ˇ ˋ after the symbols — ㄇㄚ ㄇㄚˊ ㄇㄚˇ ㄇㄚˋ. The neutral tone is the exception in both: pinyin simply drops the mark, zhuyin puts a dot ˙ in front, as in ˙ㄉㄜ. Written down the page, zhuyin runs vertically to the right of the character it annotates, tone mark included."
      mismatch_title: Where pinyin misleads you
      mismatch_body: "These are not exceptions to learn by heart. They follow from one decision: to keep the spelling short, pinyin drops vowels from the middle of the syllable, reuses one letter for different sounds, and sometimes writes a letter where there is no sound at all. Zhuyin writes nothing that is not pronounced — so the zhuyin column shows what the syllable is actually made of."
      mismatch_pinyin: Pinyin
      mismatch_zhuyin: Zhuyin
      mismatch_why: What is really happening
      mismatch:
        zhong:
          pinyin: zhong
          zhuyin: ㄓㄨㄥ
          why: zh is ㄓ, but that o is not ㄛ. The rime -ong is really -ung, so zhuyin writes the glide ㄨ and the rime ㄥ.
        jiu:
          pinyin: jiu
          zhuyin: ㄐㄧㄡ
          why: The rime is -iou; pinyin drops the middle vowel to keep the spelling short. Zhuyin keeps ㄧ and ㄡ both.
        hui:
          pinyin: hui
          zhuyin: ㄏㄨㄟ
          why: The same trick — the rime is -uei, and pinyin swallows the e. Zhuyin writes ㄨ and ㄟ.
        yu:
          pinyin: yu
          zhuyin: ㄩ
          why: The y is not a consonant, it is there to carry the vowel, and the u is really ü. One sound, so zhuyin writes one symbol.
        zhi:
          pinyin: zhi
          zhuyin: ㄓ
          why: That i spells no vowel at all — it is the held retroflex tongue. Zhuyin writes nothing after ㄓ, because nothing is there.
        weng:
          pinyin: weng / -ong
          zhuyin: ㄨㄥ
          why: Two different pinyin spellings for one and the same rime, depending on whether a consonant precedes it. In zhuyin it is ㄨㄥ either way.
      mismatch_more_title: What to take away
      mismatch_more_body: "A pinyin reader is constantly making silent corrections: here o is really u, here a vowel is missing, here i is not a vowel at all, here u is really ü. Every one of those corrections is a place where a wrong pronunciation can set, and usually the learner never notices, because the spelling looks perfectly reasonable. Zhuyin asks for none of them: what is written is what is said."
