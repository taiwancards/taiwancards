  tones:
    names:
      "1": "First tone"
      "2": "Second tone"
      "3": "Third tone"
      "4": "Fourth tone"
    segments_title: Not only the tones
    segments_lede: Two differences in the segments themselves, audible constantly and worth knowing from the start.
    segments:
      retroflex: The retroflexes ㄓ ㄔ ㄕ often merge with ㄗ ㄘ ㄙ in Taiwanese speech. In everyday talk 知 and 資 can sound alike.
      nasal: The finals -ing and -eng have largely merged with -in and -en. This is a settled feature, not carelessness.
    practice_cta: Open the tone drill →
    chart:
      taipei: Taipei
      beijing: Beijing
      aria: "%{tone}: pitch contour"
      taipei_note: How the tones sound in Taiwan. There are several differences from the norm in China; they are listed below.
      beijing_note: The norm in China, for comparison. The figures are the conventional prescriptive notation.
      scale: "Five notional pitch steps, low to high. Read each line left to right: where it starts and where it goes. No figures are given for Taipei on purpose — there is no settled prescriptive notation for the Taiwanese realisation, and inventing one is not something I will do."
    hacks_title: What actually helps
    hacks:
      low: The third tone is simply a low tone, the opposite of the first. It only produces the deep dip-and-rise in isolation and at the end of an utterance; in Taiwan the rise is almost never pronounced. Do not try to draw a tick — just go low and stay there.
      pair: "Treat the first and third as a pair: one high level, one low level. That is easier to hold on to than 'level versus dipping'."
      start: "The second and third are the ones most often confused. The cue is not where the tone ends up but where it begins: the second starts mid and rises, the third starts low and stays low."
      after_third: "When a second tone follows a third, the low of the third is your run-up: you are already at the bottom, and the second rises straight from there. Do not climb back to the middle between the syllables — that is what breaks the join."
      fourth: "The fourth usually comes easiest: it is the intonation of a firm statement, sharply top to bottom. If it sounds too soft, you probably did not start high enough."
      relative: Pitch is relative, not absolute. The five steps are measured inside your own vocal range, not against musical notes. A low voice is no obstacle to tones.
      neutral: "A neutral syllable has no pitch of its own — it takes one from the syllable before. After a first tone it lands mid, after a fourth it lands low. There is nothing to learn separately: it comes out right if the preceding tone is right."
    title: Tones
    lede: The fourth part of the phonetics, without which the first three do not work. What a tone is, how it behaves in Taiwan, and why you cannot simply not produce one.
    why_title: A tone is not decoration
    why_body: In Mandarin the tone belongs to the syllable just as much as its consonants and vowels do. Ignore tone and the language has roughly four hundred distinguishable syllables; count it and there are about thirteen hundred. Dropping tone cuts the distinctions available to you by two thirds and multiplies the number of words that sound identical coming out of your mouth.
    myth_title: On the myth that context will carry you
    myth_body: Context genuinely helps, and words never occur in a vacuum. But context corrects what the listener has already heard; it does not stand in for hearing. A native speaker parses tone automatically, before any interpretation, and a wrong tone is not received as an absent tone. It is received as a different tone — so it misleads actively rather than passively.
    cannot_title: Not producing a tone is not an option
    cannot_body: This point is technical rather than motivational. Any syllable you utter has a pitch and a pitch movement, or it would not have sounded at all. The only question is whether that contour matches the one required. Skipping tone work does not give you neutral speech; it gives you speech with random tones. The tone may not exist for your ear, but it always exists for the person listening.
    cumulative_title: It is not really about minimal pairs
    cumulative_body: "Tones are usually introduced through 媽 麻 馬 罵, which leaves the impression that the risk is limited to rare collisions. In practice the damage is cumulative rather than lexical: with systematically wrong tones each individual word may still be guessable, while a whole sentence is not, because the listener has to try alternatives faster than you are speaking."
    four_title: The four tones
    four_lede: The figures in brackets are Chao's five-point pitch notation, from 1 (low) to 5 (high).
    tones:
      t1:
        name: First — high level
        contour: "55"
        zhuyin: no mark
        note: Held at one pitch. Zhuyin marks it with nothing at all — the absence of a mark is the first tone.
      t2:
        name: Second — rising
        contour: "35"
        zhuyin: ˊ
        note: Travels upwards, much like the intonation of an English question.
      t3:
        name: Third — low
        contour: 214 / 21
        zhuyin: ˇ
        note: Textbooks draw a dip that rises again, but the rise is mostly audible on an isolated syllable or at the end of an utterance. In running speech the third tone usually stays low and does not come back up.
      t4:
        name: Fourth — falling
        contour: "51"
        zhuyin: ˋ
        note: Sharply from top to bottom, short and decisive.
    neutral_title: The fifth, or rather the neutral one
    neutral_body: "Strictly it is not a fifth tone but the absence of a tone of its own: the syllable loses its contour, shortens, and takes its pitch from the syllable before it. Zhuyin marks it with a dot ˙ and, unlike pinyin, places it BEFORE the syllable: ˙ㄉㄜ. There is no point testing it in a drill — by ear it is simply a very short unstressed syllable."
    neutral_taiwan: "And here is an important Taiwanese difference: the neutral tone is markedly less common in Taiwan than in the norm used in China. Many words whose second syllable is reduced in China keep their full tone here."
    taiwan_title: How tones differ in Taiwan
    taiwan_body: The differences are not in the system — there are the same four tones — but in how they are realized.
    taiwan_points:
      range: The range overall is lower and narrower. Taiwanese speech fits into a smaller pitch interval than speech in China, which is why the tones sound restrained rather than flat.
      second: The second tone does not rise as high. It also often picks up a slight dip at the start, coming to resemble the prescriptive third tone in shape.
      third: The third tone does not come back up out of the low, creaky range. The full 214 contour is essentially not produced in Taiwan.
      neutral: The neutral tone occurs less often, and final syllables generally keep their own tone.
      erhua: Erhua — the 兒 suffix — is very rare in Taiwanese Mandarin.
      merge: The second and third tones come closer together by ear than in broadcast pronunciation. This is the norm, not a speech defect.
    sandhi_title: Two rules that change the tone
    sandhi_lede: "One tone is written and another is spoken. The written tone does not change: the dictionary, the zhuyin and the pinyin all keep the original."
    third_title: A third tone before a third tone
    third_body: When two third tones follow each other, the first is pronounced as a second. 你好 is written ㄋㄧˇ ㄏㄠˇ but sounds like ní hǎo. The rule works on what is spoken rather than on the dictionary form, so it applies across word boundaries too.
    third_three: "With three third tones in a row the result depends on how the phrase divides in meaning. 我很好 usually comes out as wó hén hǎo, because 很好 holds together more tightly. There is nothing to memorize: the rule applies to whichever syllables you actually group together."
    yi_title: 一 and 不
    yi_body: The tone of these two syllables depends on what follows.
    yi_rules:
      yi_alone: "一 on its own, at the end, and in ordinals — first tone: yī, 第一 dì yī."
      yi_before4: "一 before a fourth tone — second: 一定 yí dìng, 一樣 yí yàng."
      yi_other: "一 before a first, second or third tone — fourth: 一天 yì tiān, 一年 yì nián, 一起 yì qǐ."
      bu_before4: "不 before a fourth tone — second: 不是 bú shì, 不要 bú yào."
      bu_other: "不 everywhere else — fourth: 不好 bù hǎo, 不能 bù néng."
    practice_title: Practice
    practice_body: "Below is a listening drill: a syllable sounds, you name the tone. It records no progress and feeds nothing into your reviews — it is pure drilling, and you can leave at any moment."
    practice_pending: "Practicing tone production aloud is not available yet: it arrives once speech recognition with contour checking and Taiwanese norms is connected. For now only recognition by ear is trained."
    drill:
      title: Tone drill by ear
      lede: "A syllable sounds and you name the tone. Nothing is recorded and your reviews are untouched: this is pure practice, and you can leave whenever you like."
      back: "← Back to the explanation"
      prompt: Which tone is this?
      replay: Play again
      keys: Up, right, down, left for first, second, third, fourth. Or tap an option.
      tone1: 1st level
