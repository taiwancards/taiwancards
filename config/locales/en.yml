  mobile_hint:
    title: A phone works, but not for everything
    body: >-
      Honestly: I built this mainly for myself, and I study about ninety percent of the time on a laptop,
      using the phone only to flip cards. So not much time went into fitting every section to every screen
      size, and something may well look wrong on a phone — at your own risk. Cards, the dictionary and
      reading the explanations are fine; the trainers, handwriting, pronunciation and text analysis expect
      a computer. Real study belongs there.
    dismiss: Understood
