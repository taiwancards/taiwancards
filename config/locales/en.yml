  licenses:
    moe_notice: 使用說明 — the official usage notice, retained in full as the license requires
    title: Licenses & credits
    intro: TaiwanCards is built with gratitude on freely licensed open resources and official Taiwan language data. Each is linked to its source and license.
    projects_title: Our own open work
    projects_note: "TaiwanCards rests on a body of open linguistic research into Taiwan Mandarin: the corpus pipeline that builds the data, the provenance analysis that keeps it Taiwanese, the signal-processing libraries behind pronunciation scoring, and the published datasets. Every part of it, including this application, is open."
    groups:
      app: The application and its data preparation
      pipeline: Corpus construction and provenance analysis
      gems: Signal processing libraries
      datasets: Published datasets
    works:
      taiwancards: The study application in full — Rails, importers, spaced repetition, pronunciation scoring, mock exams. Nothing is held back.
      corpora: Download, processing, polishing, calibration, cleaning and analysis of every source the dictionary is built from.
      twpipeline: Corpus construction for Taiwan Mandarin — nine JSONL stages from a raw crawl to a segmented, frequency-annotated corpus.
      twfilter: "Provenance analysis: script inventory, orthography, lexical and grammatical markers that separate Taiwan Mandarin from mainland, Hong Kong and Southeast Asian usage."
      dsprb: Speech signal processing in pure Ruby — WAV decoding, FFT power spectra, MFCC, YIN pitch tracking. It scores your pronunciation.
      dtwrb: Dynamic time warping with a Sakoe-Chiba band and DBA barycenter averaging. It compares your recording against the reference contour.
      twngrams: Word and character n-gram frequencies from the Taiwan Mandarin corpus, released into the public domain.
      twsyllables: Syllable inventory with zhuyin, pinyin and tone distribution across the corpus.
      twfilter_tables: "The reference tables twfilter uses to judge provenance — orthographic pairs, lexical markers, script inventories."
    open_source_title: Open source
    fonts_title: Fonts
    fonts_note: All three are self-hosted. Two of them we ship modified, and that is stated below.
    corpora_title: Corpora and dictionaries
    corpora_note: Every text corpus in the database, with the license it arrives under. Only sources whose license permits both free and commercial use are published here; the rest are used for statistics alone and no sentence from them is stored.
    data_title: Reference data
    data_note: "Bodies whose published reference material the app builds on: level lists, stroke inventories, character standards, calendar tables and classification scales. These are factual lists rather than creative works, and are credited here rather than licensed. Where a body released its material under a named license, that license is stated."
    outro: All Chinese content is Taiwan traditional characters, cross-checked against the Ministry of Education dictionaries. Names, brands and lesson texts remain the property of their respective owners.
    donate_title: Support the project
    donate_body: >-
      The app is free and ad-free, and it will stay that way. If it has been useful, you can buy the
      author a coffee. It changes nothing about access — everything is open to everyone alike.
    donate_button: Buy a coffee
    items:
      moe_audio: Audio for characters and words. Recordings by Taiwan's Ministry of Education, data version 20260626. Files are served unmodified; the app only limits playback to the headword.
      cc_cedict: Community Chinese–English dictionary — readings, meanings and traditional/simplified pairs.
      makemeahanzi: Stroke-order graphics, radical decomposition and character etymology.
      hanzi_writer: The stroke-by-stroke writing and animation engine used in the writing trainer.
      hanzilookup: Handwriting recognition that turns your drawn strokes into a character, fully offline. Its recognition data (mmah.json) is derived from Make Me a Hanzi stroke data and carries that project's LGPL / Arphic PL terms, not the MIT of the engine itself.
      unihan: The Unicode Han database — canonical readings and character properties.
      opencc: The STCharacters table, used to convert simplified characters into traditional ones when you paste in text. Every substitution it makes is listed back to you.
      roboto: The interface face, used for Latin text and for pinyin. Self-hosted rather than loaded from Google, so no request leaves for a third party when you open a page.
      noto_sans_tc: The default face for traditional characters. Also self-hosted.
      tw_kai: "Taiwan's own kaishu brush face from the CNS11643 全字庫, published by 數位發展部. This is the face behind the handwriting option, and its 臺 outline is what the site logo is drawn from. We ship a subset of it: the file is reduced to the characters this app actually uses, and the logo embeds outlines taken from it, so the copy here is modified rather than original."
      moe: Ministry of Education standard character forms, the 4808 common-character set and character frequency.
      bopomofo_audio: Zhuyin symbol recordings from the MOE 國語注音符號手冊 open-components bundle, released separately under CC BY 4.0. 2017 © 教育部,國語注音符號手冊-開放部件.
      tocfl: The official TOCFL graded vocabulary lists, level by level.
      naer: National Academy for Educational Research — the TBCL benchmark, COCT corpus and general word-frequency table.
      moe_strokes: The normative list of stroke names behind the basic and compound stroke inventory.
      moe_idioms: "The official dictionary of 成語: definition, classical source, origin story and examples for every idiom. The Chinese text is shown verbatim — the license forbids adaptation; the English and Russian glosses and notes are written by us."
      cwa: Rainfall scales, typhoon categories and the UV index bands.
      tbrs: Tea classification, processing stages and oxidation levels for Taiwanese cultivars.
      hko: The lunar calendar and solar term tables the festival dates are computed from.
      xiaoxuetang: Traced ancient character forms — oracle bone, bronze and seal script. Released into the public domain.
  help:
    title: Help
    intro: >-
      A quick tour of what you can do here. Everything is shared — dictionaries, lessons, lists — but your
      progress is yours alone.
    sections:
      search:
        title: Search
        body: >-
          The box at the top searches everything at once — type in Russian, English, pinyin (with or without
          tones, or tone numbers like xiao3), zhuyin, or even a mistyped character. Results are ranked;
          the closest match comes first.
      study:
        title: Deck & Study
        body: >-
          Your Deck is the active pile. Pick cards into it, then Study runs spaced repetition (FSRS) — swipe
          to grade yourself. Cards come back exactly when you're about to forget them.
      dictionary:
        title: Dictionary
        body: >-
          Browse Characters, Words, Sentences, Collocations, Measure words and Radicals. Every entry shows
          readings (zhuyin + pinyin), meanings, and how strong your memory of it is.
      tocfl:
        title: TOCFL
        body: >-
          The official graded vocabulary, level by level. See how ready you are for each band and study
          any level directly.
      pronunciation:
        title: Speaking
        body: >-
          Say a word into the mic and get per-syllable feedback on your tones and sounds. Auto mode moves
          on when you're right and keeps the mic open until you get it.
      writing:
        title: Writing & Lookup
        body: >-
          Writing quizzes you to draw each character from its meaning and reading. Lookup recognises what
          you draw; Cangjie drills input codes.
      history:
        title: History & Stats
        body: >-
          History is your recent timeline — what you studied and how well it's sticking. Stats shows retention,
          workload and weak spots over time.
      profile:
        title: Profile & backup
        body: >-
          Edit your name, and export your whole progress to a file. After rebuilding the database you import
          it back and pick up exactly where you left off.
    donate: >-
      Nothing here is bought and a donation unlocks nothing — the app is exactly the same either way. If
      you feel like chipping in toward the servers, the button is here. Walking past it is entirely fine.
    donate_button: Chip in for the servers
