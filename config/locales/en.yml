  meta:
    title: TaiwanCards — learn Taiwanese Mandarin with zhuyin and traditional characters
    share_description: Traditional characters, zhuyin, spaced repetition, dictionaries, pronunciation and TOCFL levels.
    share_title: TaiwanCards — Taiwanese Mandarin
    description: "TaiwanCards is an ad-free flashcard app for learning Taiwanese Mandarin: traditional characters, zhuyin beside every reading, TOCFL levels, spaced repetition, and vocabulary lists built for daily life in Taiwan."
  landing:
    open_app: Open the app
    hero:
      eyebrow: 臺灣華語 · 正體字 · 注音 · 成語 · 華語文能力測驗
      heading: Your all-in-one hub for Taiwanese Mandarin
      lede:
        variety:
          - Not Mandarin from China, converted into traditional characters.
          - No vocabulary from China, Hong Kong, Singapore, or Malaysia.
          - Zhuyin (ㄅㄆㄇㄈ) throughout — Taiwan's own phonetic script.
          - Only Taiwan readings, Taiwan usage, Taiwan norms.
          - Everything here is pure Taiwan.
        life:
          - "Every word, sentence, and situation comes from real life in Taiwan:"
          - convenience store, tea shop, noodle shop, MRT, clinic, typhoon day off.
        audience:
          - For people starting from zero, already studying,
          - about to move to Taiwan, or already living here.
        behind:
          - "Behind it: quantitative linguistics, verified sources,"
          - my own teaching method, a great deal of work by hand,
          - and a boundless love for Taiwan 🇹🇼
      cta: Start learning
      secondary: See what's inside
      note: Free to use. No ads. Not now, not ever.
      specimen:
        meaning: pineapple
        caption: One word. Five separate things to remember, each with its own review date.
    is:
      heading: What this is
      items:
        taiwan: >-
          Taiwan's Mandarin and nothing else — traditional characters, zhuyin, TOCFL bands and Taiwanese
          school grades
        decks: >-
          Like Anki, only without decks by strangers or evenings lost to typing your own — and a word here
          is five separate memories, not one know / don't-know swipe
        dictionary: >-
          Like Pleco, only it is not just a reference — the same entry feeds the trainers and a schedule
          that decides what you see next, with Taiwan first rather than as a footnote
        writing: >-
          Like Skritter, only writing is not a separate app with a separate list — you draw the characters
          you are already learning this week, and it counts toward the same progress
        reading: >-
          Like Du Chinese, only nobody picks the text for you: a song you love, a news piece, a class
          handout or a message — paste it and get it back split into words, ready to become a deck
        photo: >-
          Photograph a menu on the wall or a sign in the street, and the characters you could not read come
          back split into words, ready to become a deck
        speaking: >-
          Not a recogniser answering yes or no — every syllable you say is scored for quality on nineteen
          acoustic properties, against the way Taiwan says it rather than the way China does
        everyday: >-
          The Taiwan no course teaches: ordering at a drink shop, the invoice lottery, renting a flat, the
          clinic, typhoon days
        corpus: >-
          Every example sentence is one somebody in Taiwan actually wrote, kept together with its source and
          its licence
        measured: >-
          Nothing here is guessed: how common a word is, how hard it is and which level it belongs to all
          come from counting a real Taiwanese corpus
        memory: >-
          One progress record behind every screen: learn a word in the reader and it counts in the
          dictionary, the drills and the writing trainer
    isnt:
      heading: What this is not
      items:
        game: >-
          Not a game — no streaks, no XP, no badges, no leaderboards and no cartoon animal guilt-tripping
          you into coming back tomorrow
        machine: >-
          No AI content — and there never will be. Every meaning, example and label has passed through
          a person, and every phrase traces back to a verifiable source. Most apps show you what a
          model generated; this one never does
        decks: >-
          Not a pile of shared decks where nobody can tell you who made them, from which textbook, or
          whether the readings are even right for Taiwan
        china: >-
          Not a course from China with traditional characters swapped in — the vocabulary, the readings and
          half the everyday realities differ as well
        words: >-
          A course from China is unlikely to spend much time on 自由, 民主 or 人權. Here there is no shortage
          of words like that, and no list they are missing from
        course: >-
          Not a syllabus to sit through from the first lesson to the last — you start where you already are,
          take what you need and skip what you do not
        teacher: >-
          Not a replacement for a teacher — this is the half you do between classes, the half nobody watches
          you do, and the half that decides whether you get anywhere
        hsk: >-
          Not HSK preparation — different vocabulary, different readings and different realities behind the
          words, even if you sit the exam in traditional characters
        simplified: >-
          No simplified characters anywhere and no switch to turn them on — there is only ever the Taiwan
          side, in the dictionary, the examples and the trainers alike
        ads: >-
          Not funded by advertising and never will be — nothing flashes, nothing interrupts, nothing pulls
          you away from studying or from simply looking a word up
        tracking: >-
          Not watching you — no third-party analytics, no trackers of any kind, and your whole progress
          exports to a file you keep whenever you ask for it
    counts:
      heading: Already in place
      radicals: Kangxi radicals
      characters: Characters
      words: Dictionary entries
      collocations: Idioms and collocations
      sentences: Sentences and examples
    science:
      heading: Quantitative linguistics under the hood
      body: >-
        Everything rests on measurement: corpus frequencies and dispersion, collocation strength,
        calibrated difficulty scales, acoustic references for every syllable. What you see is the tip
        of an iceberg — beneath it are years of collecting, measuring and verifying data, with our own
        libraries and datasets released for the research community. All of it is open — knowledge
        belongs to everyone.
    quality:
      heading: Where the quality comes from
      items:
        audio:
          title: Official recordings
          body: >-
            Characters and words as recorded for Taiwan's Ministry of Education state dictionary — not synthesized,
            not crowdsourced.
        sources:
          title: Taiwanese sources
          body: The state dictionary, the official level lists and frequency tables, statutes, city news.
        human:
          title: A person behind every entry
          body: >-
            Meanings, examples and links are read through by hand. Everything is human-verified —
            nothing generated, nothing machine-translated.
        written:
          title: Written for an English speaker
          body:
            Explanations start from what English has put in your ear and the traps its spelling sets
            in pinyin.
    tools:
      heading: Everything you would otherwise install five apps for
      lede: Open it and it is all already there — nothing to set up, nothing to hunt for.
      items:
        study:
          title: Flashcards
          body: Everything due today, plus a measured helping of new
        speaking:
          title: Pronunciation
          body: Say it out loud and see which syllable slipped, and how far
        writing:
          title: Handwriting
          body: Recall the character, then draw it stroke by stroke, in order
        zhuyin:
          title: Zhuyin
          body: By ear and by hand, until the alphabet stops getting in the way
        tones:
          title: Tones
          body: Heard, drawn and spoken, one syllable at a time
        typing:
          title: Typing
          body: Zhuyin and Cangjie, the way people type in Taiwan
        reader:
          title: Reader
          body: Paste an article and read it with the dictionary already open
        everyday:
          title: Daily life in Taiwan
          body: Ordering food, renting a flat, the bank, the paperwork — what classes skip
        placement:
          title: Placement test
          body: Five minutes to find where to carry on from
        plan:
          title: Exam plan
          body: Name the TOCFL band and the date; the daily quota works itself out
    core:
      heading: Look one word up, and see the whole picture
      lede: >-
        Radicals build characters, characters build words, words build sentences. Every page shows the rest
        of the web: what a word is made of, where it turns up, and how firmly you know each piece.
      layers:
        radicals: Radicals
        characters: Characters
        words: Words
      facets_note: >-
        Knowing a word is not one thing. You can read it on the page and still freeze when you have to say
        it. So every word carries five separate memories, and only the one that has slipped comes back.
      facets:
        recognition: you see it and know it
        production: you go from meaning to word
        reading: you read it aloud correctly
        tone: the contour holds, checked by voice
        writing: from memory, stroke by stroke
    progress:
      heading: You always know where you stand
      lede: The same knowledge measured three ways. Take whichever one means something to you.
      items:
        tocfl:
