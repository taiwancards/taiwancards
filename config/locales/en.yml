      limits: >-
        Phonetics is best set up with a live teacher, and this does not replace real classes. What you get
        is tone and pronunciation checking — there is no conversation partner and no listening comprehension
        here, and the app does not set out to provide them.
    honest:
      heading: Why this exists
      body: >-
        I am a linguist, I live in Taiwan, and this is the app I kept wishing for while learning the language
        here. It grew out of a master's thesis in computational linguistics and a lot of ordinary daily
        practice — signs, menus, asking again when I miss it. There is no advertising and there never will
        be, and that is half the reason it exists.
