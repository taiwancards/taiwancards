      replay_title: Replay the introduction
      replay_body: The same short walk through the essentials that you saw on your first day.
      replay_cta: Start the introduction
    steps:
      welcome:
        title: Welcome to TaiwanCards
        body: >-
          A quick look at the parts you will use every day — a minute is plenty. It ends at the full
          guide, which covers every corner of the system. Everything a learner of Taiwan Mandarin could
          ever need is gathered here and wired together.
      search:
        title: Search is the fastest way in
        body: >-
          Type it however suits you: characters, pinyin, zhuyin, or just the English meaning. It finds
          characters, words, idioms and real sentences from the corpus.
      dictionary:
        title: The dictionary
        body: >-
          Characters, words, sentences, idioms, measure words — and the TBCL and TOCFL level lists if you
          are working towards an exam. Anything here goes into study with one tap.
      language_section:
        title: Everything about the language
        body: >-
          Come here when you want to understand rather than just memorise: how the sounds and zhuyin fit
          together, what really happens to tones, how a character is built, how counting works, how the
          grammar behaves.
      practice:
        title: Everything to practise with
        body: >-
          Everything you can drill with your hands and your voice: zhuyin, sounds, tones, pronunciation,
          handwriting, typing on a Taiwanese keyboard and mock exams.
      taiwan:
        title: The Taiwan part
        body: >-
          The things a textbook leaves out: how tea gets ordered here, what the cashier asks you, how the
          metro stations are read, and why the calendar carries two sets of dates.
      profile:
        title: Your profile and its settings
        body: >-
          Your level, what the dictionary shows, which tabs sit at the bottom on a phone, statistics,
          review history and a full export of your progress. There really is a lot in here — drop by once
          and set it up your way.
      new_deck:
        title: A deck out of anything
        body: >-
          Like a song and want to pull it apart? Got a text or a word list in class? Found an article
          worth reading? Tap here and any of it turns into a deck of cards, which then joins the same
          daily queue as everything else.
      display:
        title: Show pinyin, or don't
        body: >-
          Pinyin helps some people and gets in the way of reading zhuyin for others. These buttons turn
          it on and off, and switch the calligraphic font while they are at it. Tap and see.
      guide:
        title: Here is the full guide
        body: >-
          Every corner of the system opens from here: each section, page by page. Tap anything to open
          it, or run a chapter to be walked through it. The guide stays put — come back when you need it.
    chapters:
      dictionary:
        title: Dictionary and search
        summary: How to find anything and how to read an entry
        steps:
          open_group:
            title: Open the dictionary
            body: Click Dictionary in the top bar and the list of what is inside will drop down.
          open_more:
            title: Tap the menu
            body: On a phone every section lives behind this button in the corner. Tap it.
          pick_dict:
            title: Pick Words
            body: This is the main dictionary page. Tap it and we will be inside.
          entry:
            title: This is what an entry looks like
            body: >-
              Readings first, then the senses numbered as the source dictionary numbers them, then
              examples from the corpus. Anything here goes into study with one tap.
          detail_level:
            title: Brief or full
            body: >-
              This switch in the header decides how much is shown: the main sense only, or collocations,
              thesaurus, etymology and every sense at once.
      cards:
        title: Cards and decks
        summary: Where cards come from and how reviews work
        steps:
          new_deck:
            title: Every deck starts here
            body: >-
              This button is on every page. A song, a text from class, a word list, an article — all of it
              turns into a deck.
          open_group:
            title: Open My study
            body: "Tap it — this is everything that belongs to you: today's queue, your decks, the reader."
          open_more:
            title: Tap the menu
            body: On a phone every section lives behind this button. Tap it.
          pick_desks:
            title: Pick My decks
            body: Tap it and let us look at what a deck list is like.
          facets:
            title: Six memories per word
            body: >-
              Each word is asked separately for recognition, production, reading, listening, tone and
              writing. Knowing a word and being able to write it are different states with different
              intervals.
      taiwan:
        title: Life in Taiwan
        summary: The vocabulary tied to living here
        steps:
          open_group:
            title: Open Taiwan
            body: Tap it — this is the part a textbook leaves out.
          open_more:
            title: Tap the menu
            body: On a phone every section lives behind this button. Tap it.
          pick_everyday:
            title: Pick Everyday life
            body: Tap it and the vocabulary opens, sorted by situation.
          domains:
            title: Everything by situation
            body: >-
              Food, drinks, transport, paperwork, weather, slang. Each word is marked with where it is
              actually used and how it differs from the mainland.
      phonetics:
        title: Sounds and zhuyin
        summary: How the sounds work and where to drill them
        steps:
          open_group:
            title: Open About the language
            body: Tap it — come here when you want to understand rather than just memorise.
          open_more:
            title: Tap the menu
            body: On a phone every section lives behind this button. Tap it.
          pick_zhuyin:
            title: Pick Zhuyin and pinyin
            body: Tap it — this is the main page about the sounds.
          parts:
            title: Four parts
            body: >-
              An introduction, the initials, the finals, and everything that gets confused. Switch between
              them here — the order is meant to be read straight through.
          drill_block:
            title: And drill it straight away
            body: >-
              The symbols come in groups and each group has its own button. It drills exactly that group
              rather than all thirty-seven, so you take on four symbols at a time.
      trainers:
        title: The trainers
        summary: What you can drill with your hands and your voice
        steps:
          open_group:
            title: Open Practice
            body: Tap it — every trainer lives here.
          open_more:
            title: Tap the menu
            body: On a phone every section lives behind this button. Tap it.
          pick_pronunciation:
            title: Pick Pronunciation
            body: Tap it and we will show you how the app listens to you.
          what_else:
            title: And there is more
            body: >-
              Alongside it sit handwriting, typing on a Taiwanese keyboard, Cangjie, the sound and tone
              drills and a mock TOCFL. All of it is open from the start, not unlocked as you go.
      display:
        title: What to show
        summary: Four switches that change everything at once
        steps:
          prefs:
            title: These four buttons
            body: >-
              They control how text looks across the whole app. A tap applies everywhere immediately —
              go ahead and try them now.
          pinyin_toggle:
            title: Pinyin above the characters
            body: Try tapping it. It helps some people and gets in the way of learning zhuyin for others.
          font_kai:
            title: The calligraphic font
            body: The shapes Taiwan teaches handwriting from. Tap it and look at the characters.
          mainland_toggle:
            title: Mainland equivalents
            body: Turn it on if you want to see where the mainland standard parts ways with Taiwan.
      profile:
        title: Profile and progress
        summary: Your level, your statistics and your export
        steps:
          open_group:
            title: Open Settings
            body: Tap it — this part is about you rather than about the language.
          open_more:
            title: Tap the menu
            body: On a phone every section lives behind this button. Tap it.
          pick_progress:
            title: Pick Progress
            body: Tap it and let us see what the app knows about you.
          backup:
            title: And you can take it all with you
            body: >-
              The Backups tab holds an export of your whole progress in one file. The data is yours and
              it is not locked in here.
