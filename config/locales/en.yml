    instead:
      heading: Next to what you may already be using
      lede: >-
        Each of those apps does its own job well. The trouble is keeping five of them open with nothing
        joined up in between.
      closing: >-
        Look something up, check it, send it to a deck, watch your level rise and prepare for TOCFL — in
        one place rather than five tabs.
      note: >-
        It will not prepare you for HSK: the vocabulary and the realities behind it are different, even
        if you sit the exam in traditional characters.
    compare:
      heading: Next to what you may already be using
      summary: >-
        Apps that teach Mandarin nearly always teach the Chinese one, and the strong general-purpose tools
        leave the hard choices to you: which deck, which word next, how often. TaiwanCards is narrower on
        purpose, and makes those choices itself.
      honest: >-
        None of that makes the others bad software, and most of them are not trying to teach Taiwanese Mandarin
        at all. Anki's ecosystem is unmatched. Pleco's dictionaries are far deeper than anything here. Skritter's
        stroke-level handwriting grading is the best in the category. And Duolingo is better than anyone at
        getting you back tomorrow.
