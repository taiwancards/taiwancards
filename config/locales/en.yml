  glossary:
    fsrs: "A spaced-repetition algorithm: from your own ratings it predicts the moment you are about to forget a card, and shows it then."
    tocfl: Taiwan's national Mandarin proficiency exam and its level scale, from Novice up to Band C.
    tbcl: "Taiwan's benchmarks for Chinese language: the grades the island's own schools teach to."
    zhuyin: Taiwan's phonetic alphabet, ㄅㄆㄇㄈ. Children learn it instead of pinyin, and it is how people type.
    pinyin: Writing Mandarin syllables in Latin letters. Primary in China, a secondary aid in Taiwan.
    putonghua: The standard variety of Mandarin in China.
    hokkien: Taiwanese Southern Min, spoken by a large share of the island.
    hanzi: The full character forms kept in Taiwan, Hong Kong and Macau, as opposed to the simplified set used in China.
