      badge_strokes: 画
      disclaimer: これは完成した名前でも、個人に向けたおすすめでもありません。戸籍の統計、つまりどの字や組み合わせがよく現れるかを示したものです。名前は、その言語の中で育った人と一緒に決めるものです。このリストは、その相談のための材料として使ってください。
      results_note: 候補は5つで、それぞれ理由つきです。答えを変えるとリストが作り直されます。
