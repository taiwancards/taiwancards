    zhuyin_intro: 台湾の発音記号です。ピンインと並べて覚えても、音から直接覚えてもかまいません。同じ表に両方を載せています。
    drill:
      lede: 2つの表記の対応練習です。記号を見てローマ字のつづりを答え、その逆もやります。ここでのピンインは土台ではなく、橋渡し役です。
      title: 注音 ↔ ピンイン
      direction_zhuyin: 注音 → ピンイン
      direction_pinyin: ピンイン → 注音
      systems_html: "注音は、台湾で音を書き表すための37の記号です。どの記号も決まった1つの音を表し、結合韻母の中で音が少し変わるものがわずかにあるだけです（おもな例は〘ㄧㄢ〙）。読みを推測することはできません。どんな音かを覚えるだけです。ピンインは同じ音をアルファベットで書いたもので、補助にすぎません。やることはひとつ：記号を耳で聞き分けられるようになるまで、下の表を順に進めてください。"
      stage_hint: 順番に進めましょう。まず子音、次に母音と介音、それから韻母全体、最後に音節全体です。
      stages:
        consonants: 子音
        vowels: 母音
        finals: 韻母
        syllables: 音節全体
      prompt_zhuyin: ピンインではどれ？
      prompt_pinyin: 注音ではどれ？
      keys: 答えの方向にカードをスワイプするか、矢印キーを使ってください
      done_title: ラウンド終了
      restart: もう一度
      see_chart_zhuyin: 注音の表
      see_chart_pinyin: ピンインの表
      card: 注音とピンインを、スワイプで双方向に対応づけます。
      syllable_title: 台湾華語の音節のしくみ
      syllable_body: どの音節も、多くて3つの枠でできています。必須なのは最後の枠だけ。〘一〙は韻母だけ、〘四〙は声母だけで母音を書きません。注音は枠をすべて書き出しますが、ピンインはまとめたり省いたりすることがよくあります。
      slots:
        initial_label: 声母（〘聲母〙）
        initial_glyph: "〘ㄓ〙"
        initial_body: 21の子音のどれか。なくてもかまいません。母音で始まる音節もたくさんあります。
        medial_label: 介音（〘介音〙）
        medial_glyph: "〘ㄨ〙"
        medial_body: 3つのわたり音〘ㄧ ㄨ ㄩ〙のどれか。ピンインがいちばんよく隠す枠です。
        final_label: 韻母（〘韻母〙）
        final_glyph: "〘ㄥ〙"
        final_body: 母音、二重母音、または母音＋-nか-ng。唯一の必須の枠です。
      tones_title: 声調記号の位置
      tones_body: ピンインは主母音の上に記号を付けます（mā má mǎ mà）。注音は第一声に何も付けず、〘ˊ ˇ ˋ〙を記号のあとに書きます。たとえば〘ㄇㄚ ㄇㄚˊ ㄇㄚˇ ㄇㄚˋ〙。軽声はどちらでも例外で、ピンインは記号を付けず、注音は前に点〘˙〙を書きます（〘˙ㄉㄜ〙）。縦書きでは、注音は声調記号も含めて、ふりがなのように漢字の右側に縦に並びます。
      mismatch_title: ピンインにだまされるところ
      mismatch_body: これは丸暗記すべき例外ではありません。理由はひとつ。つづりを短くするために、ピンインは音節の途中の母音を省き、1つの文字を違う音に使い回し、音のないところに文字を書くことさえあります。注音は発音しないものを書きません。だから注音の列を見れば、音節が本当は何でできているかがわかります。
      mismatch_pinyin: ピンイン
      mismatch_zhuyin: 注音
      mismatch_why: 実際に起きていること
      mismatch:
        zhong:
          pinyin: zhong
          zhuyin: "〘ㄓㄨㄥ〙"
          why: zhは〘ㄓ〙ですが、このoは〘ㄛ〙ではありません。-ongの実体は-ungなので、注音ではわたり音〘ㄨ〙と韻母〘ㄥ〙で書きます。
        jiu:
          pinyin: jiu
          zhuyin: "〘ㄐㄧㄡ〙"
          why: 韻母は-iouで、ピンインはつづりを短くするために真ん中の母音を省いています。注音は〘ㄧ〙と〘ㄡ〙の両方を書きます。
        hui:
          pinyin: hui
          zhuyin: "〘ㄏㄨㄟ〙"
          why: 同じしくみです。韻母は-ueiで、ピンインはeを飲み込んでいます。注音は〘ㄨ〙と〘ㄟ〙を書きます。
        yu:
          pinyin: yu
          zhuyin: "〘ㄩ〙"
          why: このyは子音ではなく、母音を載せるための飾りで、uは実はüです。音はひとつなので、注音も記号ひとつで書きます。
        zhi:
          pinyin: zhi
          zhuyin: "〘ㄓ〙"
          why: このiは母音を表していません。そらせた舌の形をそのまま保っているだけです。何もないので、注音は〘ㄓ〙のあとに何も書きません。
        weng:
          pinyin: weng / -ong
          zhuyin: "〘ㄨㄥ〙"
