    series:
      title: 誰もが混同する3つの列
      body: "ピンインでは似て見えるのに、口の中の3つの違う場所で作る9つの声母です。まずは列ごとに練習しましょう。同じ列なら場所は同じで、変わるのは音の出し方だけです。息を出さずに離す、息を伴って離す、息をこすり続ける、の3つです。"
      rows_hint: 1列ずつ
      columns_hint: 3列まとめて
      hard_title: ここは本当に難しい
      hard_body: "列ではなく縦の組で比べると、音はほとんど聞き分けられなくなります。ピンインでもほぼ同じ書き方で、zhi・zi・jiは1文字しか違いません。違いは舌の位置だけです。舌先を上あごに向けてそらすか、舌を平らにして前のふちを歯の裏に寄せるか、舌先を下げて舌の面を硬口蓋に押し当てるか。ここはじっくり耳を傾けるところで、最初は間違えて当然です。"
      all_nine: 9つすべてを混ぜて
      sets:
        zhi_chi_shi: zhi chi shi
        zi_ci_si: zi ci si
        ji_qi_xi: ji qi xi
        zhi_zi_ji: zhi zi ji
        chi_ci_qi: chi ci qi
        shi_si_xi: shi si xi
    drill_these: "%{symbols}を練習"
    blocks:
      labial:
        title: 唇
        body: 唇で作る音です。〘ㄅ ㄆ ㄇ〙は上下の唇を合わせ、〘ㄈ〙は下唇を上の歯に当てます。日本語の「フ」とは違います。台湾の子どもが最初に習う音で、〘ㄅㄆㄇㄈ〙の歌の出だしでもあります。
      alveolar:
        title: 舌先
        body: 舌先を上の歯の裏の歯ぐきに当てます。〘的〙、〘他〙、〘你〙、〘了〙はどれもここから始まります。
      velar:
        title: 舌の奥
        body: "舌の奥を上あごの奥（軟口蓋）に付けて作ります。カ行・ガ行と同じ場所です。〘ㄏ〙も同じ場所で、舌の奥を付けずに近づけ、すき間で息をこすります。のどで出す日本語のハ行より摩擦のある音ですが、台湾ではハ行に近い軽い音で言うこともよくあります。"
      palatal:
        title: "〘ㄧ〙と〘ㄩ〙の前だけ"
        body: "〘ㄧ〙と〘ㄩ〙の前にしか現れないので、後ろの音を見れば〘ㄓㄔㄕ〙と混同することはありません。"
      retroflex:
        title: そり舌
        body: "舌先を上あごに向けて反らせます。"
      sibilant:
        title: 舌先と歯
        body: "舌を平らにし、舌の前のふちを歯の裏に寄せて、息を細く通します。上の3つと対になる音です。"
      medial:
        title: 介音
        body: 声母と韻母のあいだに入る音です。ピンインではi・u・ü、音節の頭ではyやwと書きます。
      open:
        title: 単母音
        body: "ほかのすべての音の土台になる4つの音です。〘ㄝ〙は単独ではほとんど使わず、ふつうは〘ㄧ〙と〘ㄩ〙のあとに現れます。"
      diphthong:
        title: 二重母音
        body: 1音節の中に2つの音があります。音節を切らずに、舌がひとつの位置から次の位置へなめらかに移ります。「エー」「オー」のように伸ばした音ではありません。
      nasal:
        title: 鼻音
        body: "〘ㄢ〙と〘ㄤ〙、〘ㄣ〙と〘ㄥ〙は、それぞれ最後に舌がどこで止まるかが違います。日本語の「案内」の「ん」と「案外」の「ん」の違いです。辞書ではどちらの組も区別しています。"
      rhotic:
        title: 唯一の存在
        body: "それだけで1音節になる音で、〘二〙、〘兒〙、〘耳〙に出てきます。"
      compound:
        title: 結合韻母
        body: 介音と韻母の組み合わせです。もう練習した記号からできているので、専用のドリルはありません。
    finals_lede: 音節から最初の子音を除いた残りすべてです。母音、二重母音、または母音＋鼻音。結合韻母では記号を1つずつ読み上げていますが、続けて発音すると、2つの音を並べただけの音にはなりません。
    why_title: 細かい話ではない理由
    why_body: ピンインは何の準備もなく読めてしまいます。だからこそ危ないのです。アルファベットを見るとついローマ字読みに引きずられ、気づかないうちに間違いが定着します。注音の記号の後ろには、自分で覚えた音しかありません。台湾が読みを注音で示すのは、まさにそのためです。
    compound_audio: 結合韻母です。記号は1つずつ読み上げていますが、続けて言うと2つの音を並べた音にはなりません。右の解説を見てください。
    play_symbol: "%{symbol}を再生"
    phonetics_card: 音の一覧表：注音、ピンイン、IPA、日本語での目安、例語。
