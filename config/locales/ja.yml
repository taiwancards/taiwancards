  variants:
    title: 台湾とほかの地域の違い
    word: 語
    reading: 読み
    meaning: 意味
    taiwan: 台湾
    china: 中国
    hongkong: 香港
    singapore: シンガポール／マレーシア
    checked: 読みは教育部の辞典と、語彙は教育部の両岸対照表や各地域の資料と照合しています。形に異論がある場合や標準が変わった場合は、どちらかの側に立つのではなく、注でそのことを説明しています。
    sections:
      reading: 同じ漢字で、読みが違う
      glyph: 同じ単語で、字が違う
      word: 語そのものが違う
    intro:
      reading: 台湾と中国で同じように書くのに、読み方が違う単語です。誰もが気づくのが〘垃圾〙で、台北でlājīと言えば、どこで華語を習ったかがすぐにわかります。注意が必要な項目が2つあります。接続詞の〘和〙をhànと読むのは本当に教育部の辞典に載っている読みですが、使うのは年配の人やニュース放送に限られつつあるので、自分で使うより聞いてわかればいい読みとして扱いましょう。また〘說服〙は台湾では確かにshuìfúですが、中国が何かを変えたからではありません。2019年に広まった「読みが改訂された」という話は、公式に否定されています。
      glyph: 台湾も香港も繁体字を使いますが、いつも同じ字を選ぶわけではありません。これらはフォントの違いではなくUnicode上の別の文字なので、画面でも実際に違って見えます。いちばんよく出会うのは〘著〙です。台湾ではどの読みでも〘著〙と書きますが、香港と中国では〘着〙と使い分けます。そのうち2つは、台湾の中でも公式の標準とふだんの手書きが食い違う例です。標準の字形は〘汙〙と〘脣〙ですが、街では〘污〙と〘唇〙をよく見かけます。
      word: 地域によって、まったく別の単語を使う例です。香港の列は、華語の変種というより、ほとんどが漢字で書いた広東語の語彙だという点に注意してください。華語話者が〘雪櫃〙を声に出して読んでも、それは広東語の単語を読んでいることになります。この表でいちばんの落とし穴は〘土豆〙です。台湾ではピーナッツ、中国ではジャガイモ。もとは別々の2つの単語が、書くと同じになってしまったのです。
