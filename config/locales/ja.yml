    title: 台湾のボードゲーム
    empty: ボードゲームの語彙はまだ取り込まれていません。
    boards:
      mahjong: 麻雀
      mcr: 中国公式ルール
      xiangqi: シャンチー
      go: 囲碁
      tabletop: ボードゲーム・カード
    leads:
      mahjong:
        title: 台湾麻雀
        body: 16枚で打つこの麻雀は台湾のもので、中華圏共通のルールではありません。アガリは5面子1雀頭。役の点数は「台」という単位で足し算され、日本の麻雀の翻のように倍々にはなりません。8枚の花牌はそれだけで点になり、一晩の勝ち負けは親の連荘で決まります。一翻縛りのような最低条件はなく、0台の手でもアガれます。
        note: ここで扱うのは用語とその意味で、ルールブックではありません。
      mcr:
        title: 中国公式ルール麻雀
        body: 1998年に中国で定められた競技ルールです。手は13枚、役は81種類で、8点縛りがあります。それより安い手はアガリになりません。点数の単位は台ではなく「番」で、台湾の卓ではまず見かけない役もたくさんあります。
        note: 台湾では大会でこのルールを使い、家では台湾のルールで打ちます。
      xiangqi:
        title: シャンチー（中国将棋）
        body: 駒はマス目の中ではなく、線の交点に置きます。将と士は九宮から出られず、象は河を渡れません。馬はすぐ隣に駒があると進めず、砲は間に駒を1つはさんだときだけ相手の駒を取れます。動かせる手がなくなった側は負けで、王手を延々と続けることは禁止です。
        note: 赤と黒で、同じ駒を別の漢字で書き分けます。
      go:
        title: 囲碁
        body: 囲碁と〘圍棋〙は同じゲームです。〘圍棋〙は「囲む碁」という意味で、日本語の「囲碁」とほぼ同じ発想の名前です。石は交点に置いたら動かさず、本物の眼が2つある石は生きます。地と取った石で数える日本のルールと違い、台湾では盤上の石と地を合わせて数えます。
        note: 用語の多くは日本語から入ったものですが、台湾では独自の漢字で書かれます。
      tabletop:
        title: ボードゲーム、トランプ、街の遊び
        body: 台湾では現代のボードゲームを〘桌遊〙と呼び、時間制のボードゲームカフェで遊びます。そのそばには地元で定番のトランプ遊びがあります。〘大老二〙、〘十三支〙、〘心臟病〙、そして街で遊ばれる〘暗棋〙。〘暗棋〙は盤の半分を使い、駒を伏せたまま遊ぶシャンチーです。
        note: どの卓でも使う言葉も集めています。手番、点数の計算、チップ、席決めなど。
