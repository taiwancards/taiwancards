      heading: すでに使っているアプリと比べると
      lede: どのアプリも、それぞれの仕事はしっかりこなします。困るのは、何のつながりもないまま5つも開いておかなければならないことです。
      closing: 調べる、確かめる、デッキに入れる、レベルが上がるのを見る、TOCFLに備える。それを5つのタブではなく、ひとつの場所で。
      note: HSK対策にはなりません。たとえ繁体字で受験するとしても、語彙もその背後にある世界も違うからです。
    compare:
      heading: すでに使っているアプリと比べると
      summary: 華語を教えるアプリのほとんどは中国の普通話を教えていて、優れた汎用ツールは難しい判断を利用者に任せます。どのデッキにするか、次はどの語か、どのくらいの頻度で。TaiwanCardsはあえて対象を絞り、そうした判断をアプリ自身が行います。
      honest: "だからといって、ほかのアプリが悪いわけではありませんし、その多くはそもそも台湾華語を教えようとしていません。Ankiのエコシステムに並ぶものはありません。Plecoの辞書はここよりはるかに充実しています。Skritterの画単位の手書き採点はこの分野で最高です。そして「明日もまた開かせる」ことにかけては、Duolingoの右に出るものはいません。台北で生まれたばかりのZhong Chineseは、中国ではなく台湾の華語を教えている、ここ以外で唯一の場所で、見ていて楽しいアプリです。教材は1冊の教科書に沿っていて辞書は小さめですが、入っているものは本物です。〘嗨嗨〙 \U0001F44B\U0001F3FB"
