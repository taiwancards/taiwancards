        meaning_two: ひとつの名前に、%{first}と%{second}というふたつの意味が込められています。
        meaning_one: 2字がどちらも%{first}を表していて、名前全体にまとまりがあります。
        meaning_single: 意味を担うのは%{text}（%{first}）で、もう1字は響きのために選ばれています。
        meaning_solo: 1字の名前で、テーマは%{first}。台湾では名が1字の人は少なめなので、印象に残ります。
        meaning_plain: 辞書から拾ってきた字の組み合わせではありません。台湾の人はこうした名前を、文としてではなく雰囲気として受け取ります。
        sound_common: "%{tones}という声調の並びは、台湾の名前でもごくありふれた形で、つかえずに口にできます。"
        sound_rare: "%{tones}という声調の並びは珍しく、個性がありながら言いやすい名前です。"
        sound_repeat: 同じ声調が2つ続く形は、台湾では避けられがちです。続けると平板に聞こえます。
        pair_strong: この2字は本当によく組み合わされます。戸籍では偶然から予想されるよりはるかに多く現れるので、寄せ集めではない、実在しそうな名前に聞こえます。
        pair_fresh: 戸籍には決まった組み合わせがないので、リストから借りてきた名前ではなく、自分だけの名前として受け取られます。
        era_match: どちらの字も同世代によくある字で、祖父母世代の名前らしくも、赤ちゃんの名前らしくもありません。
        era_older: 字の印象は同世代より上で、親の世代らしい名前です。台湾ではそれが落ち着きや堅実さとして受け取られがちです。
        era_recent: 最近生まれた子どもに多い名前なので、かなり若い印象になります。
        rare_char: "%{text}は珍しい字です。名前はすぐに覚えてもらえますが、どう書くのかは聞かれるでしょう。"
        gender_male: 耳で聞くと、はっきり男性の名前です。
        gender_female: 耳で聞くと、はっきり女性の名前です。
        gender_neutral: 性別を感じさせない名前です。台湾ではこうした名前は男女どちらにも使われます。
        echo: 本名と響きが似ているので、自己紹介したときにつながりがすぐ伝わります。
        official: 書類にもきれいに印字できます。どちらの字も標準の字体セットに含まれています。
