    description: TaiwanCardsは、台湾華語（台湾の中国語）を学ぶための広告なしの単語カードアプリです。繁体字、すべての読みに添えた注音、TOCFLレベル、間隔反復、そして台湾での毎日の暮らしに合わせた語彙リスト。
  landing:
    open_app: アプリを開く
    hero:
