  numbers:
    rules_title: 練習の前に知っておきたいルール
    rules:
      truncation:
        title: 最後の数字は、ひとつ下の位を表す
        body: いちばん混乱しやすいところです。末尾にぽつんと置かれた数字は、足されるのではなく、言われずに省かれたひとつ下の位を表します。だから〘三百五〙は305ではなく350です。日本語にはない言い方なので注意しましょう。
        rows:
          - huayu: "〘三百五〙"
            value: "350"
            note: 正式には〘三百五十〙。〘十〙を省略
          - huayu: "〘兩千三〙"
            value: "2300"
            note: 正式には〘兩千三百〙。〘百〙を省略
          - huayu: "〘一萬五〙"
            value: "15,000"
            note: 正式には〘一萬五千〙。〘千〙を省略
      zero:
        title: "〘零〙は間ではなく、省略を止める合図"
        body: 305と言うには、三と五を並べるだけでは足りず、あいだに〘零〙が必要です。〘零〙は空いている位があることを知らせ、上で見た省略の読み方を打ち消します。空いている位がいくつあっても〘零〙はひとつです。日本語の「三百五」とは違うので気をつけましょう。
        rows:
          - huayu: "〘三百零五〙"
            value: "305"
            note: "〘零〙がないと350になる"
