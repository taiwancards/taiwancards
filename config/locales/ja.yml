    is:
      heading: TaiwanCardsとは
      items:
        taiwan: 台湾の華語だけ。繁体字、注音、TOCFLのレベル、そして台湾独自のTBCLの級
        decks: Ankiに似ていますが、知らない誰かのデッキも、自分で入力して終わる夜もありません。しかもここでは1つの単語が「わかる／わからない」の1回のスワイプではなく、5つの別々の記憶です
        dictionary: Plecoに似ていますが、ただの辞書ではありません。同じ項目が練習にも、次に何を見るかを決めるスケジュールにもつながり、台湾は脚注ではなく常に最初に来ます
        writing: Skritterに似ていますが、書き取りは別アプリの別リストではありません。今週覚えている字をそのまま書き、それが同じ学習状況に反映されます
        reading: Du Chineseに似ていますが、文章は自分で選べます。好きな歌、ニュース、授業のプリント、メッセージ。貼り付ければ単語に区切られて戻ってきて、そのままデッキにできます
        photo: 壁のメニューや街の看板を撮れば、読めなかった字が単語に区切られて戻ってきて、そのままデッキにできます
        speaking: "「合っている／いない」だけを返す音声認識ではありません。発音した音節の一つひとつを、19の音響的な特徴で採点します。基準は中国の発音ではなく、台湾の発音です"
        everyday: どのコースも教えない台湾：ドリンクスタンドでの注文、統一発票の抽選、部屋探し、診療所、台風休み
        corpus: 例文はどれも、台湾の誰かが実際に書いた文です。出典とライセンスも一緒に記録しています
        measured: 当て推量はひとつもありません。単語の頻度、難しさ、どのレベルに属するかは、すべて実際の台湾のコーパスを数えて出しています
        memory: どの画面の裏にも、学習記録はひとつだけ。リーダーで覚えた単語は、辞書にも練習にも書き取りにも反映されます
    isnt:
      heading: TaiwanCardsではないもの
      items:
        game: ゲームではありません。経験値もバッジもランキングもなく、アニメの動物が「明日も来てね」と罪悪感をあおることもありません
        machine: 華語の中身に、確認していないAIの生成物は使っていません。意味、例文、ラベルはすべて人の目を通っていて、どのフレーズも確かめられる出典にさかのぼれます。なお、この日本語版の文章は機械の助けを借りて作成したもので、現在も見直しを続けています
        decks: 作ったのが誰か、どの教科書からか、読みが台湾で正しいのかさえ誰にもわからない、共有デッキの山ではありません
        china: 中国のコースの字を繁体字に差し替えただけのものではありません。語彙も読みも、日常生活の半分も違うからです
        words: 中国のコースが〘自由〙、〘民主〙、〘人權〙に時間を割くことはあまりないでしょう。ここにはそうした単語がたっぷりあり、それが抜けているリストもありません
        course: 最初のレッスンから最後まで順番に受けるカリキュラムではありません。今いるところから始めて、必要なものを取り、いらないものは飛ばせます
        teacher: 先生の代わりではありません。これは授業と授業の間にやる半分、誰にも見られずにやる半分、そして上達できるかどうかを決める半分です
        hsk: HSK対策ではありません。たとえ繁体字で受験するとしても、語彙も読みも、言葉の背後にある世界も違います
        simplified: 簡体字はどこにもなく、表示に切り替えるスイッチもありません。辞書でも例文でも練習でも、あるのは台湾の側だけです
        ads: 広告収入には頼っていませんし、これからも頼りません。ちらつくものも割り込んでくるものもなく、勉強にも、ちょっとした調べものにも集中できます
        tracking: 利用者を監視しません。外部のアクセス解析も、どんな種類のトラッカーもありません。学習記録はいつでもファイルに書き出して、手元に保存できます
    counts:
      heading: すでにそろっているもの
      radicals: 康熙部首
      characters: 漢字
      words: 辞書の項目
      collocations: 成語とコロケーション
      sentences: 文と例文
    science:
      heading: 中身は計量言語学
      body: すべては測定に基づいています。コーパスでの頻度と分布、コロケーションの強さ、調整済みの難易度尺度、全音節の音響的な基準。見えているのは氷山の一角で、その下には何年もかけたデータの収集・測定・検証があり、独自のライブラリやデータセットは研究コミュニティに公開しています。すべてオープンです。知識はみんなのものだからです。
      points:
        corpus:
          title: 当て推量ではなく、測定
          body: レベル、難しさ、単語の並び順は、自分たちで構築し測定した台湾のコーパスから出しています。頻度、分布、コロケーションの強さ、文体。
        open:
          title: 誰でも確かめられる
          body: コーパスの集計表、音節の一覧、その裏のライブラリはデータセットとして公開し、このアプリもオープンソースです。出典とライセンスはすべてクレジットのページに載っています。
        linked:
          title: ひとつの場所で、すべてがつながる
          body: 字からその字を含む語へ、語から実際の文へ、文からその文法ポイントへ。そして出会ったものは何でも、そのままデッキに入れられます。
    quality:
      heading: 品質を支えるもの
      items:
        audio:
          title: 公式の録音
          body: 字と単語の音声は、台湾の教育部の辞典のために録音されたものです。合成音声でも、寄せ集めの投稿でもありません。
        sources:
          title: 台湾の出典
          body: 教育部の辞典、公式のレベル別語彙リストと頻度表、法令、各都市のニュース。
        human:
          title: どの項目にも人の目
          body: 華語の意味、例文、リンクはすべて人が読んで確認しています。日本語版の文章は機械の助けを借りて用意したもので、いまも見直しを続けています。
        written:
          title: 日本語話者のための独自版
          body: 英語版の直訳ではありません。説明は日本語の音や、すでに知っている漢字と音読みから出発し、日本語話者がつまずきやすいところを先回りして示します。
