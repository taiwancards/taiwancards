  licenses:
    moe_notice: "〘使用說明〙 — ライセンスの定めにより、公式の利用上の注意を全文掲載しています"
    title: ライセンスとクレジット
    intro: TaiwanCardsは、自由なライセンスで公開されたオープンな資源と、台湾の公式な言語データに感謝しつつ作られています。それぞれ出典とライセンスへのリンクを付けています。
    projects_title: わたしたち自身のオープンな成果
    projects_note: TaiwanCardsは、台湾華語についてのオープンな言語研究の積み重ねの上に成り立っています。データを作るコーパス処理の仕組み、データを台湾のものに保つための出自の分析、発音採点を支える信号処理ライブラリ、そして公開済みのデータセット。このアプリ自体も含め、すべてがオープンです。
    groups:
      app: アプリとデータの準備
      pipeline: コーパスの構築と出自の分析
      gems: 信号処理ライブラリ
      datasets: 公開データセット
    works:
      taiwancards: 学習アプリのすべて：Rails、インポーター、間隔反復、発音採点、模擬試験。隠しているものは何もありません。
      corpora: 辞書のもとになるすべての資料のダウンロード、処理、整形、調整、クリーニング、分析。
      twpipeline: 台湾華語のコーパス構築：生のクロールデータから、分かち書きと頻度情報の付いたコーパスまでの9段階のJSONL処理。
      twfilter: 出自の分析：文字の目録、正書法、語彙や文法のマーカーから、台湾華語を中国・香港・東南アジアの用法と見分けます。
      dsprb: 純粋なRubyで書いた音声信号処理：WAVのデコード、FFTパワースペクトル、MFCC、YINによるピッチ追跡。発音の採点に使っています。
      dtwrb: Sakoe-Chibaバンド付きの動的時間伸縮（DTW）と、DBAによる重心平均。録音をお手本の音の高さの動きと比べています。
      twngrams: 台湾華語コーパスから集計した単語と文字のn-gram頻度。パブリックドメインで公開。
      twsyllables: 注音、ピンイン、コーパス内での声調の分布を付けた音節の目録。
      twfilter_tables: twfilterが出自を判定するのに使う参照表：表記の対応、語彙のマーカー、文字の目録。
    open_source_title: オープンソース
    fonts_title: フォント
    fonts_note: 3つとも自前のサーバーから配信しています。そのうち2つは改変して配布しており、その旨を下に記しています。
    corpora_title: コーパスと辞書
    corpora_note: データベースにあるすべてのテキストコーパスと、それぞれのライセンスです。ここで公開しているのは、無料利用と商用利用の両方を許可している出典だけです。それ以外は統計にだけ使い、文は一切保存していません。
    data_title: 参照データ
    data_note: このアプリが土台にしている参照資料（レベル別リスト、筆画の一覧、漢字の標準、暦の表、分類の尺度）を公表している機関です。これらは創作物ではなく事実の一覧なので、ライセンスではなくクレジットとして記載しています。機関が特定のライセンスで公開している場合は、そのライセンスを明記しています。
    outro: 華語のコンテンツはすべて台湾の繁体字で書かれ、教育部の辞典と照合しています。名称、ブランド、教材の本文は、それぞれの権利者に帰属します。
    items:
      moe_audio: 漢字と単語の音声。台湾教育部による録音、データ版20260626。ファイルは改変せずに配信し、アプリは見出し語の部分だけを再生するようにしています。
      cc_cedict: 有志による中英辞典。読み、意味、繁体字と簡体字の対応。
      makemeahanzi: 筆順の図、部首への分解、漢字の成り立ち。
      hanzi_writer: 書き取り練習で使っている、一画ずつ書くためのエンジンとアニメーション。
      hanzilookup: 書いた筆画を漢字に変換する手書き認識。完全にオフラインで動きます。認識データ（mmah.json）はMake Me a Hanziの筆画データから作られているため、エンジン本体のMITではなく、そのプロジェクトのLGPL／Arphic PLの条件に従います。
      unihan: UnicodeのHanデータベース。標準的な読みと漢字の属性に加え、日本語版の土台になっている日本語の読み、新字体との対応、常用漢字・人名用漢字の一覧。© 1991–2026 Unicode, Inc.、Unicode License V3による。
      opencc: STCharactersの表。テキストを貼り付けたときに簡体字を繁体字に変換するのに使います。変換した箇所はすべて表示します。日本語の異体字表（JPVariants、JPShinjitaiCharacters）は、日本語版で台湾の字と日本の字形を対応づけるのに使っています。
      roboto: ラテン文字とピンインに使っているUIフォント。Googleから読み込まず自前で配信しているので、ページを開いても第三者にリクエストが送られることはありません。
      noto_sans_tc: 繁体字の標準フォント。こちらも自前で配信しています。
      tw_kai: 台湾独自の楷書体フォントで、〘數位發展部〙が公開している〘CNS11643 全字庫〙のものです。「手書き風」表示の書体で、サイトのロゴもこのフォントの〘臺〙の字形から描いています。配布しているのはサブセットです。ファイルはこのアプリで実際に使う文字だけに絞り、ロゴにはそこから取った字形を埋め込んでいるため、ここにあるのは原本ではなく改変版です。
      moe: 教育部の標準字体、常用字4808字、漢字の頻度。
      bopomofo_audio: 注音記号の録音。教育部の〘國語注音符號手冊〙オープン部品パッケージから取ったもので、別途CC BY 4.0で公開されています。2017 © 〘教育部,國語注音符號手冊-開放部件〙。
      tocfl: TOCFLの公式レベル別語彙リスト。
      naer: 国家教育研究院。TBCL基準、COCTコーパス、一般語彙頻度表。
      moe_strokes: 基本筆画と複合筆画の一覧のもとになっている、筆画名の規範リスト。
      moe_idioms: "〘成語〙の公式辞典。すべての成語について語義、古典の出典、由来の故事、用例を収録。原文は改変せず、そのまま表示しています（ライセンスで翻案が禁じられているため）。各言語版の訳と注は、このサイトが独自に書いたものです。"
      cwa: 雨量の階級、台風の強さの区分、紫外線指数の段階。
      tbrs: 台湾の品種の茶の分類、製茶工程、発酵度。
      hko: 祝祭日の日付を計算するための旧暦と二十四節気の表。
      xiaoxuetang: 古代の字形（甲骨文、金文、篆書）をトレースしたもの。パブリックドメインで公開。
  help:
    title: ヘルプ
    intro: このサイトでできることを、ざっと紹介します。辞書、レッスン、リストなどはみんなで共有していますが、学習状況は自分だけのものです。
    sections:
      search:
        title: 検索
        body: 上の検索ボックスで、すべてをまとめて検索できます。意味、ピンイン（声調はあってもなくても、xiao3のような数字でも）、注音、さらには打ち間違えた漢字でもかまいません。結果は近い順に並び、いちばん近いものが先頭に来ます。
      study:
        title: デッキと学習
        body: デッキは、いま学習中のカードの山です。カードを追加すると、「学習」で間隔反復（FSRS）が始まります。スワイプで自己評価しましょう。カードは、ちょうど忘れかけるタイミングで戻ってきます。
      dictionary:
        title: 辞書
        body: 漢字、単語、例文、コロケーション、量詞、部首を見られます。どの項目にも、読み（注音＋ピンイン）、意味、そしてどれだけ覚えているかが表示されます。
      tocfl:
        title: TOCFL
        body: レベル別の公式語彙リストです。各バンドへの到達度を確かめ、どのレベルでも直接学習できます。
      pronunciation:
        title: スピーキング
        body: マイクに向かって単語を言うと、音節ごとに声調と音のフィードバックが返ってきます。オートモードでは、正しく言えたら次へ進み、言えるまでマイクを開いたままにします。
      writing:
        title: 書き取りと手書き検索
        body: 書き取りでは、意味と読みから漢字を一字ずつ書きます。手書き検索は書いた字を認識し、倉頡（そうけつ）入力ではコードを練習します。
      history:
        title: 学習履歴と統計
        body: 学習履歴は最近のタイムラインで、何を学び、どれだけ定着しているかがわかります。統計では、記憶の保持率、学習量、苦手なところの推移を見られます。
      profile:
        title: プロフィールとバックアップ
        body: 名前を変えたり、学習状況をすべてファイルに書き出したりできます。データベースを作り直したあとにそのファイルを読み込めば、中断したところからそのまま再開できます。
