      classes: 今のレベルは？
    level_hint:
      tocfl: これから受けるレベルではありません。それは試験プランで選びます。
      guided: 新しい単語はひとつ上のレベルから始まります。
      classes: 参考までに伺っています。飛ばしてもかまいません。
    scale:
      guide: 自分のレベルの見分け方
      zero:
        title: ゼロから
        short: ほとんどの人はここから
        body: 準備級1（Novice 1）より前。勉強したことがない、または一言二言だけ知っている。ほとんどの人はここから始めます。
      hsk: "≈ HSK %{level}"
      items: "≈ 語と字 %{count}個"
      can:
        "1": あいさつ、自己紹介、数字・時刻・値段のやりとりができる。
        "2": 自分や家族、食べ物、買い物について短いフレーズで話せる。
        "3": 交通機関、お店、カフェなど、毎日の生活に困らず、簡単なお知らせが読める。
        "4": 仕事、勉強、予定について話せる。ゆっくりした話や簡単な文章が理解できる。
        "5": 身近な話題について話し合え、わかりやすい記事が読め、たいていの会話についていける。
        "6": 自由に話せ、ニュースが読め、字幕付きで映画が見られる。
        "7": 華語で仕事や勉強ができ、複雑な文章や専門的な文章が読める。
      unknown:
        test:
          title: わからない
          chip: テストを受ける
          body: 短いレベル診断テストで、どこから始めればいいかがわかります。
        skip:
          title: スキップ
          chip: あとで設定
          body: レベルはあとからプロフィールで設定できます。
    known_question: すでに知っているものはありますか？
    known:
      zero:
        title: まだ何も
        body: まっさらな状態から始めます。
      phonetics:
        title: ピンイン
        body: ピンインは読めるけれど、注音は初めて。
      zhuyin:
        title: 注音
        body: 注音は読めるけれど、単語はほとんど知らない。
    limits:
      heading: できること、できないこと
      body: このアプリは読み方と書き方を説明し、注音とピンインを示し、次に何を学ぶかを決めます。好きな単語や文章を何でも取り込んで練習し、学習状況を見ながら、発音、声調、語彙を磨けます。
      gap: ただし、発音はネイティブの先生と一緒に身につけるのがいちばんで、ここにあるものは本物の授業の代わりにはなりません。ここでできるのは、声調と発音のチェック、リスニング練習、そして音声付きのTOCFL公式模試です。生の会話や、ほかの人と話す練習はありません。このアプリはそれを目指していません。先生の代わりではなく、先生の右腕だと考えてください。
    path:
      done_cta: ホーム画面とカードへ →
      back: "← ステップ一覧に戻る"
      title: 学習ルート
      lede: おすすめの順番です。アプリを使うと自動でチェックが付きますが、自分でチェックすることもできます。
      counter: "%{done}／%{total}完了"
      optional: 任意
      now: 今ここ
      open: 開く
      mark_done: 完了にする
      undo: 完了を取り消す
      progress: 復習 %{done}／%{target}回
      kinds:
        theory: 解説
        practice: 練習
      done_heading: ルート完了
      done_body: 基礎ができました。最初のカードが待っています。ここから先は、何をどの順番で見せるかをアプリが決めます。
      after_heading: この先は
      after_body: 基礎ができたら、何を見せるかはアプリが決めます。まずレベル、同じレベルの中では頻度の順です。ほかは必要に応じてどうぞ。リーダー、発音、手書き、そしてどんな文章からでも作れる自分のデッキ。
      change: 開始レベルを変更
      steps:
        hanzi:
          title: 漢字のしくみ
          body: 字をまとめて覚え始める前に、字が何でできているかを見ておくと得をします。部首が意味を、音符が音を担い、筆順の決まりはどの字にも共通です。漢字に慣れている日本語話者でも、繁体字の部品を見直しておくと、日本の字との違いがすっと頭に入ります。
        course:
          title: コースの最初のレッスン
          body: ここからは、ばらばらの単語よりレッスンに沿って進むほうが楽です。どのレッスンも台北の暮らしの会話で、下に語彙と文法、理解を確かめる練習問題が付いています。ボタンひとつでレッスンをデッキにできます。最初のレッスンを終えると、このステップは完了です。
        zhuyin_theory:
          title: 音のしくみ
          body: まず音節が何でできているかを見ましょう。何で始まり、何で終わり、声調が何をしているか。記号はグループに分かれていて、グループごとに、そのグループだけを練習するボタンがあります。
        tones_theory:
          title: 声調のしくみ
          body: 4つの声調と軽声、そして中国の教科書が書かない台湾の細かい点。第三声はふつう低いままで、最後はほとんど上がりません。また〘一〙と〘不〙は、うしろに来る音によって声調が変わります。読んだら、同じページからそのまま練習に進めます。
        tones:
          title: 4つの声調を聞き分ける
          body: 台湾の声調は、中国の教科書どおりではありません。第三声はふつう低いままで、最後はほとんど上がりません。すべての音節のスタジオ録音で、男性と女性の声を交互に聞いて練習します。
        phrases:
          title: 実際に使われる言い方を覚える
          body: 台湾での1日を乗り切るための文型です。聞き取れれば十分な半分、つまりレジで店員に聞かれることも含みます。
        bridge:
          title: ピンインから注音へ
          body: 音はもう知っているはずです。ここではその音を、台湾で使う記号に結びつけ、落とし穴を示します。空韻、yとw、省略して書く韻母iu・ui・un。
        readings:
          title: 台湾の読み方に直す
          body: 台湾では中国と読み方が違う単語や、教科書が軽声にしているところを台湾では本来の声調で読む単語です。
        placement:
          title: レベル診断テスト
          body: リスニング、声調、漢字、語彙、文をまたぐ短いアダプティブテストです。開始レベルを決め、すでに知っているものを習得済みにします。
        zhuyin:
          title: 注音（〘ㄅㄆㄇㄈ〙）
          body: 台湾の発音表記で、記号37個と声調記号4つです。ピンインがあるのに、最初は余計な手間に見えるかもしれません。でも台湾の辞書や教科書で読み方を示すのは注音で、このサイトでの入力も注音です。台湾のふりがなだと思って一度覚えれば、あとはずっと楽になります。
        drill:
          title: 音を聞き分ける
          body: 声母、韻母、声調を、考えずにわかるようになるまで練習します。1回終えればこのステップは完了ですが、何度でも戻ってくる価値があります。
        typing:
          title: 注音で入力する
          body: 台湾のキーボードに印字されている配列そのものです。これがないとメッセージも検索語も打てません。単語を10個正しく入力すると、このステップは完了です。
        first_cards:
          title: 最初の字と語
          body: 字はあと回しにせず、すぐに始めます。いちばんよく使う字からです。20回復習すれば、このステップは完了です。
        plan:
          title: 試験に向けたプラン
          body: TOCFLを受けるなら、レベルと日付を決めれば、アプリが1日のノルマを計算します。受けないなら飛ばしてください。
  notices:
