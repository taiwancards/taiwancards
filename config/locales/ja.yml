---
ja:
  audio:
    play: 再生
    source_whole: 教育部 — 単語まるごとの録音
  privacy_google:
    heading: Googleでのログインとデータの扱い
    body: アカウントはGoogleでログインすると作成されます。別途の会員登録やパスワードはありません。
    signin: Googleでログインすると、TaiwanCardsはメールアドレスとプロフィールの名前を受け取ります。これらはアカウントの作成と、学習状況をアカウントにひも付けるために使います。
    drive: "「Googleドライブにバックアップ」ボタンを別途押した場合に限り、アプリはドライブに学習状況のバックアップファイルを1つ作成し、そのファイルだけを読み込み・上書きできます。"
    limits: アクセス範囲はdrive.fileスコープに限られ、アプリが自分で作成したファイルにしか触れられません。TaiwanCardsがドライブ内のほかのファイルを見たり開いたりすることはできません。バックアップは自動では作られず、ボタンを押したときだけ作成されます。
    privacy: プライバシーポリシー
    terms: 利用規約
    policy_before: Google APIから受け取った情報の利用は、
    policy_name: Google APIサービスのユーザーデータに関するポリシー
    policy_after: "（限定使用の要件を含む）に従います。Googleアカウントのデータを広告に使うこと、販売すること、ここに記載した範囲を超えて共有することは一切ありません。"
  privacy:
    title: プライバシーポリシー
    effective: 施行日：2026年11月24日
    purpose:
      heading: このアプリについて
      body: TaiwanCardsは、台湾華語を学ぶための無料・広告なしのウェブアプリです。間隔反復のフラッシュカード、辞書検索、発音練習、単語リストを提供しています。運営は企業ではなく、個人の開発者1名です。
    stored:
      heading: 保存する情報
      items:
        - メールアドレス、表示名、表示言語。
        - パスワードは保存しません。アカウントはGoogleを通じて作成され、アプリがパスワードを尋ねることはありません。
        - 学習データ：デッキ、カード、復習履歴、学習状況、練習の設定。
        - 発音練習の録音と、そこから得た測定値。
        - リクエストのサーバーログ。安定運用と不正利用の防止のために保管します。
        - 1日ごとのページ閲覧数の集計：ページ、参照元サイト、端末の種類、国、表示言語。アプリ自身が集計しており、Cookie、IPアドレスは使わず、アカウントとのひも付けもありません。
    never:
      heading: 行わないこと
      items:
        - 個人データを販売したり、貸し出したりしません。
        - 広告を表示せず、広告用のトラッカーも使いません。
        - 第三者のアクセス解析ツールは使いません。
        - 本人の学習状況を表示する以外の目的で、プロファイリングは行いません。
    cookies:
      heading: Cookie
      body: Cookieは2つだけで、どちらも動作に不可欠なものです。ログイン状態を保つ署名付きのセッションCookieと、表示言語を覚えておくCookieです。広告やトラッキング用のCookieはありません。
    emails:
      heading: メール
      items:
        - アプリの新機能などを短くまとめたお知らせを、アカウントのメールアドレスに多くても月1〜2回お送りします。広告や第三者からの内容は含みません。
        - 復習のリマインダー：カードが待っているときだけ、いつも学習している時間帯に、多くても1日1通お送りします。初期設定ではオンで、ワンクリックまたはプロフィールから、お知らせメールとは別にオフにできます。
        - すべてのメールにワンクリックの配信停止リンクがあり、プロフィールからもオフにできます。配信を停止しても、アカウントのほかの部分には何の影響もありません。
        - 各メールの送信日時、メール内のリンクから初めてアプリに戻った日時とその回数、配信停止の日時を記録します。メールが届かなかった場合は、メールサーバーのエラーメッセージを保管します。開封は追跡しません。メールにトラッキングピクセルは含まれず、画像はメール本体に添付されています。
        - メールはメール配信サービスのResendに渡されます。Resendが受け取るのはメールアドレスとメッセージだけで、配信のためにのみ使われます。
    donation:
      heading: 寄付ボタン
      body: "「サイトを応援する」ページには、外部サービスBuy Me a Coffeeへの通常のリンクがあります。リンクを開くまで外部からは何も読み込まれず、アカウントのデータも送信されません。寄付は任意です。"
    where:
      heading: データの保管場所
      body: アプリとデータベースは、シンガポールにあるRenderのサーバーで動いています。通信はCloudflareを経由し、音声ファイルはCloudflare R2から配信されます。お知らせメールは米国企業Resendの日本にあるサーバーから送信されます。これらの事業者がデータを扱うのは、サービスの運用とメール配信のためだけです。Googleドライブへのバックアップを使う場合、そのコピーはご自身のGoogleアカウント内に保存されます。
    retention:
      heading: 保管期間と削除
      body: データはアカウントがある間保管されます。アカウントとその中のすべてのデータは、プロフィール → バックアップ → アカウントを削除 からいつでもご自身で削除できます。下記のアドレスにご連絡いただければ、こちらで削除することもできます。サーバーログは一定期間で自動的に消えます。アカウントを削除すると、上記のメールの記録は統計のために残りますが、個人につながる情報はすべて取り除かれます。メールアドレスとアカウントとの結びつきは削除され、届かなかったメールはメールサーバーのメッセージを消してエラーの種類だけを残し、リマインダーの予定は曜日と時刻だけを残してタイムゾーンを消します。残るのは、日時、どのメールで何枚のカードを提案したか、そのメールがどうなったか（送信、不達、リンクのクリック、配信停止など）、クリックされたリンクがどのページを開いたかです。ここでアカウントを削除しても、ご自身のGoogleドライブに作成したバックアップファイルは削除されません。そのファイルはご自身で削除してください。
    choices:
      heading: ご自身でできること
      items:
        - 辞書、文法、各種資料、台湾に関するページは、アカウントなしでも読めます。
        - Googleアカウントの権限ページから、アプリのGoogleへのアクセスをいつでも取り消せます。
        - データのコピー、訂正、完全な削除を依頼できます。
    children:
      heading: お子さまについて
      body: このアプリは13歳未満のお子さまを対象としておらず、13歳未満と知りながらアカウントを作成することはありません。
    changes:
      heading: 変更について
      body: このポリシーを変更した場合は、上記の施行日も更新します。
    contact:
      heading: お問い合わせ
      body: ご質問、データに関するご依頼、削除のご依頼はこちらへ：
    related:
      heading: 関連リンク
  terms:
    title: 利用規約
    effective: 施行日：2025年3月1日
    service:
      heading: サービスについて
      body: TaiwanCardsは台湾華語を学ぶためのウェブアプリで、個人の開発者1名が運営しています。無料で利用でき、広告はなく、現状のまま提供されます。機能は変更または削除されることがあります。
    account:
      heading: アカウント
      items:
        - アカウント情報は正確に登録し、ログイン情報は他人に教えないでください。
        - 1つのアカウントは1人で使ってください。ご自身のアカウントで行われたことには、ご自身が責任を負います。
        - 下記のアドレスにご連絡いただければ、いつでもアカウントを削除できます。
    use:
      heading: 禁止事項
      items:
        - 権限のないデータ、システム、他人のアカウントにアクセスしようとしないでください。
        - サイトを大量にスクレイピングしたり、通常の学習の範囲を超える自動アクセスで負荷をかけたりしないでください。
        - 違法なコンテンツや悪意のあるコンテンツをアップロードしないでください。
        - ライセンスページに記載している辞書、コーパス、フォントのライセンスを守ってください。
    yours:
      heading: ご自身が作成したもの
      body: 作成したデッキ、メモ、学習状況はご自身のものです。こちらに許諾いただくのは、それらを保存して本人に表示するために必要な範囲だけです。学習状況はいつでもエクスポートでき、ご自身のGoogleドライブにも保存できます。
    ours:
      heading: 当サイトが使用するもの
      body: アプリのコードとオリジナルの文章の権利は作者にあります。辞書、コーパス、音声、フォントは第三者のもので、それぞれのライセンスに基づいて使用しており、ライセンスページに一つずつ記載しています。この規約は、これらのライセンスを超えて第三者の素材に関する権利を付与するものではありません。
    availability:
      heading: 提供について
      body: 本サービスは「現状のまま」かつ「提供可能な範囲で」提供されます。中断なく動作することも、言語データに誤りがないことも保証しません。本サービスは学習の補助ツールであり、言語に関する権威ある典拠ではありません。
    suspension:
      heading: 利用停止
      body: この規約に違反したアカウントや、サービスを危険にさらすアカウントは、停止または削除することがあります。
    liability:
      heading: 免責
      body: 法律で認められる最大の範囲で、開発者は本サービスの利用によって生じた間接的、付随的、結果的な損害について責任を負いません。
    changes:
      heading: 変更について
      body: この規約は更新されることがあります。更新した場合は上記の施行日も変わり、その日以降も利用を続けることで、改定後の規約に同意したものとみなされます。
    contact:
      heading: お問い合わせ
      body: この規約に関するご質問はこちらへ：
    related:
      heading: 関連リンク
