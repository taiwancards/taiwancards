  practice:
    about_title: 注音の成り立ち
    about:
      origin: 記号のもとを考案したのは章炳麟で、その音を読みに含む古い漢字の形を整えて作りました。〘ㄅ〙〘ㄆ〙〘ㄇ〙が漢字のように見えるのはそのためで、もとは本当に漢字だったのです。カタカナが漢字の一部から生まれたのとよく似ています。
      adopted: 台湾では1945年からこの方式を使っていて、いまも小学校で華語の発音を教える中心的な方法です。
      size: 37の記号と5つの声調記号があれば、華語のどんな音でも書けます。第一声はふつう記号を付けず、軽声は点で表します。
      today: いまの台湾では、パソコンやスマホで漢字を入力するのも、辞書で引くのも、注音がいちばん一般的です。教科書では、日本のふりがなのように各文字の右側に添えて印刷されています（横書きでは文字の上に付けることも公式の手引きで認められています）。
      hokkien: "台湾語のためには、さらに23の記号が作られました。同じ方式を台湾のほかの言語にも広げたものです。"
    practice_now:
      title: すぐに練習しよう
      initials: 21の声母を、発音する場所ごとのブロックで。耳で聞いて迷わず答えられるようになったら、先に進みましょう。
      finals: 16の韻母。同じドリルで、画面にアルファベットは出ません。
      tricky: ピンインが実際の韻母を隠している6つのつづり。似た形と混ぜて出題するので、注音を読んでいるのかアルファベットを読んでいるのかがわかります。
