  glossary:
    fsrs: 間隔反復のアルゴリズム。自分でつけた評価から、カードを忘れかけるタイミングを予測し、ちょうどそのときに出題します。
    tocfl: 台湾の国家試験である華語文能力測験（TOCFL）と、そのレベル体系。準備級からBand Cまであります。
    tbcl: 台湾華語文能力基準（TBCL）。第二言語としての華語教育のために台湾が定めた、7段階の国家基準です。
    zhuyin: 台湾の発音記号〘ㄅㄆㄇㄈ〙（注音符号、ボポモフォ）。台湾の子どもはピンインではなく注音で読み方を学び、スマホやパソコンの文字入力にも使われています。
    pinyin: 華語の音節をローマ字で書き表す方式。中国では中心的に使われますが、台湾では補助的な役割にとどまります。
    putonghua: 中国で標準とされている共通語。
    hokkien: 台湾語（台語）。台湾の人口の大きな割合が話すビン南語系の言語で、華語の方言ではなく、独立した別の言語です。
    hanzi: 台湾・香港・マカオで使われている、省略しない字体の漢字。中国で使われている簡体字に対して言います。
  locales:
    en: English
    ru: Русский
    vi: Tiếng Việt
    de: Deutsch
    id: Bahasa Indonesia
    ja: 日本語
  language_step:
    heading: アプリとレッスンの言語を選んでください
    edition: 他の言語版をそのまま訳したものではなく、日本語話者のために作った独自の版です。発音、文法、文化まで、台湾華語を日本語話者の目線で解説します。
    later: あとでメニューから変更できます。
