    lunar:
      title: 旧暦のしくみ
      months_html: "<p>旧暦の1か月は新月の日に始まり、次の新月まで続きます。その長さは約29.53日なので、1か月は<strong>29</strong>日か<strong>30</strong>日のどちらかです。31日の月はなく、暗記できる決まった長さもありません。12か月で約354日となり、太陽の1年より11日ほど短くなります。</p><p>この差がすべての出発点です。何も手を打たなければ、新年は季節をさかのぼってずれていき、いずれ〘春節〙が夏に来てしまいます。</p>"
      days_html: "<p>旧暦の日付は数字だけでは書きません。最初の10日は<strong>〘初〙</strong>を付けて〘初一〙、〘初二〙、〘初三〙…〘初十〙。11日から19日は〘十〙を使って〘十一〙、〘十二〙…〘十九〙、20日は〘二十〙です。21日からは<strong>〘廿〙</strong>を付けて〘廿一〙、〘廿二〙…〘廿九〙となり、30日ある月は〘三十〙で終わります。</p><p>つまり<strong>〘初五〙</strong>は単に「その月の5日」のことです。〘正月初五〙と言えば旧暦1月5日のことで、年は付かず、新暦の日付も意味しません。</p>"
      drift_html: "<p>だから〘春節〙は、2年続けて新暦の同じ日になることがありません。旧暦の1年は太陽の1年より11日ほど短いため、新年は毎年少しずつ早まります。早まりすぎると丸1か月が挿入され、また遅い日付に戻ります。1950年から2050年の間では、1月21日から2月20日の範囲を行き来します。</p>"
      leap_html: "<p>このずれを直すのが<strong>うるう月</strong>、〘閏月〙です。19年に7回ほど1か月が追加され、その年は13か月、約384日になります。年末に付け足すのではなく、既存の月のあとに入り、その月の番号を引き継ぎます。6月のあとに入るうるう月は〘閏六月〙で、その年には〘六月〙と〘閏六月〙の両方があります。</p><p>どの月が重なるかは、唱えて覚えられる決まりではなく太陽で決まります。二十四節気がどこに来るかしだいです。2025年には〘閏六月〙があり、2033年には珍しい〘閏十一月〙があります。</p>"
      terms_html: "<p>ここにある行事のうち2つは、そもそも旧暦の行事ではありません。<strong>〘清明〙</strong>と<strong>〘冬至〙</strong>は<em>二十四節気</em>、つまり太陽の1年の通り道の上の点です。旧暦の行事が新暦の上を動き回るなか、この2つがほとんど同じ日にとどまるのはそのためです。</p>"
    minguo:
      title: "〘民國〙紀年の換算"
      gregorian: 西暦
      minguo: "〘民國〙紀年"
      note: 西暦%{gregorian}年は〘民國〙%{minguo}年です。
      before: "〘民國〙紀年は1912年に始まるため、この年には〘民國〙の年数がありません。"
      explain_html: "<p>台湾の公文書は<strong>〘民國〙</strong>紀年で日付を書きます。中華民国が建国された<strong>1912年</strong>を〘民國〙元年とする数え方で、計算は<strong>〘民國〙＝西暦−1911</strong>だけ。逆算も同じです。身分証、列車の切符、レシート、契約書、賞味期限などで目にし、ふつうは2025年ではなく114.09.28のように書かれます。和暦に慣れている人には、元号の感覚で読めるはずです。</p>"
    converter:
      title: 旧暦⇔新暦 日付換算
      to_gregorian: 旧暦 → 新暦
      to_lunar: 新暦 → 旧暦
      lunar_year: 旧暦の年
      lunar_month: 月
      lunar_day: 日
      date: 日付
      gregorian_result: "%{date}（%{weekday}）"
      lunar_result: "%{year} %{month}%{day}"
      out_of_range: 対応している範囲外です。
      bounds: 対応範囲は%{from}〜%{to}です。換算表は香港天文台の「新暦・旧暦対照表」をもとにしており、すべての日付をその出典と照合しています。
  page_help:
    word_pairs_html: "<p>日本語なら同じ一語で済んでしまうために混同しやすい、2〜3語の組み合わせを集めました。「できる」にあたる〘會〙・〘能〙・〘可以〙、「〜ない」にあたる〘不〙と〘沒〙、「また」にあたる〘再〙と〘又〙などです。まずルール、次にそれぞれの単語の例文、最後によくある間違いを紹介します。</p><p>下の練習問題は記録されません。答えるとすぐに、なぜその単語が正しいのかがわかります。これらの単語の辞書ページからも、それぞれのセットに移動できます。</p>"
    dictation_html: "<p>本物の録音を聞いて、聞こえたとおりに書き取ります。声はすべて台湾のネイティブスピーカーで、文は語彙のレベル順に並んでいます。1がいちばんやさしいレベルです。</p><p>何度でも聞き直せます。速すぎるときは、横のボタンで速度を落としましょう。どうしても聞き取れないときは、訳を表示すると意味がわかります。</p><p>注音はこの画面で直接入力できます。〘ㄅㄆㄇ〙をオンにして、台湾の注音配列のキーか画面上のボタンを押してください。声調は6・3・4・7のキーで、第一声には何も付けません。</p>"
    desk_html: "<p>ホーム画面の内容は、選んだモードによって変わります。<strong>TOCFL</strong>では試験までのカウントダウン、レベル別の到達度、模擬試験、そのレベルの文法。<strong>自分の単語</strong>では自作デッキの復習と、授業で習った単語をさっと追加する入口。<strong>おすすめの順番</strong>では発音かコースの次のステップと、その日のカード。モードはプロフィールか、見出しの横の「変更」から切り替えられます。</p><p>数字の見方：<strong>今日の復習</strong>はFSRSのスケジュールで今日出てきたカードの数、<strong>新しいカード</strong>はそれに加えてアプリが出してもよいと判断した未学習の量です（上限は学習プランから、プランがなければ設定から決まります）。<strong>学習中</strong>は出題の対象になっているカードの総数です。大きなボタンを押せば、いつでもいちばん自然な続きに進めます。</p>"
    progress_html: "<p><strong>連続記録</strong>は、復習した日が何日続いているかです。1日の区切りは端末のタイムゾーンの0時から0時まで。旅行中でも、すでに数えた日はそのまま残ります。30日続くと2日までの中断では記録が途切れなくなり、お休みなしで90日続くと4日までの中断が許されます。お休みの日は日数に加算されず、お休みを使うと次のお休みまでのカウントは最初からになります。<strong>定着率</strong>は、FSRSが復習どきと判断したカードのうち「わかった」以上で答えた割合です。設定の目標値を大きく下回っているなら、間隔が長すぎるということです。</p><p>カードの状態：<strong>未学習</strong>はまだ一度も出ていないもの、<strong>学習中</strong>は学習ステップの途中のもの、<strong>定着途中</strong>は間隔が3週間未満のもの、<strong>定着</strong>は3週間以上のものです。<strong>苦手カード</strong>は何度も忘れてしまうカードで、スケジュールに任せて回し続けるより、手で覚え直したほうが早く済みます。</p>"
    plan_html: "<p>目標のTOCFLレベルと期日を決めると、その日までにレベルを終えるには1日にどれだけ新しく学べばよいかを計算します。1日のノルマはすでに覚えた量から毎日計算し直すので、1日休んでもプランは崩れず、ノルマが少し増えるだけです。</p><p>ノルマが現実的でない量になると、オレンジ色で表示されます。その期日ではレベルを終えられないので、期日を延ばすか、目標をひとつ下のレベルにしましょう。</p>"
    cangjie_lessons_html: "<p>〘倉頡〙は、繁体字を音ではなく形で入力する台湾の入力方式です。字を目に見える部品に分け、部品ひとつをアルファベットのキーひとつで打ちます。この教科書は第5世代（〘倉頡五代〙）だけを扱い、Cangjie 3や簡易版のCangjieは扱いません。</p><p>構成は次のとおりです。まずコードの組み立て方を4レッスン、次に26個のキーを1レッスンずつ、そのあと分解のルールと例外の一覧。最後は台湾独自の字と、準備級（Novice 1・2）の字すべてで締めくくります。</p><p>どのレッスンにも練習が付いています。形からキーを答える、字の最初のキーを答える、正しい分け方を選ぶ、コードを全部打つ、の4種類です。自由に打つ練習は別にあり、「練習」の中の<strong>〘倉頡〙トレーナー</strong>でできます。</p>"
    names_html: "<p>このセクションでは、台湾人の名前がどう組み立てられているかを説明し、戸籍の記録から数えた、台湾で実際に使われている名前を紹介します。名前を作ってあげることはしません。名前選びは個人的なことで、ふつうは台湾の友人や先生と一緒に決めるものだからです。</p><p><strong>姓</strong>は1文字で、親から受け継ぎ、名の前に書きます。2文字の姓もありますが、まれです。<strong>名</strong>は家族が選ぶ1〜2文字で、2文字がふつうです。順番は変わりません。パスポートの表記がどうであれ、華語では姓が前に来ます。相手から別の呼び方を勧められるまでは、姓に肩書きを付けて呼びましょう。</p><p>「名前を選ぶ」タブでは、2つ目のタブと同じ集計をもとに字を順位づけします。世代ごとの使用頻度、声調の組み合わせ、2字の結びつきの強さ、画数です。理由付きで5つの候補を出すので、候補を絞るときに具体的に話し合えます。</p>"
    desks_html: "<p>デッキは、貼り付けたものから作れます。1行に1語のリストでも、カンマ区切りでも、ふつうの文章でもかまいません。システムが判断します。ファイルをアップロードしたり、歌詞から単語を取り出したりもできます。</p><p>Ankiとのいちばんの違いは、<strong>訳を入力する必要がまったくない</strong>ことです。読み、意味、字の分解、音声はすべてこのサイトの辞書から入ります。用意するのは単語だけです。</p><p>デッキを作る前にプレビューが表示されます。カードが何枚できるか、どれが重複していたか、どれが辞書にないか。単語はやさしい順に並びます。リストをもう全部知っているなら、ボタンひとつで新しいカードの列ではなく、間隔の長い復習に回せます。</p>"
    hanzi_html: このページでは字を部品に分解し、その部品をどう活かすかを示します。意符は意味の分野を、音符はおおよその読みを教えてくれます。このサイトのデータでは、音符から韻母が当たるのは5回に4回ほど。知らない字でも、最初の推測で読めることがよくあります。セクションはひとつずつ開いてみてください。
    triage_html: "<p>ある程度わかっている人が、自分の位置をすばやく確かめるための機能です。知っている字なら右に、自信がなければ左にスワイプしてください。</p><p><strong>知ってる</strong>を選ぶと、その項目は先の復習に回ります。だいたい3週間後以降で、1日に集中しないよう分散されます。完全に消えてしまうものはありません。</p><p><strong>自信がない</strong>を選ぶと、ほかの項目と同じふつうの順番で出てきます。</p><p>実際に学習したことのある項目は、この仕分けの対象外で、何も変わりません。</p>"
    zhuyin_trainer_html: "<p>ここでは注音を、ローマ字に頼らずひとつの文字体系として覚えます。音を聞いて記号を選ぶ練習で、画面にはあえてピンインを出しません。出してしまうと、身につくのは「〘ㄅ〙＝この音」ではなく「〘ㄅ〙＝アルファベットのb」になってしまうからです。</p><p>記号は表の順ではなく、調音位置ごとのブロックで出てきます。前のブロックを終えると次のブロックが開きます。選択肢はあえて紛らわしくしてあります。形の似た記号や、同じ調音位置の音です。でたらめな選択肢では、上達したような錯覚しか生まれません。</p><p>3回続けて、しかもすばやく正解すると、その記号は習得したことになります。正解でも時間がかかるのは、見てわかっているのではなく考えて解いているということなので、カウントは進みません。いつでも途中でやめられます。</p>"
    numbers_html: "<p>数字に必要な漢字はほんの少しで、どれも欠かせません。ただ、つまずくのは字よりも桁のほうです。</p><p>華語の数は4桁ごとに区切ります。〘萬〙が1万で、それより大きい数はすべてその上に積み上がります。だから100万は〘一百萬〙、10億は〘十億〙。この区切り方は日本語と同じなので、日本語話者には心強いところです。ただし〘一百萬〙のように、〘百〙の前にも〘一〙を付けるのが日本語との違いです。下の5つのセクションは字から始まって落とし穴まで進み、最後は台湾のあらゆる書類に出てくる〘民國〙紀年を扱います。</p>"
    practice_phonetics_html: "<p><strong>注音</strong>（〘ㄅㄆㄇㄈ〙、ボポモフォとも呼ばれます）は発音記号です。記号は37個で、どれも華語の音ひとつに対応し、それに声調記号が加わります。記号そのものには意味がないので、思い込みで読み間違えることもありません。台湾の辞書や学校の教科書で読み方を示すのに使われ、このサイトでの入力にも使います。</p><p><strong>ピンイン</strong>は正書法、つまり同じ音を独自のルールでラテン文字を使って書く方法です。そのルールは正確さより簡潔さを優先して作られています。1つの文字が別々の音を表したり、綴りから母音が抜け落ちたりします。便利な補助ですが、ローマ字読みした瞬間に間違えます。</p><p>下の表では、まず<strong>アンカー</strong>、つまり「まずはこう言ってみる」という一行が来ます。次に調音、つまり口や舌がどう動くか。各行の最後のオレンジ色の部分が、避けたい間違いです。</p>"
    roadmap_html: "<p>ゼロから始める人のための、このアプリのおすすめの進め方です。必須のものはありません。どれもメニューから開けます。</p><p>練習とつながっているステップは自動でチェックが付きます。音の練習を1回終えたら、単語を10個正しく入力したら、復習を20回したら、という具合です。それ以外は、次に進めそうだと感じたら自分でチェックしてください。</p><p>任意のステップは飛ばしてもかまいません。それがなくても、ルートは完了したことになります。</p>"
    label: このページの使い方
    typing_html: "<p>ここに表示されているのは台湾の注音キー配列です。台湾で売られているキーボードに印字されていて、台湾のほとんどの人が使っています。インストールは不要で、同じキーを押せば注音が出ます。</p><p>表示された単語の読みを入力し、スペースかEnterで答え合わせします。声調キーは6（〘ˊ〙）、3（〘ˇ〙）、4（〘ˋ〙）、7（〘˙〙）。第一声の音節には声調キーはいりません。</p><p>単語は辞書から学習順に出てくるので、読みと入力を同時に練習できます。</p>"
    reader_html: "<p>辞書を組み込んだ状態で、本物の華語を読めます。すでに知っている単語は薄く表示され、新しい単語はレベルごとの色と下線付きで、上に読みが表示されます。</p><p>単語をタップすると、辞書の全項目と音声、学習を始めるボタンが出ます。文章全体をワンクリックでデッキにすることもできます。</p><p>好きな文章を貼り付けたり、歌詞を取り込んだりできます。簡体字は必ず先に繁体字に変換されます。</p>"
    placement_html: "<p>5分ほどでレベルを判定するアダプティブテストです。終わると、そのレベル以下をすべて習得済みにするか提案します。</p><p>正解が続くと問題が難しくなり、間違えるとやさしくなります。判定はあえて大まかにしてあり、適用する前に結果画面で調整できます。</p><p>習得済みにしても心配はいりません。すでに学習中のものは進み具合がそのまま残り、追加された項目はこの先数週間に分散されるので、復習が一度に押し寄せることはありません。</p>"
    phrases_html: "<p>単語ではなく、ひとまとまりの発話です。どのカードも空欄のある文型になっていて、空欄は辞書から埋めます。だから一行でドリンクスタンドの注文が百通りこなせます。</p><p><strong>相手のセリフ</strong>のカードは、どのフレーズ集にも載っていない半分、つまりカウンターで店員から次々に飛んでくる質問です。完璧な文を言えることより、こちらを聞き取れることのほうが大切です。</p><p>中国の言い方でも通じるけれど外から来た表現に聞こえる場合は、台湾の言い方を示し、もう一方には取り消し線を引いています。</p>"
    everyday_html: "<p>どの試験の語彙リストにも入っていない、台湾ならではの語彙です。ドリンク注文の略語、台湾語から来たスラング、中国とは違う台湾の言い方など。</p><p>生活の場面や単語の由来で絞り込めます。きつい言葉と表示されているものは、本当にきつい言葉です。中国に対応する単語がある場合は並べて示すので、ひとつの形を暗記するのではなく、違いを見比べられます。</p>"
    variants_html: "<p>台湾が中国、香港、シンガポールと分かれるところを集めました。単語の読み方、書く字、そもそもどの単語を選ぶか、の違いです。</p><p>こうした違いで、華語をどこで学んだかがわかってしまいます。議論のあるものや最近変わったものは、確定した事実のようには書かず、本文で注記しています。</p>"
    calendar_html: "<p>台湾の1年を実際に形づくっている12の行事です。来年また調べ直す必要のある日付ではなく、日付を決めるルールと一緒に紹介します。</p><p>旧暦のセクションでは数え方そのものを説明します。〘初五〙がなぜその意味になるのか、〘春節〙がなぜ毎年動くのか。2つの換算ツールはどちらもブラウザの中で動きます。〘民國〙紀年のほうは単純な計算で、旧暦のほうは香港天文台の表と照合した換算表を使っています。</p><p>行事にまつわる単語は、辞書に収録されていれば一覧からそのまま学習に追加できます。</p>"
    metro_html: "<p>台北・新北のMRTの全路線と、公式の順番に並んだ駅です。駅をタップすると、上のカードに注音、ピンイン、意味が表示されます。そこから辞書の項目を開いたり、デッキに追加したりできます。</p><p>白抜きの丸は乗換駅で、カードにはその駅を通るすべての路線が出ます。地図は駅の実際の座標から描いているので、どの駅も本当にある場所に置かれています。</p>"
    games_html: "<p>台湾麻雀、中国公式ルール麻雀、シャンチー、囲碁、ボードゲームの語彙を、それぞれの単語がゲームの中でどんな働きをするかで説明します。ルールブックではありません。卓での会話についていき、看板やアプリ、配信を読めるようになるのが目的です。</p><p>タブでゲームごとに分かれ、その中は役割別に並んでいます。パイや駒、ゲームの進行、鳴き、役、戦略、対局中のひとこと。緑の点は台湾の外では別の言い方をするもので、中国で別の単語を使う場合はその単語を横に示しています。意味は教育部の辞典、台湾の16枚麻雀のルール、1998年の中国公式ルールと照合済みです。</p>"
    notices_html: "<p>台湾に来たばかりの人が読む必要のある書類を、出会う場所ごとにまとめました。診療所、職場、銀行と郵便局、住まい、学校です。どれも架空の内容で作った見本ですが、項目名や決まり文句は本物どおりなので、ここで覚えたことがそのまま実物の書類で役立ちます。</p><p>各項目の下には、その意味と何をすればよいかを書いています。いちばん大事な行、たとえば薬の量、手取り額、支払い期限には印を付けています。単語をタップすると読みと意味が出ます。ヘッダーで注音をオンにすれば、すべての字の上に読みが表示されます。</p>"
    medicine_html: "<p>台湾で実際に話されている西洋医学の言葉です。からだと臓器、医師が使う病名と家庭で使う呼び方、台湾CDC（疾病管制署）の接種スケジュールにあるワクチン、病院内でたどる表示（〘掛號〙、〘批價〙、〘領藥〙）。イラストのラベルをタップすると読みが表示され、そこから辞書の項目を開けます。</p><p>医学用語に日常の言い方がある場合は（〘闌尾炎〙と〘盲腸炎〙。日本語の「虫垂炎」と「盲腸」と同じ関係です）、2つを並べて示します。中国と使い方が違う用語には印を付け、台湾語から入った単語には台湾語ローマ字（Tâi-lô）の読みを添えています。すべて教育部の辞典と台湾の保健当局の資料で確認しています。</p>"
    dict_html: "<p>辞書はひとつです。単語も決まった言い回しも、ここではすべて同じ項目として扱い、分けていません。もともと境界はあいまいです。〘便利商店〙と〘超商〙は同じ意味なのに、別々のリストで探すのは意味がありませんでした。</p><p><strong>TOCFLレベル</strong>のボタンで試験の1段階に絞り込み、級の列でTBCLの級に、学習状況のフィルターで新しい語・学習中・習得済みだけに絞れます。</p><p>同じレベルの中では<strong>頻度</strong>順に並び、よく使う単語ほど先に来ます。並べ替えを切り替えれば、純粋な頻度で比べられます。項目をタップすると詳しい解説が開き、<strong>＋</strong>ボタンを押せばそのままデッキに入ります。</p>"
    chengyu_html: "<p>〘成語〙は、古典や寓話から生まれた4音節の決まった表現で、日本語の四字熟語にあたります。字面どおりの意味と実際の意味がかけ離れていることも多く、たとえば〘雪中送炭〙は字面では「雪の中に炭を送る」ですが、意味は「いちばん助けが必要なときに助ける」です。そのため、ここの成語には訳だけでなく<strong>ニュアンス</strong>も付けています。ほめる・中立・けなす、のどれか。何かを〘十拿九穩〙と言うのと〘莫名其妙〙と言うのとでは、まったく違います。</p><p>リストは辞書から作っています。辞書の表示からタグを付けたものと、人の手で確認したものがあり、後者には実際にどんな場面で言うかの注と、本物の例文が付いています。成語をタップすると、音声、字の分解、例文付きの全項目が開きます。</p>"
    tbcl_html: "<p>TBCL（〘臺灣華語文能力基準〙）は、台湾で華語を教えるときに実際に使われている基準で、1級から7級までの7段階です。TOCFL試験とは作りが違い、試験の形式ではなく教育カリキュラムに沿っています。</p><p>同じ級の中では、よく使う語から珍しい単語の順に並びます。バーはその級をどれだけ知っているかを示し、ここだけでなくアプリのどこで覚えたものも数えます。</p>"
    characters_html: "<p>教育部の常用国字標準字体表にある、よく使う繁体字4808字です。各タイルには字が表示され、タップすると読み（注音＋ピンイン）、筆順、字源、その字を含む単語、そしてどれだけしっかり覚えているかが出ます。</p><p>字は頻度順に並んでいるので、よく目にする字ほど先に出てきます。</p>"
    sentences_html: "<p>レッスンから集めた例文です。文中の単語はそれぞれ辞書の項目へのリンクになっているので、知らない単語はタップして確かめられます。出典フィルターで、1冊の本やひとつのレッスンに絞り込めます。</p>"
    search_html: "<p>3つの欄を組み合わせて検索します。<strong>表記・意味</strong>には漢字か、このサイトの言語（日本語・英語・ロシア語・ベトナム語・ドイツ語・インドネシア語）の単語を入れます。<strong>ピンイン</strong>と<strong>注音</strong>には読みを入れます。声調は記号でも、各音節のあとの数字でも、省略してもかまいません。<code>nǐhǎo</code>、<code>ni3hao3</code>、<code>ni hao</code>のどれでも同じ単語にたどり着きます。声調を書いた場合は、その声調がぴったり合う項目が先に出て、そのあとに残りが続きます。</p><p><strong>例文バンクを検索</strong>にチェックを入れると、種類の区別はなくなります。ヒットはすべて検索語に印の付いた例文で、1ページに10件ずつ、レベルと文体で絞り込めます。2語で検索すると、その2語がいっしょに使われるかどうかもわかります。</p>"
    radicals_html: "<p>康熙字典の214の部首です。どの字もいずれかの部首の下に分類されています。部首をタップすると、それを含む字が表示されます。</p>"
    zhuci_html: "<p>台湾華語が文末に付ける語気助詞です。〘啦〙、〘喔〙、〘耶〙、〘嘛〙、〘齁〙など。辞書的な意味はまったく足さず、そのかわり口調のすべてを担います。親しみ、じれったさ、やさしい注意、ふざけた憤慨。日本語の「ね」「よ」「さ」のような終助詞に近い働きですが、一対一には対応しません。カードは、台湾のコーパスでそれぞれの助詞が実際に節を締めくくる頻度の順に並んでいます。開くとその助詞が表す気持ちの幅がすべてわかり、例文は気分が伝わるように訳してあります。</p>"
    liangci_html: "<p>台湾華語の量詞（〘量詞〙）は、数と名詞の間に入る小さな単語で、日本語の助数詞にあたります。〘一〙<b>〘本〙</b>〘書〙、〘三〙<b>〘隻〙</b>〘貓〙のように使います。ただし〘本〙は細長いものではなく本を数え、〘隻〙は猫も鳥も数えるなど、日本語の感覚とずれるものもあります。各項目では、何を数えるか、実際にどの名詞と組むか、実際の文でどう使われるかを示します。リストは〘教育部國語辭典簡編本〙、CC-CEDICT、台湾のコーパスから作っています。正しい量詞を選ぶゲームもあります。</p>"
    tocfl_html: "<p>TOCFLの公式レベルそれぞれに向けた到達度です。ここだけでなく、アプリのどこで覚えた字や単語も数えます。レベルを開けば、そのまま学習したり、あと何が残っているかを確かめたりできます。</p>"
    study_html: "<p>まず全部のカードを一度ずつスワイプします。間違えたカードは戻ってきて、わかったカードは抜けていきます。<strong>右にスワイプ</strong>＝「わかった」、<strong>左</strong>＝「わからない」、<strong>上</strong>＝「簡単」、<strong>下</strong>＝「間違えた」。矢印キーも使え、カードをタップすると裏返ります。</p><p>新しいカードは少しずつまとめて登場し、今日の復習分と混ざって出てきます。スケジュールはFSRSなので、カードはちょうど忘れかけたころに戻ってきます。</p>"
    pronunciation_html: "<p>マイクに向かって単語を発音してください。音節ごとに<strong>声調</strong>と<strong>声母・韻母</strong>が採点されます。緑は正解、オレンジは惜しい、赤は外れです。オートモードでは、正解すると次に進み、正解するまでマイクはオンのままです。標準的な発音も台湾式の発音も、どちらも正解として扱います。</p>"
    writing_html: "<p>意味と読みから字を思い出し、一画ずつ書きます。筆画は順番どおりかチェックされ、間違った画はやさしく戻されます。よく間違える字が先に出て、残りはやさしい順に出てきます。</p>"
    handwriting_html: "<p>繁体字を一画ずつ書くと、オフラインで認識します。通信は不要で、データが端末の外に出ることはありません。形はわかるのに読みがわからないとき、さっと調べるのに便利です。</p>"
    cangjie_html: "<p>台湾の繁体字を形で打つ入力方式、倉頡（そうけつ）の第5版です。字を構成するアルファベットのキーを打つと、字が組み立てられます。各字のページにも倉頡コードが載っています。</p>"
    history_html: "<p>最近学習したものと、それぞれがどれだけ定着しているかの一覧です。点は側面ごと（見てわかる、読み、声調、書き）の記憶の強さを表します。復習日が来る前に、忘れかけているものを見つけるのに使いましょう。</p>"
    practice_drill_html: "<p>2つの発音表記を互いに照らし合わせて練習するカードです。方向を選び（注音記号を見てピンインを思い出す、またはその逆）、わかったら右に、わからなかったら左にスワイプします。</p><p>間違えたものはラウンドの後半にもう一度出てきて記録されるので、次のラウンドは苦手な音から始まります。声母と韻母は別々に練習できます。</p>"
    practice_progress_html: "<p>2つの別のものを1か所にまとめていて、それぞれ別の練習から集計されています。</p><p><strong>音の練習</strong>は、聞き分けカードと注音入力練習を何回こなしたかを数え、よく間違える記号を表示します。最初の1回を終えるとすぐに表示されます。</p><p><strong>発音</strong>はマイクでの発音から作られ、どの声調や声母が安定して出せていて、どれがまだかを示します。マイクに向かって話すまでこの欄は空のままですが、それで正常です。カードとはつながっていません。</p>"
