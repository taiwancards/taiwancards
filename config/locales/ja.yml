    honest:
      heading: このアプリが生まれた理由
      body: わたしは言語学者で、台湾に住んでいます。これは、台湾で華語を学びながらずっと欲しいと思っていたアプリです。計算言語学の修士論文と、看板を読み、メニューを読み、聞き取れなければもう一度聞き返す、そんなふつうの毎日の練習から生まれました。広告はありませんし、これからも入れません。それがこのアプリがある理由の半分です。
