    item_lede:
      course: "「こんにちは」からB1までの60課。会話、単語、文法、練習問題。"
      path: 自分用のロードマップ。何をどの順で進めるか、今どこにいるかがわかります。
      desk: 今日の画面。復習と新しいカードの数、そして今やるべきことへのボタンが1つ。
      desks: テキスト、ファイル、歌、レッスンから作るマイデッキ。グループ分けや共有リンクも。
      reader: 好きなテキストを貼り付けると単語に区切られ、知らない単語には注音が付きます。
      graded: 辞書で止まらずに最後まで読める、レベル別多読の文章。
      placement: 答えに合わせて問題が変わるテストで、スタートのレベルを決め、すでに知っている単語に印を付けます。
      plan: TOCFLのレベルと日付を決めると、1日に必要な新しい学習量を計算します。
      triage: カードを開かずに、単語をスワイプで「知っている」と「これから覚える」に仕分けます。
      textbook: 教科書の各課のまとめ。文の分析と「この課は習得済み」の印つき。
      textbook-phrases: 教科書のフレーズドリル。文型の置き換えを、声に出して時間内に。
      stories: 読書室：リーダーと同じ分析つきで、まとまった文章を読めます。
      exams: TOCFL公式模試を音声つきで。採点は自分の端末で行います。
      radicals: 康熙字典の214部首。画数、意味、その部首が出てくる単語。
      characters: 漢字のすべて：読み、画数、書き順アニメーション、字源、読みごとの単語。
      dict: 単語とコロケーション：番号付きの語義、類語、量詞、コーパスの例文。
      sentences: 例文コーパス。レベル、文体、レベル判定の確かさで絞り込めます。
      chengyu: "〘成語〙を声調、タイプ、難易度で絞り込めます。"
      liangci: 量詞：どんな名詞と組むか、生きた例文、覚えるためのゲーム。
      tbcl: 7段階のTBCL単語リスト。自分の進み具合がひと目でわかります。
      tocfl: レベル別のTOCFL単語リスト。自分の進み具合がひと目でわかります。
      practice-zhuyin: 音節は何でできているか。声母、韻母、声調、そしてよくある混同。
      syllables: 華語の音節表の全体。実際に存在する組み合わせがわかります。
      tones: 4つの声調と軽声、台湾ならではの特徴、声調変化のルール。
      hanzi: 漢字の成り立ち：〘六書〙、部品、音符でつながる字のグループ、書き順。
      cangjie-lessons: 倉頡（そうけつ）入力の教科書。1つのキーから字の分解ルールまで、40課のドリルと字のリストつき。
      practice-numbers: 数字、お金、日付、民国暦、そして〘零〙と〘兩〙のひっかけ。
      grammar: レベル別の582の文型。それぞれ解説、コーパスの例文、関連項目つき。
      zhuci: 語気助詞〘語氣詞〙：〘吧〙、〘啊〙、〘呢〙、〘嘛〙が文にどんなニュアンスを加えるか。
      variants: 台湾と中国で違うところ：読み方、字形、語彙。
      names: 台湾の名前のしくみ。戸籍から集計した姓のランキングつき。
      practice-zhuyin-trainer: 注音をグループごとに耳で覚えます。今のグループを覚えるまで、次のグループには進みません。
      practice-drill: 注音とピンインをすばやく対応づける練習。苦手な記号ほど多く出ます。
      tones-drill: スタジオ録音で声調を聞き分けます。男性と女性の声が交互に出ます。
      pronunciation: マイクで録音すると、声調と音がどこでずれたかを音節ごとに表示します。
      writing: ヒントなしで漢字を記憶から書きます。結果は「書き」の記録に反映されます。
      practice-typing: 台湾の注音キー配列を、指が覚えるまで練習します。
      cangjie: 倉頡（そうけつ）入力：漢字を部品に分けて、そのコードを打ちます。
      mock: TOCFL模擬試験。通常問題、イラスト問題、音声問題の3形式で、シードを指定すれば同じ問題を再現できます。
      everyday: 場面別の単語：食べ物、飲み物、交通、手続き、天気、スラング。
      phrases: 17の場面に186の文型。聞いてわかれば十分な半分も含みます。
      notices: 薬袋、給与明細、請求書、賃貸契約書、連絡帳、マンションの掲示を、項目ごとに読み解きます。
      metro: 台北MRTの路線図。全駅の名前の意味と読み方つき。
      calendar: 旧暦、祝祭日、季節の言葉、2つの日付変換ツール。
      medicine: 薬局や病院で言いたいことを伝えるために。
      culture: シフト表からレシート、祝祭日まで、台湾の暮らしのしくみを短く解説します。
      games: 台湾華語で遊ぶボードゲーム：用語、ルール、ゲーム中の会話。
      profile: 表示言語、注音の位置、モバイルのタブ、レベル、エクスポートとバックアップ。
      progress: 概要、復習履歴、項目別の記憶の定着度、苦手カードの一覧。
      settings-edit: FSRSのパラメーターを自分で調整：目標保持率、最大間隔、学習ステップ。
