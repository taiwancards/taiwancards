      taipei_note: "台湾での声調の聞こえ方で、覚えるのはこちらです。"
      reference_note: 比較のための中国の規範です。数字は慣例となっている規範的な表記です。
      beijing: 北京
      beijing_note: "北京の標準で、比較のためだけに示します。"
      scale: "低から高までの5段階です。線は左から右へ、声がどこから始まりどこへ向かうかを見てください。実際の発音は、この線の前後で少し揺れます。"
    hacks_title: 本当に役に立つコツ
    hacks:
      low: "第三声は、ただの低い声調です。第一声のちょうど反対だと考えてください。深く下がってまた上がる形になるのは、単独で言うときとポーズの前だけで、台湾ではそこでも上昇はわずかで、聞こえないことも多いくらいです。チェックマークを描こうとせず、低くつぶやく「うん…」のように、低く入ってそのまま低く保ちましょう。"
      pair: 第一声と第三声はペアで覚えましょう。一方は高くて平ら、もう一方は低くて平ら。「平らか、くぼむか」と覚えるより、ずっとつかみやすくなります。
      start: いちばん混同しやすいのは第二声と第三声です。手がかりは終わりではなく始まりの高さ。第二声は中くらいから上がり、第三声は低く始まって低いままです。
      after_third: 第三声のあとに第二声が来るときは、第三声の低さが助走になります。もう底にいるので、第二声はそこからまっすぐ上がるだけ。音節のあいだで中くらいの高さに戻らないでください。そこで流れが切れてしまいます。
      fourth: "第四声はたいていいちばん楽に出せます。きっぱり言い切る「はい！」のように、上から下へ鋭く落とします。文の途中でも、一語ごとにこの下がり方を保ちましょう。弱く聞こえるなら、出だしが十分に高くないのかもしれません。"
      relative: 音の高さは絶対的なものではなく、相対的なものです。5段階は楽譜の音ではなく、自分の声の幅の中で測ります。声が低くても、声調の妨げにはなりません。
      neutral: "軽声は短く軽い音節です。台湾では、前の声調が何であっても、中くらいより少し低いところに落ち着きます。別に覚えることはほとんどありません。前の声調を正しく言って、軽声はそのまま軽く落としましょう。"
    title: 声調
    lede: 発音編の4つめ。これがないと最初の3つも生きてきません。声調とは何か、台湾ではどう現れるか、そしてなぜ飛ばせないのか。
    what_title: "声調とは"
    what_body: "声調とは、一つの音節の中での声の高さと、その動きのことです。日本語にも、高さで単語を区別するしくみはすでにあります。「箸」と「橋」がその例です。ただし日本語の高低は単語全体にかかる型で、段階は高と低の二つだけ、高さが切り替わるのは拍と拍の境目です。華語では音節の一つひとつに声調があり、高さはその音節の中で動きます。〘買〙 mǎi は低く言うと「買う」、〘賣〙 mài は高いところから下げて言うと「売る」です。高さは音符で決まるものではなく、自分の声の範囲の中での高い・低いなので、声が低いことも「音痴」であることも妨げにはなりません。声調を聞き分ける耳は練習で育ちます。短い期間の聞き取り練習でも、効果は長く続きます。本当に手間がかかるのは、どの単語がどの声調かを覚えることです。声調は、あとからではなく、単語といっしょに覚えましょう。"
    why_title: 声調は飾りではありません
    why_body: 日本語の高低アクセントは単語全体にかかりますが、華語では音節の一つひとつに声調があり、子音や母音と同じく音節の一部です。声調を無視すると区別できる音節はおよそ400、声調を数えると約1300になります。声調を落とせば使える区別の3分の2を捨てることになり、口から出たときに同じに聞こえる単語が何倍にも増えてしまいます。
    myth_title: "「文脈でなんとかなる」という思い込み"
    myth_body: "文脈は確かに助けになりますし、ことばが文脈なしで使われることもありません。でも文脈が直せるのは、聞き手がすでに聞き取ったものだけで、聞き取りの代わりにはなりません。ネイティブは意味を考えるより先に、自動的に声調を聞き分けています。間違った声調は「声調がない」のではなく「別の声調」として受け取られます。つまり、ただ伝わらないだけでなく、かえって別の意味に受け取られてしまうのです。"
    cannot_title: "「声調を出さない」という選択肢はありません"
    cannot_body: これは気持ちの話ではなく、仕組みの話です。声に出した音節には必ず高さと高さの動きがあります。なければそもそも音になりません。問題は、その形が求められている形と合っているかどうかだけです。声調の練習を飛ばしても中立な発音にはならず、でたらめな声調の発音になるだけです。自分の耳には声調が存在しなくても、聞く人にとってはいつも存在しています。
    cumulative_title: 問題はミニマルペアだけではありません
    cumulative_body: 声調はたいてい〘媽 麻 馬 罵〙で紹介されるので、危ないのはまれな取り違えだけだという印象が残りがちです。実際の害は単語単位ではなく、積み重なって表れます。声調がいつもずれていると、一語ずつならまだ推測できても、文全体になるとお手上げです。聞き手は、こちらが話すより速く候補を試し続けなければならないからです。
    four_title: 4つの声調
    four_lede: "かっこ内の数字は音の高さを表し、1が低く、5が高い音です。"
    tones:
      t1:
        name: 第一声 — 高く平ら
        contour: "55"
        zhuyin: 記号なし
        note: "高く平らに、同じ高さを保ちます。時報の「ピー」のイメージです。日本語の高い拍も平らなので出発点にはなりますが、日本語話者の第一声は終わりで下がりがちだと報告されています。最後まで下げずに伸ばしましょう。注音では何も付けません。記号がないこと自体が第一声のしるしです。"
      t2:
        name: 第二声 — 上がる
        contour: "35"
        zhuyin: "〘ˊ〙"
        note: "上がる声調です。驚いて「えっ？」と聞き返すときの上がり方が出発点になりますが、あくまで出発点です。台湾では始めに少しくぼんでから、ゆるやかに上がります。ゆるやかとはいえ、平らにしてしまうと別の声調に聞こえます。日本語話者に多いのがこの平らな第二声なので、一つの音節の中で高さを動かすことを意識しましょう。"
      t3:
        name: 第三声 — 低い
        contour: 214 / 21
        zhuyin: "〘ˇ〙"
        note: "低い声調です。教科書では下がってまた上がる形に描かれますが、会話の中の第三声は声のいちばん下まで下がって、そのまま低くとどまります。くぼむ声調ではなく、低い声調として覚えましょう。日本語話者は第三声を第二声のように上げてしまいがちだと報告されています。2音節の単語では、第三声＋第三声、第一声＋第三声、第三声＋軽声の組み合わせがとくに難しいとされています。"
      t4:
        name: 第四声 — 下がる
        contour: "51"
        zhuyin: "〘ˋ〙"
        note: "下がる声調で、短くきっぱりと言います。日本語でいちばん近いのは、アクセントの高から低への下がり目です。ただし日本語の下がり目は拍と拍のあいだで起こり、第四声は一つの音節の中で下がります。文の終わりでも、軽声のように短く消えてしまわないようにしましょう。"
    neutral_title: 5つめ、というより軽声
    neutral_body: "厳密には第五の声調ではなく、自分の声調がない状態です。音節は形を失って短くなり、台湾では前の声調が何であっても、中くらいより少し低い高さに落ち着きます。注音では点〘˙〙で表し、ほかの声調記号と違って音節の前に書きます。たとえば〘˙ㄉㄜ〙。ドリルで試す意味はありません。耳には、とても短く弱い音節として聞こえるだけです。"
    taiwan_title: 台湾の声調はどう違うか
    taiwan_body: "体系は同じで、4つの声調と軽声があります。違うのは、それぞれの声調の実際の現れ方です。緑の行が、台北で耳にする発音です。"
    words_title: 同じ単語でも声調が違う
    words_lede: 日常のことばの中には、2つの標準で辞書の声調が違うものがあります。台湾のほうを覚えましょう。
    words_word: 単語
    sandhi_title: 声調が変わる2つのルール
    sandhi_lede: "書くときの声調と言うときの声調が違う場合です。第三声では書く声調は変わりません。辞書も注音もピンインも、元の声調のままです。〘一〙と〘不〙は書き方が分かれます。辞書は元の声調のままですが、教科書では下の例のように、変わったあとの声調で書くことがよくあります。"
    third_title: 第三声＋第三声
    third_body: 第三声が2つ続くと、前の第三声は第二声で発音します。〘你好〙は〘ㄋㄧˇ ㄏㄠˇ〙と書きますが、聞こえ方はní hǎoです。このルールは辞書の形ではなく実際の発音にかかるので、単語の境目をまたいでも働きます。
    third_three: "第三声が3つ続くときは、意味のまとまり方で結果が変わります。〘我很好〙では〘很好〙がひとまとまりなので、〘很〙が変わり、その前の〘我〙は低いまま、wǒ hén hǎoになります。速く言うと〘我〙も上がって、wó hén hǎoになることがよくあります。〘展覽館〙のように前の2音節がひとまとまりのときは、両方が変わってzhán lán guǎnになります。暗記することはありません。実際にひとまとまりで言う音節にルールが働くだけです。"
    yi_title: "〘一〙と〘不〙"
    yi_body: この2つの声調は、後ろに来る音で変わります。
    yi_rules:
      yi_alone: "〘一〙を単独で言うとき、文末、序数では第一声：yī、〘第一〙 dì yī。"
      yi_before4: 第四声の前の〘一〙は第二声：〘一定〙 yí dìng、〘一樣〙 yí yàng。
      yi_other: 第一声・第二声・第三声の前の〘一〙は第四声：〘一天〙 yì tiān、〘一年〙 yì nián、〘一起〙 yì qǐ。
      bu_before4: 第四声の前の〘不〙は第二声：〘不是〙 bú shì、〘不要〙 bú yào。
      bu_other: それ以外の〘不〙は第四声：〘不好〙 bù hǎo、〘不能〙 bù néng。
    practice_title: 練習
    practice_body: 下は聞き取りのドリルです。音節が流れたら、声調を答えてください。学習状況には記録されず、復習にも影響しません。純粋な練習なので、いつやめてもかまいません。
    practice_pending: 声に出して声調を練習する機能はまだありません。声調の形を台湾の基準でチェックできる音声認識をつないだら公開します。いまは耳で聞き分ける練習だけです。
