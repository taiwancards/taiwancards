previews:
  generation: "off"

databases:
  - name: taiwancards-prod
    plan: basic-1gb
    region: singapore
    postgresMajorVersion: "18"
    databaseName: taiwancards
    user: taiwancards
    diskSizeGB: 5
    storageAutoscalingEnabled: true

services:
  - type: web
    name: taiwancards-app
    runtime: ruby
    plan: starter
    region: singapore
    branch: main
    numInstances: 1
    autoDeployTrigger: commit
    healthCheckPath: /up
    domains:
      - study.taiwancards.app
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - "spec/**"
        - "site/**"
        - ".rspec*"
        - ".rubocop.yml"
        - ".rubocop_schema.yml"
        - ".slim-lint.yml"
        - ".prettierignore"
        - ".editorconfig"
        - ".gitattributes"
        - ".gitignore"
        - ".env.dev"
        - "justfile"
        - "Procfile.dev"
        - "package.json"
        - "bun.lock"
        - "config/ci.rb"
        - "bin/ci"
    buildCommand: "./bin/render-build.sh"
    preDeployCommand: "./bin/render-release.sh"
    startCommand: "./bin/render-start.sh"
    disk:
      name: taiwancards-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: RUBY_YJIT_ENABLE
        value: "1"
      - key: DATA_ROOT
        value: /var/data
      - key: MEDIA_ROOT
        value: /var/data
      - key: FONT_DIR
        value: /var/data/fonts
      - key: MEDIA_BASE_URL
        value: https://audio.taiwancards.app
      - key: ASSETS_BASE_URL
        value: https://assets.taiwancards.app
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: taiwancards-prod
          property: connectionString
      - fromGroup: taiwancards-production
      - key: APP_HOSTS
        value: study.taiwancards.app
      - key: SITE_URL
        value: https://taiwancards.app
      - key: APP_URL
        value: https://study.taiwancards.app

  - type: web
    name: taiwancards-site
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: "true"
    staticPublishPath: site
    domains:
      - taiwancards.app
      - www.taiwancards.app
    buildFilter:
      paths:
        - "site/**"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
